            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
              ${b.cantidad > 0 ? `<span style="font-size:12px;font-weight:700;color:var(--tinta)">${b.cantidad}</span>` : ''}
              <div style="width:100%;max-width:36px;height:${h}px;background:${color};
                          border-radius:3px 3px 0 0;${b.cantidad === 0 ? 'opacity:.15' : ''}"
                   title="${b.rango}: ${b.cantidad} alumno${b.cantidad === 1 ? '' : 's'}"></div>
            </div>`;
        }).join('')}
        <div style="position:absolute;top:0;bottom:0;left:50%;border-left:2px dashed #888"></div>
      </div>
      <div style="display:flex;gap:8px;font-size:12px;color:var(--tinta-suave)">
        ${buckets.map((b, i) => `<span style="flex:1;text-align:center">${i}</span>`).join('')}
      </div>
      <p style="margin-top:14px;font-size:13px;color:var(--tinta-suave)">
        Cada barra es un tramo de nota (0–1, 1–2, …, 9–10) · ${aprobados} de ${total} aprueban (${Math.round(aprobados / total * 100)}%)
      </p>`;
  }

  // --------------------------------------------------------------- alumnos
  // Resumen accionable («¿con quién hablo mañana?»): cada alumno con SU
  // nivel, SU nota en el alcance y los criterios que van por debajo del 50%
  // (el mismo umbral que los hallazgos). Ordenado por riesgo: más criterios
  // primero y, a igualdad, nota más baja. `nivelFiltro` actúa como en
  // Distribución: undefined = todos los niveles.
  const UMB_RIESGO = 0.5;

  function htmlAlumnos(claseId, insts, nivelFiltro) {
    let alumnos = Calc.alumnosDeClase(claseId);
    if (nivelFiltro !== undefined && nivelFiltro !== null) {
      const nv = Calc.nivelNorm(nivelFiltro);
      alumnos = alumnos.filter(a => Calc.nivelDeAlumno(claseId, a.id) === nv);
    }
    if (!alumnos.length) return '<div class="aviso">No hay alumnado en esta clase.</div>';

    const filas = alumnos.map(a => {
      const criterios = Calc.criteriosDeAlumno(claseId, a.id);
      const bajo = criterios
        .map(c => ({ criterio: c, logro: Calc.logroCriterioEnInsts(c.id, claseId, a.id, insts) }))
        .filter(x => x.logro != null && x.logro < UMB_RIESGO);
      return {
        alumno: a,
        nivel: Calc.etiquetaNivel(claseId, Calc.nivelDeAlumno(claseId, a.id)),
        // M-10: código del nivel para el title del badge de nivel.
        nivelCodigo: Calc.nivelDeAlumno(claseId, a.id),
        nota: Calc.notaEnInsts(claseId, a.id, insts),
        bajo
      };
    });

    const enRiesgo = filas.filter(f => f.bajo.length)
      .sort((x, y) => y.bajo.length - x.bajo.length
        || (x.nota == null ? 99 : x.nota) - (y.nota == null ? 99 : y.nota));
    const tranquilos = filas.length - enRiesgo.length;

    const resumen = `
      <p style="margin-bottom:12px"><strong>${enRiesgo.length} de ${filas.length}</strong>
        alumnos con criterios por debajo del 50% en este alcance.</p>`;

    if (!enRiesgo.length) {
      return resumen + '<div class="aviso">Ningún alumno tiene criterios por debajo del 50% en este alcance.</div>';
    }

    return resumen + `
      <div class="scroll-x">
        <table class="tabla">
          <thead><tr>
            <th>Alumno</th><th>Nivel</th><th class="num">Nota</th>
            <th class="num">Criterios bajo 50%</th><th>Criterios con dificultad</th>
          </tr></thead>
          <tbody>
            ${enRiesgo.map(f => `
              <tr>
                <td>${Utils.esc(App.nombreVisible(f.alumno))}</td>
                <td><span class="badge info" title="${Utils.esc(titleNivel(claseId, f.nivelCodigo))}" style="font-size:12px;white-space:nowrap">${Utils.esc(f.nivel || 'Base')}</span></td>
                <td class="num">${Calc.badgeHtml(f.nota)}</td>
                <td class="num"><span class="badge ${f.bajo.length >= 2 ? 'ko' : 'warn'}">${f.bajo.length}</span></td>
                <td>${f.bajo.map(x =>
                  `<span class="badge ${x.logro < 0.3 ? 'ko' : 'warn'}" style="font-size:12px;margin-right:4px"
                         title="${Utils.esc(x.criterio.descripcion)}">${Utils.esc(x.criterio.codigo)} ${Math.round(x.logro * 100)}%</span>`).join('')}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <p style="color:var(--tinta-suave);font-size:13px;margin-top:10px">
        ${tranquilos} alumno(s) sin criterios por debajo del 50%. Cada alumno se valora con los criterios de SU nivel.
      </p>`;
  }

  // ---------------------------------------------------------------- saberes
  // Subvista «Instrumentos» (D-74c): por instrumento, una tabla de saberes
  // básicos (filas = alumnado, columnas = saberes) donde cada celda dice si el
  // alumno domina ese saber (media de los apartados que lo trabajan). Incluye un
  // cajetín de observaciones del docente, guardado localmente.
  function htmlInstrumentos(claseId, insts) {
    const instsClase = (insts || []).filter(i => i.claseId === claseId);
    if (!instsClase.length) {
      return '<div class="aviso">No hay instrumentos en esta clase. Créalos en la pestaña Instrumentos.</div>';
    }
    const instId = instrumentoInfoSel || instsClase[0].id;
    const inst = Calc.instrumento(instId);
    const saberes = Calc.saberesDeInstrumento(instId);
    const alumnos = Calc.alumnosDeClase(claseId);

    const selOpts = instsClase.map(i =>
      `<option value="${i.id}" ${i.id === instId ? 'selected' : ''}>${Utils.esc(i.titulo || i.tipo)}</option>`).join('');

    const badgeCelda = d => {
      // M-11: estado en TEXTO, no solo color (WCAG 1.4.1) — el símbolo del
      // semáforo (✓/▼) lo añade el CSS para todos los badges de estado.
      if (d.estado === 'domina') return '<span class="badge ok" title="' + Utils.esc(d.media != null ? d.media + '/10' : '') + '">Domina</span>';
      if (d.estado === 'mejorar') return '<span class="badge ko" title="' + Utils.esc(d.media != null ? d.media + '/10' : '') + '">Mejorar</span>';
      return '<span class="badge na" title="Sin datos">—</span>';
    };

    let tabla = '';
    if (!saberes.length) {
      tabla = '<div class="aviso">Este instrumento no tiene saberes etiquetados en sus apartados. ' +
        'Edita el instrumento y añade los saberes básicos (separados por coma) en cada apartado.</div>';
    } else {
      tabla = `
        <div class="scroll-x">
          <table class="tabla">
            <thead><tr><th>Alumno</th>${saberes.map(s => `<th style="text-align:center">${Utils.esc(s.saber)}</th>`).join('')}</tr></thead>
            <tbody>
              ${alumnos.map(a => `
                <tr>
                  <td>${Utils.esc(App.nombreVisible(a))}</td>
                  ${saberes.map(s => `<td style="text-align:center">${badgeCelda(Calc.dominioSaber(instId, a.id, s.saber))}</td>`).join('')}
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }

    const obs = (Storage.db.observaciones && Storage.db.observaciones[instId]) || '';
    return `
      <label class="campo"><span>Instrumento</span>
        <select id="sel-inst-info">${selOpts}</select></label>
      ${tabla}
      <label class="campo" style="margin-top:16px">
        <span>Observaciones del docente (propuestas de mejora, a criterio del maestro)</span>
        <textarea id="obs-inst" rows="4" class="obs-inst" placeholder="Anotaciones locales; no se imprimen ni se exportan.">${Utils.esc(obs)}</textarea>
      </label>`;
  }

  // Informe de análisis para PDF: las secciones compuestas —atención (antes
  // hallazgos), criterios, distribución y alumnos— con cabecera de clase y
  // alcance. Devuelve un string puro (comprobable sin navegador); el botón
  // «Imprimir / PDF» —el de esta vista y el «Informe de análisis» de la
  // Cuadrícula— lo vuelca en #informe-impresion e imprime.
  // `opciones` (todas opcionales): claseSel, nivelSel y periodo, para que la
  // Cuadrícula pueda pedir el informe de SU clase y trimestre sin depender del
  // último contexto que la vista de Informes tenga en pantalla.
  function informeHtml(opciones) {
    const op = opciones || {};
    if (!claseSel && !op.claseSel) return '';
    // El alcance puntual no debe mover el estado de la vista en pantalla: se
    // fija aquí y se restaura al final.
    const antes = { claseSel, nivelSel, alcance };
    if (op.claseSel && op.claseSel !== claseSel) {
      claseSel = op.claseSel;
      alcance = { periodo: '', unidad: '', instrumentoId: '' };
    }
    if (Object.prototype.hasOwnProperty.call(op, 'nivelSel')) nivelSel = op.nivelSel || '';
    if (typeof op.periodo === 'string') {
      alcance = Object.assign({}, alcance, {
        periodo: ['T1', 'T2', 'T3'].indexOf(op.periodo) !== -1 ? op.periodo : ''
      });
    }
    try {
      const insts = instsAlcance();
      const gru = Calc.byId(Storage.db.grupos, (Calc.clase(claseSel) || {}).grupoId);
      const asig = Calc.asignaturaDeClase(claseSel);
      const alcanceTxt = [
        alcance.periodo ? 'Trimestre ' + alcance.periodo : 'Todo el curso',
        alcance.unidad,
        alcance.instrumentoId ? (Calc.instrumento(alcance.instrumentoId) || {}).titulo : ''
      ].filter(Boolean).map(t => Utils.esc(t));
      const nivelTxt = esTodas(nivelSel) ? 'Todos los niveles' : (Calc.etiquetaNivel(claseSel, nivelSel) || 'Base');
      const bloque = (titulo, cuerpo) => `
      <section class="informe-seccion">
        <h2 class="informe-titulo">${titulo}</h2>
        ${cuerpo}
      </section>`;
      return `<div class="informe-cab">
        ${Storage.perfilHtml()}
        <strong>Informe de análisis · ${Utils.esc(asig ? asig.nombre : '¿?')}</strong>
        <span>${Utils.esc(gru ? gru.nombre : '¿?')} · nivel: ${Utils.esc(nivelTxt)} · ${alcanceTxt.join(' · ')} · impreso el ${Utils.hoy().split('-').reverse().join('/')}</span>
      </div>
      ${bloque('Atención', htmlHallazgos(claseSel, insts))}
      ${bloque('Criterios', htmlCriterios(claseSel, insts))}
      ${bloque('Distribución', htmlDistribucion(claseSel, insts, esTodas(nivelSel) ? undefined : nivelSel))}
      ${bloque('Alumnos en riesgo', htmlAlumnos(claseSel, insts, esTodas(nivelSel) ? undefined : nivelSel))}`;
    } finally {
      claseSel = antes.claseSel;
      nivelSel = antes.nivelSel;
      alcance = antes.alcance;
    }
  }

  // ---------------------------------------------------------------- render
  // Fase 4a: la vista es autónoma. `opciones` sigue aceptando claseSel,
  // nivelSel y periodo (alias y Cuadrícula), pero si no llegan se conserva el
  // estado interno; la primera vez se abre con la primera clase y el nivel base.
  function render(el, opciones) {
    const op = opciones || {};
    // Alias de subvistas (Fase 4b): los ids de antes siguen funcionando. Se
    // reasignan al renderizar, así que un estado interno viejo (o un residuo
    // con data-subvista="hallazgos"/"distribucion") aterriza en su vista nueva.
    if (subVista === 'hallazgos') subVista = 'atencion';
    if (subVista === 'distribucion') subVista = 'resumen';
    // Al cambiar de clase se restablecen el alcance, el instrumento del informe
    // y el nivel (la clase nueva no tiene por qué tener el nivel anterior).
    const pedida = Object.prototype.hasOwnProperty.call(op, 'claseSel')
      ? op.claseSel
      : (claseSel || ((Storage.db.clases && Storage.db.clases[0]) || {}).id || null);
    if (pedida !== claseSel) {
      claseSel = pedida;
      alcance = { periodo: '', unidad: '', instrumentoId: '' };
      instrumentoInfoSel = '';
      nivelSel = '';
    }
    // Si alguien nos pasa un periodo (T1/T2/T3/Final), sincronízalo con el
    // alcance del informe. «Final» no es un periodo propio del informe: se
    // trata como «todo el curso» (sin filtro por trimestre).
    if (typeof op.periodo === 'string') {
      alcance.periodo = ['T1', 'T2', 'T3'].indexOf(op.periodo) !== -1
        ? op.periodo
        : '';
    }
    // El nivel explícito manda; si no llega, se conserva el interno. Un nivel
    // que la clase activa no tiene vuelve a base (misma guarda que la Cuadrícula).
    if (Object.prototype.hasOwnProperty.call(op, 'nivelSel')) nivelSel = op.nivelSel || '';
    if (claseSel && nivelSel && !esTodas(nivelSel)
        && !Calc.nivelesAciDeClase(claseSel).some(n => n.codigo === nivelSel)) {
      nivelSel = '';
    }
    contenedor = el;

    if (!claseSel || !Calc.clase(claseSel)) {
      el.innerHTML = `<div class="aviso">Selecciona una clase para ver el informe.
        <div class="acciones" style="margin-top:8px">
          <button class="btn btn-primario" id="btn-informe-ajustes">Abrir Ajustes</button>
        </div></div>`;
      const btnAjustes = el.querySelector('#btn-informe-ajustes');
      if (btnAjustes) btnAjustes.onclick = () => App.abrirAjustes();
      return;
    }

    sueltaFiltrosVacios();
    const insts = instsAlcance();
    const todas = esTodas(nivelSel);

    // Criterios decide sus tablas según el nivel; la Distribución (dentro del
    // Resumen) filtra el alumnado por el mismo nivel; Atención analiza cada
    // nivel seleccionado y lo etiqueta (las preguntas globales no tienen
    // nivel); Alumnos ordena por riesgo. La vista va en su propia tarjeta:
    // ya no vive dentro de la Cuadrícula.
    el.innerHTML = `
      <section class="card">
        ${htmlAlcance(claseSel)}
        ${htmlSubVista()}
        <div id="informe-cuerpo">
          ${subVista === 'resumen' ? htmlResumen(claseSel, insts, todas ? undefined : nivelSel)
            : subVista === 'atencion' ? htmlHallazgos(claseSel, insts)
            : subVista === 'criterios' ? htmlCriterios(claseSel, insts)
            : subVista === 'instrumentos' ? htmlInstrumentos(claseSel, insts)
            : htmlAlumnos(claseSel, insts, todas ? undefined : nivelSel)}
        </div>
      </section>`;

    // --- eventos ---
    const scl = el.querySelector('#alc-clase');
    if (scl) scl.onchange = e => {
      render(el, Object.assign({}, op, { claseSel: e.target.value }));
    };
    const snv = el.querySelector('#alc-nivel');
    if (snv) snv.onchange = e => {
      render(el, Object.assign({}, op, { nivelSel: e.target.value }));
    };
    const sp = el.querySelector('#alc-periodo');
    if (sp) sp.onchange = e => {
      alcance.periodo = e.target.value;
      alcance.unidad = '';
      alcance.instrumentoId = '';
      // Mantener sincronizado el periodo de la cuadrícula con el del informe.
      if (op && typeof op.onPeriodo === 'function') {
        op.onPeriodo(e.target.value || '');
      }
      render(el, op);
    };
    const su = el.querySelector('#alc-unidad');
    if (su) su.onchange = e => {
      alcance.unidad = e.target.value;
      alcance.instrumentoId = '';
      render(el, op);
    };
    const si = el.querySelector('#alc-instrumento');
    if (si) si.onchange = e => {
      alcance.instrumentoId = e.target.value;
      render(el, op);
    };
    // M-12: modo privacidad — el mismo botón de ojo que la Cuadrícula, aquí al
    // final del panel de contexto: un clic oculta los nombres; mantener
    // pulsado 1 s los vuelve a mostrar. Repinta la subvista al cambiar.
    const slotPriv = el.querySelector('#slot-privacidad');
    if (slotPriv && typeof slotPriv.insertBefore === 'function') {
      slotPriv.parentNode.insertBefore(App.crearBotonPrivacidad(() => render(el, op)), slotPriv);
      slotPriv.remove();
    }
    el.querySelectorAll('[data-subvista]').forEach(ch => {
      ch.onclick = () => { subVista = ch.dataset.subvista; render(el, op); };
    });
    el.querySelectorAll('[data-modocrit]').forEach(ch => {
      ch.onclick = () => { modoCriterios = ch.dataset.modocrit; render(el, op); };
    });
    el.querySelectorAll('[data-filtrosev]').forEach(ch => {
      ch.onclick = () => { filtroSev = ch.dataset.filtrosev; render(el, op); };
    });
    const selInstInfo = el.querySelector('#sel-inst-info');
    if (selInstInfo) selInstInfo.onchange = e => { instrumentoInfoSel = e.target.value; render(el, op); };
    const obsInst = el.querySelector('#obs-inst');
    if (obsInst && selInstInfo) {
      obsInst.oninput = e => {
        if (selInstInfo.value) { Storage.db.observaciones[selInstInfo.value] = e.target.value; Storage.save(); }
      };
    }
    // Impresión (Fase 4a): el botón propio usa el MISMO camino que el
    // «Informe de análisis» de la Cuadrícula — CuadriculaView.imprimirInforme
    // vuelca el HTML en #informe-impresion y llama a window.print(). La
    // Cuadrícula reenvía su función por opciones.imprimir; sin ella (vista
    // autónoma), se usa la exportada directamente.
    const btnImp = el.querySelector('#btn-informe-imprimir');
    if (btnImp) btnImp.onclick = () => {
      const imprimir = typeof op.imprimir === 'function'
        ? op.imprimir
        : (typeof CuadriculaView !== 'undefined' && CuadriculaView.imprimirInforme)
          ? CuadriculaView.imprimirInforme
          : (html => window.print());
      imprimir(informeHtml());
    };
  }

  return { render, informeHtml };
})();

</script>
<script>
const CuadriculaView = (() => {
  let claseSel = null;
  let periodo = 'T1';
  let tab = 'notas';
  let nivelSel = '';
  const TODAS = '__todas__';
  // Unidades cuyas columnas están DESPLEGADAS en la pestaña Instrumentos.
  // El conjunto vacío significa «todas plegadas al entrar» (igual que en la vista
  // Instrumentos), de modo que el gesto que aprende el claustro es el mismo.
  const udsAbiertas = new Set();

  function tablaNotas(alumnos, insts, modoTodas) {
    if (!alumnos.length) {
      return '<div class="aviso">El grupo de esta clase no tiene alumnado en este nivel. Revísalo en «Alumnos y grupos» o en los niveles ACI de la clase.</div>';
    }
    const grupos = [];
    insts.forEach(i => {
      const ud = i.unidad || '';
      let g = grupos.find(x => x.ud === ud);
      if (!g) { g = { ud, insts: [] }; grupos.push(g); }
      g.insts.push(i);
    });
    const { mapa: coloresUd, cambios: nuevosColores } = Storage.coloresUdPara(grupos.map(g => g.ud));
    if (nuevosColores) Storage.save();
    // La barra de unidad (con su plegado) solo tiene sentido si hay algo que
    // agrupar: varias unidades, o una sola con nombre. Si todo va sin unidad no
    // hay barra, y sin barra no se pliega nada (las columnas se ven siempre).
    const conBarra = grupos.length > 1 || (grupos.length === 1 && grupos[0].ud !== '');
    grupos.forEach(g => { g.plegada = conBarra && !udsAbiertas.has(g.ud); });
    // Una unidad plegada NO borra sus celdas: deja UNA celda por fila que se
    // estira con colspan sobre sus columnas. Si se ocultan de verdad, la fila se
    // queda corta y todo lo que va detrás (cabeceras y la nota final) se desplaza
    // de su columna. Con la celda de relleno la tabla siempre cuadra.
    const cabeceraInst = i => {
      const c = coloresUd[i.unidad || ''];
      const estilo = c ? `style="max-width:130px;background:${c.suave}"` : 'style="max-width:130px"';
      return `<th class="celda-nota" ${estilo} data-ud="${Utils.esc(i.unidad || '')}" data-edit="${i.id}" title="Toca para editar el instrumento">${Utils.esc(i.titulo)}<br><small>${Utils.esc(i.tipo)} · ${Utils.esc(i.periodo)}${i.unidad ? ' · ' + Utils.esc(i.unidad) : ''}</small></th>`;
    };
    const barraUd = g => {
      const c = coloresUd[g.ud];
      const estiloTh = c ? `style="background:${c.intenso};color:var(--tinta)"` : '';
      const estiloSmall = c ? 'style="color:var(--tinta)"' : '';
      return `<th class="ud-grupo plegable" colspan="${g.insts.length}" data-toggle-ud="${Utils.esc(g.ud)}" title="${g.insts.length} instrumento${g.insts.length === 1 ? '' : 's'} · toca para ${g.plegada ? 'ver' : 'ocultar'} sus columnas · clic derecho para cambiar el color" ${estiloTh}>` +
        `<span class="ud-flecha">${g.plegada ? '▸' : '▾'}</span>${g.ud ? Utils.esc(g.ud) : 'Sin unidad'}` +
        `<small ${estiloSmall}>${g.plegada ? `(${g.insts.length})` : `${g.insts.length} instrumento${g.insts.length === 1 ? '' : 's'}`}</small></th>`;
    };
    // Columnas de una UD plegadas: en vez de una celda vacía, se muestra la nota
    // media del alumno en esa UD (media aritmética de sus instrumentos, cada uno
    // ya ponderado por criterios). Información útil sin desplegar.
    // sinNotaEsCero (D-74b, ajustable en Configuración): true = el vacío vale 0;
    // false = solo promedia los instrumentos evaluados. notaInstrumento devuelve 0
    // tanto para «sin nota» como para nota 0 real, así que para distinguir si un
    // instrumento tiene nota se mira el registro del alumno (si hay al menos un
    // apartado con valor, cuenta; si no, es «sin nota»).
    const sinNotaEsCero = !!(Storage.db && Storage.db.configuracion && Storage.db.configuracion.sinNotaEsCero);
    // ¿Este alumno queda excluido de este instrumento? La exclusión no cuenta
    // ni como nota ni como vacío, con independencia de sinNotaEsCero.
    const noRealizaEn = (inst, alumnoId) => {
      const fila = ((Storage.db.registros && Storage.db.registros[inst.id]) || {})[alumnoId] || {};
      return fila.noRealiza === true;
    };
    const instrumentoEvaluado = (inst, alumnoId) => {
      if (noRealizaEn(inst, alumnoId)) return false;
      const fila = ((Storage.db.registros && Storage.db.registros[inst.id]) || {})[alumnoId];
      return !!(fila && inst.apartados && inst.apartados.some(ap => fila[ap.id] != null && fila[ap.id] !== ''));
    };
    const mediaUdAlumno = (a, insts) => {
      const aplican = insts.filter(i => !modoTodas || Calc.instrumentoParaAlumno(i, claseSel, a.id));
      // Si ningún instrumento de la UD está corregido, no hay media que mostrar:
      // se enseña «—» y no un 0 (el 0 es una nota corregida que resulta en cero).
      if (!aplican.some(i => instrumentoEvaluado(i, a.id))) return null;
      const notas = aplican
        // Excluidos fuera, siempre: sinNotaEsCero solo decide sobre lo que está
        // sin corregir, nunca sobre quien no se evalúa.
        .filter(i => !noRealizaEn(i, a.id))
        .map(i => {
          if (instrumentoEvaluado(i, a.id)) return Calc.notaInstrumento(i, a.id);
          return sinNotaEsCero ? 0 : null;
        })
        .filter(n => n != null);
      return notas.length ? notas.reduce((x, y) => x + y, 0) / notas.length : null;
    };
    const cabecerasGrupo = g => g.plegada
      ? (() => {
          const c = coloresUd[g.ud];
          const estilo = c ? `style="background:${c.suave}"` : '';
          return `<th class="celda-plegada" ${estilo} colspan="${g.insts.length}"></th>`;
        })()
      : g.insts.map(cabeceraInst).join('');
    const celdasGrupo = (a, g) => g.plegada
      ? (() => {
          const m = mediaUdAlumno(a, g.insts);
          const todasExcluidas = g.insts.length > 0 && g.insts.every(i => noRealizaEn(i, a.id));
          const c = coloresUd[g.ud];
          const estilo = c ? `style="background:${c.suave}"` : '';
          const contenido = todasExcluidas
            ? '<span class="badge no-realiza">No realiza</span>'
            : (m == null ? '<span class="badge na">—</span>' : Calc.badgeHtml(m));
          return `<td class="celda-plegada num" ${estilo} colspan="${g.insts.length}" title="${todasExcluidas ? 'No realiza esta evaluación' : 'Nota media de la UD'}">${contenido}</td>`;
        })()
      : g.insts.map(i => {
        const ud = `data-ud="${Utils.esc(i.unidad || '')}"`;
        // No aplica (M-09): texto plano atenuado y sin aspecto de botón, para
        // que no se confunda ni con «sin corregir» ni con una acción posible.
        if (modoTodas && !Calc.instrumentoParaAlumno(i, claseSel, a.id)) {
          return `<td class="celda-nota num celda-na" ${ud} title="No aplica a este alumno (su currículo no lo incluye)">N/A</td>`;
        }
        // Excluido de la evaluación: insignia propia, distinta de «sin corregir».
        // La celda NO abre la corrección (el alumno está fuera): el clic
        // izquierdo y el derecho abren el mismo menú contextual (data-excluida).
        // Fase 5 (teclado): las celdas interactivas llevan tabindex="0", para que
        // Tab las alcance y Enter/Espacio y la tecla de menú las activen.
        if (noRealizaEn(i, a.id)) {
          return `<td class="celda-nota num" ${ud} data-inst="${i.id}" data-alumno="${Utils.esc(a.id)}" tabindex="0" data-excluida="1" title="No realiza esta evaluación"><span class="badge no-realiza">No realiza</span></td>`;
        }
        // Sin corregir: chip «Pend.» con borde discontinuo (M-09), distinto del
        // «—» de la media de una UD plegada. La celda ya abre la corrección.
        const n = instrumentoEvaluado(i, a.id) ? Calc.notaInstrumento(i, a.id) : null;
        return `<td class="celda-nota num" ${ud} data-inst="${i.id}" data-alumno="${Utils.esc(a.id)}" tabindex="0"${n == null ? ' title="Pendiente de corregir · toca para corregir"' : ''}>${n == null ? '<span class="celda-pendiente">Pend.</span>' : Calc.badgeHtml(n)}</td>`;
      }).join('');
    const thead = conBarra
      ? `<tr class="fila-ud"><th rowspan="2">Alumno</th>${grupos.map(barraUd).join('')}<th class="col-eval" rowspan="2">Evaluación</th></tr>
         <tr>${grupos.map(cabecerasGrupo).join('')}</tr>`
      : `<tr><th>Alumno</th>${insts.map(cabeceraInst).join('')}<th class="col-eval">Evaluación</th></tr>`;
    return `
      ${insts.length ? '' : '<div class="aviso">Aún no hay instrumentos en esta clase para este nivel. Créalos en «Instrumentos».</div>'}
      <table class="tabla tabla-cuadricula">
        <thead>${thead}</thead>
        <tbody>
          ${alumnos.map(a => `<tr>
            <td>${Utils.esc(App.nombreVisible(a))}</td>
            ${grupos.map(g => celdasGrupo(a, g)).join('')}
            <td class="num col-eval">${Calc.badgeHtml(Calc.notaEvaluacion(claseSel, a.id, periodo))}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      <p class="no-print" style="color:var(--tinta-suave);font-size:13px">${modoTodas
        ? 'Vista de todo el grupo: cada alumno se evalúa con los criterios de su nivel y la columna «Evaluación» armoniza su nota. «N/A» en gris = el examen no aplica a ese alumno. Clic derecho en una celda: corregir o marcar "no realiza".'
        : 'La columna «Evaluación» aplica las ponderaciones de los criterios del nivel mostrado' + (periodo === 'Final' ? ' sobre todo el curso' : ' en ' + periodo) + '. Toca una nota para corregir y una cabecera para editar. Clic derecho en una celda: corregir o marcar "no realiza".'}</p>`;
  }

  // Menú contextual de color de una UD (clic derecho sobre su barra, o
  // Mayús+F10 / tecla ContextMenu con la barra enfocada).
  let menuColorUd = null;
  // Fase 5 (teclado): el menú guarda el elemento que lo abrió (la barra de la
  // UD) y, al cerrarse, le devuelve el foco — como hace el modal con su
  // disparador. La guardia de `isConnected` evita enfocar un nodo muerto (la
  // vista pudo repintarse mientras el menú estaba abierto).
  let menuColorUdOrigen = null;
  function cerrarMenuColorUd() {
    if (menuColorUd && menuColorUd.parentNode) menuColorUd.parentNode.removeChild(menuColorUd);
    menuColorUd = null;
    document.onclick = null;
    document.onkeydown = null;
    const origen = menuColorUdOrigen;
    menuColorUdOrigen = null;
    if (origen && typeof origen.focus === 'function' && origen.isConnected) origen.focus();
  }
  function abrirMenuColorUd(el, ud, x, y, origen) {
    cerrarMenuColorUd();
    cerrarMenuCelda();
    menuColorUdOrigen = origen || null;
    const m = document.createElement('div');
    m.id = 'menu-color-ud';
    m.className = 'menu-color-ud';
    m.setAttribute('role', 'menu');
    m.innerHTML = `<div class="rejilla">${ColoresUd.PALETA.map((p, i) =>
      `<button type="button" class="muestra" data-i="${i}" style="background:${p.intenso}" title="Color ${i + 1}" aria-label="Color ${i + 1}"></button>`
    ).join('')}</div><button type="button" class="btn btn-mini sin-color">Sin color</button>`;
    document.body.appendChild(m);
    // Guardia para el arnés (sin `getBoundingClientRect` no hay layout): se
    // cae a un tamaño estimado y el posicionamiento queda igual de acotado.
    const r = typeof m.getBoundingClientRect === 'function' ? m.getBoundingClientRect() : { width: 170, height: 110 };
    m.style.left = Math.max(4, Math.min(x, window.innerWidth - r.width - 4)) + 'px';
    m.style.top = Math.max(4, Math.min(y, window.innerHeight - r.height - 4)) + 'px';
    m.onclick = ev => {
      const b = ev.target.closest('button');
      if (!b) return;
      if (b.classList.contains('sin-color')) Storage.fijarColorUd(ud, null);
      else if (b.classList.contains('muestra')) Storage.fijarColorUd(ud, ColoresUd.PALETA[Number(b.dataset.i)].intenso);
      Storage.save();
      cerrarMenuColorUd();
      render(el);
    };
    menuColorUd = m;
    document.onclick = ev => { if (menuColorUd && !menuColorUd.contains(ev.target)) cerrarMenuColorUd(); };
    document.onkeydown = ev => { if (ev.key === 'Escape') cerrarMenuColorUd(); };
  }

  // Menú contextual de una celda alumno × instrumento (M-09, clic derecho):
  // corregir, marcar/quitar «No realiza esta evaluación» o cancelar. Mismo
  // patrón que abrirMenuColorUd: flotante posicionado, cierre con clic fuera
  // y Escape. Los gestos se comparten entre sí: abrir uno cierra el otro.
  let menuCelda = null;
  // Fase 5 (teclado): igual que el menú de color, guarda quién lo abrió (la
  // celda) y le devuelve el foco al cerrarse, por la vía que sea (acción,
  // Escape o clic fuera).
  let menuCeldaOrigen = null;
  function cerrarMenuCelda() {
    if (menuCelda && menuCelda.parentNode) menuCelda.parentNode.removeChild(menuCelda);
    menuCelda = null;
    document.onclick = null;
    document.onkeydown = null;
    const origen = menuCeldaOrigen;
    menuCeldaOrigen = null;
    if (origen && typeof origen.focus === 'function' && origen.isConnected) origen.focus();
  }
  function abrirMenuCelda(el, instId, alumnoId, x, y, desdeClic, origen) {
    cerrarMenuCelda();
    cerrarMenuColorUd();
    menuCeldaOrigen = origen || null;
    const inst = Calc.instrumento(instId);
    if (!inst || !Calc.alumno(alumnoId)) return;
    const fila = ((Storage.db.registros && Storage.db.registros[instId]) || {})[alumnoId] || {};
    const excluido = fila.noRealiza === true;
    const m = document.createElement('div');
    m.id = 'menu-celda';
    m.className = 'menu-celda';
    m.setAttribute('role', 'menu');
    m.innerHTML = `
      <button type="button" class="btn btn-mini accion-corregir">Corregir</button>
      <button type="button" class="btn btn-mini accion-no-realiza">${excluido ? 'Quitar la marca de "No realiza"' : 'Marcar como "No realiza esta evaluación"'}</button>
      <button type="button" class="btn btn-mini accion-cancelar">Cancelar</button>`;
    document.body.appendChild(m);
    // Sin `getBoundingClientRect` no hay layout (arnés sin navegador): se cae
    // al un tamaño estimado y el posicionamiento queda igual de acotado.
    const r = typeof m.getBoundingClientRect === 'function' ? m.getBoundingClientRect() : { width: 220, height: 110 };
    const anchoPantalla = window.innerWidth || 1024;
    const altoPantalla = window.innerHeight || 768;
    m.style.left = Math.max(4, Math.min(x || 0, anchoPantalla - r.width - 4)) + 'px';
    m.style.top = Math.max(4, Math.min(y || 0, altoPantalla - r.height - 4)) + 'px';
    m.onclick = ev => {
      const b = ev.target.closest('button');
      if (!b) return;
      cerrarMenuCelda();
      if (b.classList.contains('accion-corregir')) {
        InstrumentosView.renderCorreccion(el, instId, () => render(el), alumnoId);
      } else if (b.classList.contains('accion-no-realiza')) {
        InstrumentosView.toggleNoRealiza(inst, alumnoId, !excluido);
        render(el);
      }
      // Cancelar: solo cierra el menú, no toca nada.
    };
    menuCelda = m;
    // Si el menú se abrió con clic IZQUIERDO, ese clic sigue burbujeando hasta
    // document: sin esta guarda, el propio gestor de «clic fuera» lo cerraría
    // al instante. El clic derecho no dispara `document.onclick`, así que ahí
    // la guarda sobra (y se consume en el primer clic de verdad).
    let abriendo = desdeClic === true;
    document.onclick = ev => {
      if (abriendo) { abriendo = false; return; }
      if (menuCelda && !menuCelda.contains(ev.target)) cerrarMenuCelda();
    };
    document.onkeydown = ev => { if (ev.key === 'Escape') cerrarMenuCelda(); };
  }

  function tablaCriterios(alumnos, modoTodas, claseSel, periodo) {
    let criterios = Calc.criteriosDeNivel(claseSel, nivelSel);
    if (!alumnos.length) return '<div class="aviso">El grupo de esta clase no tiene alumnado en este nivel.</div>';
    if (!criterios.length) return '<div class="vacio-grande">Este nivel no tiene criterios definidos.</div>';
    return `
      <table class="tabla tabla-cuadricula">
        <thead><tr><th>Alumno</th>${criterios.map(c =>
          `<th title="${Utils.esc(c.descripcion)}">${Utils.esc(c.codigo)}<br><small>${Utils.fmt(c.peso)}%</small></th>`
        ).join('')}<th class="num col-eval">Evaluación</th></tr></thead>
        <tbody>
          ${alumnos.map(a => `<tr>
            <td>${Utils.esc(App.nombreVisible(a))}</td>
            ${criterios.map(c => {
              const l = Calc.logroCriterio(c.id, claseSel, a.id, periodo);
              const n = (l == null ? null : l * 10);
              return `<td class="num">${n == null ? '<span class="badge na">—</span>' : '<span class="badge ' + Calc.clasif(n) + '">' + Utils.fmt(n) + '</span>'}</td>`;
            }).join('')}
            <td class="num col-eval">${Calc.badgeHtml(Calc.notaEvaluacion(claseSel, a.id, periodo))}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      <p class="no-print" style="color:var(--tinta-suave);font-size:13px">% de logro acumulado por criterio del nivel${periodo === 'Final' ? ' (todo el curso)' : ' en ' + periodo}. «—» = sin evidencias todavía. La columna «Evaluación» es la nota final (0–10) con las ponderaciones de los criterios.</p>`;
  }

  function tablaCompetencias(alumnos, modoTodas) {
    let esps = Calc.competenciasEspecificasDeNivel(claseSel, nivelSel);
    let claves = Calc.clavesDeNivel(claseSel, nivelSel);
    if (!alumnos.length) return '<div class="aviso">El grupo de esta clase no tiene alumnado en este nivel.</div>';

    const tabla = (lista, titulo, fnNota, notaPie) => {
      if (!lista.length) return '';
      return `
        <h3 style="font-size:15px;margin:4px 0 8px">${titulo}</h3>
        <table class="tabla tabla-cuadricula">
          <thead><tr><th>Alumno</th>${lista.map(x =>
            `<th title="${Utils.esc(x.descripcion || x.nombre || '')}">${Utils.esc(x.codigo)}</th>`
          ).join('')}</tr></thead>
          <tbody>
            ${alumnos.map(a => `<tr>
              <td>${Utils.esc(App.nombreVisible(a))}</td>
              ${lista.map(x => {
                const n = fnNota(a, x);
                return `<td class="num">${Calc.badgeHtml(n)}</td>`;
              }).join('')}
            </tr>`).join('')}
          </tbody>
        </table>
        <p class="no-print" style="color:var(--tinta-suave);font-size:13px">${notaPie}</p>`;
    };

    const hayClaves = criteriosConClaves();
    return `
      ${tabla(esps, 'Competencias específicas',
        (a, e) => Calc.notaCompetencia(claseSel, a.id, e.id, periodo),
        'Nota por competencia específica (0–10), agregando los criterios vinculados con su peso.')}
      ${claves.length ? tabla(claves, 'Competencias clave (perfil de salida)',
        (a, k) => Calc.notaClave(claseSel, a.id, k.id, periodo),
        'Nota por competencia clave (0–10), agregando con su peso todos los criterios que la llevan asignada.') : `
        <h3 style="font-size:15px;margin:14px 0 8px">Competencias clave (perfil de salida)</h3>
        <div class="aviso">${hayClaves ? 'Ninguna clave aparece aún en esta tabla.' : 'Los criterios de esta asignatura no tienen competencias clave asignadas. Asígnalas editando cada criterio en «Currículo»; las plantillas oficiales las traen automáticamente.'}</div>`}`;
  }

  function criteriosConClaves() {
    return Calc.criteriosDeNivel(claseSel, nivelSel).some(c => (c.claveIds || []).length > 0);
  }

  // Informe de «Imprimir»: una sección por nivel —base y cada nivel ACI—
  // con SOLO su alumnado y SU currículo, sin mezclar columnas (los currículos
  // de cada nivel pueden no coincidir). `opciones`:
  //   - criterios / competencias: qué bloques incluir (al menos uno).
  //   - alumnoId: si se indica, solo ese alumno (informe individual).
  // Se compone aquí y no en el DOM para poder comprobarlo sin navegador.
  function informeHtml(claseId, periodoId, opciones) {
    const op = Object.assign({ criterios: true, competencias: true, alumnoId: null }, opciones || {});
    const db = Storage.db;
    const cl = Calc.clase(claseId);
    if (!cl) return '';
    const gru = Calc.byId(db.grupos, cl.grupoId);
    const alu = op.alumnoId ? Calc.alumno(op.alumnoId) : null;
    const nombreAsig = id => (Calc.asignatura(id) || {}).nombre || '¿?';
    const tituloBloques = op.criterios && op.competencias ? 'Criterios y competencias'
      : op.criterios ? 'Criterios' : 'Competencias específicas y clave';
    const dosBloques = op.criterios && op.competencias;
    const niveles = [{ codigo: '', etiqueta: 'Base (sin adaptación)', asig: nombreAsig(cl.asignaturaId) }]
      .concat(Calc.nivelesAciDeClase(claseId).map(n => ({
        codigo: n.codigo,
        etiqueta: n.etiqueta || n.codigo,
        asig: nombreAsig(n.asignaturaId)
      })));

    // Las tablas leen clase, nivel y periodo del estado del módulo: se fija aquí
    // y se restaura al final, para que el informe no dependa de lo que hubiera
    // seleccionado en pantalla.
    const antes = { claseSel, periodo, nivelSel };
    claseSel = claseId;
    periodo = periodoId;
    let secciones = '';
    try {
      secciones = niveles.map(nv => {
        nivelSel = nv.codigo;
        let alumnos = Calc.alumnosDeClase(claseId)
          .filter(a => Calc.nivelDeAlumno(claseId, a.id) === nv.codigo);
        if (alu) alumnos = alumnos.filter(a => a.id === alu.id);
        if (!alumnos.length) return '';
        const partes = [];
        if (op.criterios) {
          // Con dos bloques hace falta un rótulo; las competencias ya llevan
          // los suyos propios dentro de tablaCompetencias.
          partes.push((dosBloques
            ? '<h3 style="font-size:15px;margin:4px 0 8px">Criterios</h3>' : '')
            + tablaCriterios(alumnos, false, claseId, periodoId));
        }
        if (op.competencias) partes.push(tablaCompetencias(alumnos, false));
        // El título lleva la asignatura del nivel (los ACI pueden venir de otro curso).
        return `<section class="informe-seccion">
        <h2 class="informe-titulo">${Utils.esc(nv.etiqueta)} · ${Utils.esc(nv.asig)}</h2>
        ${partes.join('')}
      </section>`;
      }).join('');
    } finally {
      claseSel = antes.claseSel;
      periodo = antes.periodo;
      nivelSel = antes.nivelSel;
    }

    const quien = alu
      ? Utils.esc(App.nombreVisible(alu))
      : `${Calc.alumnosDeClase(claseId).length} alumno(s)`;
    return `<div class="informe-cab">
        ${Storage.perfilHtml()}
        <strong>${alu ? 'Informe individual' : 'Cuadrícula de calificaciones'} · ${tituloBloques}</strong>
        <span>${Utils.esc(nombreAsig(cl.asignaturaId))} · ${Utils.esc(gru ? gru.nombre : '¿?')} · ${quien} · ${periodo} · impreso el ${Utils.hoy().split('-').reverse().join('/')}</span>
      </div>
      ${secciones || '<p class="aviso">No hay alumnado para imprimir.</p>'}`;
  }

  // El informe vive fuera de la vista (en `#informe-impresion`), y solo se ve al
  // imprimir: así la pantalla no cambia al generar el PDF.
  function limpiarInforme() {
    const cont = document.getElementById('informe-impresion');
    if (cont) cont.innerHTML = '';
    document.body.classList.remove('imprimiendo-informe');
  }

  function imprimirInforme(html) {
    limpiarInforme();
    let cont = document.getElementById('informe-impresion');
    if (!cont) {
      cont = document.createElement('div');
      cont.id = 'informe-impresion';
      document.body.appendChild(cont);
    }
    cont.innerHTML = html;
    document.body.classList.add('imprimiendo-informe');
    // Al terminar de imprimir se retira el informe y se revocan las URLs de
    // objeto de los logos (si no, la memoria crece con cada exportación).
    const alCerrar = () => {
      limpiarInforme();
      Storage.revocarLogos();
      window.removeEventListener('afterprint', alCerrar);
    };
    window.addEventListener('afterprint', alCerrar);
    // Los logos ya son URL de objeto (blob:), que cargan en diferido: hay que
    // esperarlos antes de imprimir o salen a 0×0 (o ausentes) en el PDF.
    const imgs = Array.prototype.slice.call(cont.querySelectorAll('img'));
    const cargadas = imgs.map(img => new Promise(res => {
      if (img.complete && img.naturalWidth > 0) return res();
      img.addEventListener('load', res, { once: true });
      img.addEventListener('error', res, { once: true });
    }));
    Promise.all(cargadas).then(() => window.print());
  }

  // Modal de impresión: elegir alcance (vista actual, clase completa o un
  // alumno) y qué bloques incluir (criterios / competencias) al generar el PDF.
  function modalImprimir(el, insts) {
    const alumnos = Calc.alumnosDeClase(claseSel)
      .map(a => ({ id: a.id, nom: App.nombreVisible(a) }));
    const mbody = UI.openModal({
      titulo: 'Imprimir / PDF',
      cuerpo: `<p class="hint">Elige qué quieres pasar a PDF.</p>
        <div style="display:flex;flex-direction:column;gap:8px">
          <label style="display:flex;gap:8px;align-items:center">
            <input type="radio" name="imp-alcance" value="vista" checked>
            Vista actual (lo que se ve en pantalla)
          </label>
          <label style="display:flex;gap:8px;align-items:center">
            <input type="radio" name="imp-alcance" value="analisis">
            Informe de análisis (todas las secciones del Informe)
          </label>
          <label style="display:flex;gap:8px;align-items:center">
            <input type="radio" name="imp-alcance" value="clase">
            Informe de la clase (base + cada nivel ACI)
          </label>
          <label style="display:flex;gap:8px;align-items:center">
            <input type="radio" name="imp-alcance" value="alumno" ${alumnos.length ? '' : 'disabled'}>
            Informe de un alumno
            <select id="imp-alumno" style="max-width:220px;margin-left:auto">
              ${UI.selectHtml(alumnos, alumnos[0] ? alumnos[0].id : '', 'id', 'nom')}
            </select>
          </label>
        </div>
        <div id="imp-bloques" style="display:none;gap:16px;margin:10px 0 2px;
             padding:10px 12px;border:1px solid var(--linea);border-radius:8px">
          <label style="display:flex;gap:6px;align-items:center">
            <input type="checkbox" id="imp-criterios" checked> Criterios
          </label>
          <label style="display:flex;gap:6px;align-items:center">
            <input type="checkbox" id="imp-competencias" checked> Competencias
          </label>
        </div>
        <button class="btn btn-primario" id="imp-go" style="margin-top:12px">Imprimir / PDF</button>`
    });

    const selAlumno = mbody.querySelector('#imp-alumno');
    const cajaBloques = mbody.querySelector('#imp-bloques');
    const alcance = () => {
      const r = mbody.querySelector('input[name=imp-alcance]:checked');
      return r ? r.value : 'vista';
    };
    const refresca = () => {
      selAlumno.disabled = alcance() !== 'alumno';
      cajaBloques.style.display = (alcance() === 'vista' || alcance() === 'analisis') ? 'none' : 'flex';
    };
    mbody.querySelectorAll('input[name=imp-alcance]').forEach(r => { r.onchange = refresca; });
    refresca();

    mbody.querySelector('#imp-go').onclick = () => {
      const donde = alcance();
      if (donde === 'vista') {
        UI.closeModal();
        imprimirVistaActual(el, insts);
        return;
      }
      if (donde === 'analisis') {
        UI.closeModal();
        // Fase 4a: la vista de Informes es autónoma y guarda su propio contexto,
        // así que el informe de análisis de la cuadrícula se pide con SU clase,
        // nivel y trimestre como alcance puntual (informeHtml lo restaura).
        imprimirInforme(InformeView.informeHtml({
          claseSel,
          nivelSel,
          periodo
        }));
        return;
      }
      const criterios = mbody.querySelector('#imp-criterios').checked;
      const competencias = mbody.querySelector('#imp-competencias').checked;
      if (!criterios && !competencias) {
        UI.toast('Marca «Criterios», «Competencias» o ambas.');
        return;
      }
      const alumnoId = donde === 'alumno' ? selAlumno.value : null;
      UI.closeModal();
      imprimirInforme(informeHtml(claseSel, periodo, { criterios, competencias, alumnoId }));
    };
  }

  // Cabecera de perfil para la impresión de la vista actual (petición del
  // docente: TODOS los imprimibles llevan nombre del maestro, centro y logo
  // del cole). Devuelve el bloque a inyectar, o null si no hay perfil: igual
  // que en los otros imprimibles, sin perfil no se pinta nada (ni restos).
  function perfilImpresion() {
    const cab = Storage.perfilHtml();
    if (!cab) return null;
    const bloque = document.createElement('div');
    bloque.className = 'perfil-impresion';
    bloque.innerHTML = cab;
    return bloque;
  }

  // Imprime lo que hay en pantalla. Si la pestaña es «Instrumentos», todas las
  // unidades quedan desplegadas: una unidad plegada deja su celda de relleno y
  // CSS no puede recuperarla, así que se abren en JS.
  function imprimirVistaActual(el, insts) {
    limpiarInforme();
    if (tab === 'notas') {
      udsAbiertas.clear();
      Calc.unidadesDe(insts).forEach(u => udsAbiertas.add(u));
      render(el);
    }
    // La cabecera de perfil se inyecta al principio de la vista: solo se ve al
    // imprimir (CSS) y el siguiente render la retira con el resto del HTML.
    const bloque = perfilImpresion();
    if (bloque) el.insertBefore(bloque, el.firstElementChild || null);
    window.print();
  }

  // `opciones.tab` permite fijar la pestaña activa (uso interno y pruebas),
  // `opciones.unidadesAbiertas` las unidades que deben verse desplegadas y
  // `opciones.periodo` el trimestre visible.
  function render(el, opciones) {
    if (opciones && opciones.tab) tab = opciones.tab;
    if (opciones && opciones.periodo) periodo = opciones.periodo;
    if (opciones && opciones.unidadesAbiertas) {
      udsAbiertas.clear();
      opciones.unidadesAbiertas.forEach(u => udsAbiertas.add(u));
    }
    const db = Storage.db;
    // `opciones.claseId` permite abrir una clase concreta (p. ej. desde los
    // paneles de Inicio).
    if (opciones && opciones.claseId && Calc.clase(opciones.claseId)) claseSel = opciones.claseId;
    if (!claseSel || !Calc.clase(claseSel)) claseSel = db.clases.length ? db.clases[0].id : null;

    if (!db.clases.length) {
      el.innerHTML = `<section class="card"><div class="vacio-grande">
        <strong>No hay clases todavía</strong>
        Crea grupos, alumnos y clases para ver aquí la cuadrícula de calificación.
        <div class="acciones" style="justify-content:center;margin-top:12px">
          <button class="btn btn-primario" id="btn-ir-alumnos">Ir a Alumnos y grupos</button>
        </div>
      </div></section>`;
      const btnAlu = el.querySelector('#btn-ir-alumnos');
      // «Alumnos y grupos» es la primera vista de preparación (subpestaña de
      // Evaluación): desde ahí se llega a clases, currículo e instrumentos.
      if (btnAlu) btnAlu.onclick = () => App.ir('alumnos');
      return;
    }

    const nivelesAci = Calc.nivelesAciDeClase(claseSel);
    if (nivelSel && nivelSel !== TODAS && !nivelesAci.some(n => n.codigo === nivelSel)) nivelSel = '';

    const alumnosTodos = Calc.alumnosDeClase(claseSel);
    const modoTodas = nivelSel === TODAS;
    const alumnos = modoTodas ? alumnosTodos : alumnosTodos.filter(a => Calc.nivelDeAlumno(claseSel, a.id) === nivelSel);
    const instsNivel = Calc.instrumentosDeClase(claseSel)
      .filter(i => modoTodas || Calc.instrumentoParaNivel(i, nivelSel))
      .sort((a, b) => (String(a.unidad || '').localeCompare(String(b.unidad || ''), 'es'))
        || (a.fecha || '').localeCompare(b.fecha || ''));
    // El selector de trimestre también filtra las columnas: T1/T2/T3 muestran solo
    // sus instrumentos; «Final» muestra todo el curso (todas las UDs).
    const insts = periodo === 'Final'
      ? instsNivel
      : instsNivel.filter(i => i.periodo === periodo);

    const selNivel = nivelesAci.length ? `
      <select id="sel-nivel" style="max-width:220px">
        <option value="${TODAS}" ${modoTodas ? 'selected' : ''}>Todos los niveles (grupo completo)</option>
        <option value="" ${nivelSel === '' ? 'selected' : ''}>Base (sin adaptación)</option>
        ${nivelesAci.map(n => `<option value="${Utils.esc(n.codigo)}" ${nivelSel === n.codigo ? 'selected' : ''}>${Utils.esc(n.etiqueta || n.codigo)}</option>`).join('')}
      </select>` : '';

    const buscaAlumno = alumnos.length > 6 ? '<input type="text" id="busca-alumno" class="no-print" placeholder="Buscar alumn@" style="max-width:170px">' : '';

    // Instrumentos que todavía tienen alumnado sin nota: es lo que ofrece
    // «Corregir», y también lo que da sentido a imprimir la cuadrícula entera.
    // Sin pendientes el botón queda deshabilitado, como el de Inicio.
    const porCorregir = insts.filter(i => Calc.progresoInstrumento(i).pendientes > 0).length;
    const btnCorregir = `<button class="btn no-print${porCorregir ? ' btn-primario' : ''}" id="btn-corregir"${porCorregir ? '' : ' disabled'}>Corregir${porCorregir ? ` · ${porCorregir} pendiente${porCorregir === 1 ? '' : 's'}` : ''}</button>`;

    // El mismo grupo/asignatura se usa en pantalla y en la cabecera impresa.
    const cl = Calc.clase(claseSel);
    const gru = Calc.byId(db.grupos, cl.grupoId);

    // Cabecera que solo sale impresa: el informe se lee solo, sin la vista.
    const asigImp = (Calc.asignaturaDeClase(claseSel) || {}).nombre || '';
    const grupoImp = gru ? gru.nombre : '';
    const nivelImp = modoTodas ? 'todos los niveles' : nivelSel ? 'nivel ' + Calc.etiquetaNivel(claseSel, nivelSel) : 'base';
    const tituloImp = tab === 'notas' ? 'Instrumentos' : tab === 'criterios' ? 'Criterios' : 'Competencias específicas y clave';
    const cabeceraImp = `<div class="solo-impresion cabecera-impresion">
      <strong>Cuadrícula de calificaciones · ${tituloImp}</strong>
      <span>${Utils.esc(asigImp)} · ${Utils.esc(grupoImp)} · ${periodo} · ${nivelImp} · impreso el ${Utils.hoy().split('-').reverse().join('/')}</span>
    </div>`;

    // Insignia del ajuste de notas sin corregir (M-04): informativa, no botón.
    // Da contexto a la media de la cuadrícula sea cual sea la pestaña activa.
    const sinNotaEsCero = !!(db.configuracion && db.configuracion.sinNotaEsCero);
    const badgeSinNota = sinNotaEsCero
      ? '<span class="badge warn" title="Un instrumento sin corregir cuenta como 0 en la media de la unidad. Cámbialo en Configuración → Calificación.">Sin corregir cuenta como 0</span>'
      : '<span class="badge" title="Un instrumento sin corregir NO cuenta en la media de la unidad. Cámbialo en Configuración → Calificación.">Sin corregir no cuenta</span>';

    // El buscador de la cabecera filtra la tabla de notas; el selector de
    // periodo gobierna el alcance de la cuadrícula.
    el.innerHTML = `
      <section class="card">
        ${cabeceraImp}
        <div class="card-head no-print">
          <h2>Calificaciones</h2>
          ${badgeSinNota}
          ${(() => {
            const lblNivel = modoTodas
              ? ' · <b>todos los niveles</b>'
              : nivelSel ? ` · nivel <b>${Utils.esc(Calc.etiquetaNivel(claseSel, nivelSel))}</b>` : '';
            return `<span style="color:var(--tinta-suave);font-size:13px">
              Grupo vinculado: <b>${Utils.esc(gru ? gru.nombre : '¿?')}</b> · ${alumnos.length} de ${alumnosTodos.length} alumno(s)${lblNivel}</span>`;
          })()}
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <select id="sel-clase" style="max-width:260px">${UI.selectHtml(db.clases.map(c => ({
              id: c.id,
              nombre: `${Calc.asignaturaDeClase(c.id)?.nombre || '?'} · ${(Calc.byId(db.grupos, c.grupoId) || {}).nombre || '?'}`
            })), claseSel, 'id', 'nombre')}</select>
            ${selNivel}
            ${buscaAlumno}
            <select id="sel-periodo" style="max-width:130px">
              ${['T1', 'T2', 'T3', 'Final'].map(p => `<option ${p === periodo ? 'selected' : ''}>${p}</option>`).join('')}
            </select>
            <button class="btn no-print" id="btn-imprimir">Imprimir / PDF</button>
            <span id="slot-privacidad"></span>
          </div>
        </div>
        <div class="chips no-print" id="tabs" style="margin-bottom:14px">
          <label class="chip ${tab === 'notas' ? 'on' : ''}" data-tab="notas" ${tab === 'notas' ? 'aria-current="true"' : ''}>Instrumentos</label>
          <label class="chip ${tab === 'criterios' ? 'on' : ''}" data-tab="criterios" ${tab === 'criterios' ? 'aria-current="true"' : ''}>Criterios</label>
          <label class="chip ${tab === 'competencias' ? 'on' : ''}" data-tab="competencias" ${tab === 'competencias' ? 'aria-current="true"' : ''}>Competencias específicas y clave</label>
        </div>
        ${tab === 'notas' ? `<div class="barra-tab no-print" style="justify-content:flex-end">
          <button class="btn" id="btn-nuevo-instrumento">+ Crear instrumento</button>
          ${btnCorregir}
        </div>` : ''}
        <div class="scroll-tabla" id="contenido">
          ${tab === 'notas' ? tablaNotas(alumnos, insts, modoTodas)
            : modoTodas && (tab === 'criterios' || tab === 'competencias')
              ? '<div class="aviso">En la vista «Todos los niveles» solo se muestran los instrumentos y la nota armonizada de cada alumno. Elige un nivel concreto para ver criterios y competencias.</div>'

        </div>
      </section>`;

    el.querySelector('#sel-clase').onchange = e => { claseSel = e.target.value; nivelSel = ''; render(el); };

    if (selPeriodo) selPeriodo.onchange = e => { periodo = e.target.value; render(el); };
    if (el.querySelector('#sel-nivel')) {
      el.querySelector('#sel-nivel').onchange = e => { nivelSel = e.target.value; render(el); };
    }
    const busca = el.querySelector('#busca-alumno');
    if (busca) {
      const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      busca.oninput = () => {
        const q = norm(busca.value.trim());
        el.querySelectorAll('#contenido tbody tr').forEach(tr => {
          const cel = tr.querySelector('td');
          tr.style.display = !q || (cel && norm(cel.textContent).includes(q)) ? '' : 'none';
        });
      };
    }

    // El botón solo existe en la pestaña «Instrumentos».
    const btnCorregirEl = el.querySelector('#btn-corregir');
    if (btnCorregirEl) {
      btnCorregirEl.onclick = () => {
        // Corregir desde aquí no debe arrastrar a otra vista: al salir del
        // corrector se vuelve a la cuadrícula.
        InstrumentosView.modalCalificar(claseSel,
          id => InstrumentosView.renderCorreccion(el, id, () => render(el)));
      };
    }
    const btnNuevo = el.querySelector('#btn-nuevo-instrumento');
    if (btnNuevo) {
      btnNuevo.onclick = () => {
        InstrumentosView.modalInstrumento(null, claseSel, () => render(el));
      };
    }

    el.querySelector('#btn-imprimir').onclick = () => modalImprimir(el, insts);

    // M-12: modo privacidad — botón de ojo (componente compartido con el
    // Informe). Un clic oculta los nombres; mantener pulsado 1 s los vuelve a
    // mostrar. El hueco del HTML encaja el botón que crea el componente.
    const slotPriv = el.querySelector('#slot-privacidad');
    if (slotPriv && typeof slotPriv.insertBefore === 'function') {
      slotPriv.parentNode.insertBefore(App.crearBotonPrivacidad(() => render(el)), slotPriv);
      slotPriv.remove();
    }

    el.querySelectorAll('#tabs .chip').forEach(ch => {
      ch.onclick = () => {
        tab = ch.dataset.tab;
        render(el);
        // La sección activa del menú depende de la pestaña: repinta la nav.
        if (typeof App !== 'undefined' && App.refrescarNav) App.refrescarNav();
      };
    });

    // Plegar o desplegar las columnas de una unidad didáctica. El clic derecho
    // (o Mayús+F10) abre el menú de color de la UD.
    el.querySelectorAll('[data-toggle-ud]').forEach(th => {
      th.onclick = () => {
        const clave = th.dataset.toggleUd || '';
        if (udsAbiertas.has(clave)) udsAbiertas.delete(clave); else udsAbiertas.add(clave);
        render(el);
      };
      th.oncontextmenu = e => { e.preventDefault(); abrirMenuColorUd(el, th.dataset.toggleUd, e.clientX, e.clientY, th); };
      th.setAttribute('tabindex', '0');
      th.onkeydown = e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); th.onclick(); }
        else if ((e.key === 'F10' && e.shiftKey) || e.key === 'ContextMenu') {
          e.preventDefault();
          // Guardia para el arnés (sin layout que medir): se cae al origen de
          // coordenadas y el menú queda igual de acotado a la pantalla.
          const r = typeof th.getBoundingClientRect === 'function' ? th.getBoundingClientRect() : {};
          abrirMenuColorUd(el, th.dataset.toggleUd, r.left, r.bottom, th);
        }
      };
    });

    el.querySelectorAll('.celda-nota[data-inst]').forEach(td => {
      // Clic derecho (M-09): menú contextual de la celda, en cualquier celda
      // con alumno e instrumento (pendiente, corregida o «No realiza»).
      td.oncontextmenu = e => {
        e.preventDefault();
        abrirMenuCelda(el, td.dataset.inst, td.dataset.alumno, e.clientX, e.clientY, false, td);
      };
      if (td.dataset.excluida) {
        // «No realiza»: el alumno está excluido, así que la corrección no es
        // un camino válido ni con el clic izquierdo; ambos gestos abren el
        // mismo menú (desdeClic evita que ese clic lo cierre al abrirse).
        td.onclick = e => abrirMenuCelda(el, td.dataset.inst, td.dataset.alumno, e.clientX, e.clientY, true, td);
      } else {
        td.onclick = () => InstrumentosView.renderCorreccion(el, td.dataset.inst, () => render(el), td.dataset.alumno);
      }
      // Fase 5 (teclado): la celda es alcanzable con Tab (tabindex en el HTML).
      // Enter/Espacio repiten el clic — corregir, o el mismo menú si el alumno
      // está excluido — y la tecla de menú del navegador (ContextMenu o
      // Mayús+F10) abre el menú contextual de la celda.
      td.onkeydown = e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          if (td.dataset.excluida) {
            const r = typeof td.getBoundingClientRect === 'function' ? td.getBoundingClientRect() : {};
            abrirMenuCelda(el, td.dataset.inst, td.dataset.alumno, r.left, r.bottom, false, td);
          } else {
            InstrumentosView.renderCorreccion(el, td.dataset.inst, () => render(el), td.dataset.alumno);
          }
        } else if ((e.key === 'F10' && e.shiftKey) || e.key === 'ContextMenu') {
          e.preventDefault();
          // Guardia para el arnés (sin layout): el menú se acota igualmente.
          const r = typeof td.getBoundingClientRect === 'function' ? td.getBoundingClientRect() : {};
          abrirMenuCelda(el, td.dataset.inst, td.dataset.alumno, r.left, r.bottom, false, td);
        }
      };
    });
    el.querySelectorAll('th[data-edit]').forEach(th => {
      th.onclick = () => {
        try {
          InstrumentosView.modalInstrumento(Calc.instrumento(th.dataset.edit));
        } catch (e) {
          console.error(e);
          alert('Error al editar: ' + e.message);
        }
      };
    });
  }

  return {
    render,
    informeHtml,
    // Camino de impresión compartido con la vista de Informes (Fase 4a): su
    // botón «Imprimir / PDF» vuelca el HTML en #informe-impresion e imprime.
    imprimirInforme,
    // Impresión de la vista actual (comprobable en el arnés sin impresora:
    // la llamada termina justo antes de window.print()).
    imprimirVistaActual,
    // Cabecera de perfil de la impresión de la vista actual (comprobable sin
    // imprimir: devuelve el bloque DOM o null).
    perfilImpresion,
    // Pestaña activa: la usa el menú principal para marcar Evaluación.
    tabActivo() { return tab; }
  };
})();

</script>

<script>
const App = (() => {
  const VISTAS = [
    { id: 'inicio', label: 'Inicio', render: renderInicio },
    { id: 'alumnos', label: 'Alumnos y grupos', render: el => AlumnosView.render(el) },
    { id: 'clases', label: 'Asignaturas y clases', render: el => ClasesView.render(el) },
    { id: 'curriculo', label: 'Currículo', render: el => CurriculoView.render(el) },
    { id: 'instrumentos', label: 'Instrumentos', render: el => InstrumentosView.render(el) },
    // Sección «Corregir»: la cola de pendientes de la clase, no el listado de
    // instrumentos (que pasa a ser subpestaña de Evaluación).
    { id: 'corregir', label: 'Corregir', render: el => InstrumentosView.renderCorregir(el) },
    // La cuadrícula acepta opciones (pestaña, clase, periodo): hay que
    // reenviárselas o se perderían (p. ej. el tab de la sección Evaluación).
    { id: 'cuadricula', label: 'Calificaciones', render: (el, opciones) => CuadriculaView.render(el, opciones) },
    // Informes (Fase 4a): vista propia y autónoma, ya no la pestaña «Informe»
    // de la cuadrícula. Sin opciones: la vista guarda su propio contexto.
    { id: 'informes', label: 'Informes', render: el => InformeView.render(el, {}) }
  ];
  // Secciones del menú principal (Fase 2 de la remodelación de la navegación):
  // Inicio · Corregir · Evaluación · Informes · Ajustes. Corregir tiene su
  // propia vista (cola de pendientes) y Evaluación agrupa las vistas de
  // preparación y revisión como subpestañas.
  const SECCIONES = [
    { id: 'inicio', label: 'Inicio', vista: 'inicio' },
    { id: 'corregir', label: 'Corregir', vista: 'corregir' },
    // Evaluación abre la pestaña principal de la cuadrícula: si se está en
    // Informes, pulsar Evaluación debe volver a las notas.
    { id: 'evaluacion', label: 'Evaluación', vista: 'cuadricula', tab: 'notas' },
    // Informes abre su vista propia (Fase 4a), ya no la pestaña Informe de la
    // cuadrícula.
    { id: 'informes', label: 'Informes', vista: 'informes' },
    { id: 'ajustes', label: 'Ajustes', modal: true }
  ];
  // Subpestañas de Evaluación: preparar y revisar la evaluación sin recordar
  // dónde está cada cosa. El orden es el de trabajo: cuadrícula, instrumentos,
  // alumnado, clases y currículo.
  const SUBEVAL = [
    { id: 'cuadricula', label: 'Cuadrícula' },
    { id: 'instrumentos', label: 'Instrumentos' },
    { id: 'alumnos', label: 'Alumnos' },
    { id: 'clases', label: 'Clases' },
    { id: 'curriculo', label: 'Currículo' }
  ];
  const SECCION_DE_VISTA = {
    inicio: 'inicio',
    corregir: 'corregir',
    instrumentos: 'evaluacion',
    cuadricula: 'evaluacion',
    informes: 'informes',
    alumnos: 'evaluacion',
    clases: 'evaluacion',
    curriculo: 'evaluacion'
  };
  let actual = 'inicio';

  // M-12: modo privacidad (nombres → iniciales) para proyectar o imprimir.
  // Estado SOLO de sesión: no se guarda en `db` ni viaja en el backup; al
  // recargar la página se vuelven a mostrar los nombres.
  let anonimo = false;

  // M-12: cómo se pinta un alumno. Con el modo privacidad activo devuelve las
  // iniciales («G. J.»: inicial del primer apellido + inicial del nombre); si
  // no, «Apellidos, Nombre» como siempre. La corrección (renderCorreccion) SÍ
  // pasa por aquí: tiene su propio ojo para ocultar/mostrar.
  function nombreVisible(a) {
    if (!a) return '';
    if (!anonimo) return `${a.apellidos}, ${a.nombre}`;
    // Iniciales «N. P. S.»: nombre, primer apellido y segundo apellido, en
    // ese orden (petición del docente). Sin segundo apellido queda «N. P.».
    const ap = String(a.apellidos || '').trim().split(/\s+/).filter(Boolean);
    const nom = String(a.nombre || '').trim();
    const inicial = x => x ? x.charAt(0).toUpperCase() + '.' : '';
    return [inicial(nom), inicial(ap[0]), inicial(ap[1])].filter(Boolean).join(' ');
  }

  // M-12: botón de privacidad con icono de ojo (sustituye a los botones de
  // texto «Ocultar/Mostrar nombres»). Un clic oculta los nombres; para volver
  // a mostrarlos hay que MANTENER PULSADO ≥1 s: se proyecta en clase y un
  // toque accidental no debe revelar el listado. Las vistas repintan vía
  // `onCambio` tras cada cambio (el botón se recrea con el nuevo estado).
  const MS_REVELAR = 1000;
  const ICONO_OJO =
    '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const ICONO_OJO_TACHADO =
    '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>' +
    '<line x1="1" y1="1" x2="23" y2="23"/></svg>';

  function crearBotonPrivacidad(onCambio) {
    const btn = document.createElement('button');
    btn.className = 'icon-btn btn-privacidad';

    // Ojo abierto = nombres visibles; tachado = ocultos. Los atributos (aria,
    // title) se ajustan con el estado para que el botón hable solo.
    const pintaEstado = () => {
      const oculto = anonimo;
      btn.innerHTML = oculto ? ICONO_OJO_TACHADO : ICONO_OJO;
      const texto = oculto
        ? 'Mantén pulsado para mostrar los nombres'
        : 'Ocultar los nombres al proyectar';
      if (typeof btn.setAttribute === 'function') {
        btn.setAttribute('type', 'button');
        btn.setAttribute('aria-pressed', String(oculto));
        btn.setAttribute('aria-label', texto);
        btn.setAttribute('title', texto);
      } else {
        btn.type = 'button';
        btn.title = texto;
      }
    };
    pintaEstado();

    let tempRevelar = null;

    // Pulso de aviso: anillo breve que acompaña al toast cuando se intenta
    // revelar con un clic simple (solo se consigue manteniendo pulsado).
    function pulso() {
      btn.classList.add('pulso-privacidad');
      setTimeout(() => btn.classList.remove('pulso-privacidad'), 600);
    }

    function avisoMantener() {
      UI.toast('Mantén pulsado el ojo para mostrar los nombres.');
      pulso();
    }

    function cambiar(ocultar) {
      anonimo = ocultar;
      if (typeof onCambio === 'function') onCambio();
    }

    // Clic simple: oculta si los nombres están visibles; si están ocultos NO
    // revela (eso exige mantener pulsado ≥1 s) y lo hace saber.
    btn.addEventListener('click', () => {
      // Si la pulsación larga ya reveló, la vista se repintó y este botón
      // quedó huérfano: ignora el clic sintético que le llega al soltar.
      if (!btn.isConnected) return;
      if (!anonimo) { cambiar(true); return; }
      avisoMantener();
    });

    // Mantener pulsado (ratón/táctil) ≥1 s revela. Si los nombres ya son
    // visibles no hay nada que armar: el clic nativo los oculta.
    btn.addEventListener('pointerdown', () => {
      if (!anonimo) return;
      clearTimeout(tempRevelar);
      tempRevelar = setTimeout(() => { tempRevelar = null; cambiar(false); }, MS_REVELAR);
    });
    const suelta = () => { clearTimeout(tempRevelar); tempRevelar = null; };
    btn.addEventListener('pointerup', suelta);
    btn.addEventListener('pointerleave', suelta);
    btn.addEventListener('pointercancel', suelta);

    // Teclado: Enter/Espacio mantenidos ≥1 s también revelan. Con los nombres
    // visibles no se intercepta nada: el clic nativo del botón ya los oculta.
    btn.addEventListener('keydown', e => {
      if (!anonimo) return;
      if (e.key !== 'Enter' && e.key !== ' ') return;
      if (e.repeat) return; // al mantener, el teclado repite keydown: no rearmar
      if (typeof e.preventDefault === 'function') e.preventDefault(); // sin clic nativo: lo gestionamos aquí
      clearTimeout(tempRevelar);
      tempRevelar = setTimeout(() => { tempRevelar = null; cambiar(false); }, MS_REVELAR);
    });
    btn.addEventListener('keyup', e => {
      if (!anonimo) return;
      if (e.key !== 'Enter' && e.key !== ' ') return;
      // Pulsación corta: no revela; mismo aviso que el clic simple.
      if (tempRevelar) { suelta(); avisoMantener(); }
    });

    return btn;
  }

  function opcionesCurso(valorActual) {
    const m = /^(\d{4})\//.exec(String(valorActual || ''));
    const base = m ? parseInt(m[1], 10) : new Date().getMonth() >= 6 ? new Date().getFullYear() : new Date().getFullYear() - 1;
    const lista = [];
    for (let y = base - 2; y <= base + 4; y++) lista.push(`${y}/${y + 1}`);
    if (!lista.includes(valorActual)) lista.push(valorActual);
    lista.sort();
    return lista.map(v => `<option ${v === valorActual ? 'selected' : ''}>${Utils.esc(v)}</option>`).join('');
  }

  // Mensaje de aviso según el estado de la copia de seguridad (R-01).
  // `conDestacado`: cuando el aviso destacado ya muestra el texto (nunca
  // exportado o cambios sin copiar), el discreto no lo repite: solo aporta
  // los botones (carpeta y copia previa).
  function avisoCopiaHtml(est, conDestacado) {
    if (!est.hayDatos) return '';
    if (conDestacado && (est.nivel === 'nunca' || est.nivel === 'pendiente')) return '';
    if (est.nivel === 'nunca') {
      return '<div class="aviso" style="margin:8px 0 0;background:#fef2f2;border-color:#fecaca;color:#991b1b"><b>Todavía no has hecho ninguna copia de seguridad.</b> Tus notas solo están en este navegador: expórtalas al USB.</div>';
    }
    if (est.nivel === 'pendiente') {
      return '<div class="aviso" style="margin:8px 0 0"><b>Hay cambios desde tu última copia.</b> Exporta el backup al USB para no perderlos.</div>';
    }
    if (est.nivel === 'antigua') {
      return `<div class="aviso" style="margin:8px 0 0">Tu última copia es de hace ${est.dias} días. Conviene exportarla otra vez.</div>`;
    }
    return '';
  }

  // Aviso de copia destacado (Fase 3): solo cuando hay algo que perder. El
  // aviso discreto del bloque «Copias de seguridad» sigue pintándose siempre.
  function avisoCopiaDestacadoHtml() {
    const est = Storage.estadoCopia();
    const texto = est.nivel === 'nunca'
      ? '<b>Todavía no has hecho ninguna copia de seguridad.</b> Tus notas solo están en este navegador: expórtalas al USB.'
      : '<b>Hay cambios desde tu última copia.</b> Exporta el backup al USB para no perderlos.';
    return `<section id="aviso-backup" class="aviso aviso-pendiente no-print">
      <div>⚠ ${texto}</div>
      <div class="acciones" style="margin-top:8px">
        <button class="btn btn-primario btn-mini" id="btn-backup-aviso">Hacer backup</button>
      </div>
    </section>`;
  }

  // --- Paneles de Inicio (puros, sin DOM: comprobables en el arnés) ---------
  // Pendientes: el conteo unificado de correcciones (alumno × instrumento) y
  // el atajo a la cola de Corregir. Es el primer panel tras la cabecera.
  function panelPendientesHtml() {
    const insts = Storage.db.instrumentos || [];
    let pendientes = 0;
    let conPendientes = 0;
    insts.forEach(i => {
      const p = Calc.progresoInstrumento(i).pendientes;
      if (p > 0) { pendientes += p; conPendientes++; }
    });
    const texto = pendientes
      ? `<b class="num-grande">${pendientes}</b> ${pendientes === 1 ? 'corrección pendiente' : 'correcciones pendientes'} en ${conPendientes} ${conPendientes === 1 ? 'instrumento' : 'instrumentos'}`
      : 'Todo corregido';
    return `<section id="panel-pendientes" class="card inicio-pendientes no-print ${pendientes ? '' : 'todo-ok'}">
      <div class="card-head"><h2>Pendientes</h2>
        <button class="btn btn-primario" id="btn-corregir-pendientes" ${pendientes ? '' : 'disabled'}>Corregir pendientes</button></div>
      <p style="margin:0;color:var(--tinta-suave)">${texto}</p>
    </section>`;
  }

  // Estado por clase: qué está montado y qué queda por corregir. Toca la fila
  // para abrir Calificaciones de esa clase.
  function panelesEstadoHtml() {
    const db = Storage.db;
    if (!db.clases.length) return '';
    const filas = db.clases.map(c => {
      const asig = Calc.asignaturaDeClase(c.id);
      const gru = Calc.byId(db.grupos, c.grupoId);
      const insts = Calc.instrumentosDeClase(c.id);
      const pend = insts.reduce((s, i) => s + Calc.progresoInstrumento(i).pendientes, 0);
      const marca = !insts.length ? '<span class="badge na">sin instrumentos</span>'

  // Asignaturas en uso por el curso: la de cada clase y la de cada nivel ACI
  // (los ACI pueden apuntar a la asignatura de otro curso).
  function asignaturasEnUso(db) {
    const ids = [];
    db.clases.forEach(c => {
      if (c.asignaturaId && !ids.includes(c.asignaturaId)) ids.push(c.asignaturaId);
      Calc.nivelesAciDeClase(c.id).forEach(n => {
        const id = n.asignaturaId || c.asignaturaId;
        if (id && !ids.includes(id)) ids.push(id);
      });
    });
    return ids;
  }

  // Cobertura del currículo: errores de montaje que rompen la calificación.
  function panelesCoberturaHtml() {
    const db = Storage.db;
    const ids = asignaturasEnUso(db);
    if (!ids.length) return '';
    const incidencias = [];
    ids.forEach(id => {
      const asig = Calc.asignatura(id);
      const nombre = asig ? asig.nombre : '¿?';
      const crits = db.criterios.filter(c => c.asignaturaId === id);
      if (!crits.length) { incidencias.push(['ko', nombre, 'sin criterios definidos']); return; }
      const suma = crits.reduce((s, c) => s + (Number(c.peso) || 0), 0);
      if (Math.abs(suma - 100) > 0.01) incidencias.push(['warn', nombre, `los criterios suman ${Utils.fmt(suma)}% (deben ser 100%)`]);
      const sinClave = crits.filter(c => !(c.claveIds || []).length).length;
      if (sinClave) incidencias.push(['warn', nombre, `${sinClave} criterio${sinClave === 1 ? '' : 's'} sin competencias clave asignadas`]);
    });
    const cuerpo = incidencias.length
      ? `<ul class="flujo" style="margin:0;padding-left:18px;color:var(--tinta-suave)">${incidencias.map(([nivel, nombre, txt]) =>
          `<li><span class="badge ${nivel}">${nivel === 'ko' ? 'Falta' : 'Revisar'}</span> <b>${Utils.esc(nombre)}</b> — ${Utils.esc(txt)}</li>`).join('')}</ul>`
      : '<p style="margin:0"><span class="badge ok">Todo en orden</span> Criterios, pesos y competencias clave completos en las asignaturas en uso.</p>';
    return `
      <section class="card">
        <div class="card-head"><h2>Cobertura del currículo</h2>
          <button class="btn btn-mini" id="btn-ir-curriculo">Abrir Currículo</button></div>
        ${cuerpo}
      </section>`;
  }

  // Isotipo inscrito en un círculo blanco: el círculo cubre el viewBox y el
  // isotipo va ligeramente reducido para que siempre se lea sobre blanco.
  function isotipoSvg(color) {
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="425 110 558 552">` +
      `<circle cx="704" cy="386" r="279" fill="#ffffff"/>` +
      `<g transform="translate(0,768) scale(0.1,-0.1) translate(7040,3820) scale(0.88) translate(-7040,-3820)" fill="${color}" stroke="none">` +
      `<path d="${ISOTIPO_D}"/></g></svg>`;
  }

  // Mezcla un color con blanco (para el --acento-suave del tema).
  function tinte(hex, fraccion) {
    const n = parseInt(String(hex).slice(1), 16);
    const f = fraccion == null ? 0.88 : fraccion;
    const mez = v => Math.round(v + (255 - v) * f);
    const a2 = x => x.toString(16).padStart(2, '0');
    return '#' + a2(mez((n >> 16) & 255)) + a2(mez((n >> 8) & 255)) + a2(mez(n & 255));
  }

  // Aplica el tema: color de marca (cabecera), acento de énfasis (botones, chips,
  // resaltados, foco), su tinte suave y el favicon en caliente.
  function aplicaTema() {
    const t = (Storage.db && Storage.db.tema) || { color: '#1f5c6b', nav: 'topbar' };
    const raiz = document.documentElement;
    const valores = {
      '--marca': t.color,
      '--acento': t.color,
      '--acento-suave': tinte(t.color, 0.88)
    };
    Object.keys(valores).forEach(k => {
      if (raiz.style && typeof raiz.style.setProperty === 'function') raiz.style.setProperty(k, valores[k]);
      else if (raiz.style) raiz.style[k] = valores[k];
    });
    const link = document.getElementById('favicon-isotipo');
    if (link) link.href = 'data:image/svg+xml,' + encodeURIComponent(isotipoSvg(t.color));
  }

    btnExpAjustes.onclick = () => {
      btnExpAjustes.disabled = true; // ocupado: sin doble clic durante la copia
      Storage.exportar()
        .then(ok => { if (ok) { UI.toast('Backup exportado'); pintaEstadoCopia(); modalAjustes(); } })
        .catch(e => alert('Error al exportar: ' + e.message))
        .finally(() => { btnExpAjustes.disabled = false; });
    };
    body.querySelector('#btn-importar-ajustes').onclick = () =>
      document.getElementById('input-importar').click();
    // Carpeta de backups: con carpeta elegida, «Guardar» sobrescribe
    // `evalcrit.json` en ella; «Exportar backup» crea uno nuevo con fecha.
    const btnCarpetaAjustes = body.querySelector('#btn-carpeta-ajustes');
    const carpetaEstado = body.querySelector('#carpeta-estado');
    const pintaCarpeta = dir => {
      if (carpetaEstado) carpetaEstado.textContent = dir ? `Carpeta: «${dir.name}»` : 'Sin carpeta: la copia irá a Descargas.';
      if (btnCarpetaAjustes) btnCarpetaAjustes.textContent = dir ? 'Cambiar carpeta…' : 'Elegir carpeta…';
    };

    };
    Storage.idbLeer('dir').then(pintaCarpeta).catch(() => {});
    body.querySelector('#btn-reiniciar').onclick = () => {
      UI.openModal({
        titulo: 'Restablecer aplicación',
        cuerpo: `<p>Se eliminarán <b>todos</b> los grupos, alumnos, clases, currículos, instrumentos y calificaciones guardados en este navegador.</p>
          <div class="aviso">Si quieres conservar algo, exporta tu backup antes de continuar.</div>`,
        textoGuardar: 'Sí, vaciar todo',
        peligro: true,
        alGuardar() {
          Storage.reiniciar();
          UI.toast('Datos eliminados');
        }
      });
    };
  }

  function renderInicio(el) {

        </div>

            <li>Crea <b>grupos</b> e inscribe <b>alumnos</b>.</li>
            <li>Crea <b>asignaturas</b> y sus <b>clases</b> (asignatura · grupo). Si vas a trabajar con adaptaciones, crea en la clase sus <b>niveles ACI</b>.</li>
            <li>Define en <b>Currículo</b> las competencias específicas, los criterios y sus ponderaciones (suman 100%).</li>
            <li>Crea <b>instrumentos</b>: control, rúbrica, proyecto u otro, mapeando cada apartado a criterios. Si ya tienes una rúbrica hecha (por ejemplo, con una IA), impórtala con «Importar rúbrica».</li>

            <li>Revisa los <b>informes</b> (Atención, Criterios, Alumnos en riesgo). Imprime o exporta a PDF el informe que necesites.</li>

    const curso = el.querySelector('#sel-curso');
    if (curso) {

      });
