    db.bancoInstrumentos.forEach(m => {
      if (m.unidad == null) m.unidad = '';
      if (m.criteriosModo == null) m.criteriosModo = 'desglosado';
      if (!Array.isArray(m.niveles)) m.niveles = [];
      if (!Array.isArray(m.criterioCodesGlobal)) m.criterioCodesGlobal = [];
      if (!m.origen || typeof m.origen !== 'object') m.origen = {};
      if (!Array.isArray(m.apartados)) m.apartados = [];
      m.apartados.forEach(ap => {
        if (!Array.isArray(ap.criterioCodes)) ap.criterioCodes = [];
        if (!Array.isArray(ap.niveles)) ap.niveles = [];
      });
    });
    // Un instrumento con nivel ACI debe evaluar los criterios de SU currículo.
    // Los creados con «Duplicar» antes de esta versión copiaban los del original
    // (otro ciclo) y sus notas no salían en el informe; aquí se reapuntan por
    // número de criterio, sin tocar ninguna nota.
    this.reparadosCriterios = 0;
    if (typeof Calc !== 'undefined' && Calc.repararCriteriosDeInstrumentos) {
      this.reparadosCriterios = Calc.repararCriteriosDeInstrumentos(db);
    }
    return db;
  },

  // --- Color por unidad didáctica (cuadrícula de Instrumentos) ---

  // Mapa { ud: { h, intenso, suave } | null } para las UDs indicadas. Si una UD
  // no tiene color, se le asigna el primer color libre de la paleta y se marca
  // `cambios` para que el llamador guarde. `null` = «Sin color» (barra neutral).
  coloresUdPara(uds) {
    const mapa = {};
    let cambios = false;
    const usados = new Set();
    for (const v of Object.values(this.db.coloresUd || {})) {
      if (v && ColoresUd.esValido(v)) usados.add(v);
    }
    for (const ud of uds || []) {
      if (!ud) continue;
      const actual = this.db.coloresUd ? this.db.coloresUd[ud] : undefined;
      if (actual === null) { mapa[ud] = null; continue; }
      if (actual && ColoresUd.esValido(actual)) {
        mapa[ud] = ColoresUd.entradaPorIntenso(actual);
        continue;
      }
      const entrada = ColoresUd.primerLibre(usados);
      this.db.coloresUd[ud] = entrada.intenso;
      usados.add(entrada.intenso);
      mapa[ud] = entrada;
      cambios = true;
    }
    return { mapa, cambios };
  },

  // Renombrar una UD conserva su color: al guardar un instrumento, si la UD
  // anterior ya no la usa ningún instrumento, su color pasa al nombre nuevo.
  migrarColorUd(antes, despues) {
    if (!antes || !despues || antes === despues) return;
    const queda = (this.db.instrumentos || []).some(i => (i.unidad || '') === antes);
    if (queda) return;
    const color = this.db.coloresUd ? this.db.coloresUd[antes] : undefined;
    if (color == null) return;
    if (this.db.coloresUd[despues] == null) this.db.coloresUd[despues] = color;
    delete this.db.coloresUd[antes];
  },

  // Color manual de una UD: un `intenso` de la paleta, o null para «Sin color».
  fijarColorUd(ud, color) {
    if (!ud) return;
    if (color == null || color === '') this.db.coloresUd[ud] = null;
    else if (ColoresUd.esValido(color)) this.db.coloresUd[ud] = color;
  },

  claveDesdeDescriptores(descriptores) {
    const mapa = [
      ['CPSAA', 'cc-cpsaa'], ['CCEC', 'cc-ccec'], ['CCL', 'cc-ccl'],
      ['CP', 'cc-cp'], ['STEM', 'cc-stem'], ['CD', 'cc-cd'],
      ['CC', 'cc-cc'], ['CE', 'cc-ce']
    ];
    const ids = new Set();
    (descriptores || []).forEach(d => {
      const hit = mapa.find(([pref]) => String(d).startsWith(pref));
      if (hit) ids.add(hit[1]);
    });
    return [...ids];
  },

  // --- Copia de seguridad: estado, sellado y copia previa a importar ---

  // Estado de la copia para avisar en Inicio (R-01). Puro: recibe el «ahora»
  // para poder comprobarlo sin depender del reloj.
  estadoCopia(ahora) {
    const meta = this.db.meta || {};
    const ultima = meta.ultimaExportacion || null;
    const hayDatos = !this.vacio();
    const dias = ultima ? Math.floor(((ahora || Date.now()) - new Date(ultima).getTime()) / 86400000) : null;
    let nivel = 'ok';
    if (hayDatos && !ultima) nivel = 'nunca';
    else if (hayDatos && meta.cambiosSinCopia) nivel = 'pendiente';
    else if (hayDatos && dias >= this.DIAS_COPIA) nivel = 'antigua';
    return { ultima, dias, nivel, hayDatos };
  },

  // Sella una exportación correcta: fija la fecha y quita «cambios sin copiar».
  marcarCopia() {
    this.db.meta = this.db.meta || {};
    this.db.meta.ultimaExportacion = new Date().toISOString();
    this.db.meta.cambiosSinCopia = false;
    this.save(true);
  },

  // Copia del estado actual justo antes de una importación (que reemplaza
  // todo). Permite deshacerla desde Inicio.
  copiarAntesDeImportar() {
    try {
      localStorage.setItem(this.KEY_PREVIA, JSON.stringify({ fecha: new Date().toISOString(), db: this.db }));
      return true;
    } catch (e) {
      return false;
    }
  },

  copiaPrevia() {
    try {
      const raw = localStorage.getItem(this.KEY_PREVIA);
      if (!raw) return null;
      const o = JSON.parse(raw);
      return o && o.db ? o : null;
    } catch (e) {
      return null;
    }
  },

  limpiarCopiaPrevia() {
    try { localStorage.removeItem(this.KEY_PREVIA); } catch (e) { /* noop */ }
  },

  restaurarCopiaPrevia() {
    const o = this.copiaPrevia();
    if (!o) return false;
    try {
      this.db = this.migrar(o.db);
      this.limpiarCopiaPrevia();
      this.save();
      return true;
    } catch (e) {
      return false;
    }
  },

  reiniciar() {
    try { localStorage.removeItem(this.KEY); } catch (e) {}
    this.limpiarCopiaPrevia();
    this.db = this.defaults();
    this.save();
  },

  // --- Alta y edición de grupos, alumnado y asignaturas ---
  // La escritura vive aquí (no en el modal) para que sea la misma al crear y
  // al editar, y para poder comprobarla sin navegador. `id` ausente = crear;
  // `id` presente = editar en sitio, conservando el id (y con él las notas).
  // Renombrar una asignatura NO toca sus criterios (van ligados por id), así
  // que ni el currículo ni las notas se pierden.

  guardarAsignatura(datos, id) {
    const nombre = String(datos.nombre || '').trim();
    if (!nombre) return null;
    if (id) {
      const a = this.db.asignaturas.find(x => x.id === id);
      if (!a) return null;
      a.nombre = nombre;
      a.etapa = datos.etapa || a.etapa;
      if (datos.curso != null) a.curso = String(datos.curso);
      if (datos.fuente != null) a.fuente = String(datos.fuente);
      this.save();
      return a;
    }
    const nueva = {
      id: Utils.uid(),
      nombre,
      area: String(datos.area || ''),
      etapa: datos.etapa || 'Primaria',
      curso: datos.curso != null ? String(datos.curso) : '',
      fuente: datos.fuente != null ? String(datos.fuente) : ''
    };
    this.db.asignaturas.push(nueva);
    this.save();
    return nueva;
  },

  guardarGrupo(datos, id) {
    const nombre = String(datos.nombre || '').trim();
    if (!nombre) return null;
    const etapa = datos.etapa || 'Primaria';
    if (id) {
      const g = this.db.grupos.find(x => x.id === id);
      if (!g) return null;
      g.nombre = nombre;
      g.etapa = etapa;
      this.save();
      return g;
    }
    const nuevo = { id: Utils.uid(), nombre, etapa };
    this.db.grupos.push(nuevo);
    this.save();
    return nuevo;
  },

  guardarAlumno(datos, id) {
    const nombre = String(datos.nombre || '').trim();
    const apellidos = String(datos.apellidos || '').trim();
    if (!nombre && !apellidos) return null;
    if (id) {
      const a = this.db.alumnos.find(x => x.id === id);
      if (!a) return null;
      a.nombre = nombre;
      a.apellidos = apellidos;
      if (datos.grupoId) a.grupoId = datos.grupoId;
      this.save();
      return a;
    }
    const nuevo = { id: Utils.uid(), nombre, apellidos, grupoId: datos.grupoId || null };
    this.db.alumnos.push(nuevo);
    this.save();
    return nuevo;
  },

  // Alta masiva: añade alumnado a un grupo desde un texto (un alumno por línea).
  // Formato «Apellidos, Nombre»; si una línea no lleva coma, se toma entera como
  // nombre. Ignora líneas vacías y evita duplicados ya presentes en el grupo.
  // Devuelve un resumen para informar al docente. La escritura vive aquí (no en
  // el modal) para poder comprobarla sin navegador.
  guardarAlumnosDesdeTexto(grupoId, texto) {
    const resp = { creados: 0, duplicados: 0 };
    const clave = a => (String(a.apellidos || '') + '\u0000' + String(a.nombre || '')).toLowerCase();
    const existentes = new Set(this.db.alumnos.filter(a => a.grupoId === grupoId).map(clave));
    const vistos = new Set();
    for (const linea of String(texto || '').split(/\r?\n/)) {
      const limpia = linea.trim();
      if (!limpia) continue;
      const coma = limpia.indexOf(',');
      const apellidos = coma >= 0 ? limpia.slice(0, coma).trim() : '';
      const nombre = coma >= 0 ? limpia.slice(coma + 1).trim() : limpia;
      if (!nombre && !apellidos) continue;
      const c = clave({ apellidos, nombre });
      if (existentes.has(c) || vistos.has(c)) { resp.duplicados++; continue; }
      vistos.add(c);
      this.db.alumnos.push({ id: Utils.uid(), nombre, apellidos, grupoId: grupoId || null });
      resp.creados++;
    }
    if (resp.creados) this.save();
    return resp;
  },

  // --- Borrado en cascada (punto único) ---
  // Antes cada vista reimplementaba su cascada a mano y dos de ellas dejaban
  // datos huérfanos: notas de instrumentos que ya no existían y notas de
  // alumnado borrado. Aquí vive la ÚNICA cascada, de modo que borrar una clase,
  // un grupo o una asignatura nunca deja registros colgando.

  // Quita los instrumentos de una lista de clases y sus notas. Suma el número
  // de instrumentos eliminados en `resp.instrumentos`.
  _purgarInstrumentosDeClases(claseIds, resp) {
    const ids = new Set(claseIds);
    const instIds = this.db.instrumentos.filter(i => ids.has(i.claseId)).map(i => i.id);
    instIds.forEach(id => delete this.db.registros[id]);
    if (instIds.length) {
      const set = new Set(instIds);
      this.db.instrumentos = this.db.instrumentos.filter(i => !set.has(i.id));
    }
    resp.instrumentos += instIds.length;
  },

  // Quita las notas de una lista de alumnado en TODOS los instrumentos.
  _purgarRegistrosDeAlumnos(alumnoIds) {
    const ids = new Set(alumnoIds);
    Object.keys(this.db.registros).forEach(instId => {
      const reg = this.db.registros[instId] || {};
      Object.keys(reg).forEach(al => { if (ids.has(al)) delete reg[al]; });
    });
  },

  // Quita referencias ACI cuyo currículo ya no existe (p. ej. al borrar la
  // asignatura que daba criterios a un nivel). Sin esto, el alumnado de ese
  // nivel caería en silencio al currículo base.
  _purgarAciHuerfano() {
    const vivas = new Set(this.db.asignaturas.map(a => a.id));
    this.db.clases.forEach(c => {
      if (Array.isArray(c.nivelesAci)) {
        c.nivelesAci = c.nivelesAci.filter(n => !n.asignaturaId || vivas.has(n.asignaturaId));
      }
      if (c.adaptaciones && typeof c.adaptaciones === 'object') {
        const codigos = new Set((c.nivelesAci || []).map(n => Calc.nivelNorm(n.codigo)));
        const adap = {};
        Object.keys(c.adaptaciones).forEach(k => {
          const v = Calc.nivelNorm(c.adaptaciones[k]);
          if (v && codigos.has(v)) adap[k] = c.adaptaciones[k];
        });
        c.adaptaciones = adap;
      }
    });
  },

  // Borra una clase con sus instrumentos y sus notas.
  borrarClase(claseId) {
    const resp = { instrumentos: 0 };
    this._purgarInstrumentosDeClases([claseId], resp);
    this.db.clases = this.db.clases.filter(c => c.id !== claseId);
    this.save();
    return resp;
  },

  // Borra un alumno y sus notas en todos los instrumentos.
  borrarAlumno(alumnoId) {
    this.db.alumnos = this.db.alumnos.filter(a => a.id !== alumnoId);
    this._purgarRegistrosDeAlumnos([alumnoId]);
    this.save();
  },

  // Borra un grupo con su alumnado, sus clases, sus instrumentos y sus notas.
  borrarGrupo(grupoId) {
    const resp = { alumnos: 0, clases: 0, instrumentos: 0 };
    const claseIds = this.db.clases.filter(c => c.grupoId === grupoId).map(c => c.id);
    resp.clases = claseIds.length;
    this._purgarInstrumentosDeClases(claseIds, resp);
    this.db.clases = this.db.clases.filter(c => c.grupoId !== grupoId);
    const alumnoIds = this.db.alumnos.filter(a => a.grupoId === grupoId).map(a => a.id);
    resp.alumnos = alumnoIds.length;
    this.db.alumnos = this.db.alumnos.filter(a => a.grupoId !== grupoId);
    this._purgarRegistrosDeAlumnos(alumnoIds);
    this.db.grupos = this.db.grupos.filter(g => g.id !== grupoId);
    this.save();
    return resp;
  },

  // Borra una asignatura con su currículo, sus clases, sus instrumentos y sus
  // notas, y limpia las referencias ACI que apuntaban a ella.
  borrarAsignatura(asignaturaId) {
    const resp = { criterios: 0, clases: 0, instrumentos: 0 };
    const claseIds = this.db.clases.filter(c => c.asignaturaId === asignaturaId).map(c => c.id);
    resp.clases = claseIds.length;
    this._purgarInstrumentosDeClases(claseIds, resp);
    resp.criterios = this.db.criterios.filter(x => x.asignaturaId === asignaturaId).length;
    this.db.criterios = this.db.criterios.filter(x => x.asignaturaId !== asignaturaId);
    this.db.competenciasEspecificas = this.db.competenciasEspecificas.filter(x => x.asignaturaId !== asignaturaId);
    this.db.clases = this.db.clases.filter(x => x.asignaturaId !== asignaturaId);
    this.db.asignaturas = this.db.asignaturas.filter(x => x.id !== asignaturaId);
    this._purgarAciHuerfano();
    this.save();
    return resp;
  },

  // --- Banco de instrumentos (D-48) ---
  // Guarda un instrumento del curso como molde reutilizable. Devuelve el molde.
  guardarEnBanco(inst) {
    if (!Array.isArray(this.db.bancoInstrumentos)) this.db.bancoInstrumentos = [];
    const molde = Calc.moldeDeInstrumento(this.db, inst);
    this.db.bancoInstrumentos.push(molde);
    this.save();
    return molde;
  },

  borrarDelBanco(moldeId) {
    this.db.bancoInstrumentos = (this.db.bancoInstrumentos || []).filter(m => m.id !== moldeId);
    this.save();
  },

  // Crea un instrumento nuevo en `claseId` a partir de un molde del banco. Si
  // algún criterio del molde no existe en el currículo de destino, no crea nada
  // y devuelve esa lista en `faltan`.
  anadirDesdeBanco(moldeId, claseId, nivel, periodo) {
    const molde = (this.db.bancoInstrumentos || []).find(m => m.id === moldeId);
    if (!molde) return { faltan: ['(el molde ya no está en el banco)'] };
    const r = Calc.instrumentoDesdeMolde(molde, claseId, nivel, periodo);
    if (r.faltan.length) return { faltan: r.faltan, molde };
    this.db.instrumentos.push(r.inst);
    this.save();
    return { inst: r.inst, faltan: [], molde };
  },

  importarCurriculo(datos, opciones) {
    if (!datos || datos.tipo !== 'curriculo-evalcrit' || datos.version !== 1) {
      throw new Error('El archivo no es una plantilla de currículo Evalora válida');
    }
    const asig = datos.asignatura || {};
    const nombre = String(asig.nombre || '').trim();
    const etapa = String(asig.etapa || '').trim();
    if (!nombre) throw new Error('Falta el nombre de la asignatura');
    if (!Array.isArray(datos.competenciasEspecificas) || !datos.competenciasEspecificas.length) {
      throw new Error('La plantilla no incluye competencias específicas');
    }
    if (!Array.isArray(datos.criterios) || !datos.criterios.length) {
      throw new Error('La plantilla no incluye criterios de evaluación');
    }
    const cesCodigos = datos.competenciasEspecificas.map(c => c.codigo);
    if (new Set(cesCodigos).size !== cesCodigos.length) {
      throw new Error('Hay competencias específicas con código repetido');
    }
    const critCodigos = datos.criterios.map(c => c.codigo);
    if (new Set(critCodigos).size !== critCodigos.length) {
      throw new Error('Hay criterios con código repetido');
    }
    for (const c of datos.criterios) {
      if (!cesCodigos.includes(c.ceCodigo)) {
        throw new Error(`El criterio ${c.codigo} referencia una competencia específica inexistente (${c.ceCodigo})`);
      }
    }

    const opts = opciones || {};
    const cursosPlantilla = Array.isArray(asig.cursos) && asig.cursos.length
      ? asig.cursos.map(c => String(c).trim()).filter(Boolean)
      : [''];
    // Sin `opciones.cursos` se comporta como antes (una asignatura por curso de
    // la plantilla). Con `opciones.cursos` solo se crea el curso pedido.
    let cursos = cursosPlantilla;
    if (Array.isArray(opts.cursos) && opts.cursos.length) {
      const pedidos = opts.cursos.map(c => String(c).trim()).filter(Boolean);
      cursos = cursosPlantilla.filter(c => pedidos.indexOf(c) !== -1);
      if (!cursos.length) {
        throw new Error(`La plantilla de ${nombre} no cubre el curso ${pedidos.join(', ')}`);
      }
    }
    const n = datos.criterios.length;
    const pesoIgual = Math.round((100 / n) * 10000) / 10000;
    const fuente = typeof datos.fuente === 'string' ? datos.fuente.trim() : '';
    const creadas = [];
    const ids = [];

    // Rellena una asignatura (nueva o ya existente) con las competencias
    // específicas, los criterios y los saberes de la plantilla. Aborta si esa
    // asignatura ya tiene currículo: nunca se pisa lo que ya hay.
    const rellenar = (target, curso) => {
      if (this.db.competenciasEspecificas.some(e => e.asignaturaId === target.id)) {
        throw new Error(`La asignatura «${target.nombre}» ya tiene currículo. Elimínalo primero o renombra la asignatura en la plantilla.`);
      }
      target.curso = curso;
      if (fuente) target.fuente = fuente;

      const idEsp = {};
      for (const ce of datos.competenciasEspecificas) {
        const obj = {
          id: Utils.uid(),
          asignaturaId: target.id,
          codigo: ce.codigo,
          descripcion: ce.descripcion,
          perfilSalida: Array.isArray(ce.perfilSalida) ? ce.perfilSalida : []
        };
        this.db.competenciasEspecificas.push(obj);
        idEsp[ce.codigo] = obj;
      }

      datos.criterios.forEach((c, i) => {
        const esp = idEsp[c.ceCodigo];
        const peso = (typeof c.peso === 'number' && !isNaN(c.peso))
          ? c.peso
          : (i === n - 1 ? Math.round((100 - pesoIgual * (n - 1)) * 10000) / 10000 : pesoIgual);
        const claveIds = [...new Set(esp.perfilSalida ? this.claveDesdeDescriptores(esp.perfilSalida) : [])];
        this.db.criterios.push({
          id: Utils.uid(),
          asignaturaId: target.id,
          codigo: c.codigo,
          descripcion: c.descripcion,
          peso,
          espIds: [esp.id],
          claveIds
        });
      });

      if (Array.isArray(datos.saberesBasicos)) {
        target.saberesBasicos = datos.saberesBasicos;
      }
    };

    if (opts.asignaturaId) {
      // Recuperar el currículo en una asignatura ya creada (una sola), sin
      // duplicarla. Sirve para arreglar las creadas a mano sin currículo.
      const target = this.db.asignaturas.find(a => a.id === opts.asignaturaId);
      if (!target) throw new Error('La asignatura indicada ya no existe');
      if (!target.area) target.area = nombre;
      const etiqueta = String(opts.etiqueta || '').trim();
      const cursoTarget = String(opts.curso || target.curso || '').trim();
      if (etiqueta) target.nombre = cursoTarget ? `${etiqueta} ${cursoTarget}` : etiqueta;
      rellenar(target, String(opts.curso || target.curso || cursos[0] || '').trim());
      creadas.push(target.nombre);
      ids.push(target.id);
    } else {
      for (const curso of cursos) {
        const nombreCompleto = curso ? `${nombre} ${curso}` : nombre;
        let target = this.db.asignaturas.find(a =>
          a.nombre.toLowerCase() === nombreCompleto.toLowerCase() && (a.etapa || '') === etapa);
        if (!target) {
          // El nombre del área va aparte del nombre visible: así el desplegable
          // puede agrupar por área aunque el docente renombre la asignatura. Si
          // no se indica etiqueta (Inglés/Francés, Plástica/Música), es el del
          // decreto y el nombre visible es «área + curso», como siempre.
          const etiqueta = String(opts.etiqueta || '').trim();
          target = {
            id: Utils.uid(),
            nombre: etiqueta ? (curso ? `${etiqueta} ${curso}` : etiqueta) : nombreCompleto,
            area: nombre,
            etapa,
            curso,
            fuente
          };
          this.db.asignaturas.push(target);
        }
        rellenar(target, curso);
        creadas.push(nombreCompleto);
        ids.push(target.id);
      }
    }

    this.save();
    return {
      asignaturas: creadas,
      ids,
      ces: datos.competenciasEspecificas.length,
      criterios: n,
      pesosAjustados: typeof datos.criterios[0].peso !== 'number'
    };
  },

  // Importa una rúbrica generada por una IA (formato "rubrica-evalcrit", ver §14
  // del SSOT). `claseId` fija la asignatura y, con ella, los códigos de criterio.
  // Lanza Error con un mensaje en castellano si algo no cuadra: en ese caso no
  // se importa nada.
  importarRubrica(datos, claseId, periodo) {
    if (!datos || datos.tipo !== 'rubrica-evalcrit' || datos.version !== 1) {
      throw new Error('El texto no es una rúbrica Evalora válida (debe empezar por "tipo": "rubrica-evalcrit").');
    }
    const titulo = String(datos.titulo || '').trim();
    if (!titulo) throw new Error('La rúbrica no tiene título.');

    const items = Array.isArray(datos.items) ? datos.items : [];
    if (!items.length) throw new Error('La rúbrica no trae ningún ítem.');

    const nivel = String(datos.nivel || '').trim();
    const asig = Calc.asignaturaDeNivel(claseId, nivel);
    if (!asig) throw new Error('Esta clase no tiene una asignatura asociada con currículo.');

    const porCodigo = {};
    this.db.criterios
      .filter(c => c.asignaturaId === asig.id)
      .forEach(c => { porCodigo[String(c.codigo).trim().toLowerCase()] = c.id; });

    const vistos = new Set();
    const desconocidos = new Set();
    const apartados = items.map((it, i) => {
      const nombre = String((it && it.criterio) || '').trim();
      if (!nombre) throw new Error(`El ítem ${i + 1} no tiene nombre en el campo "criterio".`);
      if (vistos.has(nombre.toLowerCase())) throw new Error(`El ítem «${nombre}» está repetido.`);
      vistos.add(nombre.toLowerCase());

      const peso = Number(it.peso);
      if (!isFinite(peso) || peso <= 0) throw new Error(`El ítem «${nombre}» necesita un "peso" mayor que 0.`);

      const niveles = (Array.isArray(it.niveles) ? it.niveles : [])
        .filter(n => n && isFinite(Number(n.pct)))
        .map(n => ({ pct: Number(n.pct), descriptor: String(n.descriptor || '').trim() }))
        .sort((a, b) => a.pct - b.pct);
      if (niveles.length < 2) throw new Error(`El ítem «${nombre}» necesita al menos 2 niveles.`);

      const codigos = Array.isArray(it.criterios) ? it.criterios : [];
      const criterioIds = [];
      for (const cod of codigos) {
        const limpio = String(cod).trim();
        const id = porCodigo[limpio.toLowerCase()];
        if (id && !criterioIds.includes(id)) criterioIds.push(id);
        else if (!id && limpio) desconocidos.add(limpio);
      }
      return { id: Utils.uid(), orden: i + 1, descripcion: nombre, maxPts: 100, criterioIds, peso, niveles };
    });

    if (desconocidos.size) {
      throw new Error(`Estos criterios no existen en ${asig.nombre}: ${[...desconocidos].join(', ')}. ` +
        'Pídele a la IA que use solo los códigos de la lista, o créalos en la vista Currículo.');
    }
    const sinCriterios = apartados.filter(a => !a.criterioIds.length);
    if (sinCriterios.length) {
      throw new Error(`Estos ítems no indican ningún criterio: ${sinCriterios.map(a => a.descripcion).join(', ')}.`);
    }

    const instrumento = {
      id: Utils.uid(),
      claseId,
      tipo: 'Rúbrica',
      titulo,
      fecha: Utils.hoy(),
      periodo: periodo || 'T1',
      saberes: String(datos.saberes || ''),
      unidad: String(datos.unidad || '').trim(),
      nivel,
      // Escala por defecto: la del primer ítem. Cada ítem guarda además la suya.
      niveles: apartados[0].niveles.map(n => ({ pct: n.pct, descriptor: n.descriptor })),
      apartados,
      criteriosModo: 'desglosado',
      criterioIdsGlobal: []
    };
    this.db.instrumentos.push(instrumento);
    this.save();
    return { id: instrumento.id, titulo, items: apartados.length };
  },

  demoSeed() {
    const db = this.defaults();
    const g = { id: Utils.uid(), nombre: '3ºA', etapa: 'Primaria' };
    db.grupos.push(g);
    const nombres = [
      ['García', 'Lucía'], ['López', 'Mateo'], ['Martínez', 'Sofía'],
      ['Sánchez', 'Hugo'], ['Fernández', 'María'], ['Pérez', 'Daniel']
    ];
    for (const [ape, nom] of nombres) {
      db.alumnos.push({ id: Utils.uid(), nombre: nom, apellidos: ape, grupoId: g.id });
    }
    const mat = { id: Utils.uid(), nombre: 'Matemáticas', etapa: 'Primaria' };
    db.asignaturas.push(mat);
    const clase = { id: Utils.uid(), asignaturaId: mat.id, grupoId: g.id };
    db.clases.push(clase);
    const ce1 = { id: Utils.uid(), asignaturaId: mat.id, codigo: 'CE1', descripcion: 'Resuelve problemas de la vida cotidiana' };
    const ce2 = { id: Utils.uid(), asignaturaId: mat.id, codigo: 'CE2', descripcion: 'Razona y argumenta matemáticamente' };
    db.competenciasEspecificas.push(ce1, ce2);
    const c1 = { id: Utils.uid(), asignaturaId: mat.id, codigo: 'MAT 1.1', descripcion: 'Resuelve problemas de suma y resta', peso: 50, espIds: [ce1.id], claveIds: ['cc-stem'] };
    const c2 = { id: Utils.uid(), asignaturaId: mat.id, codigo: 'MAT 2.1', descripcion: 'Domina las tablas de multiplicar', peso: 25, espIds: [ce1.id], claveIds: [] };
    const c3 = { id: Utils.uid(), asignaturaId: mat.id, codigo: 'MAT 2.2', descripcion: 'Explica el proceso seguido', peso: 25, espIds: [ce2.id], claveIds: ['cc-ccl'] };
    db.criterios.push(c1, c2, c3);
    const ap1 = { id: Utils.uid(), orden: 1, descripcion: 'Problemas escritos', maxPts: 4, criterioIds: [c1.id] };
    const ap2 = { id: Utils.uid(), orden: 2, descripcion: 'Tablas de multiplicar', maxPts: 2, criterioIds: [c2.id] };
    const ap3 = { id: Utils.uid(), orden: 3, descripcion: 'Explicación oral o escrita', maxPts: 2, criterioIds: [c3.id] };
    const inst = {
      id: Utils.uid(), claseId: clase.id, tipo: 'Control', titulo: 'Control de prueba',
      fecha: Utils.hoy(), periodo: 'T1', saberes: '', niveles: [], apartados: [ap1, ap2, ap3]
    };
    db.instrumentos.push(inst);
    const valores = [
      [3.5, 2, 1], [4, 1, 2], [2, 0.5, 1], [3, 1.5, 2], [4, 2, 2], [1.5, 1, 0]
    ];
    const reg = {};
    db.alumnos.forEach((al, i) => {
      reg[al.id] = {};
      inst.apartados.forEach((ap, j) => { reg[al.id][ap.id] = valores[i % valores.length][j]; });
    });
    db.registros[inst.id] = reg;
    this.db = db;
    this.save();
  }
};

</script>
<script>
const Calc = {
  byId(lista, id) {
    return (lista || []).find(x => x.id === id) || null;
  },

  clase(claseId) { return this.byId(Storage.db.clases, claseId); },
  asignatura(asigId) { return this.byId(Storage.db.asignaturas, asigId); },
  criterio(critId) { return this.byId(Storage.db.criterios, critId); },
  instrumento(instId) { return this.byId(Storage.db.instrumentos, instId); },
  alumno(aluId) { return this.byId(Storage.db.alumnos, aluId); },

  asignaturaDeClase(claseId) {
    const cl = this.clase(claseId);
    return cl ? this.asignatura(cl.asignaturaId) : null;
  },

  alumnosDeClase(claseId) {
    const cl = this.clase(claseId);
    if (!cl) return [];
    return Storage.db.alumnos
      .filter(a => a.grupoId === cl.grupoId)
      .sort((x, y) => (x.apellidos + x.nombre).localeCompare(y.apellidos + y.nombre, 'es'));
  },

  criteriosDeClase(claseId) {
    const asig = this.asignaturaDeClase(claseId);
    if (!asig) return [];
    return Storage.db.criterios
      .filter(c => c.asignaturaId === asig.id)
      .sort((x, y) => String(x.codigo).localeCompare(String(y.codigo), 'es'));
  },

  competenciasEspecificasDeClase(claseId) {
    return this.competenciasEspecificasDeNivel(claseId, '');
  },

  clavesDeClase(claseId) {
    return this.clavesDeNivel(claseId, '');
  },

  competenciasEspecificasDeNivel(claseId, codigo) {
    const asig = this.asignaturaDeNivel(claseId, codigo);
    if (!asig) return [];
    return Storage.db.competenciasEspecificas.filter(c => c.asignaturaId === asig.id);
  },

  clavesDeNivel(claseId, codigo) {
    const usadas = new Set();
    this.criteriosDeNivel(claseId, codigo).forEach(c => (c.claveIds || []).forEach(k => usadas.add(k)));
    return Storage.db.competenciasClave.filter(k => usadas.has(k.id));
  },

  // --- Adaptaciones curriculares (ACI) ---
  // Cada nivel ACI de una clase apunta a la asignatura (currículo) de otro curso.

  // Unifica la forma de un código de nivel: sin espacios y en mayúsculas, y
  // «BASE» se trata como base interna (''). Es la ÚNICA forma de comparar
  // códigos en todo el programa: si no se normaliza, un «b» tecleado por el
  // docente no casaría con el nivel «B» guardado y el alumnado desaparecería.
  nivelNorm(codigo) {
    const v = String(codigo == null ? '' : codigo).trim().toUpperCase();
    return v === 'BASE' ? '' : v;
  },

  nivelesAciDeClase(claseId) {
    const cl = this.clase(claseId);
    const arr = (cl && Array.isArray(cl.nivelesAci)) ? cl.nivelesAci : [];
    // Se devuelven con el código normalizado (y sin códigos vacíos) para que
    // todas las vistas y comparaciones usen la misma forma.
    return arr
      .map(n => Object.assign({}, n, { codigo: this.nivelNorm(n.codigo) }))
      .filter(n => n.codigo);
  },

  nivelDeAlumno(claseId, alumnoId) {
    const cl = this.clase(claseId);
    const c = this.nivelNorm((cl && cl.adaptaciones && cl.adaptaciones[alumnoId]) || '');
    if (!c) return '';
    // Si el código no corresponde a ningún nivel definido (p. ej. un nivel
    // borrado), el alumnado cae a base: mejor corregido contra el currículo de
    // su clase que desaparecido de la cuadrícula y del informe.
    return this.nivelesAciDeClase(claseId).some(n => n.codigo === c) ? c : '';
  },

  etiquetaNivel(claseId, codigo) {
    const c = this.nivelNorm(codigo);
    if (!c) return 'Base';
    const n = this.nivelesAciDeClase(claseId).find(x => x.codigo === c);
    return n ? (n.etiqueta || n.codigo) : c;
  },

  asignaturaDeNivel(claseId, codigo) {
    const c = this.nivelNorm(codigo);
    if (c) {
      const n = this.nivelesAciDeClase(claseId).find(x => x.codigo === c);
      if (n && n.asignaturaId && this.asignatura(n.asignaturaId)) return this.asignatura(n.asignaturaId);
    }
    return this.asignaturaDeClase(claseId);
  },

  asignaturaDeAlumno(claseId, alumnoId) {
    return this.asignaturaDeNivel(claseId, this.nivelDeAlumno(claseId, alumnoId));
  },

  criteriosDeNivel(claseId, codigo) {
    const asig = this.asignaturaDeNivel(claseId, codigo);
    if (!asig) return [];
    return Storage.db.criterios
      .filter(c => c.asignaturaId === asig.id)
      .sort((x, y) => String(x.codigo).localeCompare(String(y.codigo), 'es'));
  },

  criteriosDeAlumno(claseId, alumnoId) {
    return this.criteriosDeNivel(claseId, this.nivelDeAlumno(claseId, alumnoId));
  },

  // Niveles cuyos criterios puede elegir el docente al crear un instrumento.
  // Un instrumento «común» (sin nivel) es para TODO el alumnado: se ofrecen los
  // criterios de todos los niveles, para que cada alumno se evalúe con los suyos.
  // Un instrumento de un nivel concreto ofrece solo el de ese nivel.
  nivelesParaInstrumento(claseId, nivel) {
    const cl = this.clase(claseId);
    const base = {
      codigo: '', etiqueta: 'Base',
      asignaturaId: cl ? cl.asignaturaId : null,
      criterios: this.criteriosDeClase(claseId)
    };
    if (nivel) {
      return [{
        codigo: nivel,
        etiqueta: nivel === 'BASE' ? 'Base' : (this.etiquetaNivel(claseId, nivel) || nivel),
        asignaturaId: (this.asignaturaDeNivel(claseId, nivel) || {}).id || (cl ? cl.asignaturaId : null),
        criterios: this.criteriosDeNivel(claseId, nivel)
      }];
    }
    return [base].concat(this.nivelesAciDeClase(claseId).map(n => ({
      codigo: n.codigo,
      etiqueta: n.etiqueta || n.codigo,
      asignaturaId: (this.asignaturaDeNivel(claseId, n.codigo) || {}).id || (cl ? cl.asignaturaId : null),
      criterios: this.criteriosDeNivel(claseId, n.codigo)
    })));
  },

  // --- Criterios de un instrumento frente al currículo de su nivel ACI ---
  // Un instrumento con nivel solo debe evaluar criterios de SU currículo; si
  // apunta a otro (p. ej. una copia de examen paralelo), sus notas no salen en
  // el informe. Estas helpers lo detectan y lo corrigen.

  // Clave numérica de un criterio: «MAT.TC.2.2» → «2.2». La numeración es la
  // misma en todos los ciclos (es el criterio oficial adaptado), así que sirve
  // para reconocer el criterio equivalente de otro currículo.
  claveCriterio(codigo) {
    const m = String(codigo == null ? '' : codigo).match(/(\d+(?:\.\d+)+)\s*$/);
    return m ? m[1] : '';
  },

  // Nivel ACI (con su currículo) dentro de un `db` concreto. Devuelve null si el
  // código es vacío/BASE, si el nivel no existe o si su asignatura ya no está.
  nivelAciEn(db, claseId, codigo) {
    const c = this.nivelNorm(codigo);
    if (!c) return null;
    const cl = (db.clases || []).find(x => x.id === claseId);
    if (!cl) return null;
    const n = (cl.nivelesAci || [])
      .map(x => Object.assign({}, x, { codigo: this.nivelNorm(x.codigo) }))
      .find(x => x.codigo === c);
    if (!n || !n.asignaturaId) return null;
    return (db.asignaturas || []).some(a => a.id === n.asignaturaId) ? n : null;
  },

  // Ids de criterio de un instrumento que NO pertenecen al currículo de su
  // nivel ACI. Los instrumentos comunes (sin nivel) no tienen currículo propio.
  criteriosFueraDeNivel(db, inst) {
    if (!inst) return [];
    const nv = this.nivelAciEn(db, inst.claseId, inst.nivel);
    if (!nv) return [];
    const porId = {};
    (db.criterios || []).forEach(c => { porId[c.id] = c; });
    const fuera = [];
    const mirar = ids => (ids || []).forEach(id => {
      const c = porId[id];
      if (c && c.asignaturaId !== nv.asignaturaId) fuera.push(id);
    });
    mirar(inst.criterioIdsGlobal);
    (inst.apartados || []).forEach(ap => mirar(ap.criterioIds));
    return [...new Set(fuera)];
  },

  // Reapunta los criterios de un instrumento al currículo de su nivel ACI,
  // emparejando por número de criterio («MAT.TC.2.2» ↔ «MAT.SC.2.2»). Las notas
  // cuelgan del apartado, no del criterio, así que no se pierde ninguna.
  // Devuelve true si cambió algo. Si un criterio no tiene equivalente, se deja
  // el bloque tal cual (mejor visible que reapuntado a medias).
  repararCriteriosDeInstrumento(db, inst) {
    if (!inst) return false;
    if (!this.criteriosFueraDeNivel(db, inst).length) return false;
    const nv = this.nivelAciEn(db, inst.claseId, inst.nivel);
    const porId = {};
    (db.criterios || []).forEach(c => { porId[c.id] = c; });
    const destino = {};   // clave de criterio → id dentro del currículo del nivel
    (db.criterios || []).filter(c => c.asignaturaId === nv.asignaturaId).forEach(c => {
      const k = this.claveCriterio(c.codigo);
      if (k && destino[k] == null) destino[k] = c.id;
    });
    const remapear = ids => {
      const salida = [];
      let cambio = false;
      for (const id of (ids || [])) {
        const c = porId[id];
        if (!c || c.asignaturaId === nv.asignaturaId) {
          if (salida.indexOf(id) === -1) salida.push(id);
          continue;
        }
        const k = this.claveCriterio(c.codigo);
        const nuevo = k ? destino[k] : null;
        if (!nuevo) return { ok: false };
        if (salida.indexOf(nuevo) === -1) salida.push(nuevo);
        cambio = true;
      }
      return { ok: true, ids: salida, cambio };
    };
    let cambio = false;
    const g = remapear(inst.criterioIdsGlobal);
    if (g.ok && g.cambio) { inst.criterioIdsGlobal = g.ids; cambio = true; }
    (inst.apartados || []).forEach(ap => {
      const a = remapear(ap.criterioIds);
      if (a.ok && a.cambio) { ap.criterioIds = a.ids; cambio = true; }
    });
    return cambio;
  },

  // Repasa todos los instrumentos de un `db` (al cargar o importar un backup).
  // Devuelve cuántos ha corregido.
  repararCriteriosDeInstrumentos(db) {
    let n = 0;
    (db.instrumentos || []).forEach(inst => { if (this.repararCriteriosDeInstrumento(db, inst)) n++; });
    return n;
  },

  // --- Banco de instrumentos (D-48) ---
  // Un «molde» es la plantilla de un instrumento (título, tipo, apartados y
  // criterios) guardada para reutilizarla en otra clase o en el curso siguiente.
  // Guarda los criterios por CÓDIGO, no por id: así el molde sigue siendo válido
  // aunque su asignatura de origen desaparezca, y los ids reales los pone el
  // currículo de la clase de destino al añadirlo.

  // Molde a partir de un instrumento ya guardado. `db` explícito para poder
  // probarlo sin depender del estado global.
  moldeDeInstrumento(db, inst) {
    const porId = {};
    (db.criterios || []).forEach(c => { porId[c.id] = c; });
    const codigos = ids => [...new Set((ids || [])
      .map(id => (porId[id] || {}).codigo)
      .filter(Boolean))];
    const clase = (db.clases || []).find(c => c.id === inst.claseId);
    const asig = clase ? (db.asignaturas || []).find(a => a.id === clase.asignaturaId) : null;
    return {
      id: Utils.uid(),
      titulo: inst.titulo || '',
      tipo: inst.tipo || 'Control',
      unidad: inst.unidad || '',
      saberes: inst.saberes || '',
      url: inst.url || '',
      niveles: (inst.niveles || []).map(n => ({ pct: n.pct, descriptor: n.descriptor })),
      criteriosModo: inst.criteriosModo || 'desglosado',
      criterioCodesGlobal: codigos(inst.criterioIdsGlobal),
      apartados: (inst.apartados || []).map(ap => ({
        descripcion: ap.descripcion || '',
        maxPts: ap.maxPts,
        peso: ap.peso,
        niveles: (ap.niveles || []).map(n => ({ pct: n.pct, descriptor: n.descriptor })),
        criterioCodes: codigos(ap.criterioIds)
      })),
      origen: {
        asignaturaId: asig ? asig.id : '',
        asignatura: asig ? asig.nombre : '',
        etapa: asig ? (asig.etapa || '') : '',
        guardadoEn: Utils.hoy()
      }
    };
  },

  // Instrumento nuevo a partir de un molde del banco, para la clase y el nivel
  // indicados. Los códigos se resuelven contra el currículo de destino por
  // código EXACTO (la numeración cambia entre ciclos; para reapuntar entre
  // ciclos está «Duplicar» con el nivel). Devuelve { inst, faltan }: si `faltan`
  // no está vacío, NO debe crearse el instrumento.
  instrumentoDesdeMolde(molde, claseId, nivel, periodo) {
    const asig = this.asignaturaDeNivel(claseId, nivel || '');
    const faltan = [];
    const porCodigo = {};
    if (asig) {
      Storage.db.criterios
        .filter(c => c.asignaturaId === asig.id)
        .forEach(c => { porCodigo[String(c.codigo).trim().toLowerCase()] = c.id; });
    }
    const resolver = codigos => {
      const ids = [];
      (codigos || []).forEach(cod => {
        const id = porCodigo[String(cod).trim().toLowerCase()];
        if (id) { if (ids.indexOf(id) === -1) ids.push(id); }
        else if (faltan.indexOf(cod) === -1) faltan.push(cod);
      });
      return ids;
    };
    const apartados = (molde.apartados || []).map((ap, i) => ({
      id: Utils.uid(),
      orden: i + 1,
      descripcion: ap.descripcion || '',
      maxPts: ap.maxPts,
      peso: ap.peso,
      niveles: (ap.niveles || []).map(n => ({ pct: n.pct, descriptor: n.descriptor })),
      criterioIds: resolver(ap.criterioCodes)
    }));
    const inst = {
      id: Utils.uid(),
      claseId,
      tipo: molde.tipo || 'Control',
      titulo: molde.titulo || '',
      fecha: Utils.hoy(),
      periodo: periodo || 'T1',
      saberes: molde.saberes || '',
      unidad: molde.unidad || '',
      url: molde.url || '',
      nivel: this.nivelNorm(nivel || ''),
      niveles: (molde.niveles || []).map(n => ({ pct: n.pct, descriptor: n.descriptor })),
      apartados,
      criteriosModo: molde.criteriosModo || 'desglosado',
      criterioIdsGlobal: resolver(molde.criterioCodesGlobal)
    };
    return { inst, faltan };
  },

  // Un instrumento sin nivel es común a todos; con nivel, solo para ese nivel
  // ('' o 'BASE' = base, es decir, alumnado sin adaptación).
  instrumentoParaNivel(inst, codigo) {
    if (!inst || !inst.nivel) return true;
    return this.nivelNorm(inst.nivel) === this.nivelNorm(codigo);
  },

  // Un instrumento solo se corrige para quien PUEDE puntuar en él: además del
  // nivel, sus criterios (los de los apartados o, en modo global, los globales)
  // tienen que ser del currículo de ese alumno. Si no, el alumnado con ACI
  // aparecería en la corrección de un instrumento común o base y en «por
  // corregir» para siempre, sin que sus notas contaran para nada.
  instrumentoParaAlumno(inst, claseId, alumnoId) {
    if (!this.instrumentoParaNivel(inst, this.nivelDeAlumno(claseId, alumnoId))) return false;
    // Un instrumento «común» (sin nivel) es para TODO el alumnado, como dice su
    // etiqueta: no se filtra por criterios. El filtro por criterios solo tiene
    // sentido en pruebas de un nivel concreto (Base o ACI), donde el currículo
    // del alumno debe poder puntuarlas.
    if (!inst.nivel) return true;
    const ids = new Set(this.criteriosDeAlumno(claseId, alumnoId).map(c => c.id));
    if ((inst.criteriosModo || 'desglosado') === 'global') {
      const globales = inst.criterioIdsGlobal || [];
      // Sin criterios globales declarados (datos antiguos) se comporta como antes.
      return !globales.length || globales.some(id => ids.has(id));
    }
    const apartados = inst.apartados || [];
    // Un instrumento sin ningún criterio declarado (datos antiguos) no permite
    // decidir: se deja como estaba para no vaciar correcciones ya hechas.
    if (!apartados.some(ap => (ap.criterioIds || []).length)) return true;
    return apartados.some(ap => (ap.criterioIds || []).some(id => ids.has(id)));
  },

  alumnosDeInstrumento(inst) {
    return this.alumnosDeClase(inst.claseId).filter(a => this.instrumentoParaAlumno(inst, inst.claseId, a.id));
  },

  instrumentosDeAlumno(claseId, alumnoId, periodo) {
    return this.instrumentosDeClase(claseId, periodo)
      .filter(i => this.instrumentoParaAlumno(i, claseId, alumnoId));
  },

  // Cuánto falta por corregir de un instrumento: alumnado asignado que todavía
  // tiene algún apartado sin nota. Lo que se deja en blanco se cuenta como
  // pendiente (una ausencia también queda en blanco, y así se ve).
  progresoInstrumento(inst) {
    if (!inst) return { hechos: 0, total: 0, pendientes: 0 };
    const registros = (Storage.db.registros || {})[inst.id] || {};
    // El alumnado excluido («no realiza esta evaluación») no es evaluable: no
    // cuenta como pendiente ni entra en el total.
    const alumnos = this.alumnosDeInstrumento(inst)
      .filter(a => !(registros[a.id] && registros[a.id].noRealiza === true));
    let hechos = 0;
    if (inst.apartados && inst.apartados.length) {
      alumnos.forEach(a => {
        const fila = registros[a.id] || {};
        const completo = inst.apartados.every(ap => {
          const v = fila[ap.id];
          return v !== undefined && v !== null && v !== '';
        });
        if (completo) hechos++;
      });
    }
    return { hechos, total: alumnos.length, pendientes: alumnos.length - hechos };
  },

  // Instrumentos de una clase ordenados para corregir: lo que más falta tiene
  // primero y, a igualdad, lo más reciente.
  instrumentosPorCorregir(claseId) {
    return this.instrumentosDeClase(claseId)
      .map(i => ({ i, p: this.progresoInstrumento(i) }))
      .sort((a, b) => (b.p.pendientes - a.p.pendientes)
        || String(b.i.fecha || '').localeCompare(String(a.i.fecha || '')))
      .map(x => x.i);
  },

  logroCriterioEnInstrumento(inst, alumnoId, criterioId) {
    const modo = inst.criteriosModo || 'desglosado';
    const reg = (Storage.db.registros[inst.id] || {})[alumnoId] || {};
    if (reg.noRealiza === true) return null;
    if (modo === 'global') {
      const globalIds = inst.criterioIdsGlobal || [];
      if (globalIds.length && !globalIds.includes(criterioId)) return null;
      let obt = 0, max = 0, hay = false;
      for (const ap of inst.apartados) {
        const v = reg[ap.id];
        if (v == null || isNaN(v)) continue;
        obt += Number(v);
        max += ap.maxPts;
        hay = true;
      }
      return hay && max > 0 ? obt / max : null;
    }
    let obt = 0, max = 0, hay = false;
    for (const ap of inst.apartados) {
      if (!ap.criterioIds.includes(criterioId)) continue;
      const v = reg[ap.id];
      if (v == null || isNaN(v)) continue;
      obt += Number(v);
      max += ap.maxPts;
      hay = true;
    }
    return hay && max > 0 ? obt / max : null;
  },

  instrumentosDeClase(claseId, periodo) {
    const lista = Storage.db.instrumentos.filter(i => i.claseId === claseId);
    if (!periodo || periodo === 'Final') return lista;
    return lista.filter(i => i.periodo === periodo);
  },

  // Niveles aplicables a un ítem de rúbrica: los propios si los define, si no los
  // de la escala común del instrumento. Siempre de menor a mayor
  // (nivel 1 = más bajo … nivel N = más alto).
  nivelesDeApartado(inst, ap) {
    const comunes = (inst && inst.niveles) || [];
    const propios = (ap && Array.isArray(ap.niveles))
      ? ap.niveles.filter(n => n && !isNaN(Number(n.pct)))
      : [];
    const base = propios.length ? propios : comunes;
    return base.slice().sort((a, b) => Number(a.pct) - Number(b.pct));
  },

  // Etiquetas de unidad didáctica presentes en una lista de instrumentos, ordenadas alfabéticamente.
  unidadesDe(insts) {
    return [...new Set((insts || []).map(i => i.unidad).filter(Boolean))]
      .sort((a, b) => String(a).localeCompare(String(b), 'es'));
  },

  // Instrumentos de una unidad concreta. `unidad` vacío o nulo = todos.
  instrumentosDeUnidad(insts, unidad) {
    if (!unidad) return insts || [];
    return (insts || []).filter(i => i.unidad === unidad);
  },

  // Unidades didácticas ya usadas en una asignatura (todas sus clases). Sirve
  // para sugerirlas al escribir: una UD1 de 6ºA se ofrece también en 6ºB.
  unidadesDeAsignatura(asigId) {
    const clases = Storage.db.clases.filter(c => c.asignaturaId === asigId).map(c => c.id);
    return this.unidadesDe(Storage.db.instrumentos.filter(i => clases.indexOf(i.claseId) !== -1));
  },

  // Logro de un criterio en una lista explícita de instrumentos. Extraído de
  // logroCriterio para poder analizar un alcance arbitrario (D-59): filtrar por
  // unidad, por instrumento concreto o por todo el curso.
  logroCriterioEnInsts(criterioId, claseId, alumnoId, insts) {
    const aplicables = (insts || []).filter(i =>
      this.instrumentoParaAlumno(i, claseId, alumnoId) && (
        (i.criteriosModo || 'desglosado') === 'global'
          ? (i.criterioIdsGlobal || []).includes(criterioId)
          : i.apartados.some(ap => ap.criterioIds.includes(criterioId))
      )
    );
    const logros = [];
    for (const inst of aplicables) {
      const l = this.logroCriterioEnInstrumento(inst, alumnoId, criterioId);
      if (l != null) logros.push(l);
    }
    if (!logros.length) return null;
    return logros.reduce((a, b) => a + b, 0) / logros.length;
  },

  logroCriterio(criterioId, claseId, alumnoId, periodo) {
    return this.logroCriterioEnInsts(criterioId, claseId, alumnoId,
      this.instrumentosDeClase(claseId, periodo));
  },

  notaPonderada(claseId, alumnoId, periodo, filtroCriterios) {
    const todos = this.criteriosDeAlumno(claseId, alumnoId);
    const criterios = filtroCriterios ? todos.filter(filtroCriterios) : todos;
    let suma = 0, pesos = 0;
    for (const c of criterios) {
      const l = this.logroCriterio(c.id, claseId, alumnoId, periodo);
      if (l == null) continue;
      suma += l * c.peso;
      pesos += c.peso;
    }
    if (pesos <= 0) return null;
    return (suma / pesos) * 10;
  },

  notaEvaluacion(claseId, alumnoId, periodo) {
    return this.notaPonderada(claseId, alumnoId, periodo, null);
  },

  notaCompetencia(claseId, alumnoId, espId, periodo) {
    return this.notaPonderada(claseId, alumnoId, periodo, c => c.espIds.includes(espId));
  },

  notaClave(claseId, alumnoId, claveId, periodo) {
    return this.notaPonderada(claseId, alumnoId, periodo, c => (c.claveIds || []).includes(claveId));
  },

  notaInstrumento(inst, alumnoId) {
    const reg = (Storage.db.registros[inst.id] || {})[alumnoId] || {};
    // Excluido de este instrumento: no tiene nota (un 0 seria una nota puesta).
    if (reg.noRealiza === true) return null;
    const esRubrica = inst.tipo === 'Rúbrica';
    if (esRubrica) {
      let suma = 0, pesos = 0;
      for (const ap of inst.apartados) {
        const v = reg[ap.id];
        if (v == null || isNaN(v)) continue;
        const niveles = this.nivelesDeApartado(inst, ap);
        const nv = niveles.find(n => Math.abs(Number(v) - Number(n.pct)) < 1e-9);
        const pct = nv ? Number(nv.pct) : Number(v);
        const p = ap.peso == null || isNaN(ap.peso) ? 1 : Number(ap.peso);
        suma += (pct / 100) * p;
        pesos += p;
      }
      if (pesos <= 0) return null;
      return (suma / pesos) * 10;
    }
    let obt = 0, max = 0;
    for (const ap of inst.apartados) {
      const v = reg[ap.id];
      max += ap.maxPts;
      if (v != null && !isNaN(v)) obt += Number(v);
    }
    return max > 0 ? (obt / max) * 10 : null;
  },

  // === Análisis para la pestaña Informe (D-59) ===
  // Solo lectura sobre datos existentes. No modifican db ni Storage.

  // Instrumentos de una clase filtrados por alcance.
  // `filtros` = { periodo, unidad, instrumentoId } — todos opcionales.
  instrumentosAlcance(claseId, filtros) {
    const f = filtros || {};
    let insts = this.instrumentosDeClase(claseId, f.periodo);
    if (f.unidad) insts = insts.filter(i => i.unidad === f.unidad);
    if (f.instrumentoId) insts = insts.filter(i => i.id === f.instrumentoId);
    return insts;
  },

  // Media de la clase para un criterio en un alcance. Devuelve 0–1 o null.
  mediaClaseCriterio(criterioId, claseId, insts) {
    const alumnos = this.alumnosDeClase(claseId);
    const valores = alumnos
      .map(a => this.logroCriterioEnInsts(criterioId, claseId, a.id, insts))
      .filter(v => v != null);
    if (!valores.length) return null;
    return valores.reduce((s, v) => s + v, 0) / valores.length;
  },

  // Nota global (0–10) de un alumno en un alcance de instrumentos.
  notaEnInsts(claseId, alumnoId, insts) {
    const criterios = this.criteriosDeAlumno(claseId, alumnoId);
    let suma = 0, pesos = 0;
    for (const c of criterios) {
      const l = this.logroCriterioEnInsts(c.id, claseId, alumnoId, insts);
      if (l == null) continue;
      suma += l * c.peso;
      pesos += c.peso;
    }
    if (pesos <= 0) return null;
    return (suma / pesos) * 10;
  },

  // Datos para la tabla de criterios (absoluto × relativo) de la pestaña Informe.
  // Para cada criterio: media de la clase y, por alumno, logro + estado absoluto
  // (≥50%) y relativo (≥ media de clase). `criterios` los decide la vista.
  tablaCriteriosInforme(claseId, insts, criterios) {
    const alumnos = this.alumnosDeClase(claseId);
    return (criterios || []).map(c => {
      const media = this.mediaClaseCriterio(c.id, claseId, insts);
      const filas = alumnos.map(a => {
        const logro = this.logroCriterioEnInsts(c.id, claseId, a.id, insts);
        return {
          alumno: a,
          logro,
          absoluto: logro == null ? null : logro >= 0.5,
          relativo: (logro == null || media == null) ? null : logro >= media
        };
      });
      return { criterio: c, media, filas };
    });
  },

  // Reglas de detección para la pestaña Informe. `criterios` los decide la vista
  // (según el nivel ACI seleccionado). Devuelve hallazgos ordenados por
  // severidad: críticos primero, luego atención, por porcentaje descendente.
  //
  // `nivelFiltro`: undefined = todos los niveles; '' = base; otro = ese nivel
  // ACI (misma convención que `distribucionNotas`). Es responsabilidad de la
  // vista traducir sus centinelas de «todos» (p. ej. el '__todas__' del selector
  // de la Cuadrícula) a `undefined` antes de llamar: aquí un valor que no sea un
  // código de nivel se trata como un nivel real y no casaría con nadie.
  //
  // El NIVEL del instrumento manda en los dos sentidos: una prueba creada para
  // un nivel ACI solo la corrige ese alumnado (`alumnosDeInstrumento`), así que
  // sus preguntas se juzgan con los datos de quien realmente la hizo —no con los
  // de todo el grupo— y no salen en el informe de otro nivel, donde se leerían
  // como fallos de alumnado que nunca la hizo.
  hallazgos(claseId, insts, criterios, nivelFiltro) {
    const todos = nivelFiltro === undefined || nivelFiltro === null;
    const alcance = todos ? '' : this.nivelNorm(nivelFiltro);
    const alumnos = this.alumnosDeClase(claseId);
    const UMB = { critico: 50, atencion: 30, fallosPregunta: 50 };
    const salida = [];

    // Regla 1: criterios con alto porcentaje de alumnos por debajo del 50%.
    for (const c of criterios || []) {
      // El criterio solo cuenta para el alumnado cuyo currículo lo incluye: un
      // instrumento común con criterios de varios currículos no debe inflar el
      // denominador con alumnado al que ese criterio no afecta (D-69).
      const alumnosDelCriterio = alumnos
        .filter(a => this.criteriosDeAlumno(claseId, a.id).some(x => x.id === c.id));
      const logros = alumnosDelCriterio
        .map(a => this.logroCriterioEnInsts(c.id, claseId, a.id, insts))
        .filter(v => v != null);
      if (logros.length < 2) continue;
      const pct = Math.round(logros.filter(v => v < 0.5).length / logros.length * 100);
      const ref = `«${c.codigo} — ${c.descripcion}»`;
      if (pct >= UMB.critico) {
        salida.push({
          nivel: 'critico', tipo: 'criterio', criterioId: c.id,
          codigo: c.codigo, pct,
          texto: `${pct}% del alumnado por debajo del 50% en ${ref}`
        });
      } else if (pct >= UMB.atencion) {
        salida.push({
          nivel: 'atencion', tipo: 'criterio', criterioId: c.id,
          codigo: c.codigo, pct,
          texto: `${pct}% del alumnado por debajo del 50% en ${ref}`
        });
      }
    }

    // Regla 2: preguntas (apartados) con alto índice de fallos.
    for (const inst of insts || []) {
      // Con un nivel elegido, solo se juzgan los instrumentos de ESE nivel: los
      // comunes (sin nivel) valen para todos y una prueba de otro nivel no la
      // hizo este alumnado.
      if (!todos && !this.instrumentoParaNivel(inst, alcance)) continue;
      const alumnosAp = this.alumnosDeInstrumento(inst);
      const regInst = Storage.db.registros[inst.id] || {};
      for (const ap of inst.apartados || []) {
        const notas = alumnosAp
          // Excluido de este instrumento: sus apartados están en blanco, pero
          // se filtra por si acaso para no contar su ausencia como un fallo.
          .filter(a => !(regInst[a.id] && regInst[a.id].noRealiza === true))
          .map(a => (regInst[a.id] || {})[ap.id])
          .filter(v => v != null && v !== '' && !isNaN(v))
          .map(Number);
        if (notas.length < 2) continue;
        // Apartado sin criterios: no pertenece a ningún currículo, así que no
        // se puede decir que sea de un nivel. Igual que `logroCriterioEnInsts`
        // con los criterios, se descarta en vez de contarlo como un fallo más.
        if (!(ap.criterioIds || []).length) continue;
        const max = inst.tipo === 'Rúbrica' ? 100 : Number(ap.maxPts) || 1;
        const pct = Math.round(notas.filter(v => v / max < 0.5).length / notas.length * 100);
        if (pct >= UMB.fallosPregunta) {
          salida.push({
            nivel: pct >= 80 ? 'critico' : 'atencion', tipo: 'pregunta',
            instrumentoId: inst.id, apartadoId: ap.id,
            titulo: inst.titulo, pregunta: ap.descripcion, pct,
            texto: `«${ap.descripcion}» en ${inst.titulo}: ${pct}% de fallos`
          });
        }
      }
    }

    const orden = { critico: 0, atencion: 1, bien: 2 };
    salida.sort((a, b) => (orden[a.nivel] - orden[b.nivel]) || (b.pct - a.pct));
    return salida;
  },

  // Distribución de notas (0–10) en un alcance. Devuelve buckets para el
  // histograma, la media y las notas sueltas. `nivelCodigo` (opcional) restringe
  // el alumnado: ausente = todo el grupo, '' = base, otro = ese nivel ACI.
  distribucionNotas(claseId, insts, nivelCodigo) {
    let alumnos = this.alumnosDeClase(claseId);
    if (nivelCodigo !== undefined && nivelCodigo !== null) {
      const nv = this.nivelNorm(nivelCodigo);
      alumnos = alumnos.filter(a => this.nivelDeAlumno(claseId, a.id) === nv);
    }
    const notas = alumnos
      .map(a => this.notaEnInsts(claseId, a.id, insts))
      .filter(n => n != null);
    if (!notas.length) return { notas: [], buckets: [], media: null };
    const buckets = Array.from({ length: 10 }, (_, i) => ({
      rango: `${i}–${i + 1}`, cantidad: 0
    }));
    for (const n of notas) {
      buckets[Math.min(9, Math.floor(n))].cantidad++;
    }
    const media = notas.reduce((s, n) => s + n, 0) / notas.length;
    return { notas, buckets, media };
  },

  // Estadísticos deterministas de una lista de notas (para la pestaña
  // Distribución del Informe): media, mediana, desviación típica, mínima y
  // máxima. Puro y testeable sin navegador.
  estadisticasNotas(notas) {
    if (!notas || !notas.length) return { media: null, mediana: null, desv: null, min: null, max: null, cv: null };
    const ordenadas = notas.slice().sort((a, b) => a - b);
    const n = ordenadas.length;
    const media = ordenadas.reduce((s, x) => s + x, 0) / n;
    const mediana = n % 2
      ? ordenadas[(n - 1) / 2]
      : (ordenadas[n / 2 - 1] + ordenadas[n / 2]) / 2;
    const varianza = ordenadas.reduce((s, x) => s + (x - media) * (x - media), 0) / n;
    return { media, mediana, desv: Math.sqrt(varianza), min: ordenadas[0], max: ordenadas[n - 1], cv: media ? Math.sqrt(varianza) / media : null };
  },


  clasif(n) {
    if (n == null || isNaN(n)) return 'na';
    return n >= 5 ? 'ok' : 'ko';
  },

  badgeHtml(n, real) {
    return '<span class="badge ' + this.clasif(n) + '">' + (real ? Utils.fmtReal(n) : Utils.fmt(n)) + '</span>';
  },

  // === Saberes por instrumento (D-74c) ===
  // Pura: lee Storage.db, no toca DOM. Analiza qué saberes básicos domina cada
  // alumno a partir de los apartados etiquetados por el docente.

  // Lista los saberes únicos de un instrumento y en qué apartados aparecen.
  // Deduplica por minúsculas conservando la primera capitalización.
  saberesDeInstrumento(instrumentId) {
    const inst = this.instrumento(instrumentId);
    if (!inst) return [];
    const vistos = new Map(); // lowercase -> { saber, apartados, count }
    for (const ap of inst.apartados) {
      const raw = String(ap.saberes == null ? '' : ap.saberes);
      for (let s of raw.split(',')) {
        s = s.trim();
        if (!s) continue;
        const clave = s.toLowerCase();
        if (!vistos.has(clave)) vistos.set(clave, { saber: s, apartados: [], count: 0 });
        const item = vistos.get(clave);
        if (item.apartados.indexOf(ap.id) === -1) item.apartados.push(ap.id);
        item.count++;
      }
    }
    return [...vistos.values()];
  },

  // Nota 0–10 de un alumno en un apartado, o null si no tiene nota. Pura.
  notaAlumnoEnApartado(instrumentId, alumnoId, apartadoId) {
    const inst = this.instrumento(instrumentId);
    if (!inst) return null;
    const ap = inst.apartados.find(a => a.id === apartadoId);
    if (!ap || !ap.maxPts) return null;
    const reg = (Storage.db.registros[instrumentId] || {})[alumnoId];
    const raw = (reg || {})[apartadoId];
    if (raw == null || raw === '' || isNaN(raw)) return null;
    const n = (Number(raw) / ap.maxPts) * 10;
    const clamp = Math.max(0, Math.min(10, n));
    return Math.round(clamp * 10) / 10;
  },

  // Dominio de un saber para un alumno: media de los apartados que lo trabajan.
  dominioSaber(instrumentId, alumnoId, saber) {
    const todos = this.saberesDeInstrumento(instrumentId);
    const match = todos.find(x => x.saber.toLowerCase() === String(saber).toLowerCase());
    const etiquetaSaber = match ? match.saber : saber;
    if (!match) return { saber: etiquetaSaber, estado: 'sin_datos', media: null, apartados: [] };
    const filas = match.apartados.map(apId => {
      const ap = (this.instrumento(instrumentId) || {}).apartados.find(a => a.id === apId);
      const nota = this.notaAlumnoEnApartado(instrumentId, alumnoId, apId);
      return { descripcion: ap ? ap.descripcion : '', nota, apto: nota !== null && nota >= 5 };
    });
    const conNota = filas.filter(f => f.nota !== null);
    if (!conNota.length) {
      return { saber: etiquetaSaber, estado: 'sin_datos', media: null, apartados: filas };
    }
    const media = Math.round((conNota.reduce((s, f) => s + f.nota, 0) / conNota.length) * 10) / 10;
    return { saber: etiquetaSaber, estado: media >= 5 ? 'domina' : 'mejorar', media, apartados: filas };
  }
};

</script>
<script>
// Color por unidad didáctica (UD) en la cuadrícula de Instrumentos.
// Paleta curada de 15 tonos pastel: `intenso` para la barra de la UD y
// `suave` para las cabeceras de instrumento. Ambos pasan contraste >= 4.6:1
// con el texto que se pintan encima (--tinta y --tinta-suave).
const ColoresUd = {
  PALETA: [
    { h: 0,   intenso: '#e07b7b', suave: '#f7e8e8' },
    { h: 24,  intenso: '#e0a37b', suave: '#f4e9e1' },
    { h: 48,  intenso: '#e0cc7b', suave: '#f0ebd5' },
    { h: 72,  intenso: '#cce07b', suave: '#e9efd2' },
    { h: 96,  intenso: '#a3e07b', suave: '#ddefd2' },
    { h: 120, intenso: '#7be07b', suave: '#d9f2d9' },
    { h: 144, intenso: '#7be0a3', suave: '#d5f0e0' },
    { h: 168, intenso: '#7be0cc', suave: '#d5f0eb' },
    { h: 192, intenso: '#7bcce0', suave: '#d9edf2' },
    { h: 210, intenso: '#7bade0', suave: '#e1ebf4' },
    { h: 230, intenso: '#7f8fe1', suave: '#e8ebf7' },
    { h: 250, intenso: '#9687e3', suave: '#ebe8f7' },
    { h: 275, intenso: '#b67be0', suave: '#f1e8f7' },
    { h: 300, intenso: '#e07be0', suave: '#f6e5f6' },
    { h: 330, intenso: '#e07bad', suave: '#f6e5ed' }
  ],
  esValido(hex) {
    return typeof hex === 'string' && /^#[0-9a-fA-F]{6}$/.test(hex);
  },
  // Entrada de la paleta a partir de su tono `intenso`, o null si no existe.
  entradaPorIntenso(hex) {
    return this.PALETA.find(c => c.intenso === hex) || null;
  },
  // Primer color de la paleta cuyo `intenso` no está en `usados`.
  primerLibre(usados) {
    const set = new Set(usados || []);
    return this.PALETA.find(c => !set.has(c.intenso)) || this.PALETA[0];
  }
};

<script>
// Diálogo accesible: al abrir se lleva el foco dentro, Tab/Shift+Tab quedan
// atrapados en el modal (no se escapan a la página de detrás), Escape equivale a
// «Cancelar» y al cerrar el foco vuelve a quien lo abrió. Sin dependencias: el
// único estado es `elementoFocoPrevio`, para devolver el foco al disparador.
let elementoFocoPrevio = null;

// Elementos que pueden recibir foco dentro del modal, en orden de documento.
// Se evitan selectores compuestos (`:not(...)`, `*`, comas) para que la misma
// función valga en el navegador y en el DOM mínimo del arnés.
// `querySelectorAll` NO devuelve un Array: en el navegador es un `NodeList`, que
// no tiene `.filter`. Hay que convertirlo antes — el arnés sí devuelve un Array,
// así que sin el `Array.from` esto pasaba las comprobaciones y reventaba en el
// navegador con «querySelectorAll(...).filter is not a function».
function focablesEn(raiz) {
  const tags = ['a', 'button', 'input', 'select', 'textarea', 'summary'];
  const sel = tags.join(',') + ',[tabindex]';
  const lista = Array.from(raiz.querySelectorAll(sel)).filter(el => {
    if (el.getAttribute('tabindex') === '-1') return false;
    if (el.hasAttribute('disabled')) return false;
    if (el.tagName === 'INPUT' && el.getAttribute('type') === 'hidden') return false;
    return true;
  });
  return lista;
}

// Mueve el foco dentro del modal; si no hay focables (modal solo informativo),
// enfoca el propio contenedor para que Tab no salte a la página de detrás.
function enfocarModal(raiz) {
  const lista = focablesEn(raiz);
  const primeroAuto = raiz.querySelector('[autofocus]');
  const destino = primeroAuto || lista[0] || raiz.querySelector('.modal');
  if (destino && typeof destino.focus === 'function') destino.focus();
}

const UI = {
  // `capa` (1 por defecto, 2 para modales anidados, p. ej. elegir criterios
  // dentro del modal de instrumento) permite abrir un segundo modal por encima
  // sin destruir el primero.
  openModal({ titulo, cuerpo, textoGuardar, alGuardar, peligro }, capa) {
    const nivel = capa === 2 ? 2 : 1;
    const root = document.getElementById(nivel === 2 ? 'modal-root-2' : 'modal-root');
    elementoFocoPrevio = (document.activeElement && document.activeElement.focus) ? document.activeElement : null;
    const idTitulo = 'modal-titulo';
    root.innerHTML = `
      <div class="velo">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="${idTitulo}" tabindex="-1">
          <div class="modal-head">
            <h3 id="${idTitulo}">${Utils.esc(titulo)}</h3>
            <button class="icon-btn cerrar" title="Cerrar" aria-label="Cerrar">×</button>
          </div>
          <div class="modal-body"></div>
          <div class="modal-foot">
            ${alGuardar ? '<button class="btn cancelar">Cancelar</button><button class="btn btn-primario guardar">' + Utils.esc(textoGuardar || 'Guardar') + '</button>' : '<button class="btn cancelar">Cerrar</button>'}
          </div>
        </div>
      </div>`;
    const body = root.querySelector('.modal-body');
    body.innerHTML = cuerpo;
    const cerrar = () => { UI.closeModal(); };
    root.querySelector('.cerrar').onclick = cerrar;
    root.querySelector('.cancelar').onclick = cerrar;
    if (alGuardar) {
      const btn = root.querySelector('.guardar');
      if (peligro) btn.classList.add('btn-peligro');
      btn.onclick = () => {
        if (alGuardar(body, cerrar) !== false) {
          cerrar();
          // La segunda capa no refresca la vista: el modal padre sigue abierto.
          if (nivel === 1 && typeof App !== 'undefined' && App.refrescar) App.refrescar();
        }
      };
    }
    // Trampa de foco y Escape. El listener vive en `root`, que se vacía al
    // cerrar, así que no se acumula entre modales. Escape cierra por el mismo
    // camino que «Cancelar»: nunca ejecuta `alGuardar`.
    root.onkeydown = ev => {
      if (ev.key === 'Escape') { ev.preventDefault(); cerrar(); return; }
      if (ev.key !== 'Tab') return;
      const lista = focablesEn(root);
      if (!lista.length) { ev.preventDefault(); const m = root.querySelector('.modal'); if (m) m.focus(); return; }
      const primero = lista[0];
      const ultimo = lista[lista.length - 1];
      if (ev.shiftKey && document.activeElement === primero) { ev.preventDefault(); ultimo.focus(); }
      else if (!ev.shiftKey && document.activeElement === ultimo) { ev.preventDefault(); primero.focus(); }
    };
    enfocarModal(root);
    return body;
  },

  closeModal() {
    // Cierra la capa superior abierta (la 2 si la hay; si no, la 1).
    const raiz2 = document.getElementById('modal-root-2');
    const hay2 = !!(raiz2 && raiz2.innerHTML);
    const root = document.getElementById(hay2 ? 'modal-root-2' : 'modal-root');
    if (!root) { elementoFocoPrevio = null; return; }
    root.innerHTML = '';
    root.onkeydown = null;
    // Devolver el foco al disparador, si sigue vivo (un repintado pudo
    // sustituirlo). `isConnected` evita enfocar un nodo huérfano.
    const previo = elementoFocoPrevio;
    elementoFocoPrevio = null;
    if (previo && typeof previo.focus === 'function' && previo.isConnected !== false) previo.focus();
  },

  // Aviso efímero. `tipo: 'error'` se anuncia de forma imperiosa (`role="alert"`,
  // que implica `aria-live="assertive"`), porque interrumpe al lector a propósito:
  // solo se usa para fallos que exigen atención inmediata. El resto son informes
  // (`role="status"`, que implica `aria-live="polite"`: no interrumpen). El rol va
  // en el propio aviso, no en el contenedor, para no solapar regiones vivas.
  toast(msg, tipo) {
    const root = document.getElementById('toast-root');
    const t = document.createElement('div');
    t.className = 'toast' + (tipo === 'error' ? ' toast-error' : '');
    t.setAttribute('role', tipo === 'error' ? 'alert' : 'status');
    t.textContent = msg;
    root.appendChild(t);
    setTimeout(() => t.remove(), tipo === 'error' ? 6000 : 2600);
  },

  chipsCriterios(asignaturaId, seleccionados) {
    const lista = Storage.db.criterios
      .filter(c => c.asignaturaId === asignaturaId)
      .sort((a, b) => String(a.codigo).localeCompare(String(b.codigo), 'es'));
    if (!lista.length) return '<div class="aviso">Primero crea criterios en la sección Currículo.</div>';
    return `<div class="chips" data-campo="criterios">` + lista.map(c => {
      const on = (seleccionados || []).includes(c.id);
      return `<label class="chip ${on ? 'on' : ''}"><input type="checkbox" value="${c.id}" ${on ? 'checked' : ''}>${Utils.esc(c.codigo)} · ${Utils.esc(c.descripcion)}</label>`;
    }).join('') + '</div>';
  },

  // Chips de criterios agrupados por nivel (para un instrumento «común», que es
  // para todo el alumnado). `grupos` = [{ etiqueta, criterios }].
  chipsCriteriosMulti(grupos, seleccionados) {
    // Acepta un array o un Set de ids marcados.
    const sel = seleccionados == null ? []
      : (typeof seleccionados.has === 'function' ? [...seleccionados] : seleccionados);
    const partes = [];
    // Compatibilidad: si llega un asignaturaId (string), se trata como un único grupo.
    const lista = (typeof grupos === 'string')
      ? [{ etiqueta: 'Criterios', criterios: Storage.db.criterios.filter(c => c.asignaturaId === grupos) }]
      : (grupos || []);
    lista.forEach(g => {
      const lista = (g.criterios || []).slice()
        .sort((a, b) => String(a.codigo).localeCompare(String(b.codigo), 'es'));
      if (!lista.length) return;
      const marcados = lista.filter(c => sel.includes(c.id)).length;
      partes.push('<details class="chips-nivel"><summary>' + Utils.esc(g.etiqueta) +
        ' · <span class="chips-nivel-cuenta">' + marcados + '</span></summary>' +
        '<div class="chips-grupo">' + lista.map(c => {
          const on = sel.includes(c.id);
          return `<label class="chip ${on ? 'on' : ''}"><input type="checkbox" value="${c.id}" ${on ? 'checked' : ''}>${Utils.esc(c.codigo)} · ${Utils.esc(c.descripcion)}</label>`;
        }).join('') + '</div></details>');
    });
    if (!partes.length) return '<div class="aviso">Primero crea criterios en la sección Currículo.</div>';
    return `<div class="chips" data-campo="criterios">` + partes.join('') + '</div>';
  },

  wireChips(container) {
    container.querySelectorAll('.chip input').forEach(inp => {
      inp.addEventListener('change', () => {
        inp.closest('.chip').classList.toggle('on', inp.checked);
      });
    });
  },

  valoresChips(container) {
    return Array.from(container.querySelectorAll('input:checked')).map(i => i.value);
  },

  selectHtml(lista, valorActual, campoId, campoNombre) {
    return lista.map(x =>
      `<option value="${x[campoId]}" ${x[campoId] === valorActual ? 'selected' : ''}>${Utils.esc(x[campoNombre])}</option>`
    ).join('');
  }
};

</script>

  function render(el) {

              </li>`).join('') || '<li class="vacio">Sin grupos todavía. Crea el primero.</li>'}
          </ul>
