<style>
:root {
  --papel: #f5f3ec;
  --tinta: #2b2a26;
  --tinta-suave: #6b685e;
  --linea: #d5d0c0;
  --acento: #1f5c6b;
  --acento-suave: #e4ebed;
  /* Color de marca (cabecera, isotipo y favicon). Lo fija el docente en
     Configuración → Tema y menús; por defecto azul petróleo. */
  --marca: #1f5c6b;
  --ok: #15803d;
  --ok-suave: #e8f7ee;
  --ko: #b91c1c;
  --ko-suave: #fdecec;
  --na: #5f6672;
  --na-suave: #f1f2f4;
  --aviso: #b45309;
  --aviso-suave: #fdf3e7;
  --radio: 14px;
  --pad-x: 18px;
  --sombra: 0 1px 3px rgba(43, 42, 38, .08), 0 8px 24px rgba(43, 42, 38, .06);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.45;
  background: var(--papel);
  color: var(--tinta);
  min-height: 100vh;
}

.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 16px;
  padding: 10px var(--pad-x);
  background: var(--marca);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid transparent;
  flex-wrap: wrap;
}
/* La cabecera va a todo color: texto y controles en blanco sobre la marca. */
.topbar .brand-txt strong { color: #fff; }
.topbar .brand-txt small { color: rgba(255, 255, 255, .82); }
.topbar .nav button { color: rgba(255, 255, 255, .74); }
.topbar .nav button:hover { background: rgba(255, 255, 255, .16); color: #fff; }
.topbar .nav button.activo {
  background: #fff; color: var(--marca); font-weight: 700;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .26);
}
.topbar .icon-btn { color: rgba(255, 255, 255, .88); }
.topbar .icon-btn:hover { background: rgba(255, 255, 255, .2); color: #fff; }
.topbar .btn { background: rgba(255, 255, 255, .16); border-color: rgba(255, 255, 255, .4); color: #fff; }
.topbar .btn:hover:not(:disabled) {
  background: rgba(255, 255, 255, .26); border-color: rgba(255, 255, 255, .55); color: #fff;
}

/* Navegación configurable (Configuración → Tema y menús). */
.nav-fab { position: fixed; left: 16px; bottom: 16px; z-index: 9998; padding: 12px 16px;
  border: 0; border-radius: 999px; background: var(--marca); color: #fff;
  font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1.1;
  cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.28); }
.nav-fab:hover { filter: brightness(1.08); }
.nav-menu { position: fixed; left: 16px; bottom: 68px; z-index: 9998; width: 260px;
  background: #fff; border: 1px solid var(--linea); border-radius: 12px;
  box-shadow: 0 8px 28px rgba(0,0,0,.28); padding: 8px; }
.nav-menu[hidden] { display: none; }
.nav-menu button, .nav-dock button, .nav-drawer button {
  font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1.2;
  cursor: pointer; color: var(--tinta); }
.nav-menu button { display: block; width: 100%; text-align: left; padding: 10px 12px;
  border: 0; background: transparent; border-radius: 8px; }
.nav-menu button:hover { background: var(--acento-suave); color: var(--acento); }
.nav-menu button.activo { background: var(--acento); color: #fff; }
body.modo-fab main, body.modo-dock main { padding-bottom: 84px; }
.nav-dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: 10px; z-index: 9998;
  display: flex; gap: 2px; padding: 6px; max-width: calc(100% - 20px); overflow-x: auto;
  background: rgba(255,255,255,.96);
  border: 1px solid var(--linea); border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.20); }
.nav-dock button { min-width: 74px; padding: 8px 6px; border: 0; background: transparent;
  border-radius: 10px; font-size: 12px; color: var(--tinta-suave); }
.nav-dock button:hover { background: var(--acento-suave); color: var(--acento); }
.nav-dock button.activo { background: var(--acento); color: #fff; }
/* Subpestañas de Evaluación en el modo dock: segunda fila pegada al dock,
   con la misma estética (fondo blanco, borde y sombra). Solo existe dentro
   de Evaluación. La activa usa el relleno suave, como las anidadas de los
   menús: no llega a la píldora llena del nivel 1. */
.nav-dock-sub { position: fixed; left: 50%; transform: translateX(-50%); bottom: 60px; z-index: 9998;
  display: flex; gap: 2px; padding: 6px; max-width: calc(100% - 20px); overflow-x: auto;
  background: rgba(255,255,255,.96);
  border: 1px solid var(--linea); border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.20); }
.nav-dock-sub button { min-width: 58px; padding: 6px; border: 0; background: transparent;
  border-radius: 10px; font-family: inherit; font-size: 12px; font-weight: 600;
  line-height: 1.2; cursor: pointer; color: var(--tinta-suave); }
.nav-dock-sub button:hover { background: var(--acento-suave); color: var(--acento); }
.nav-dock-sub button.activo { background: var(--acento-suave); color: var(--acento); }
/* M-19: la barra lateral es una FRANJA estrecha fija en el margen izquierdo
   con la hamburguesa; el menú se despliega SOLO al tocarla y solo se colapsa
   al volver a tocarla (ni Escape ni un clic fuera lo cierran, petición del
   docente). El panel es una capa pegada a la franja y NUNCA cubre el
   contenido: main aparta el hueco de la franja con un margen (la cabecera
   queda sin margen). El estado del panel vive en app.js (drawerAbierto) y se
   conserva al repintar la nav. */
body.modo-drawer main { margin-left: 48px; transition: margin-left .2s ease; }
/* Panel desplegado: aparta el contenido (franja + panel), no lo tapa. */
body.modo-drawer.drawer-abierto main { margin-left: 268px; }
.franja-drawer { position: fixed; left: 0; top: var(--sticky-top, 60px); bottom: 0; width: 48px; z-index: 40;
  background: #fff; border-right: 1px solid var(--linea); box-shadow: 4px 0 14px rgba(0, 0, 0, .12); }
.franja-drawer .nav-drawer-toggle { display: block; margin: 10px auto 0; padding: 6px 8px;
  border: 0; background: transparent; border-radius: 8px; cursor: pointer;
  font-family: inherit; font-size: 18px; line-height: 1.1; color: var(--tinta); }
.franja-drawer .nav-drawer-toggle:hover { background: var(--acento-suave); color: var(--acento); }
.nav-drawer { position: fixed; left: 48px; top: var(--sticky-top, 60px); bottom: 0; width: 220px; z-index: 40;
  background: #fff; border-right: 1px solid var(--linea); box-shadow: 0 0 30px rgba(0, 0, 0, .3);
  padding: 14px 8px; overflow: auto; }
.nav-drawer[hidden] { display: none; }
.nav-drawer button { display: block; width: 100%; text-align: left; padding: 10px 12px;
  margin-bottom: 2px; border: 0; background: transparent; border-radius: 8px; }
.nav-drawer button:hover { background: var(--acento-suave); color: var(--acento); }
.nav-drawer button.activo { background: var(--acento); color: #fff; }
/* Subpestañas de Evaluación anidadas (nivel 3): mismo patrón en el panel
   lateral y en el menú del FAB — sangradas bajo la entrada Evaluación, texto
   pequeño (12 px) y la activa con el relleno suave. Los selectores van tras
   las reglas base para ganar en cascada con la misma especificidad. */
.nav-drawer button.subeval, .nav-menu button.subeval {
  margin: 0 0 2px 20px; padding: 6px 10px;
  font-size: 12px; font-weight: 500; color: var(--tinta-suave);
}
.nav-drawer button.subeval:hover, .nav-menu button.subeval:hover {
  background: var(--acento-suave); color: var(--acento);
}
.nav-drawer button.subeval.activo, .nav-menu button.subeval.activo {
  background: var(--acento-suave); color: var(--acento);
}

@media (max-width: 520px) {
  .nav-dock { left: 10px; right: 10px; transform: none; max-width: none; }
  .nav-dock-sub { left: 10px; right: 10px; transform: none; max-width: none; }
  /* M-11: la fuente no baja de 12 px; el dock se deja desplazar en horizontal. */
  .nav-dock button { min-width: 58px; }
}

/* M-16 (parte 1): en móvil (≤520 px) y en el modo barra superior (el
   predeterminado), #nav deja la cabecera y se convierte en una barra de
   pestañas fija al fondo: ancho completo, fondo blanco y borde superior, con
   desplazamiento horizontal si las pestañas no caben. El resto de la cabecera
   (marca, estado de copia, Guardar, engranaje) queda arriba y el subnav de
   Evaluación conserva su fila propia bajo la marca. En fab, dock y drawer la
   #nav está oculta (display: none) y cada modo pinta lo suyo: no cambian.
   Detalle importante: backdrop-filter convierte a la cabecera en el bloque de
   contención de los descendientes position: fixed, así que aquí se retira (su
   fondo es opaco y el difuminado no aportaba nada) para que #nav pueda
   anclarse al fondo real de la ventana. */
@media (max-width: 520px) {
  :root { --altura-tabs: 53px; }
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) .topbar { backdrop-filter: none; }
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) #nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 55;
    flex: none; flex-wrap: nowrap; gap: 2px;
    overflow-x: auto; scrollbar-width: none;
    padding: 4px 6px;
    padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px));
    background: #fff;
    border-top: 1px solid var(--linea);
    box-shadow: 0 -2px 10px rgba(43, 42, 38, .08);
  }
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) #nav::-webkit-scrollbar { display: none; }
  /* Colores propios sobre fondo blanco: las reglas de la cabecera a todo color
     (texto blanco sobre la marca) dejarían las pestañas invisibles aquí. */
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) #nav button {
    flex: 1 0 auto; min-width: 64px; min-height: 44px;
    padding: 8px 10px; border-radius: 10px; font-size: 12px;
    white-space: nowrap; color: var(--tinta-suave);
  }
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) #nav button:hover {
    background: var(--acento-suave); color: var(--acento);
  }
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) #nav button.activo {
    background: var(--acento); color: #fff; font-weight: 700; box-shadow: none;
  }
  /* El contenido aparta el hueco de la barra inferior. */
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) main {
    padding-bottom: calc(var(--altura-tabs) + env(safe-area-inset-bottom, 0px) + 8px);
  }
}

.brand { display: flex; align-items: center; gap: 10px; }
.logo {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--acento); color: #fff; font-weight: 800; font-size: 15px;
  flex: none;
}
/* Isotipo en la cabecera: pastilla blanca con el color del tema. Clicable a
   Inicio (petición del docente): mismo tamaño e isotipo, cursor de mano y
   hover sutil. */
.logo.isotipo {
  background: #fff; color: var(--marca);
  border: 1px solid rgba(255, 255, 255, .55);
  cursor: pointer;
}
.logo.isotipo:hover { filter: brightness(1.06); }
.logo.isotipo:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.logo.isotipo svg { width: 26px; height: 26px; display: block; }
.brand-txt { line-height: 1.1; }
.brand-txt small { display: block; color: var(--tinta-suave); font-size: 12px; }

.nav { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
.nav button {
  display: inline-flex; align-items: center; justify-content: center;
  border: none; background: transparent; cursor: pointer;
  font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1.1; color: var(--tinta-suave);
  padding: 10px 14px; border-radius: 999px; min-height: 40px;
}
.nav button:hover { background: var(--acento-suave); color: var(--acento); }
.nav button.activo { background: var(--acento); color: #fff; }

/* Subpestañas de Evaluación: segunda fila de la cabecera (Fase 2a). Nivel 2 de
   la jerarquía de navegación (M-05): pestañas subrayadas, no píldoras, sobre
   una fila blanca propia bajo la fila de marca — el subrayado y el texto de
   marca necesitan fondo claro para tener contraste en todos los modos. Pesos
   tipográficos algo menores que los del nivel 1 (14 px). Solo existe estando
   en Evaluación: fuera de ella #subnav se elimina del DOM. */
.subnav {
  display: flex; flex-wrap: wrap; gap: 4px;
  flex: 1 1 100%; order: 4; /* bajo la fila de secciones */
  background: #fff;
  border-top: 1px solid var(--linea);
  margin: 0 calc(-1 * var(--pad-x)); padding: 0 12px;
}
.subnav:empty { display: none; }
.subnav button {
  border: 0; border-bottom: 2px solid transparent; border-radius: 0;
  background: transparent; color: var(--tinta-suave);
  padding: 8px 10px; min-height: 36px;
  font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
}
.subnav button:hover { color: var(--marca); border-bottom-color: var(--linea); }
.subnav button.activo { color: var(--marca); border-bottom-color: var(--marca); font-weight: 700; }

/* Los controles de la cabecera (indicador de copia, Copia de seguridad y
   engranaje) van pegados a la derecha. */
.actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

/* Cola de Corregir: los instrumentos completos van en un desplegable cerrado
   para no estorbar lo pendiente. */
.completos-corrige { margin-top: 14px; }
.completos-corrige > summary {
  cursor: pointer; padding: 8px 2px; font-weight: 700; color: var(--tinta-suave);
}
.completos-corrige > summary:hover { color: var(--acento); }

/* Indicador permanente de copia de seguridad (M-02): punto de color + texto,
   junto al botón «Copia de seguridad». Colores de estado con texto más oscuro
   que el punto (mismo criterio que .badge) para superar el contraste AA. */
.estado-copia { display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; color: var(--tinta-suave); }
/* El atributo `hidden` (app sin datos) debe ganar a la regla display. */
.estado-copia[hidden] { display: none; }
.estado-copia::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--tinta-suave); }
.estado-copia.ok::before { background: var(--ok); }
.estado-copia.ok { color: var(--ok); }
.estado-copia.pendiente::before, .estado-copia.antigua::before { background: var(--aviso); }
.estado-copia.pendiente, .estado-copia.antigua { color: var(--aviso); }
.estado-copia.nunca::before { background: var(--ko); }
.estado-copia.nunca { color: var(--ko); }
/* En la cabecera a todo color: el texto acompaña en blanco translúcido, como
   el resto de la barra; el punto conserva su color de estado (con anillo para
   destacar sobre el fondo de marca). */
.topbar .estado-copia { color: rgba(255, 255, 255, .82); }
.topbar .estado-copia::before { box-shadow: 0 0 0 2px rgba(255, 255, 255, .35); }
/* Móvil: solo el punto; el `title` del elemento explica el estado. */
@media (max-width: 520px) {
  .estado-copia { font-size: 0; gap: 0; }
}

main { max-width: 1440px; margin: 0 auto; padding: 20px 18px 60px; }

.card {
  background: #fff; border: 1px solid var(--linea);
  border-radius: var(--radio); box-shadow: var(--sombra);
  padding: 18px; margin-bottom: 18px;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.card h1 { margin: 0; font-size: 24px; font-weight: 800; line-height: 1.2; }
.card h2 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25; }
.card .subtitulo { font-size: 15px; font-weight: 700; }
.card-head .sub { color: var(--tinta-suave); font-size: 13px; width: 100%; margin-top: -6px; }

/* Grupo único de acciones: mismo gap y alineación en cabeceras y tablas. */
.acciones { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-head .acciones { margin-left: auto; }
.tabla .acciones { flex-wrap: nowrap; }

/* M-08: modal «Acciones de <instrumento>» — un botón por línea, a lo ancho y
   alineado a la izquierda, para elegir con seguridad también en táctil. */
.acciones-modal { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
.acciones-modal .btn { text-align: left; }
.flujo { line-height: 1.6; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

.btn {
  appearance: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--linea); background: #fff;
  color: var(--tinta); font-family: inherit; font-weight: 600; font-size: 14px; line-height: 1.1;
  padding: 10px 16px; border-radius: 10px; cursor: pointer; min-height: 40px;
  text-decoration: none;
}
.btn:hover:not(:disabled) { border-color: var(--acento); color: var(--acento); }
.btn-primario { background: var(--acento); border-color: var(--acento); color: #fff; }
.btn-primario:hover:not(:disabled) { filter: brightness(1.07); color: #fff; }
.btn-peligro { color: var(--ko); border-color: #f3caca; }
.btn-peligro:hover:not(:disabled) { background: var(--ko-suave); border-color: var(--ko); color: var(--ko); }
/* Bloque para acciones irreversibles (p. ej. borrar todo), separado del resto. */
.zona-peligro {
  margin-top: 14px; padding: 12px 14px;
  border: 1px solid #f3caca; border-radius: 10px; background: var(--ko-suave);
}
.zona-peligro > b { display: block; color: var(--ko); margin-bottom: 4px; }
.zona-peligro > p { margin: 0 0 10px; font-size: 13px; color: var(--tinta-suave); }
/* Bloque «Perfil docente» del modal Configuración (D-74): nombre, centro y
   logo que saldrán en la cabecera de los informes impresos. */
.bloque-perfil {
  margin-top: 14px; padding: 12px 14px;
  border: 1px solid var(--linea); border-radius: 10px; background: var(--papel);
}
.bloque-perfil > b { display: block; margin-bottom: 4px; }
.bloque-perfil > p { margin: 0 0 10px; font-size: 13px; color: var(--tinta-suave); }
.perfil-logo-fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.perfil-logo-mini { max-height: 40px; max-width: 140px; object-fit: contain; }
.perfil-logo-mini[hidden] { display: none; }
.perfil-logo-aviso { margin: 6px 0 0; }
/* Bloque «Ajustes de calificación» del modal Configuración (D-74b): cómo se
   calcula la media de una UD plegada cuando un instrumento no tiene nota. */
.bloque-ajustes {
  margin-top: 14px; padding: 12px 14px;
  border: 1px solid var(--linea); border-radius: 10px; background: var(--papel);
}
.bloque-ajustes > b { display: block; margin-bottom: 4px; }
.bloque-ajustes > p { margin: 0 0 10px; font-size: 13px; color: var(--tinta-suave); }
.campo--toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.campo--toggle input { width: auto; flex: 0 0 auto; margin: 0; }
.campo--toggle span { flex: 1; }

/* Configuración con pestañas (submenú, no un cajón de sastre). */
.tabs-ajustes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.ajuste-seccion { display: none; }
.ajuste-seccion.activa { display: block; }
.bloque-tema { margin-top: 14px; padding: 12px 14px; border: 1px solid var(--linea); border-radius: 10px; background: var(--papel); }
.bloque-tema > b { display: block; margin-bottom: 4px; }
.bloque-tema > p { margin: 0 0 10px; font-size: 13px; color: var(--tinta-suave); }
.tonos { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 6px; }
.tono {
  width: 34px; height: 34px; padding: 0; border-radius: 8px; cursor: pointer;
  border: 2px solid transparent;
}
.tono:hover { transform: scale(1.06); }
.tono.on { border-color: var(--tinta); }
/* Bloque de copias de seguridad del modal Configuración. */
.bloque-copias {
  margin-top: 14px; padding: 12px 14px;
  border: 1px solid var(--linea); border-radius: 10px; background: var(--papel);
}
.bloque-copias > b { display: block; margin-bottom: 4px; }
.bloque-copias > p { margin: 0 0 10px; font-size: 13px; color: var(--tinta-suave); }
/* Bloque informativo «Acerca de»: sin fondo destacado, es para leer. */
.bloque-acerca {
  margin-top: 14px; padding-top: 12px;
  border-top: 1px solid var(--linea);
}
.bloque-acerca > b { display: block; margin-bottom: 6px; }
.bloque-acerca > p { margin: 0 0 6px; font-size: 13px; color: var(--tinta-suave); }
.bloque-acerca .acerca-firma { margin: 0; font-size: 12px; color: var(--tinta-suave); }
.acerca-licencia { margin-top: 8px; border-top: 1px solid var(--linea); }
.acerca-licencia summary {
  cursor: pointer; padding: 14px 0; min-height: 44px;
  font-size: 13px; font-weight: 700; color: var(--tinta);
}
.acerca-licencia pre {
  max-height: 260px; overflow: auto; margin: 0 0 8px; padding: 10px;
  background: #fff; border: 1px solid var(--linea); border-radius: 8px;
  font-size: 12px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere;
  color: var(--tinta);
}
.btn-ghost { border-color: transparent; background: transparent; color: var(--tinta-suave); }
.btn-ghost:hover:not(:disabled) { background: var(--acento-suave); color: var(--acento); border-color: transparent; }
.btn:disabled {
  background: var(--na-suave); border-color: var(--linea); color: var(--tinta-suave);
  opacity: 1; cursor: not-allowed;
}
.btn-mini { padding: 6px 12px; min-height: 32px; font-size: 12px; border-radius: 8px; }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; padding: 0;
  border: none; background: transparent; cursor: pointer;
  font-family: inherit; font-size: 16px; line-height: 1; color: var(--tinta-suave); border-radius: 8px;
}
.icon-btn:hover { background: var(--ko-suave); color: var(--ko); }
/* Botón de icono grande (p. ej. el engranaje de Configuración): talla táctil
   cómoda y el icono hereda el color del botón. */
.icon-btn-lg { width: 44px; height: 44px; border-radius: 10px; }
.icon-btn-lg svg { display: block; fill: currentColor; }
/* Los iconos dentro de un botón heredan su color y no se deforman. */
.btn svg { flex: 0 0 auto; fill: currentColor; }

/* M-12: botón de ojo del modo privacidad. Alineado con los icon-btn; el ojo
   se dibuja a trazo (stroke), no a relleno, y hereda el color del botón. */
.btn-privacidad svg { flex: 0 0 auto; fill: none; stroke: currentColor; }
/* Pulso de aviso: anillo breve (clic simple con nombres ocultos: no revela). */
.btn-privacidad.pulso-privacidad { animation: pulso-privacidad .6s ease-out; }
@keyframes pulso-privacidad {
  from { box-shadow: 0 0 0 0 var(--acento); }
  to { box-shadow: 0 0 0 9px transparent; }
}

.lista { list-style: none; margin: 0; padding: 0; }
.lista li {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border-radius: 10px; cursor: pointer;
  border: 1px solid transparent;
}
.lista li:hover { background: var(--papel); }
.lista li.activo { background: var(--acento-suave); border-color: #d8d3fb; }
.lista li span { flex: 1; font-weight: 600; }
.lista li small { color: var(--tinta-suave); }
.lista li.vacio, td.vacio { color: var(--na); text-align: center; padding: 18px !important; cursor: default !important; }

.tabla { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.tabla th, .tabla td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--linea); vertical-align: middle; }
.tabla th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--tinta-suave); }
.tabla thead th {
  position: sticky;
  top: 0;
  background: #fff;
  z-index: 4;
  box-shadow: 0 1px 0 var(--linea);
}
.tabla tr:last-child td { border-bottom: none; }
.tabla .num { text-align: right; font-variant-numeric: tabular-nums; }
.tabla tbody tr:hover { background: #faf9f4; }

/* Nombre del alumno en la corrección: un botón con aspecto de enlace, punto de
   entrada de «no realiza esta evaluación». */
.nombre-alumno {
  appearance: none;
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  font: inherit;
  color: var(--acento);
  text-align: left;
  cursor: pointer;
}
.nombre-alumno:hover { text-decoration: underline; }
.nombre-alumno .badge { margin-left: 5px; vertical-align: middle; }

/* Nota tecleada que todavía no es un número válido (p. ej. «-» o texto suelto): se
   marca mientras dure, para que no se guarde un valor a medias sin que el docente lo vea. */
.inp-nota.nota-invalida { border-color: var(--ko); background: var(--ko-suave); }

.scroll-x { overflow-x: auto; }

/* M-18: en las tablas cuyo desplazamiento VERTICAL es la página (Cuadrícula e
   Informe: están dentro de .scroll-x, que solo desplaza en horizontal) la fila
   de cabecera sticky NO funciona ahí: al tener overflow-x: auto, el propio
   .scroll-x se convierte en el contenedor de scroll (también en vertical) y
   el thead se ancla a él, que no se mueve. La solución es el mismo patrón
   que la corrección: el contenedor de la tabla hace de ventana de scroll
   (vertical y horizontal) y el thead se pega a su borde superior; su tamaño
   lo mide app.js (mideScrollTabla) para ocupe el espacio bajo la cabecera.
   El thead (z-index 7/8) debe quedar POR ENCIMA de las celdas sticky de la
   primera columna (z-index 5) y de «Evaluación» (4), o el contenido pasa
   por encima de la cabecera al desplazar. */
.scroll-tabla { overflow: auto; }
.tabla thead th { z-index: 7; }
.tabla-cuadricula thead th:first-child { z-index: 8; }
.tabla-cuadricula thead th.col-eval { z-index: 7; }
.tabla-cuadricula thead tr:nth-child(2) th { top: var(--fila1-h, 40px); }

/* Corrección: la tabla tiene su propio scroll (vertical y horizontal) para que
   la cabecera quede fija mientras se puntúa a los últimos alumnos. Sin el
   contenedor con scroll, el thead sticky se anclaría a .scroll-x (que no
   desplaza en vertical) y la cabecera se iría con el contenido.
   M-18: al desplazarse DENTRO del contenedor, su thead sigue pegado a
   top: 0 respecto a él: aquí no se aplica la variable de altura de cabecera. */
.scroll-correccion { overflow: auto; max-height: 72vh; }

/* Filas de los paneles de Inicio: al tocarlas se abre la vista correspondiente. */
.fila-inicio { cursor: pointer; }
.fila-inicio:hover td { background: #faf9f4; }

/* Cuadrícula ancha: fija la columna del alumno y la columna «Evaluación». */
.tabla-cuadricula th:first-child, .tabla-cuadricula td:first-child {
  position: sticky; left: 0; background: #fff; z-index: 5;
  box-shadow: 1px 0 0 var(--linea);
}
.tabla-cuadricula thead th:first-child { z-index: 6; }
.tabla-cuadricula th.col-eval, .tabla-cuadricula td.col-eval {
  position: sticky; right: 0; background: #fff; z-index: 4;
  box-shadow: -1px 0 0 var(--linea);
}
.tabla-cuadricula thead th.col-eval { z-index: 6; }
.tabla-cuadricula tbody tr:hover td:first-child { background: #faf9f4; }
.tabla-cuadricula tbody tr:hover td.col-eval { background: #faf9f4; }
/* En la cuadrícula solo la columna del alumno va a la izquierda: cabeceras y
   notas se centran para que cada cifra quede bajo su columna. */
.tabla-cuadricula th:not(:first-child),
.tabla-cuadricula td:not(:first-child) { text-align: center; }
.tabla-cuadricula .num { text-align: center; }
/* El color de la barra lo pone el inline de cada UD; sin color queda el tono
   de acento por defecto. */
.tabla-cuadricula .fila-ud .ud-grupo { text-align: center; color: var(--acento); }
.tabla-cuadricula .fila-ud th { border-bottom: 2px solid var(--linea); }
/* Separadores de puntos finos entre columnas (no en la columna del alumno ni
   en la de Evaluación, que ya llevan su sombra). */
.tabla-cuadricula th:not(:first-child):not(.col-eval),
.tabla-cuadricula td:not(:first-child):not(.col-eval) {
  border-left: 1px dotted var(--linea);
}

input[type="text"], input[type="number"], input[type="date"], select, textarea {
  font: inherit; color: inherit;
  border: 1px solid var(--linea); border-radius: 10px;
  padding: 8px 10px; background: #fff; min-height: 40px; width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--acento); }
:where(button, a, input, select, textarea, summary):focus-visible {
  outline: 3px solid var(--acento); outline-offset: 2px;
}
.campo { display: block; margin-bottom: 12px; }
.campo > span { display: block; font-size: 12px; font-weight: 700; color: var(--tinta-suave); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
.fila-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }

.badge {
  display: inline-block; padding: 3px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
}
/* Los badges llevan texto más oscuro que el color de estado para superar 4.5:1
   (WCAG AA para texto pequeño): el color claro de estado sobre su fondo "suave"
   ronda 4:1 y falla; estos tonos suben a 5-7:1. */
.badge.ok { background: var(--ok-suave); color: #166534; }
.badge.ko { background: var(--ko-suave); color: #991b1b; }
.badge.na { background: var(--na-suave); color: #4b5563; }
.badge.info { background: var(--acento-suave); color: #3730a3; }
/* Aviso (pendientes) y alumnado excluido de un instrumento: mismo ámbar. */
.badge.warn, .badge.no-realiza { background: var(--aviso-suave); color: #92400e; }
/* M-11: el estado del semáforo no depende solo del color (WCAG 1.4.1): cada
   badge de estado lleva un símbolo propio además del tono — ✓ correcto,
   ● atención, ▼ crítico —. El contenido generado llega también a los lectores
   de pantalla y se imprime. El resto de badges (info, na, no-realiza) ya
   distingue su estado con texto propio. El símbolo del semáforo (✓/●/▼) se
   retiró a petición del docente: la nota y el color bastan, y el símbolo
   añadía ruido en la cuadrícula. */

/* Estadísticos de la pestaña Distribución (Informe): rejilla de tarjetas. */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 8px;
  margin: 0 0 22px;
}
.stat {
  background: var(--papel);
  border: 1px solid var(--linea);
  border-radius: 10px;
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  cursor: help;
  transition: box-shadow .15s ease, border-color .15s ease, transform .15s ease;
}
.stat:hover {
  border-color: var(--acento);
  box-shadow: var(--sombra);
  transform: translateY(-1px);
}

/* Contexto del informe (Fase 4a: vista autónoma): fila propia con los
   selectores de clase, nivel, trimestre, unidad e instrumento, y el botón de
   imprimir empujado al extremo derecho. */
.informe-alcance {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 14px;
}
.informe-alcance .btn { margin-left: auto; }

/* Resumen del informe: dos tarjetas con listas compactas. */
.resumen-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
  align-items: start;
}
.resumen-lista { list-style: none; margin: 0; padding: 0; }
.resumen-lista li {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 0; border-bottom: 1px solid var(--linea);
}
.resumen-lista li:last-child { border-bottom: none; }
.resumen-detalle { color: var(--tinta-suave); font-size: 12px; }
.resumen-mas { color: var(--tinta-suave); font-size: 12px; margin: 6px 0 0; }
.resumen-enlace { margin: 10px 0 0; }
.stat-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--tinta-suave);
  text-transform: uppercase;
  letter-spacing: .04em;
}
.stat-value {
  font-size: 15px;
  font-weight: 700;
  color: var(--tinta);
  font-variant-numeric: tabular-nums;
}
.stat-value small { font-size: 12px; font-weight: 600; color: var(--tinta-suave); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.hint { display: block; color: var(--tinta-suave); font-size: 12px; margin-bottom: 6px; }
.chip {
  position: relative;
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px;
  border: 1px solid var(--linea); border-radius: 999px;
  padding: 6px 12px; font-size: 13px; cursor: pointer; user-select: none; background: #fff;
}
.chip.on { background: var(--acento); border-color: var(--acento); color: #fff; }
.chip input { position: absolute; width: 1px; height: 1px; opacity: 0; margin: 0; }
/* Criterios agrupados por nivel (instrumento «común» a todo el grupo), plegados
   en <details> para no desplegar 60+ chips a la vez. */
.chips-nivel { border-top: 1px dashed var(--linea); padding: 2px 0; }
.chips-nivel:first-child { border-top: 0; }
.chips-nivel > summary {
  cursor: pointer; list-style: none; padding: 4px 0;
  font-size: 12px; font-weight: 700; color: var(--tinta-suave);
}
.chips-nivel > summary::-webkit-details-marker { display: none; }
.chips-nivel > summary::before { content: "▸ "; }
.chips-nivel[open] > summary::before { content: "▾ "; }
.chips-nivel-cuenta {
  display: inline-block; min-width: 16px; text-align: center; margin-left: 4px;
  background: var(--acento-suave); color: var(--acento); border-radius: 999px;
  font-size: 12px; padding: 0 6px;
}
.chips-grupo { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 2px 0 6px; }
.chip:has(input:focus-visible) { outline: 2px solid var(--acento); outline-offset: 2px; }

/* Pestañas de la Cuadrícula (#tabs, M-05): segundo nivel de navegación, el
   mismo lenguaje que el subnav — pestaña subrayada, sin píldora con fondo.
   El activo lleva el color de marca; el hover subraya en gris suave. */
#tabs .chip {
  border: 0; border-bottom: 2px solid transparent; border-radius: 0;
  background: transparent; color: var(--tinta-suave);
  padding: 6px 10px; min-height: 32px;
}
#tabs .chip:hover { color: var(--marca); border-bottom-color: var(--linea); }
#tabs .chip.on {
  background: transparent; color: var(--marca);
  border-bottom-color: var(--marca); font-weight: 700;
}

/* Subvistas del Informe (M-05, nivel 3): chips pequeños de navegación, más
   discretos que los de selección (criterios, niveles…), que no cambian. El
   activo usa relleno suave en lugar del pleno. */
.subvistas-informe { gap: 4px; }
.subvistas-informe .chip {
  font-size: 12px; padding: 3px 10px; min-height: 26px;
}
.subvistas-informe .chip.on {
  background: var(--acento-suave); border-color: var(--acento-suave);
  color: var(--acento); font-weight: 600;
}

.aviso {
  background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
  padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 12px;
}
/* Aviso de copia destacado: mismo ámbar, con el color semántico de aviso. */
.aviso-pendiente { background: var(--aviso-suave); border-color: var(--aviso); color: var(--aviso); }
/* Panel de pendientes de Inicio: número grande, sin protagonismo excesivo. */
.inicio-pendientes .num-grande { font-size: 28px; font-weight: 800; line-height: 1; color: var(--acento); }
.inicio-pendientes.todo-ok .num-grande { color: var(--ok); }
details.guia-inicio { margin-bottom: 12px; }
details.guia-inicio > summary { cursor: pointer; color: var(--tinta-suave); }
details.guia-inicio > summary .guia-titulo { display: inline; font-size: 16px; font-weight: 700; }
.vacio-grande { text-align: center; color: var(--tinta-suave); padding: 40px 20px; }
.vacio-grande strong { display: block; font-size: 17px; color: var(--tinta); margin-bottom: 6px; }

#modal-root .velo, #modal-root-2 .velo {
  position: fixed; inset: 0; background: rgba(43, 42, 38, .45);
  display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px;
}
/* El modal anidado (p. ej. criterios dentro del instrumento) va por encima. */
#modal-root-2 .velo { z-index: 200; }
.modal {
  background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
  width: min(720px, 100%); max-height: 90vh; display: flex; flex-direction: column;
}
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--linea); }
.modal-head h3 { margin: 0; font-size: 18px; line-height: 1.25; }
.modal-body { padding: 18px; overflow: auto; }
/* La cuadrícula de rúbrica necesita más ancho para sus columnas de nivel */
.modal:has(.rub-head) { width: min(1080px, 100%); }
.modal:has(#ia-prompt) { width: min(860px, 100%); }
/* El modal de instrumento ahora lleva 5 columnas (pregunta, saberes, peso,
   criterios, quitar): necesita más ancho que el modal por defecto. */
.modal:has(#lista-apartados) { width: min(1080px, 100%); }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--linea); }

#toast-root { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: var(--tinta); color: #fff; padding: 10px 18px; border-radius: 999px;
  font-size: 14px; box-shadow: var(--sombra); animation: aparecer .2s ease-out;
}
/* Fallo que exige atención inmediata (p. ej. no se pudo guardar): se distingue del
   aviso informativo, no solo por el color, para que no dependa de percibir el tono. */
.toast-error { background: var(--ko); font-weight: 600; }
@keyframes aparecer { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.apartado-fila {
  display: grid; grid-template-columns: 1fr 1fr 110px auto auto; gap: 8px; align-items: center;
  padding: 6px 0; border-bottom: 1px dashed var(--linea);
}
.apartado-fila > *:first-child { min-width: 0; }
.col-saberes, .col-peso { display: flex; flex-direction: column; gap: 2px; }
.col-saberes small, .col-peso small { color: var(--tinta-suave); font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0; }
.col-peso input { width: 100%; }
.zona-crit { grid-column: 1 / -1; padding: 8px 4px 2px; border-top: 1px dashed var(--linea); }
.apartado-fila:last-child { border-bottom: none; }
.apartado-fila .quitar-ap { justify-self: end; }
/* Movil: 5 columnas no caben. Pregunta+saberes arriba, peso+criterios+quitar abajo. */
@media (max-width: 720px) {
  .apartado-fila { grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .apartado-fila .ap-desc,
  .apartado-fila .col-saberes { grid-column: 1 / -1; }
  .apartado-fila .toggle-crit { justify-self: start; }
  .apartado-fila .quitar-ap { justify-self: end; }
}


/* Rúbrica: cuadrícula «criterio · peso · nivel 1 … nivel N» (D-40) */
.rub-head { display: grid; gap: 8px; align-items: end; padding: 2px 0 8px; border-bottom: 2px solid var(--linea); }
.rub-head > span { font-size: 12px; font-weight: 700; color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .04em; line-height: 1.3; }
.rub-head > span small { text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--acento); }
.apartado-fila.rub { align-items: start; }
.ap-saberes { font-size: 13px; }

/* Subvista «Instrumentos» del informe (D-74c): tabla de saberes por alumno */
.obs-inst { resize: vertical; min-height: 80px; }
.apartado-fila.rub .ap-nv { font-size: 13px; }
.apartado-fila.rub .ap-nv::placeholder { color: #b6b2a6; font-style: italic; }

.leyenda-rubrica { margin-top: 12px; font-size: 13px; }
.leyenda-rubrica summary { cursor: pointer; color: var(--acento); font-weight: 600; }
.leyenda-rubrica .leg-item { margin-top: 10px; }
.leyenda-rubrica ul { margin: 4px 0 0; padding-left: 18px; color: var(--tinta-suave); }
.leyenda-rubrica li { margin-bottom: 3px; }

#ia-prompt, #ia-json { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; white-space: pre; }

.segmentos { display: inline-flex; border: 1px solid var(--linea); border-radius: 999px; overflow: hidden; }
.segmentos button {
  display: inline-flex; align-items: center; justify-content: center;
  border: none; background: #fff; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1.1;
  padding: 7px 12px; min-height: 38px; min-width: 52px; color: var(--tinta-suave);
}
.segmentos button:focus-visible { outline-offset: -2px; }
.segmentos button + button { border-left: 1px solid var(--linea); }
.segmentos button.on { background: var(--acento); color: #fff; }

.celda-nota { cursor: pointer; text-align: center; }
.celda-nota:hover { outline: 2px solid var(--acento-suave); }

/* Corrección: barra de navegación y resaltado del alumno en curso */
.barra-correccion { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 2px 0 12px; }
.barra-correccion #nav-info { flex: 1; color: var(--tinta-suave); font-size: 13px; }
.tabla tbody tr.fila-actual { background: var(--acento-suave); }

/* M-16 (parte 2): en móvil (≤520 px) la vista de corrección ocupa la ventana
   completa bajo la cabecera: la tarjeta va a sangre, el listado se desplaza
   dentro de su hueco hasta la barra fija, y «← Anterior · Guardar y siguiente
   →» queda fija abajo, con el alumno en curso (nombre bien visible) en su
   propia fila encima de los botones. Es solo CSS: el selector
   :has(#tabla-corrige) deja de aplicar en cuanto se sale de la corrección, sin
   tocar los manejadores ni el guardado. Igual que la barra de pestañas, solo
   en el modo barra superior: en fab, dock y drawer el pie ya está ocupado por
   su propio menú (no se tocan). */
@media (max-width: 520px) {
  :root { --altura-barra-corr: 85px; }
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) main:has(#tabla-corrige) {
    max-width: none;
    display: flex; flex-direction: column;
    height: calc(100vh - var(--sticky-top, 60px));
    height: calc(100dvh - var(--sticky-top, 60px));
    padding: 8px 0 0;
    padding-bottom: calc(var(--altura-tabs, 53px) + var(--altura-barra-corr, 85px) + env(safe-area-inset-bottom, 0px) + 8px);
  }
  /* La tarjeta a sangre completa y en columna: el hueco que sobra es para la tabla. */
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) main:has(#tabla-corrige) .card {
    flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column;
    margin: 0 0 10px; padding: 10px 10px 12px;
    border-radius: 0; border-left: 0; border-right: 0; box-shadow: none;
  }
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) main:has(#tabla-corrige) > p { flex: none; }
  /* El listado ocupa todo el resto y se desplaza dentro: la fila de cabecera
     sigue pegada a su borde superior, igual que en escritorio. */
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) main:has(#tabla-corrige) .scroll-correccion {
    flex: 1 1 auto; min-height: 0; max-height: none;
  }
  /* Barra fija abajo, justo encima de la barra de pestañas, en dos filas:
     el alumno en curso arriba y los dos botones debajo, a cada lado. */
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) main:has(#tabla-corrige) .barra-correccion {
    position: fixed; left: 0; right: 0; z-index: 55;
    bottom: calc(var(--altura-tabs, 53px) + env(safe-area-inset-bottom, 0px));
    display: grid; grid-template-columns: 1fr 1fr;
    grid-template-areas: 'info info' 'prev next';
    gap: 4px 8px; margin: 0;
    padding: 8px 10px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    background: #fff;
    border-top: 1px solid var(--linea);
    box-shadow: 0 -2px 10px rgba(43, 42, 38, .08);
  }
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) main:has(#tabla-corrige) .barra-correccion #nav-info {
    grid-area: info; min-width: 0;
    font-size: 14px; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) main:has(#tabla-corrige) .barra-correccion #btn-anterior { grid-area: prev; }
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) main:has(#tabla-corrige) .barra-correccion #btn-siguiente { grid-area: next; }
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) main:has(#tabla-corrige) .barra-correccion .btn {
    min-height: 44px; white-space: nowrap;
  }
  /* Entradas numéricas grandes (objetivo táctil ≥44 px) y a 16 px para que iOS
     no haga zoom al enfocarlas; el nombre del alumno también sube de talla. */
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) main:has(#tabla-corrige) .inp-nota {
    min-height: 44px; font-size: 16px; text-align: center;
  }
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) main:has(#tabla-corrige) .segmentos button { min-height: 44px; }
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) main:has(#tabla-corrige) .nombre-alumno { font-size: 15px; font-weight: 600; }
  body:not(.modo-fab):not(.modo-dock):not(.modo-drawer) main:has(#tabla-corrige) .tabla td { padding-top: 10px; padding-bottom: 10px; }
}

/* Instrumentos: secciones por trimestre y bloques plegables por unidad didáctica */
.per-titulo { font-size: 15px; margin: 18px 0 8px; }
.per-titulo:first-child { margin-top: 0; }
.per-titulo small { color: var(--tinta-suave); font-weight: 400; }
.ud-bloque { border: 1px solid var(--linea); border-radius: 10px; margin-bottom: 10px; overflow: hidden; background: #fffdf8; }
.ud-cabecera { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 10px 12px; background: var(--acento-suave); border: 0; font: inherit; color: var(--acento); cursor: pointer; }
.ud-cabecera:hover { filter: brightness(.97); }
.ud-cabecera .ud-flecha { width: 1em; }
.ud-cabecera small { margin-left: auto; color: var(--tinta-suave); font-size: 12px; }
.ud-bloque .ud-cuerpo { display: none; }
.ud-bloque.abierta .ud-cuerpo { display: block; }
.ud-cuerpo .tabla { margin: 0; }

/* M-17: fila de grupo de variantes (mismo título, niveles distintos). Destaca
   sobre sus filas de variantes sin depender solo del color: lleva borde. */
.fila-grupo-inst > td {
  background: var(--acento-suave);
  border-top: 2px solid var(--acento);
  font-weight: 600;
}

/* Cuadrícula · pestaña Instrumentos: plegado de columnas por unidad */
/* Celda que ocupa las columnas de una unidad plegada: mantiene la tabla cuadrada
   (la nota final no se desplaza). Su color lo pinta inline la vista con el tono
   `suave` de la UD (ver js/colores-ud.js), para que combine con la barra. */
.tabla-cuadricula .ud-grupo.plegable { cursor: pointer; user-select: none; }
.tabla-cuadricula .ud-grupo.plegable:hover { filter: brightness(.95); }
/* EXCEPCIÓN M-11 (11 px): flecha decorativa del plegado de UD, no es texto. */
.tabla-cuadricula .ud-grupo .ud-flecha { margin-right: 5px; font-size: 11px; }
/* Mismo aspecto que las barras de unidad de la vista Instrumentos. */
.tabla-cuadricula .ud-grupo { text-transform: none; letter-spacing: normal; }
.tabla-cuadricula .ud-grupo small { margin-left: 6px; color: var(--tinta-suave); font-weight: 400; }
.tabla-cuadricula .ud-grupo:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
/* Fase 5 (teclado): las celdas interactivas de la cuadrícula, los li de los
   listados (grupos, currículos) y las filas de estado de Inicio son
   alcanzables con Tab; el anillo de foco se extiende a ellos. En la celda el
   anillo se pinta hacia dentro (offset negativo) para que no lo recorte el
   borde de la tabla. */
.tabla-cuadricula .celda-nota:focus-visible { outline: 3px solid var(--acento); outline-offset: -3px; }
.lista li:focus-visible,
.fila-inicio:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }

/* Menú contextual de color de una UD (clic derecho sobre su barra). */
.menu-color-ud {
  position: fixed; z-index: 1000;
  background: #fff; border: 1px solid var(--linea); border-radius: 10px;
  box-shadow: var(--sombra); padding: 8px; min-width: 170px;
}
.menu-color-ud .rejilla {
  display: grid; grid-template-columns: repeat(5, 28px); gap: 6px; margin-bottom: 6px;
}
.menu-color-ud .muestra {
  width: 28px; height: 28px; padding: 0;
  border: 1px solid var(--linea); border-radius: 6px; cursor: pointer;
}
.menu-color-ud .muestra:hover { transform: scale(1.1); }
.menu-color-ud .sin-color { width: 100%; }

/* M-09: menú contextual de una celda alumno × instrumento (clic derecho).
   Mismo patrón flotante que el menú de color de UD, con acciones apiladas. */
.menu-celda {
  position: fixed; z-index: 1000; display: flex; flex-direction: column; gap: 6px;
  background: #fff; border: 1px solid var(--linea); border-radius: 10px;
  box-shadow: var(--sombra); padding: 8px; min-width: 220px;
}
.menu-celda .btn { width: 100%; text-align: left; }

/* M-09: chip «Pend.» de la celda sin corregir (pestaña Instrumentos): borde
   discontinuo y color suave con aire de clicable — la celda ya abre la
   corrección. Distinto del «—» gris de la media de una UD plegada (badge na). */
.celda-pendiente {
  display: inline-block; padding: 0 8px; border-radius: 8px;
  border: 1px dashed var(--tinta-suave); color: var(--tinta-suave);
  font-size: 12px; line-height: 20px;
}
.celda-nota:hover .celda-pendiente { border-color: var(--acento); color: var(--acento); }

/* M-09: «N/A» (no aplica, «Todos los niveles»): texto plano atenuado, sin
   fondo ni hover: no es un botón y no abre nada. */
.celda-na { color: var(--tinta-suave); opacity: .55; font-weight: 400; }
.celda-nota.celda-na, .celda-nota.celda-na:hover { outline: none; cursor: default; }

.barra-tab { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }

/* Cabecera de informe: solo existe al imprimir, para que el PDF se lea solo. */
.solo-impresion { display: none; }

/* Filas de «Corregir»: la cola de pendientes y el modal «¿ qué quieres
   corregir? ». Botón único: título + meta a la izquierda, badge de estado a
   la derecha. */
.fila-corrige {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; text-align: left; font: inherit; color: var(--tinta);
  background: #fff; border: 1px solid var(--linea); border-radius: 10px;
  padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
}
.fila-corrige:hover { border-color: var(--acento); background: var(--acento-suave); }
.fila-corrige-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fila-corrige-txt b { font-size: 14px; }
.fila-corrige-txt small { color: var(--tinta-suave); font-size: 12px; }
/* Variante compacta en pantallas estrechas: menos aire y sin la meta. */
@media (max-width: 520px) {
  .fila-corrige { padding: 7px 10px; margin-bottom: 6px; }
  .fila-corrige-txt small { display: none; }
}

/* Filas del banco de instrumentos (modal «Banco de instrumentos», D-48). */
.fila-banco {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: #fff; border: 1px solid var(--linea); border-radius: 10px;
  padding: 10px 12px; margin-bottom: 8px;
}
.fila-banco-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fila-banco-txt b { font-size: 14px; }
.fila-banco-txt small { color: var(--tinta-suave); font-size: 12px; }

@media print {
  .topbar, #modal-root, #toast-root, .no-print { display: none !important; }
  /* Al imprimir, los bloques plegables de Instrumentos salen abiertos. */
  .ud-bloque .ud-cuerpo { display: block !important; }
  body { background: #fff; }
  main { max-width: none; padding: 0; }
  .card { box-shadow: none; border: none; padding: 0; }

  /* Salen solo los datos: los controles (selects, botones) se quedan en pantalla. */
  .solo-impresion { display: block !important; }
  .card-head select, .card-head input, .btn, .icon-btn { display: none !important; }

  /* El informe de «Imprimir todo» sustituye a la vista mientras se imprime. */
  body.imprimiendo-informe main { display: none !important; }
  body.imprimiendo-informe #informe-impresion { display: block !important; }
  /* La cabecera de perfil de la vista actual solo se ve al imprimir. */
  .perfil-impresion { display: block; margin: 0 0 10px; }
  .cabecera-impresion { display: flex; flex-direction: column; gap: 2px; margin: 0 0 10px; }
  .cabecera-impresion strong { font-size: 15px; }
  .cabecera-impresion span { color: #555; font-size: 12px; }

  /* La tabla entera, con su cabecera repetida en cada página y sin cortar filas. */
  .scroll-x { overflow: visible !important; }
  .tabla-cuadricula th:first-child, .tabla-cuadricula td:first-child {
    position: static !important; box-shadow: none;
  }
  thead { display: table-header-group; }
  tr { page-break-inside: avoid; break-inside: avoid; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @page { margin: 10mm; size: A4 landscape; }

  /* Reducir tablas muy anchas (criterios, etc.) —cuerpo a 10 px. EXCEPCIÓN M-11:
     es la salida a PDF impreso (plan previo: >= 10 px); en pantalla manda el
     mínimo de 12 px. */
  #informe-impresion .tabla,
  #informe-impresion .tabla-cuadricula {
    width: 100%;
    table-layout: fixed;
    word-break: break-word;
    hyphens: auto;
    font-size: 10px;
  }
  #informe-impresion .tabla th,
  #informe-impresion .tabla td {
    padding: 1px 2px;
    font-size: 10px;
    line-height: 1.15;
    white-space: normal;
  }
  #informe-impresion .tabla th {
    font-size: 11px;
  }
  #informe-impresion .scroll-x {
    overflow: visible !important;
  }
  .informe-seccion .scroll-x { overflow: visible !important; }
  /* Un poco de aire entre tablas: el título siguiente no pega con la anterior
     (el margin-top no sobrevive al salto de página, se usa padding). */
  .informe-seccion + .informe-seccion { padding-top: 12px; }
  #informe-impresion .informe-seccion h3 { margin-top: 14px !important; }
}
.aci-ast { font-size: 12px; vertical-align: text-top; margin-left: 1px; }

/* Informe de «Imprimir todo»: solo existe al imprimir, nunca en pantalla. */
#informe-impresion { display: none; }
.informe-cab { margin: 0 0 12px; }
.informe-cab strong { font-size: 16px; }
.informe-cab span { display: block; color: var(--tinta-suave); font-size: 12px; }
/* Cabecera de perfil de la impresión de la vista actual (Cuadrícula): los
   demás imprimibles la llevan en .informe-cab; aquí el bloque solo existe al
   imprimir (en pantalla está oculto) y el siguiente render lo retira. */
.perfil-impresion { display: none; }
/* Perfil docente en la cabecera impresa (D-74): solo aparece si el docente ha
   definido algo. La clase .logo ya está ocupada por la marca de la cabecera,
   y el bloque entero no debe partirse entre páginas. Van con `.informe-cab`
   por delante para ganarle a `.informe-cab span` (que haría block y suave
   todos los span de la cabecera). Las mismas reglas sirven para la cabecera
   inyectada de la vista actual (.perfil-impresion). */
.informe-cab .informe-perfil,
.perfil-impresion .informe-perfil {
  display: flex; align-items: center; gap: 10px; margin: 0 0 8px;
  break-inside: avoid; page-break-inside: avoid;
}
.informe-cab .informe-logo,
.perfil-impresion .informe-logo { max-height: 44px; max-width: 150px; object-fit: contain; }
.informe-cab .informe-perfil-txt,
.perfil-impresion .informe-perfil-txt { display: flex; flex-direction: column; min-width: 0; }
.informe-cab .informe-nombre,
.perfil-impresion .informe-nombre { font-size: 13px; font-weight: 700; color: var(--tinta); }
.informe-cab .informe-centro,
.perfil-impresion .informe-centro { font-size: 12px; color: var(--tinta-suave); }
.informe-seccion { margin-bottom: 16px; }
/* El título viaja siempre con lo que le sigue: nunca solo al pie de una página. */
.informe-titulo { font-size: 15px; margin: 0 0 6px; break-after: avoid; page-break-after: avoid; }
/* Los subrótulos (Criterios / Competencias) también quedan pegados a su tabla. */
.informe-seccion h3 { break-after: avoid; page-break-after: avoid; page-break-before: avoid; }
/* Las tablas del informe son más altas que la página: si no pueden partirse,
   el navegador las empuja a la hoja siguiente y deja una página EN BLANCO
   entre el título y la tabla. Cada fila ya se protege sola (tr, arriba). */
.informe-seccion table { break-before: avoid; page-break-before: avoid; break-inside: auto; page-break-inside: auto; }
/* Cada nivel (Base, ACI 1, ACI 2…) empieza en una hoja nueva. */
.informe-seccion + .informe-seccion { break-before: page; page-break-before: always; }

</style>

<script>
const Utils = {
  uid() {
    return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  },
  esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },

  // Enlace de un instrumento (al examen, al proyecto, a los materiales…).
  // Al guardar se limpia: se descartan los esquemas peligrosos y, si falta el
  // esquema, se asume https://. Al pintar se vuelve a comprobar, de modo que un
  // backup manipulado no pueda inyectar código por el atributo href.
  urlLimpia(u) {
    let s = String(u == null ? '' : u).trim();
    if (!s || this.esquemaPeligroso(s)) return '';
    if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://' + s;
    return s;
  },
  urlPintable(u) {
    const s = String(u == null ? '' : u).trim();
    return (s && !this.esquemaPeligroso(s)) ? s : '';
  },
  esquemaPeligroso(s) {
    return /^(javascript|data|vbscript):/i.test(String(s).trim());
  },
  fmt(n) {
    if (n == null || isNaN(n)) return '—';
    return (Math.round(n * 10) / 10).toFixed(1).replace('.', ',');
  },
  // Nota real: hasta 2 decimales, sin el redondeo a 1 que hace `fmt`
  // (1,25 en vez de 1,3; 6,9 en vez de 6,90; 5 en vez de 5,0). Se usa donde
  // importa el valor exacto que se puede teclear (p. ej. el máximo de una
  // pregunta o la nota de un instrumento).
  fmtReal(n) {
    if (n == null || isNaN(n)) return '—';
    const r = Math.round(n * 100) / 100;
    return String(r).replace('.', ',');
  },
  pct(n) {
    if (n == null || isNaN(n)) return '—';
    return Math.round(n) + '%';
  },
  hoy() {
    const d = new Date();
    const p = x => String(x).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  },

  fechaLegible(d = new Date()) {
    const p = x => String(x).padStart(2, '0');
    return p(d.getDate()) + '-' + p(d.getMonth() + 1) + '-' + d.getFullYear();
  },

  horaCorta(d = new Date()) {
    const p = x => String(x).padStart(2, '0');
    return p(d.getHours()) + p(d.getMinutes());
  },
  stamp() {
    const d = new Date();
    const p = x => String(x).padStart(2, '0');
    return '' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  },
  debounce(fn, ms) {
    let t;
    return function (...a) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, a), ms);
    };
  }
};

</script>
<script>
// URLs de objeto creadas para los logos en impresión; se revocan al terminar.
const _logoObjUrls = [];

const Storage = {
  KEY: 'evalcrit:data',
  LOGO_MAX: 30 * 1024, // 30 KB en el fichero original (~40 KB en base64).

  // Copia del estado anterior a una importación, para poder deshacerla:
  // importar reemplaza TODOS los datos (ver «Copia de seguridad» más abajo).
  KEY_PREVIA: 'evalcrit:preimport',
  // Días sin copia de seguridad a partir de los cuales se avisa en Inicio.
  DIAS_COPIA: 7,
  db: null,
  // Fichero de trabajo: nombre y manejador. Permiten sobrescribir el mismo
  // fichero al guardar en lugar de amontonar backups con fecha.
  nombreFichero: 'evalcrit.json',
  ficheroHandle: null,

  defaults() {
    const hoy = new Date();
    const inicio = hoy.getMonth() >= 6 ? hoy.getFullYear() : hoy.getFullYear() - 1;
    return {
      schemaVersion: 1,
      cursoEscolar: `${inicio}/${inicio + 1}`,
      meta: { ultimaExportacion: null, cambiosSinCopia: false },
      grupos: [],
      alumnos: [],
      asignaturas: [],
      clases: [],
      competenciasClave: [
        { id: 'cc-ccl', codigo: 'CCL', nombre: 'Comunicación lingüística' },
        { id: 'cc-cp', codigo: 'CP', nombre: 'Competencia plurilingüe' },
        { id: 'cc-stem', codigo: 'STEM', nombre: 'Competencia científica y tecnológica' },
        { id: 'cc-cd', codigo: 'CD', nombre: 'Competencia digital' },
        { id: 'cc-cpsaa', codigo: 'CPSAA', nombre: 'Personal, social y de aprender a aprender' },
        { id: 'cc-cc', codigo: 'CC', nombre: 'Competencia ciudadana' },
        { id: 'cc-ce', codigo: 'CE', nombre: 'Competencia emprendedora' },
        { id: 'cc-ccec', codigo: 'CCEC', nombre: 'En conciencia y expresión culturales' }
      ],
      competenciasEspecificas: [],
      criterios: [],
      instrumentos: [],
      // Moldes de instrumentos guardados para reutilizarlos en otra clase o en
      // el curso siguiente (D-48).
      bancoInstrumentos: [],
      // Perfil docente (D-74): nombre del profesor, nombre del centro y logo
      // (data URL) para las cabeceras de los informes impresos. Declararlo
      // aquí basta: Storage.migrar rellena la clave en backups antiguos.
      perfil: { nombre: '', centro: '', logo: '' },
      // Ajustes del comportamiento de la app (D-74b): como se calcula la media
      // de una UD plegada en Calificaciones cuando un instrumento no tiene nota.
      // false (por defecto) = no cuenta (solo promedia lo evaluado, «Media»);
      // true = el vacio vale 0 (punitivo). migrar() lo normaliza a booleano.
      configuracion: { sinNotaEsCero: false },
      // Identidad visual elegida por el docente: color del tema (cabecera,
      // acento, isotipo y favicon) y organización de los menús.
      tema: { color: '#1f5c6b', nav: 'topbar' },
      // Color por unidad didáctica en la cuadrícula: mapa { ud: '#hex' | null }.
      // undefined = automático (primer color libre de la paleta), null = sin color.
      coloresUd: {},
      registros: {},
      // Observaciones del docente por instrumento (D-74c): propuestas de mejora
      // a criterio del maestro. Se guardan localmente, offline.
      observaciones: {}
    };
  },

  // --- Perfil docente (D-74) ---------------------------------------------
  // Límite del logo en origen: el data URL ocupa ~4/3 de la imagen, así que
  // 30 KB de fichero son ~40 KB en el backup. Un logo grande no debe colgar
  // el localStorage (cuota de ~5 MB) ni cargar cada guardado.
  LOGO_MAX: 30 * 1024,

  // Motivo por el que un fichero de logo NO se acepta, o '' si va bien. Pura:
  // se comprueba sin navegador, con un objeto { type, size } a medias. Mismo
  // criterio defensivo que Utils.urlPintable: la guarda vive al subir, no
  // solo al pintar.
  logoRechazo(archivo) {
    if (!archivo) return 'No se ha podido leer el fichero del logo.';
    if (archivo.type && archivo.type.indexOf('image/') !== 0) {
      return 'El logo debe ser una imagen: «' + (archivo.name || 'ese fichero') + '» no lo es.';
    }
    if (typeof archivo.size !== 'number' || archivo.size > this.LOGO_MAX) {
      const kb = typeof archivo.size === 'number' ? Math.round(archivo.size / 1024) : '?';
      return 'Logo demasiado grande (' + kb + ' KB): el máximo son '
        + Math.round(this.LOGO_MAX / 1024) + ' KB.';
    }
    return '';
  },

  // Al pintar se vuelve a comprobar: un backup manipulado no puede meter en
  // el src del logo otra cosa que no sea una imagen (data:image/...).
  logoPintable(valor) {
    return typeof valor === 'string' && valor.indexOf('data:image/') === 0;
  },

  // Convierte un data:URL del logo en una URL de objeto (blob:), que Chrome SÍ
  // renderiza al exportar a PDF; un <img src="data:..."> a veces no imprime.
  // La URL creada se registra en _logoObjUrls y se revoca al terminar de imprimir.
  logoObjUrl(valor) {
    if (!this.logoPintable(valor)) return '';
    try {
      const arr = String(valor).split(',');
      const mime = (arr[0].match(/:(.*?);/) || [])[1] || 'image/png';
      const bstr = atob(arr[1]);
      const u8 = new Uint8Array(bstr.length);
      for (let i = 0; i < bstr.length; i++) u8[i] = bstr.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([u8], { type: mime }));
      _logoObjUrls.push(url);
      return url;
    } catch (e) {
      return '';
    }
  },

  // Revoca todas las URLs de objeto creadas para los logos (tras imprimir).
  revocarLogos() {
    for (const url of _logoObjUrls) {
      try { URL.revokeObjectURL(url); } catch (e) { /* ya revocada */ }
    }
    _logoObjUrls.length = 0;
  },

  // Cabecera de perfil para los informes impresos (D-74): nombre, centro y
  // logo. La usan LAS DOS vistas imprimibles, así que vive en el modelo y no
  // en ninguna de las dos (views-informe.js es un módulo autocontenido y no
  // puede ser su dependencia). Devuelve '' si no hay datos: una cabecera
  // vacía no deja separadores sueltos. Lee db.perfil con defensa, para que un
  // estado antiguo sin la clave no rompa informeHtml. Comprobable sin
  // navegador: las comprobaciones la comparan como string.
  perfilHtml() {
    const p = (this.db && this.db.perfil) || {};
    const nombre = String(p.nombre == null ? '' : p.nombre).trim();
    const centro = String(p.centro == null ? '' : p.centro).trim();
    const logo = this.logoPintable(p.logo) ? this.logoObjUrl(p.logo) : '';
    if (!nombre && !centro && !logo) return '';
    const partes = [];
    if (logo) partes.push(`<img class="informe-logo" src="${Utils.esc(logo)}" alt="Logo del centro">`);
    const textos = [];
    if (nombre) textos.push(`<span class="informe-nombre">${Utils.esc(nombre)}</span>`);
    if (centro) textos.push(`<span class="informe-centro">${Utils.esc(centro)}</span>`);
    if (textos.length) partes.push(`<span class="informe-perfil-txt">${textos.join('')}</span>`);
    return `<div class="informe-perfil">${partes.join('')}</div>`;
  },

  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      this.db = raw ? this.migrar(JSON.parse(raw)) : this.defaults();
    } catch (e) {
      this.db = this.defaults();
    }
    return this.db;
  },

  // Guarda en el navegador y marca que hay cambios sin copiar (salvo cuando el
  // propio guardado forma parte de una exportación: ahí no hay nada nuevo que
  // respaldar). `esCopia` lo usan exportar/guardar vía `marcarCopia`.
  save(esCopia) {
    if (!esCopia) {
      this.db.meta = this.db.meta || {};
      this.db.meta.cambiosSinCopia = true;
    }
    this.volcar();
  },

  // Vuelca el estado actual al navegador sin efectos colaterales (no marca
  // «cambios sin copiar» ni anima el indicador). Es la red de seguridad al
  // cerrar u ocultar la pestaña (R-01): el último estado siempre queda escrito.
  volcar() {
    try {
      localStorage.setItem(this.KEY, JSON.stringify(this.db));
    } catch (e) {
      if (typeof UI !== 'undefined' && UI.toast) UI.toast('Error al guardar: exporta tu backup ahora', 'error');
    }
  },

  vacio() {
    const d = this.db;
    return !d.grupos.length && !d.alumnos.length && !d.asignaturas.length && !d.criterios.length && !d.instrumentos.length;
  },

  puedeCarpeta() {
    return typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function';
  },

  abrirIdb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('evalcrit-fs', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('kv');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },

  idbLeer(clave) {
    return this.abrirIdb().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readonly');
      const req = tx.objectStore('kv').get(clave);
      tx.oncomplete = () => resolve(req.result);
      tx.onerror = () => reject(tx.error);
    }));
  },

  idbEscribir(clave, valor) {
    return this.abrirIdb().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(valor, clave);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    }));
  },

  async elegirCarpetaBackup() {
    if (!this.puedeCarpeta()) {
      alert('Tu navegador no permite elegir carpeta de guardado (necesitas Chrome o Edge en Windows). Los backups irán a Descargas.');
      return null;
    }
    try {
      const handle = await window.showDirectoryPicker({ id: 'evalcrit-backups', mode: 'readwrite' });
      await this.idbEscribir('dir', handle);
      UI.toast('Los backups se guardarán en la carpeta «' + handle.name + '»');
      return handle;
    } catch (e) {
      if (e && e.name === 'AbortError') return null;
      console.error(e);
      alert('No se pudo elegir la carpeta: ' + e.message + '. Puede que tu navegador rechace ubicaciones de red (p. ej. rutas WSL).');
      return null;
    }
  },

  // Escribe en un manejador de fichero (File System Access). Devuelve false si
  // no hay permiso o falla, para que el llamador pruebe otra via.
  async escribeHandle(fh, contenido) {
    try {
      let perm = 'granted';
      if (fh.queryPermission) perm = await fh.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted' && fh.requestPermission) perm = await fh.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') return false;
      const w = await fh.createWritable();
      await w.write(contenido);
      await w.close();
      return true;
    } catch (e) {
      if (e && e.name === 'AbortError') return false;
      console.error(e);
      return false;
    }
  },

  // Guarda en el fichero de trabajo y lo SOBRESCRIBE. No crea backups nuevos:
  // eso es lo que hace «Exportar backup» (explícito, en Configuración).
  async guardar() {
    const contenido = JSON.stringify(this.db, null, 2);
    const nombre = this.nombreFichero || 'evalcrit.json';
    // En file:// el SELECTOR de fichero no se abre y la espera se cuelga: el
    // botón parecería no hacer nada (R-03). El manejador recordado y la carpeta
    // elegida siguen siendo la vía de sobrescribir; sin ellos, descarga.
    const esFile = typeof location !== 'undefined' && location.protocol === 'file:';
    // 1. Manejador recordado (misma sesión o IndexedDB tras recargar).
    const fh = this.ficheroHandle || await this.idbLeer('fileHandle');
    if (fh && await this.escribeHandle(fh, contenido)) {
      this.marcarCopia();
      UI.toast('Guardado en «' + fh.name + '»');
      return true;
    }
    // 2. Carpeta de backups: siempre el mismo «evalcrit.json».
    if (this.puedeCarpeta()) {
      let dir = await this.idbLeer('dir');
      if (!dir) dir = await this.elegirCarpetaBackup();
      if (dir) {
        let perm = 'granted';
        if (dir.queryPermission) perm = await dir.queryPermission({ mode: 'readwrite' });
        if (perm !== 'granted' && dir.requestPermission) perm = await dir.requestPermission({ mode: 'readwrite' });
        if (perm === 'granted') {
          try {
            const fh2 = await dir.getFileHandle('evalcrit.json', { create: true });
            const w = await fh2.createWritable();
            await w.write(contenido);
            await w.close();
            this.marcarCopia();
            UI.toast('Guardado en «' + dir.name + '/evalcrit.json»');
            return true;
          } catch (e) {
            if (e && e.name === 'AbortError') return false;
            console.error(e);
          }
        }
      }
    }
    // 3. Selector de fichero con nombre estable (Chrome/Edge). Solo fuera de
    // file://: en fichero local no abre el selector y la espera se cuelga.
    if (!esFile && typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function') {
      try {
        const fh3 = await window.showSaveFilePicker({
          suggestedName: nombre,
          types: [{ description: 'Copia Evalora (JSON)', accept: { 'application/json': ['.json'] } }]
        });
        this.ficheroHandle = fh3;
        await this.idbEscribir('fileHandle', fh3);
        if (await this.escribeHandle(fh3, contenido)) {
          this.marcarCopia();
          UI.toast('Guardado en «' + fh3.name + '»');
          return true;
        }
      } catch (e) {
        if (e && e.name === 'AbortError') return false;
        console.error(e);
      }
    }
    // 4. Descarga con nombre estable (funciona en file://).
    return this.descargar(contenido, nombre);
  },

  // Descarga por Blob (universal, file:// incluido) con un nombre estable.
  descargar(contenido, nombre) {
    const blob = new Blob([contenido], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nombre;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { try { a.remove(); } catch (e) {} URL.revokeObjectURL(url); }, 1000);
    this.marcarCopia();
    UI.toast('Copia en Descargas (' + nombre + '): pásala a la carpeta backups/ del proyecto');
    return true;
  },

  async exportar() {
    const contenido = JSON.stringify(this.db, null, 2);
    const nombre = `backup-${Utils.fechaLegible()}-${Utils.horaCorta()}.json`;
    // En file:// el API de acceso al sistema de ficheros (showSaveFilePicker) NO
    // funciona: no abre el selector nativo y el fallback Blob puede no disparar la
    // descarga. Detectamos el protocolo para saltarnos ese camino por completo y
    // usar solo la descarga por Blob, que funciona en cualquier origen.
    const esFile = typeof location !== 'undefined' && location.protocol === 'file:';
    let destino = '';
    try {
      if (!esFile) {
        const dir = await this.idbLeer('dir');
        if (dir) {
          let perm = 'granted';
          if (dir.queryPermission) perm = await dir.queryPermission({ mode: 'readwrite' });
          if (perm !== 'granted' && dir.requestPermission) {
            perm = await dir.requestPermission({ mode: 'readwrite' });
          }
          if (perm === 'granted') {
            const fh = await dir.getFileHandle(nombre, { create: true });
            const w = await fh.createWritable();
            await w.write(contenido);
            await w.close();
            destino = `la carpeta «${dir.name}»`;
          }
        }
        if (!destino && typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function') {
          const fh = await window.showSaveFilePicker({
            suggestedName: nombre,
            types: [{ description: 'Backup Evalora (JSON)', accept: { 'application/json': ['.json'] } }]
          });
          const w = await fh.createWritable();
          await w.write(contenido);
          await w.close();
          destino = `«${fh.name}»`;
        }
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return false;
      console.error('exportar (FSA):', e);
    }
    if (!destino) {
      // Fallback universal: descarga por Blob. En file:// (Opera, Chrome...) este
      // es el unico camino que funciona sin servidor.
      return this.descargar(contenido, nombre);
    }
    this.marcarCopia();
    UI.toast(`Backup guardado en ${destino}`);
    return true;
  },

  importar(archivo) {
    return new Promise((resolve, reject) => {
      const lector = new FileReader();
      lector.onload = () => {
        try {
          const datos = JSON.parse(lector.result);
          if (!datos || datos.schemaVersion !== 1 || !Array.isArray(datos.grupos) || !Array.isArray(datos.alumnos)) {
            throw new Error('Formato no válido');
          }
          // Antes de reemplazar nada, guarda el estado actual para poder
          // deshacerlo (solo si había algo que perder).
          const copiada = this.vacio() ? false : this.copiarAntesDeImportar();
          this.db = this.migrar(datos);
          // Recuerda el nombre del fichero cargado: el botón «Guardar» lo
          // sobrescribe en lugar de crear un backup nuevo.
          if (archivo && archivo.name) this.nombreFichero = archivo.name;
          this.save();
          resolve(copiada);
        } catch (e) {
          reject(e);
        }
      };
      lector.onerror = () => reject(new Error('No se pudo leer el archivo'));
      lector.readAsText(archivo);
    });
  },

  migrar(datos) {
    const d = this.defaults();
    const db = datos && typeof datos === 'object' ? datos : {};
    db.schemaVersion = 1;
    for (const k of Object.keys(d)) {
      if (db[k] == null) db[k] = d[k];
    }
    // Ajustes (D-74b): `configuracion` debe ser un objeto y `sinNotaEsCero` un
    // booleano. Un backup antiguo puede traer la clave ausente o con otro tipo
    // (p. ej. "true" de un volcado a mano): en ese caso manda el defecto false.
    if (!db.configuracion || typeof db.configuracion !== 'object') db.configuracion = {};
    if (typeof db.configuracion.sinNotaEsCero !== 'boolean') db.configuracion.sinNotaEsCero = false;
    if (!db.meta || typeof db.meta !== 'object') db.meta = { ultimaExportacion: null };
    if (db.meta.cambiosSinCopia == null) db.meta.cambiosSinCopia = false;
    if (db.observaciones == null) db.observaciones = {};
    if (db.coloresUd == null || typeof db.coloresUd !== 'object') db.coloresUd = {};
    if (db.tema == null || typeof db.tema !== 'object') db.tema = { color: '#1f5c6b', nav: 'topbar' };
    if (typeof db.tema.color !== 'string' || !/^#[0-9a-fA-F]{6}$/.test(db.tema.color)) db.tema.color = '#1f5c6b';
    if (typeof db.tema.nav !== 'string') db.tema.nav = 'topbar';
    db.grupos.forEach(g => { if (g.etapa == null) g.etapa = ''; });
    // La asignatura recuerda de qué curso es su currículo (p. ej. «6º») y su
    // fuente legal (la cita del decreto). Backups antiguos no los traen.
    db.asignaturas.forEach(a => {
      if (a.curso == null) a.curso = '';
      if (a.fuente == null) a.fuente = '';
      // El area es de que asignatura del decreto sale, y va APARTE del nombre
      // visible: asi el desplegable agrupa por area aunque el docente renombre
      // la asignatura (o le ponga «Ingles 3º»). Backups antiguos no la traen, y
      // no se puede derivar del nombre sin ambiguedad («Conocimiento del Medio
      // Natural, Social y Cultural 5º»), asi que se migra a vacio y el
      // desplegable cae en «Otras asignaturas». Las creadas a partir de ahora
      // si la llevan.
      if (a.area == null) a.area = '';
    });
    // Códigos de nivel ACI y asignaciones de alumnado: se guardan siempre
    // normalizados (sin espacios, en mayúsculas) para que un «b» tecleado por
    // el docente no deje al alumnado fuera de su nivel (y de todas las vistas).
    const normNivel = v => String(v == null ? '' : v).trim().toUpperCase();
    db.clases.forEach(c => {
      if (!Array.isArray(c.nivelesAci)) c.nivelesAci = [];
      c.nivelesAci = c.nivelesAci
        .map(n => Object.assign({}, n, { codigo: normNivel(n.codigo) }))
        .filter(n => n.codigo);
      if (!c.adaptaciones || typeof c.adaptaciones !== 'object') c.adaptaciones = {};
      const adap = {};
      Object.keys(c.adaptaciones).forEach(k => {
        const v = normNivel(c.adaptaciones[k]);
        if (v && v !== 'BASE') adap[k] = v;
      });
      c.adaptaciones = adap;
    });
    db.criterios.forEach(c => { if (!Array.isArray(c.claveIds)) c.claveIds = []; });
    db.instrumentos.forEach(i => {
      if (i.nivel == null) i.nivel = '';
      i.nivel = normNivel(i.nivel); // '' = común, 'BASE' = solo base, resto = nivel
      if (i.unidad == null) i.unidad = '';
      if (!Array.isArray(i.apartados)) i.apartados = [];
      if (!Array.isArray(i.niveles)) i.niveles = [];
      if (i.criteriosModo == null) i.criteriosModo = 'desglosado';
      if (!Array.isArray(i.criterioIdsGlobal)) i.criterioIdsGlobal = [];
      i.apartados.forEach(ap => {
        if (ap.peso == null || isNaN(ap.peso)) {
          ap.peso = (i.tipo === 'Rúbrica') ? 1 : (ap.maxPts || 1);
        }
        if (!Array.isArray(ap.criterioIds)) ap.criterioIds = [];
        if (!Array.isArray(ap.niveles)) ap.niveles = [];
        if (ap.saberes == null) ap.saberes = '';
      });
    });
    // Las rúbricas antiguas guardaban los descriptores en la escala común del
    // instrumento y dejaban los ítems vacíos (heredaban). Ahora cada ítem lleva
    // los suyos: se materializan antes de que queden sin escala.
    db.instrumentos.forEach(i => {
      if (i.tipo !== 'Rúbrica') return;
      const comunes = (Array.isArray(i.niveles) ? i.niveles : []).map(n => ({ pct: n.pct, descriptor: n.descriptor }));
      if (!comunes.length) return;
      i.apartados.forEach(ap => {
        if (!(Array.isArray(ap.niveles) && ap.niveles.length)) {
          ap.niveles = comunes.map(n => ({ pct: n.pct, descriptor: n.descriptor }));
        }
      });
    });
    // Moldes guardados en el banco: se sanean al cargar para que un backup
    // antiguo (o editado a mano) no rompa la vista del banco.
    if (!Array.isArray(db.bancoInstrumentos)) db.bancoInstrumentos = [];
