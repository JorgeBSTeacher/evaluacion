    if (!logros.length) return null;
    return logros.reduce((a, b) => a + b, 0) / logros.length;
  },

  logroCriterio(criterioId, claseId, alumnoId, periodo) {
    return this.logroCriterioEnInsts(criterioId, claseId, alumnoId,
      this.instrumentosDeClase(claseId, periodo));
  },

  notaPonderada(claseId, alumnoId, periodo, filtroCriterios) {
    const todos = this.criteriosDeAlumno(claseId, alumnoId);
    const criterios = filtroCriterios ? todos.filter(filtroCriterios) : todos;
    let suma = 0, pesos = 0;
    for (const c of criterios) {
      const l = this.logroCriterio(c.id, claseId, alumnoId, periodo);
      if (l == null) continue;
      suma += l * c.peso;
      pesos += c.peso;
    }
    if (pesos <= 0) return null;
    return (suma / pesos) * 10;
  },

  notaEvaluacion(claseId, alumnoId, periodo) {
    return this.notaPonderada(claseId, alumnoId, periodo, null);
  },

  notaCompetencia(claseId, alumnoId, espId, periodo) {
    return this.notaPonderada(claseId, alumnoId, periodo, c => c.espIds.includes(espId));
  },

  notaClave(claseId, alumnoId, claveId, periodo) {
    return this.notaPonderada(claseId, alumnoId, periodo, c => (c.claveIds || []).includes(claveId));
  },

  notaInstrumento(inst, alumnoId) {
    const reg = (Storage.db.registros[inst.id] || {})[alumnoId] || {};
    const esRubrica = inst.tipo === 'Rúbrica';
    if (esRubrica) {
      let suma = 0, pesos = 0;
      for (const ap of inst.apartados) {
        const v = reg[ap.id];
        if (v == null || isNaN(v)) continue;
        const niveles = this.nivelesDeApartado(inst, ap);
        const nv = niveles.find(n => Math.abs(Number(v) - Number(n.pct)) < 1e-9);
        const pct = nv ? Number(nv.pct) : Number(v);
        const p = ap.peso == null || isNaN(ap.peso) ? 1 : Number(ap.peso);
        suma += (pct / 100) * p;
        pesos += p;
      }
      if (pesos <= 0) return null;
      return (suma / pesos) * 10;
    }
    let obt = 0, max = 0;
    for (const ap of inst.apartados) {
      const v = reg[ap.id];
      max += ap.maxPts;
      if (v != null && !isNaN(v)) obt += Number(v);
    }
    return max > 0 ? (obt / max) * 10 : null;
  },

  // === Análisis para la pestaña Informe (D-59) ===
  // Solo lectura sobre datos existentes. No modifican db ni Storage.

  // Instrumentos de una clase filtrados por alcance.
  // `filtros` = { periodo, unidad, instrumentoId } — todos opcionales.
  instrumentosAlcance(claseId, filtros) {
    const f = filtros || {};
    let insts = this.instrumentosDeClase(claseId, f.periodo);
    if (f.unidad) insts = insts.filter(i => i.unidad === f.unidad);
    if (f.instrumentoId) insts = insts.filter(i => i.id === f.instrumentoId);
    return insts;
  },

  // Media de la clase para un criterio en un alcance. Devuelve 0–1 o null.
  mediaClaseCriterio(criterioId, claseId, insts) {
    const alumnos = this.alumnosDeClase(claseId);
    const valores = alumnos
      .map(a => this.logroCriterioEnInsts(criterioId, claseId, a.id, insts))
      .filter(v => v != null);
    if (!valores.length) return null;
    return valores.reduce((s, v) => s + v, 0) / valores.length;
  },

  // Nota global (0–10) de un alumno en un alcance de instrumentos.
  notaEnInsts(claseId, alumnoId, insts) {
    const criterios = this.criteriosDeAlumno(claseId, alumnoId);
    let suma = 0, pesos = 0;
    for (const c of criterios) {
      const l = this.logroCriterioEnInsts(c.id, claseId, alumnoId, insts);
      if (l == null) continue;
      suma += l * c.peso;
      pesos += c.peso;
    }
    if (pesos <= 0) return null;
    return (suma / pesos) * 10;
  },

  // Datos para la tabla de criterios (absoluto × relativo) de la pestaña Informe.
  // Para cada criterio: media de la clase y, por alumno, logro + estado absoluto
  // (≥50%) y relativo (≥ media de clase). `criterios` los decide la vista.
  tablaCriteriosInforme(claseId, insts, criterios) {
    const alumnos = this.alumnosDeClase(claseId);
    return (criterios || []).map(c => {
      const media = this.mediaClaseCriterio(c.id, claseId, insts);
      const filas = alumnos.map(a => {
        const logro = this.logroCriterioEnInsts(c.id, claseId, a.id, insts);
        return {
          alumno: a,
          logro,
          absoluto: logro == null ? null : logro >= 0.5,
          relativo: (logro == null || media == null) ? null : logro >= media
        };
      });
      return { criterio: c, media, filas };
    });
  },

  // Reglas de detección para la pestaña Informe. `criterios` los decide la vista
  // (según el nivel ACI seleccionado). Devuelve hallazgos ordenados por
  // severidad: críticos primero, luego atención, por porcentaje descendente.
  hallazgos(claseId, insts, criterios) {
    const alumnos = this.alumnosDeClase(claseId);
    const UMB = { critico: 50, atencion: 30, fallosPregunta: 50 };
    const salida = [];

    // Regla 1: criterios con alto porcentaje de alumnos por debajo del 50%.
    for (const c of criterios || []) {
      const logros = alumnos
        .map(a => this.logroCriterioEnInsts(c.id, claseId, a.id, insts))
        .filter(v => v != null);
      if (logros.length < 2) continue;
      const pct = Math.round(logros.filter(v => v < 0.5).length / logros.length * 100);
      const ref = `«${c.codigo} — ${c.descripcion}»`;
      if (pct >= UMB.critico) {
        salida.push({
          nivel: 'critico', tipo: 'criterio', criterioId: c.id,
          codigo: c.codigo, pct,
          texto: `${pct}% de la clase por debajo del 50% en ${ref}`
        });
      } else if (pct >= UMB.atencion) {
        salida.push({
          nivel: 'atencion', tipo: 'criterio', criterioId: c.id,
          codigo: c.codigo, pct,
          texto: `${pct}% de la clase por debajo del 50% en ${ref}`
        });
      }
    }

    // Regla 2: preguntas (apartados) con alto índice de fallos.
    for (const inst of insts || []) {
      const alumnosAp = this.alumnosDeInstrumento(inst);
      for (const ap of inst.apartados || []) {
        const notas = alumnosAp
          .map(a => ((Storage.db.registros[inst.id] || {})[a.id] || {})[ap.id])
          .filter(v => v != null && v !== '' && !isNaN(v))
          .map(Number);
        if (notas.length < 2) continue;
        const max = inst.tipo === 'Rúbrica' ? 100 : Number(ap.maxPts) || 1;
        const pct = Math.round(notas.filter(v => v / max < 0.5).length / notas.length * 100);
        if (pct >= UMB.fallosPregunta) {
          salida.push({
            nivel: pct >= 80 ? 'critico' : 'atencion', tipo: 'pregunta',
            instrumentoId: inst.id, apartadoId: ap.id,
            titulo: inst.titulo, pregunta: ap.descripcion, pct,
            texto: `«${ap.descripcion}» en ${inst.titulo}: ${pct}% de fallos`
          });
        }
      }
    }

    const orden = { critico: 0, atencion: 1, bien: 2 };
    salida.sort((a, b) => (orden[a.nivel] - orden[b.nivel]) || (b.pct - a.pct));
    return salida;
  },

  // Distribución de notas (0–10) en un alcance. Devuelve buckets para el
  // histograma, la media y las notas sueltas. `nivelCodigo` (opcional) restringe
  // el alumnado: ausente = todo el grupo, '' = base, otro = ese nivel ACI.
  distribucionNotas(claseId, insts, nivelCodigo) {
    let alumnos = this.alumnosDeClase(claseId);
    if (nivelCodigo !== undefined && nivelCodigo !== null) {
      const nv = this.nivelNorm(nivelCodigo);
      alumnos = alumnos.filter(a => this.nivelDeAlumno(claseId, a.id) === nv);
    }
    const notas = alumnos
      .map(a => this.notaEnInsts(claseId, a.id, insts))
      .filter(n => n != null);
    if (!notas.length) return { notas: [], buckets: [], media: null };
    const buckets = Array.from({ length: 10 }, (_, i) => ({
      rango: `${i}–${i + 1}`, cantidad: 0
    }));
    for (const n of notas) {
      buckets[Math.min(9, Math.floor(n))].cantidad++;
    }
    const media = notas.reduce((s, n) => s + n, 0) / notas.length;
    return { notas, buckets, media };
  },

  clasif(n) {
    if (n == null || isNaN(n)) return 'na';
    return n >= 5 ? 'ok' : 'ko';
  },

  badgeHtml(n) {
    return '<span class="badge ' + this.clasif(n) + '">' + Utils.fmt(n) + '</span>';
  }
};

</script>
<script>
// Diálogo accesible: al abrir se lleva el foco dentro, Tab/Shift+Tab quedan
// atrapados en el modal (no se escapan a la página de detrás), Escape equivale a
// «Cancelar» y al cerrar el foco vuelve a quien lo abrió. Sin dependencias: el
// único estado es `elementoFocoPrevio`, para devolver el foco al disparador.
let elementoFocoPrevio = null;

// Elementos que pueden recibir foco dentro del modal, en orden de documento.
// Se evitan selectores compuestos (`:not(...)`, `*`, comas) para que la misma
// función valga en el navegador y en el DOM mínimo del arnés.
// `querySelectorAll` NO devuelve un Array: en el navegador es un `NodeList`, que
// no tiene `.filter`. Hay que convertirlo antes — el arnés sí devuelve un Array,
// así que sin el `Array.from` esto pasaba las comprobaciones y reventaba en el
// navegador con «querySelectorAll(...).filter is not a function».
function focablesEn(raiz) {
  const tags = ['a', 'button', 'input', 'select', 'textarea', 'summary'];
  const sel = tags.join(',') + ',[tabindex]';
  const lista = Array.from(raiz.querySelectorAll(sel)).filter(el => {
    if (el.getAttribute('tabindex') === '-1') return false;
    if (el.hasAttribute('disabled')) return false;
    if (el.tagName === 'INPUT' && el.getAttribute('type') === 'hidden') return false;
    return true;
  });
  return lista;
}

// Mueve el foco dentro del modal; si no hay focables (modal solo informativo),
// enfoca el propio contenedor para que Tab no salte a la página de detrás.
function enfocarModal(raiz) {
  const lista = focablesEn(raiz);
  const primeroAuto = raiz.querySelector('[autofocus]');
  const destino = primeroAuto || lista[0] || raiz.querySelector('.modal');
  if (destino && typeof destino.focus === 'function') destino.focus();
}

const UI = {
  openModal({ titulo, cuerpo, textoGuardar, alGuardar, peligro }) {
    const root = document.getElementById('modal-root');
    elementoFocoPrevio = (document.activeElement && document.activeElement.focus) ? document.activeElement : null;
    const idTitulo = 'modal-titulo';
    root.innerHTML = `
      <div class="velo">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="${idTitulo}" tabindex="-1">
          <div class="modal-head">
            <h3 id="${idTitulo}">${Utils.esc(titulo)}</h3>
            <button class="icon-btn cerrar" title="Cerrar" aria-label="Cerrar">×</button>
          </div>
          <div class="modal-body"></div>
          <div class="modal-foot">
            ${alGuardar ? '<button class="btn cancelar">Cancelar</button><button class="btn btn-primario guardar">' + Utils.esc(textoGuardar || 'Guardar') + '</button>' : '<button class="btn cancelar">Cerrar</button>'}
          </div>
        </div>
      </div>`;
    const body = root.querySelector('.modal-body');
    body.innerHTML = cuerpo;
    const cerrar = () => { UI.closeModal(); };
    root.querySelector('.cerrar').onclick = cerrar;
    root.querySelector('.cancelar').onclick = cerrar;
    if (alGuardar) {
      const btn = root.querySelector('.guardar');
      if (peligro) btn.classList.add('btn-peligro');
      btn.onclick = () => {
        if (alGuardar(body, cerrar) !== false) {
          cerrar();
          if (typeof App !== 'undefined' && App.refrescar) App.refrescar();
        }
      };
    }
    // Trampa de foco y Escape. El listener vive en `root`, que se vacía al
    // cerrar, así que no se acumula entre modales. Escape cierra por el mismo
    // camino que «Cancelar»: nunca ejecuta `alGuardar`.
    root.onkeydown = ev => {
      if (ev.key === 'Escape') { ev.preventDefault(); cerrar(); return; }
      if (ev.key !== 'Tab') return;
      const lista = focablesEn(root);
      if (!lista.length) { ev.preventDefault(); const m = root.querySelector('.modal'); if (m) m.focus(); return; }
      const primero = lista[0];
      const ultimo = lista[lista.length - 1];
      if (ev.shiftKey && document.activeElement === primero) { ev.preventDefault(); ultimo.focus(); }
      else if (!ev.shiftKey && document.activeElement === ultimo) { ev.preventDefault(); primero.focus(); }
    };
    enfocarModal(root);
    return body;
  },

  closeModal() {
    document.getElementById('modal-root').innerHTML = '';
    document.getElementById('modal-root').onkeydown = null;
    // Devolver el foco al disparador, si sigue vivo (un repintado pudo
    // sustituirlo). `isConnected` evita enfocar un nodo huérfano.
    const previo = elementoFocoPrevio;
    elementoFocoPrevio = null;
    if (previo && typeof previo.focus === 'function' && previo.isConnected !== false) previo.focus();
  },

  // Aviso efímero. `tipo: 'error'` se anuncia de forma imperiosa (`role="alert"`,
  // que implica `aria-live="assertive"`), porque interrumpe al lector a propósito:
  // solo se usa para fallos que exigen atención inmediata. El resto son informes
  // (`role="status"`, que implica `aria-live="polite"`: no interrumpen). El rol va
  // en el propio aviso, no en el contenedor, para no solapar regiones vivas.
  toast(msg, tipo) {
    const root = document.getElementById('toast-root');
    const t = document.createElement('div');
    t.className = 'toast' + (tipo === 'error' ? ' toast-error' : '');
    t.setAttribute('role', tipo === 'error' ? 'alert' : 'status');
    t.textContent = msg;
    root.appendChild(t);
    setTimeout(() => t.remove(), tipo === 'error' ? 6000 : 2600);
  },

  chipsCriterios(asignaturaId, seleccionados) {
    const lista = Storage.db.criterios
      .filter(c => c.asignaturaId === asignaturaId)
      .sort((a, b) => String(a.codigo).localeCompare(String(b.codigo), 'es'));
    if (!lista.length) return '<div class="aviso">Primero crea criterios en la sección Currículo.</div>';
    return `<div class="chips" data-campo="criterios">` + lista.map(c => {
      const on = (seleccionados || []).includes(c.id);
      return `<label class="chip ${on ? 'on' : ''}"><input type="checkbox" value="${c.id}" ${on ? 'checked' : ''}>${Utils.esc(c.codigo)} · ${Utils.esc(c.descripcion)}</label>`;
    }).join('') + '</div>';
  },

  wireChips(container) {
    container.querySelectorAll('.chip input').forEach(inp => {
      inp.addEventListener('change', () => {
        inp.closest('.chip').classList.toggle('on', inp.checked);
      });
    });
  },

  valoresChips(container) {
    return Array.from(container.querySelectorAll('input:checked')).map(i => i.value);
  },

  selectHtml(lista, valorActual, campoId, campoNombre) {
    return lista.map(x =>
      `<option value="${x[campoId]}" ${x[campoId] === valorActual ? 'selected' : ''}>${Utils.esc(x[campoNombre])}</option>`
    ).join('');
  }
};

</script>
<script>
const AlumnosView = (() => {
  let grupoSel = null;

  const nombreGrupo = () => {
    const g = Calc.byId(Storage.db.grupos, grupoSel);
    return g ? g.nombre : '';
  };

  const alumnosDe = gid => Storage.db.alumnos
    .filter(a => a.grupoId === gid)
    .sort((x, y) => (x.apellidos + x.nombre).localeCompare(y.apellidos + y.nombre, 'es'));

  function modalGrupo(g) {
    UI.openModal({
      titulo: g ? 'Editar grupo' : 'Nuevo grupo',
      cuerpo: `
        <label class="campo"><span>Nombre del grupo</span>
          <input type="text" id="f-nombre" value="${Utils.esc(g ? g.nombre : '')}" placeholder="Ej. 3ºA"></label>
        <label class="campo"><span>Etapa</span>
          <select id="f-etapa">
            <option ${g && g.etapa === 'Primaria' ? 'selected' : ''}>Primaria</option>
            <option ${g && g.etapa === 'Infantil' ? 'selected' : ''}>Infantil</option>
          </select></label>`,
      alGuardar(body) {
        const guardado = Storage.guardarGrupo({
          nombre: body.querySelector('#f-nombre').value,
          etapa: body.querySelector('#f-etapa').value
        }, g ? g.id : null);
        if (!guardado) return false;
        if (!g) grupoSel = guardado.id;
      }
    });
  }

  function modalAlumno(a) {
    const grupos = Storage.db.grupos;
    const grupoId = a ? a.grupoId : grupoSel;
    // El grupo solo se puede cambiar si hay más de uno; con un único grupo no
    // tiene sentido pedirlo.
    const varios = grupos.length > 1;
    UI.openModal({
      titulo: a ? 'Editar alumno' : 'Nuevo alumno en ' + nombreGrupo(),
      cuerpo: `
        <label class="campo"><span>Nombre</span><input type="text" id="f-nombre" placeholder="Nombre" value="${Utils.esc(a ? a.nombre : '')}"></label>
        <label class="campo"><span>Apellidos</span><input type="text" id="f-apellidos" placeholder="Apellidos" value="${Utils.esc(a ? a.apellidos : '')}"></label>
        ${varios ? `<label class="campo"><span>Grupo</span><select id="f-grupo">${UI.selectHtml(grupos, grupoId, 'id', 'nombre')}</select></label>` : ''}`,
      alGuardar(body) {
        const sel = body.querySelector('#f-grupo');
        const guardado = Storage.guardarAlumno({
          nombre: body.querySelector('#f-nombre').value,
          apellidos: body.querySelector('#f-apellidos').value,
          grupoId: sel ? sel.value : grupoId
        }, a ? a.id : null);
        return guardado !== null;
      }
    });
  }

  function modalAlumnosVarios() {
    UI.openModal({
      titulo: 'Añadir varios alumnos a ' + nombreGrupo(),
      cuerpo: `
        <label class="campo"><span>Un alumno por línea</span>
          <textarea id="f-lista" rows="10" placeholder="García Pérez, José Luis&#10;Martínez Ruiz, Ana"></textarea></label>
        <div class="aviso">Escribe <b>Apellidos, Nombre</b> (con coma). Si una línea no lleva coma, se toma entera como <b>nombre</b>. Se ignoran las líneas vacías y los alumnos que ya estén en el grupo.</div>`,
      textoGuardar: 'Añadir',
      alGuardar(body) {
        const r = Storage.guardarAlumnosDesdeTexto(grupoSel, body.querySelector('#f-lista').value);
        if (!r.creados) {
          alert(r.duplicados
            ? 'No se añadió ninguno: los ' + r.duplicados + ' ya estaban en el grupo.'
            : 'No se encontró ningún alumno en la lista.');
          return false;
        }
        UI.toast((r.creados === 1 ? 'Añadido 1 alumno' : 'Añadidos ' + r.creados + ' alumnos') +
          (r.duplicados ? ' (' + r.duplicados + ' ya estaban)' : ''));
        return true;
      }
    });
  }

  function render(el) {
    const db = Storage.db;
    el.innerHTML = `
      <div class="grid-2">
        <section class="card">
          <div class="card-head">
            <h2>Grupos</h2>
            <button class="btn btn-primario" id="add-grupo">Nuevo grupo</button>
          </div>
          <ul class="lista" id="lista-grupos">
            ${db.grupos.map(g => `
              <li data-id="${g.id}" class="${g.id === grupoSel ? 'activo' : ''}">
                <span>${Utils.esc(g.nombre)}</span><small>${Utils.esc(g.etapa)}</small>
                <button class="btn btn-mini editar-grupo" data-id="${g.id}">Editar</button>
                <button class="icon-btn borrar-grupo" data-id="${g.id}" title="Eliminar grupo">×</button>
              </li>`).join('') || '<li class="vacio">Sin grupos todavía. Crea el primero.</li>'}
          </ul>
        </section>
        <section class="card">
          <div class="card-head">
            <h2>Alumnos${grupoSel ? ' · ' + Utils.esc(nombreGrupo()) : ''}</h2>
            <div class="acciones">
              <button class="btn" id="add-varios" ${grupoSel ? '' : 'disabled'}>Añadir varios</button>
              <button class="btn btn-primario" id="add-alumno" ${grupoSel ? '' : 'disabled'}>Nuevo alumno</button>
            </div>
          </div>
          <table class="tabla">
            <thead><tr><th>Apellidos</th><th>Nombre</th><th></th></tr></thead>
            <tbody>
              ${grupoSel ? alumnosDe(grupoSel).map(a => `
                <tr>
                  <td>${Utils.esc(a.apellidos)}</td>
                  <td>${Utils.esc(a.nombre)}</td>
                  <td>
                    <div class="acciones">
                      <button class="btn btn-mini editar-alumno" data-id="${a.id}">Editar</button>
                      <button class="icon-btn borrar-alumno" data-id="${a.id}" title="Eliminar">×</button>
                    </div></td>
                </tr>`).join('') || '<tr><td colspan="3" class="vacio">Este grupo no tiene alumnos aún.</td></tr>'
                : '<tr><td colspan="3" class="vacio">Selecciona un grupo para ver sus alumnos.</td></tr>'}
            </tbody>
          </table>
        </section>
      </div>`;

    el.querySelector('#add-grupo').onclick = () => modalGrupo(null);
    el.querySelector('#add-alumno').onclick = () => modalAlumno(null);
    el.querySelector('#add-varios').onclick = () => modalAlumnosVarios();
    el.querySelectorAll('#lista-grupos li[data-id]').forEach(li => {
      li.addEventListener('click', e => {
        if (e.target.closest('.borrar-grupo') || e.target.closest('.editar-grupo')) return;
        grupoSel = li.dataset.id;
        render(el);
      });
    });
    el.querySelectorAll('.editar-grupo').forEach(b => {
      b.onclick = e => {
        e.stopPropagation();
        modalGrupo(Calc.byId(db.grupos, b.dataset.id));
      };
    });
    el.querySelectorAll('.editar-alumno').forEach(b => {
      b.onclick = () => modalAlumno(Calc.byId(db.alumnos, b.dataset.id));
    });
    el.querySelectorAll('.borrar-grupo').forEach(b => {
      b.onclick = e => {
        e.stopPropagation();
        const id = b.dataset.id;
        const nAlu = db.alumnos.filter(a => a.grupoId === id).length;
        const extra = nAlu ? ` También se eliminarán ${nAlu} alumno(s).` : '';
        if (confirm('¿Eliminar este grupo?' + extra)) {
          Storage.borrarGrupo(id);
          if (grupoSel === id) grupoSel = null;
          render(el);
        }
      };
    });
    el.querySelectorAll('.borrar-alumno').forEach(b => {
      b.onclick = () => {
        if (confirm('¿Eliminar este alumno y todas sus notas?')) {
          Storage.borrarAlumno(b.dataset.id);
          render(el);
        }
      };
    });
  }

  return { render };
})();

</script>
<script>
const ClasesView = (() => {
  const ORDEN_CURSOS = ['1º', '2º', '3º', '4º', '5º', '6º'];

  // Las plantillas oficiales embebidas (una por área y ciclo) son la única
  // fuente de currículo. La asignatura se ancla a un curso concreto.
  function plantillasOficiales() {
    return (typeof PLANTILLAS_CURRICULO !== 'undefined' && Array.isArray(PLANTILLAS_CURRICULO))
      ? PLANTILLAS_CURRICULO : [];
  }

  function areasOficiales() {
    return [...new Set(plantillasOficiales().map(p => (p.asignatura || {}).nombre).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, 'es'));
  }

  function cursosDeArea(area) {
    const set = new Set();
    plantillasOficiales()
      .filter(p => (p.asignatura || {}).nombre === area)
      .forEach(p => ((p.asignatura || {}).cursos || []).forEach(c => set.add(String(c))));
    return [...set].sort((a, b) => {
      const ia = ORDEN_CURSOS.indexOf(a), ib = ORDEN_CURSOS.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
  }

  function plantillaDe(area, curso) {
    return plantillasOficiales().find(p =>
      (p.asignatura || {}).nombre === area &&
      ((p.asignatura || {}).cursos || []).map(String).includes(String(curso)));
  }

  // Área del decreto de una asignatura. Es lo que permite ofrecer, en los
  // niveles ACI, solo currículos de la MISMA área que la clase: una clase de
  // Matemáticas no debe poder apuntar a un currículo de Lengua.
  //
  // El campo `asignatura.area` solo lo llevan las asignaturas creadas desde el
  // alta oficial (641585d); las anteriores lo tienen vacío, así que NO se puede
  // usar como única fuente. Se deduce EN EL MOMENTO del prefijo de los códigos
  // de criterio («MAT 1.1» → «Matemáticas»), que es el dato vivo: si el
  // currículo cambia o se recupera después, el área se recalcula sola. No se
  // escribe nada, así que no hay migración ni botón de rescate.
  //
  // Los prefijos salen de tools/extract-decreto.py (AREAS) y las 19 plantillas
  // los cumplen sin colisión.
  const AREA_POR_PREFIJO = {
    CMNSC: 'Conocimiento del Medio Natural, Social y Cultural',
    EART: 'Educación Artística',
    EFIS: 'Educación Física',
    EVCE: 'Educación en Valores Cívicos y Éticos',
    LCL: 'Lengua Castellana y Literatura',
    LEXT: 'Lengua Extranjera',
    MAT: 'Matemáticas'
  };

  function areaDeAsignatura(asig) {
    if (!asig) return '';
    // El campo guardado manda cuando existe (asignaturas creadas desde 641585d).
    if (asig.area) return asig.area;
    const criterios = Storage.db.criterios.filter(c => c.asignaturaId === asig.id);
    for (const c of criterios) {
      const pref = String(c.codigo || '').trim().split(/[\s.]+/)[0].toUpperCase();
      if (AREA_POR_PREFIJO[pref]) return AREA_POR_PREFIJO[pref];
    }
    // Sin currículo no hay prefijo: es una asignatura hecha a mano, sin área.
    return '';
  }

  // Solo dos áreas del decreto se desdoblan en la práctica, y el currículo es el
  // mismo en las dos: Lengua Extranjera (Inglés o Francés) y Educación Artística
  // (Plástica o Música). Son ETIQUETAS del nombre visible, no áreas distintas.
  const VARIANTES = {
    'Lengua Extranjera': ['Inglés', 'Francés'],
    'Educación Artística': ['Plástica', 'Música']
  };

  // Alta de asignatura. Sin argumentos deja elegir entre recuperar el currículo
  // oficial de un curso o crearla en blanco. Si recibe una asignatura existente
  // (creada a mano), solo ofrece recuperar el currículo sobre ella.
  function modalAsignatura(asigExistente) {
    const recuperar = asigExistente || null;
    const areas = areasOficiales();
    const hayOficiales = areas.length > 0;
    const cuerpo = `
      ${recuperar ? '' : `<label class="campo"><span>Origen del currículo</span>
        <select id="f-modo">
          ${hayOficiales ? '<option value="oficial">Currículo oficial (plantillas del decreto)</option>' : ''}
          <option value="blanco"${hayOficiales ? '' : ' selected'}>En blanco (añadiré los criterios a mano)</option>
        </select></label>`}
      <div id="bloque-oficial">
        <label class="campo"><span>Área / asignatura</span>
          <select id="f-area">${areas.map(a => `<option>${Utils.esc(a)}</option>`).join('')}</select></label>
        <label class="campo" id="campo-variante"><span>Variante</span>
          <select id="f-variante"></select></label>
        <label class="campo"><span>Curso</span>
          <select id="f-curso"></select></label>
        <div class="aviso" id="f-resumen"></div>
        <div class="aviso">
          La asignatura se llamará <b>como en el Decreto 66/2022</b>. Si necesitas otro
          nombre (por ejemplo porque das Plástica y Música por separado), cámbialo después
          en <b>Editar asignatura</b>: el currículo y las notas no se tocan.
        </div>
      </div>
      <div id="bloque-blanco">
        <label class="campo"><span>Nombre</span>
          <input type="text" id="f-nombre" placeholder="Ej. Taller de ajedrez"></label>
        <label class="campo"><span>Etapa</span>
          <select id="f-etapa"><option>Primaria</option><option>Infantil</option></select></label>
      </div>`;

    const mbody = UI.openModal({
      titulo: recuperar ? 'Recuperar currículo oficial' : 'Nueva asignatura / área',
      textoGuardar: 'Guardar',
      cuerpo,
      alGuardar(body) {
        const modo = recuperar ? 'oficial' : ((body.querySelector('#f-modo') || {}).value || 'blanco');
        if (modo === 'oficial') {
          const area = body.querySelector('#f-area').value;
          const curso = body.querySelector('#f-curso').value;
          const variante = body.querySelector('#f-variante');
          const etiqueta = variante && variante.value ? variante.value : '';
          const pl = plantillaDe(area, curso);
          if (!pl) { alert(`No hay currículo oficial para «${area}» en ${curso}.`); return false; }
          try {
            const r = Storage.importarCurriculo(pl, {
              cursos: [curso],
              etiqueta,
              asignaturaId: recuperar ? recuperar.id : null
            });
            UI.toast('Currículo cargado: ' + r.asignaturas.join(', '));
          } catch (e) {
            alert(e.message);
            return false;
          }
          return;
        }
        const nombre = body.querySelector('#f-nombre').value.trim();
        if (!nombre) { alert('Escribe un nombre para la asignatura.'); return false; }
        Storage.guardarAsignatura({ nombre, etapa: body.querySelector('#f-etapa').value });
      }
    });

    const selModo = mbody.querySelector('#f-modo');
    const selArea = mbody.querySelector('#f-area');
    const selVariante = mbody.querySelector('#f-variante');
    const campoVariante = mbody.querySelector('#campo-variante');
    const selCurso = mbody.querySelector('#f-curso');
    const bloqueOficial = mbody.querySelector('#bloque-oficial');
    const bloqueBlanco = mbody.querySelector('#bloque-blanco');
    const resumen = mbody.querySelector('#f-resumen');

    function pintaResumen() {
      const pl = plantillaDe(selArea.value, selCurso.value);
      const nombreVisible = nombreElegido();
      resumen.innerHTML = pl
        ? `Se creará <b>${Utils.esc(nombreVisible)}</b> con `
          + `${(pl.competenciasEspecificas || []).length} competencias y ${(pl.criterios || []).length} criterios`
          + `${pl.asignatura.ciclo ? ' (' + Utils.esc(pl.asignatura.ciclo) + ')' : ''}.`
        : 'No hay currículo oficial para esa combinación.';
    }
    // Nombre visible de la asignatura que se va a crear: «área + curso», o
    // «variante + curso» en las áreas que se desdoblan.
    function nombreElegido() {
      const base = (selVariante && selVariante.value) ? selVariante.value : selArea.value;
      return selCurso.value ? `${base} ${selCurso.value}` : base;
    }
    function pintaVariante() {
      const variantes = VARIANTES[selArea.value] || [];
      campoVariante.style.display = variantes.length ? '' : 'none';
      selVariante.innerHTML = variantes.map(v => `<option>${Utils.esc(v)}</option>`).join('');
    }
    function pintaCursos() {
      selCurso.innerHTML = cursosDeArea(selArea.value).map(c => `<option>${Utils.esc(c)}</option>`).join('');
      pintaResumen();
    }
    function pintaModo() {
      const oficial = !selModo || selModo.value === 'oficial';
      bloqueOficial.style.display = oficial ? '' : 'none';
      bloqueBlanco.style.display = oficial ? 'none' : '';
    }
    function alCambiarArea() {
      pintaVariante();
      pintaCursos();
    }
    if (selArea) selArea.onchange = alCambiarArea;
    if (selVariante) selVariante.onchange = pintaResumen;
    if (selCurso) selCurso.onchange = pintaResumen;
    if (recuperar) {
      bloqueBlanco.style.display = 'none';
      const area = areas.find(a => (recuperar.area || recuperar.nombre).toLowerCase().indexOf(a.toLowerCase()) === 0);
      if (area) selArea.value = area;
      pintaVariante();
      pintaCursos();
      if (recuperar.curso && Array.from(selCurso.options).some(o => o.value === recuperar.curso)) {
        selCurso.value = recuperar.curso;
      }
      // Si la asignatura ya lleva la etiqueta en el nombre («Inglés 3º»),
      // preselecciona su variante para no renombrarla sin querer.
      const varianteActual = selVariante && Array.from(selVariante.options)
        .find(o => new RegExp('^' + o.value + '\\b', 'i').test(String(recuperar.nombre || '')));
      if (varianteActual) selVariante.value = varianteActual.value;
      pintaResumen();
    } else if (selModo) {
      selModo.onchange = pintaModo;
      pintaModo();
      pintaVariante();
      // El desplegable de curso se rellena al elegir área, pero si el docente
      // abre el modal y va directo a Guardar sin tocar nada, quedaría vacío y
      // el alta oficial fallaría con «No hay currículo» sin motivo. Se puebla
      // ya con el área preseleccionada.
      pintaCursos();
    }
  }

  // Edición de una asignatura ya creada: nombre, nivel (curso) y etapa. Son
  // ETIQUETAS: el currículo va ligado al id de la asignatura, así que desde
  // aquí no se toca NUNCA ni el currículo ni las notas. La regla del docente:
  // «si es Lengua, es Lengua» — se corrige una errata («Legua» → «Lengua»),
  // no se cambia la sustancia.
  function modalAsignaturaEditar(a) {
    UI.openModal({
      titulo: 'Editar asignatura',
      cuerpo: `
        <datalist id="lista-cursos">${ORDEN_CURSOS.map(c => `<option value="${c}"></option>`).join('')}</datalist>
        <label class="campo"><span>Nombre</span>
          <input type="text" id="f-nombre" value="${Utils.esc(a.nombre)}" placeholder="Ej. Matemáticas 6º"></label>
        <label class="campo"><span>Nivel (curso)</span>
          <input type="text" id="f-curso" list="lista-cursos" value="${Utils.esc(a.curso || '')}" placeholder="Ej. 6º"></label>
        <label class="campo"><span>Etapa</span>
          <select id="f-etapa">
            <option ${a.etapa === 'Primaria' ? 'selected' : ''}>Primaria</option>
            <option ${a.etapa === 'Infantil' ? 'selected' : ''}>Infantil</option>
          </select></label>
        <div class="aviso">Cambiar el nombre o el nivel solo cambia cómo se <b>muestra</b> la asignatura. Su <b>currículo</b> y sus <b>notas</b> no se tocan.</div>`,
      alGuardar(body) {
        const guardada = Storage.guardarAsignatura({
          nombre: body.querySelector('#f-nombre').value,
          curso: body.querySelector('#f-curso').value,
          etapa: body.querySelector('#f-etapa').value
        }, a.id);
        if (!guardada) { alert('Escribe un nombre para la asignatura.'); return false; }
      }
    });
  }

  function modalClase() {
    const db = Storage.db;
    if (!db.asignaturas.length || !db.grupos.length) {
      UI.toast('Necesitas al menos una asignatura y un grupo');
      return;
    }
    UI.openModal({
      titulo: 'Nueva clase',
      cuerpo: `
        <label class="campo"><span>Asignatura</span>
          <select id="f-asig">${UI.selectHtml(db.asignaturas, null, 'id', 'nombre')}</select></label>
        <label class="campo"><span>Grupo</span>
          <select id="f-grupo">${UI.selectHtml(db.grupos, null, 'id', 'nombre')}</select></label>`,
      alGuardar(body) {
        const asignaturaId = body.querySelector('#f-asig').value;
        const grupoId = body.querySelector('#f-grupo').value;
        if (db.clases.some(c => c.asignaturaId === asignaturaId && c.grupoId === grupoId)) {
          alert('Esa clase ya existe');
          return false;
        }
        db.clases.push({ id: Utils.uid(), asignaturaId, grupoId });
        Storage.save();
      }
    });
  }

  function modalAci(clase) {
    const db = Storage.db;
    const alumnos = Calc.alumnosDeClase(clase.id);
    let mbody = null;

    const nivelesActuales = () => Array.from(document.querySelectorAll('.nivel-aci-fila')).map(f => ({
      codigo: (f.querySelector('.nv-cod') || {}).value || '',
      etiqueta: (f.querySelector('.nv-etq') || {}).value || '',
      asignaturaId: (f.querySelector('.nv-asig') || {}).value || ''
    }));

    const opcionesAsig = asignaturaId => '<option value="">— asignatura —</option>'
      + UI.selectHtml(db.asignaturas, asignaturaId, 'id', 'nombre');

    // Currículos que se ofrecen en cada nivel ACI: solo los de la MISMA área que
    // la clase. Una clase de Matemáticas no puede apuntar a Lengua. El área se
    // deduce del currículo de la propia clase (su asignatura base), no del campo
    // guardado, para que funcione también con las asignaturas anteriores.
    //
    // SALVAGUARDA: si el filtro deja la lista VACÍA, la ACI NO se bloquea: se
    // ofrecen todas. «Prefiero una lista larga que un callejón sin salida.»
    // Pasa con las asignaturas hechas a mano (sin área) y con las clases sin
    // currículo propio.
    function otrasDelArea() {
      const areaClase = areaDeAsignatura(Calc.asignaturaDeClase(clase.id));
      if (!areaClase) return null; // sin área: no se puede filtrar
      return db.asignaturas.filter(a => areaDeAsignatura(a) === areaClase);
    }

    function opcionesAsignatura(asignaturaId) {
      const mismas = otrasDelArea();
      if (!mismas || !mismas.length) return opcionesAsig(asignaturaId);
      return '<option value="">— asignatura —</option>'
        + UI.selectHtml(mismas, asignaturaId, 'id', 'nombre');
    }

    // Aviso en gris: la clase tiene área pero NO hay otro currículo de esa área
    // al que apuntar un nivel ACI (solo el suyo propio, o ninguno). Entonces no
    // se puede montar un nivel de otro curso y se dice en gris qué falta, sin
    // bloquear nada. Es el caso en que el docente aún no ha generado el currículo
    // del curso del que viene el alumnado con adaptación.
    function avisoSinCurriculo() {
      const mismas = otrasDelArea();
      if (!mismas) return ''; // sin área no hay nada que reclamar
      const propias = new Set(
        Calc.nivelesAciDeClase(clase.id).map(n => n.asignaturaId).filter(Boolean)
      );
      const candidatas = mismas.filter(a => a.id !== clase.asignaturaId && !propias.has(a.id));
      if (candidatas.length) return '';
      return `<div class="aviso" id="aviso-curriculo-area">Genera un currículo personalizado primero: no hay ningún otro currículo de <b>${Utils.esc(areaDeAsignatura(Calc.asignaturaDeClase(clase.id)))}</b> al que apuntar el nivel.</div>`;
    }

    function filaNivel(n) {
      const div = document.createElement('div');
      div.className = 'nivel-aci-fila fila-campos';
      div.innerHTML = `
        <label class="campo"><span>Código</span><input type="text" class="nv-cod" value="${Utils.esc(n.codigo || '')}" placeholder="B" style="max-width:80px"></label>
        <label class="campo"><span>Etiqueta</span><input type="text" class="nv-etq" value="${Utils.esc(n.etiqueta || '')}" placeholder="4º"></label>
        <label class="campo"><span>Currículo (asignatura)</span><select class="nv-asig">${opcionesAsignatura(n.asignaturaId)}</select></label>
        <button type="button" class="icon-btn quitar-nivel-aci">×</button>`;
      div.querySelector('.quitar-nivel-aci').onclick = () => { div.remove(); pintarAsignacion(); };
      div.querySelector('.nv-cod').addEventListener('input', pintarAsignacion);
      return div;
    }

    function pintarAsignacion() {
      const cont = mbody.querySelector('#lista-asignacion');
      const niveles = nivelesActuales().filter(x => String(x.codigo).trim());
      if (!niveles.length) {
        cont.innerHTML = '<div class="aviso">Aún no hay niveles definidos. Pulsa «Añadir nivel», escribe su <b>código</b> (p. ej. «B») y elige su currículo; entonces podrás asignar alumnado aquí.</div>';
        return;
      }
      const previos = {};
      cont.querySelectorAll('.alu-nivel').forEach(s => { previos[s.dataset.alu] = s.value; });
      cont.innerHTML = alumnos.map(a => {
        const actual = Calc.nivelNorm((a.id in previos) ? previos[a.id] : ((clase.adaptaciones || {})[a.id] || ''));
        const ops = ['<option value="">Base</option>']
          .concat(niveles.map(n => `<option value="${Utils.esc(Calc.nivelNorm(n.codigo))}" ${actual === Calc.nivelNorm(n.codigo) ? 'selected' : ''}>${Utils.esc(n.etiqueta || n.codigo)}</option>`))
          .join('');
        return `<div class="fila-campos">
          <span style="flex:1">${Utils.esc(a.apellidos)}, ${Utils.esc(a.nombre)}</span>
          <select class="alu-nivel" data-alu="${a.id}">${ops}</select></div>`;
      }).join('') || '<div class="vacio">El grupo de esta clase no tiene alumnado.</div>';
    }

    mbody = UI.openModal({
      titulo: 'Niveles ACI · ' + (Calc.asignaturaDeClase(clase.id) || {}).nombre + ' · ' + ((Calc.byId(db.grupos, clase.grupoId) || {}).nombre || ''),
      cuerpo: `
        <div class="aviso">Un <b>nivel ACI</b> agrupa al alumnado que trabaja un currículo de otro curso (p. ej. 4º o 2º). Cada nivel apunta a la asignatura que se usará para corregirlo. Los exámenes de cada nivel se crean en «Instrumentos» eligiendo el nivel y una misma <b>unidad</b>.</div>
        ${avisoSinCurriculo()}
        <label class="campo"><span>Niveles ACI</span><div id="lista-niveles-aci"></div></label>
        <button class="btn btn-mini" type="button" id="add-nivel-aci">Añadir nivel</button>
        <label class="campo" style="margin-top:14px"><span>Asignación de alumnado</span><div id="lista-asignacion"></div></label>`,
      textoGuardar: 'Guardar niveles ACI',
      alGuardar(body) {
        const niveles = nivelesActuales().map(n => ({
          codigo: String(n.codigo).trim().toUpperCase(),
          etiqueta: String(n.etiqueta).trim(),
          asignaturaId: n.asignaturaId
        })).filter(n => n.codigo);
        const codigos = niveles.map(n => n.codigo);
        if (new Set(codigos).size !== codigos.length) { alert('Hay códigos de nivel repetidos'); return false; }
        if (codigos.includes('BASE')) { alert('El código BASE está reservado para el nivel base'); return false; }
        for (const n of niveles) {
          if (!n.asignaturaId) { alert(`El nivel ${n.codigo} necesita una asignatura (currículo)`); return false; }
        }
        clase.nivelesAci = niveles;
        const adap = {};
        body.querySelectorAll('.alu-nivel').forEach(sel => {
          const v = Calc.nivelNorm(sel.value);
          if (v) adap[sel.dataset.alu] = v;
        });
        clase.adaptaciones = adap;
        Storage.save();
      }
    });

    mbody.querySelector('#add-nivel-aci').onclick = () => {
      const cont = mbody.querySelector('#lista-niveles-aci');
      cont.appendChild(filaNivel({}));
      pintarAsignacion();
      const cod = cont.querySelector('.nivel-aci-fila:last-child .nv-cod');
      if (cod) cod.focus();
    };
    (clase.nivelesAci || []).forEach(n => mbody.querySelector('#lista-niveles-aci').appendChild(filaNivel(n)));
    pintarAsignacion();
  }

  function render(el) {
    const db = Storage.db;
    const hayOficiales = areasOficiales().length > 0;
    el.innerHTML = `
      <div class="grid-2">
        <section class="card">
          <div class="card-head">
            <h2>Currículos y asignaturas</h2>
            <div class="acciones"><button class="btn btn-primario" id="add-asig">Nueva asignatura</button></div>
          </div>
          <div class="aviso" style="margin:0 0 10px">Cada fila es un <b>currículo de un área en un curso</b>: «Matemáticas 3º» y «Matemáticas 6º» son dos filas distintas. Es lo que después eligen las clases y los niveles ACI.</div>
          <ul class="lista" id="lista-asig">
            ${db.asignaturas.map(a => {
              const conCurriculo = db.criterios.some(c => c.asignaturaId === a.id);
              const det = [a.etapa, a.curso, conCurriculo ? '' : 'sin currículo'].filter(Boolean).join(' · ');
              return `
              <li data-id="${a.id}">
                <span>${Utils.esc(a.nombre)}</span><small>${Utils.esc(det)}</small>
                <button class="btn btn-mini editar-asig" data-id="${a.id}">Editar</button>
                ${conCurriculo || !hayOficiales ? '' : `<button class="btn btn-mini recuperar-asig" data-id="${a.id}" title="Cargar el currículo oficial de este curso">Recuperar</button>`}
                <button class="icon-btn borrar-asig" data-id="${a.id}" title="Eliminar">×</button>
              </li>`;
            }).join('') || '<li class="vacio">Sin asignaturas. Crea la primera.</li>'}
          </ul>
        </section>
        <section class="card">
          <div class="card-head">
            <h2>Clases <small class="sub" style="margin:0">asignatura · grupo</small></h2>
            <div class="acciones"><button class="btn btn-primario" id="add-clase">Nueva clase</button></div>
          </div>
          <table class="tabla">
            <thead><tr><th>Asignatura</th><th>Grupo</th><th>Alumnos</th><th></th></tr></thead>
            <tbody>
              ${db.clases.map(c => {
                const asig = Calc.asignatura(c.asignaturaId) || { nombre: '?' };
                const gru = Calc.byId(db.grupos, c.grupoId) || { nombre: '?' };
                const nAlu = db.alumnos.filter(a => a.grupoId === c.grupoId).length;
                const nAci = (c.nivelesAci || []).length;
                return `<tr>
                  <td>${Utils.esc(asig.nombre)}</td>

cracia, justicia y paz.","peso":null},{"codigo":"EVCE.TC.2.2","ceCodigo":"EVCE.TC.CE2","descripcion":"Interactuar con otros adoptando, de forma motivada y autónoma, conductas cívicas y éticas orientadas por valores comunes, a partir del conocimiento de los derechos humanos y los principios constitucionales fundamentales, en relación con contextos y problemas concretos, así como por una consideración crítica y dialogada acerca de cómo debemos relacionarnos con los demás.","peso":null},{"codigo":"EVCE.TC.2.3","ceCodigo":"EVCE.TC.CE2","descripcion":"Reflexionar y asumir un compromiso activo y crítico con valores relativos a la solidaridad y el respeto a las minorías y las identidades etnoculturales y de género, analizando desde un punto de vista ético cuestiones relacionadas con la desigualdad y la pobreza, el hecho multicultural, la diversidad humana y los fenómenos migratorios.","peso":null},{"codigo":"EVCE.TC.2.4","ceCodigo":"EVCE.TC.CE2","descripcion":"Contribuir a generar una convivencia respetuosa, no sexista y comprometida con el logro de la igualdad y la corresponsabilidad efectivas, y con la erradicación de la violencia de género, a partir del conocimiento y análisis crítico de la situación secular de desigualdad entre mujeres y hombres.","peso":null},{"codigo":"EVCE.TC.2.5","ceCodigo":"EVCE.TC.CE2","descripcion":"Comprender y valorar los principios de justicia, solidaridad, seguridad y paz, a la vez que el respeto a las libertades básicas, a partir del análisis y la ponderación de las políticas y acciones de ayuda y cooperación internacional, de defensa para la paz y de seguridad integral ciudadana, ejercidas por el Estado y sus instituciones, los organismos internaciones, las ONG y ONGD y la propia ciudadanía.","peso":null},{"codigo":"EVCE.TC.3.1","ceCodigo":"EVCE.TC.CE3","descripcion":"Evaluar diferentes alternativas con que frenar el cambio climático y lograr los Objetivos de Desarrollo Sostenible, identificando causas y problemas ecosociales, y justificando argumentalmente y de modo crítico el deber ético de proteger y cuidar la naturaleza.","peso":null},{"codigo":"EVCE.TC.3.2","ceCodigo":"EVCE.TC.CE3","descripcion":"Comprometerse activamente con valores, prácticas y actitudes afectivas consecuentes con el respeto, cuidado y protección de las personas, los animales y el planeta, a través de la participación en actividades que promuevan un consumo responsable y un uso sostenible del suelo, el aire, el agua, la energía, la movilidad segura, saludable y sostenible, y la prevención y gestión de residuos, reconociendo el papel de las personas, colectivos y entidades comprometidas con la protección del entorno.","peso":null},{"codigo":"EVCE.TC.4.1","ceCodigo":"EVCE.TC.CE4","descripcion":"Gestionar equilibradamente pensamientos, sentimientos y emociones, y desarrollar una actitud de estima y cuidado de sí mismo o sí misma, de los demás y del entorno, identificando, analizando y expresando de manera asertiva las propias emociones y afectos, y reconociendo y valorando los de otras personas, en distintos contextos y en relación con actividades creativas y de reflexión individual o dialogada sobre cuestiones éticas y cívicas.","peso":null}]},{"version":1,"tipo":"curriculo-evalcrit","fuente":"Decreto 66/2022, de 7 de julio, por el que se establece el currículo de Educación Infantil y Primaria en la Comunidad Autónoma de Cantabria (BOC nº 135, 13-07-2022), Anexo II-A","asignatura":{"nombre":"Educación Física","etapa":"Primaria","ciclo":"Primer ciclo","cursos":["1º","2º"]},"saberesBasicos":[{"bloque":"A. Vida activa y saludable","apartados":[]},{"bloque":"B. Organización y gestión de la actividad física","apartados":[]},{"bloque":"C. Resolución de problemas en situaciones motrices","apartados":[]},{"bloque":"E. Manifestaciones de la cultura motriz","apartados":[]},{"bloque":"F. Interacción eficiente y sostenible con el entorno","apartados":[]}],"competenciasEspecificas":[{"codigo":"EFIS.PC.CE1","descripcion":"Adoptar un estilo de vida activo y saludable, practicando regularmente actividades físicas, lúdicas y deportivas, adoptando comportamientos que potencien la salud física, mental y social, así como medidas de responsabilidad individual y colectiva durante la práctica motriz, para interiorizar e integrar hábitos de actividad física sistemática que contribuyan al bienestar.","perfilSalida":["STEM2","STEM5","CPSAA2","CPSAA5","CE3"]},{"codigo":"EFIS.PC.CE2","descripcion":"Adaptar los elementos propios del esquema corporal, las capacidades físicas, perceptivo- motrices y coordinativas, así como las habilidades y destrezas motrices, aplicando procesos de percepción, decisión y ejecución adecuados a la lógica interna y a los objetivos de diferentes situaciones, para dar respuesta a las demandas de proyectos motores y de prácticas motrices con distintas finalidades en contextos de la vida diaria.","perfilSalida":["STEM1","CPSAA4","CPSAA5"]},{"codigo":"EFIS.PC.CE3","descripcion":"Desarrollar procesos de autorregulación e interacción en el marco de la práctica motriz, con actitud empática e inclusiva, haciendo uso de habilidades sociales y actitudes de cooperación, respeto, trabajo en equipo y deportividad, con independencia de las diferencias etnoculturales, sociales, de género y de habilidad de los participantes, para contribuir a la convivencia y al compromiso ético en los diferentes espacios en los que se participa.","perfilSalida":["CCL1","CCL5","CPSAA1","CPSAA3","CPSAA5","CC2","CC3"]},{"codigo":"EFIS.PC.CE4","descripcion":"Reconocer y practicar diferentes manifestaciones lúdicas, físico-deportivas y artístico- expresivas propias de la cultura motriz, valorando su influencia y sus aportaciones estéticas y creativas a la cultura tradicional y contemporánea, para integrarlas en las situaciones motrices que se utilizan regularmente en la vida cotidiana.","perfilSalida":["CC3","CCEC1","CCEC2","CCEC3","CCEC4"]},{"codigo":"EFIS.PC.CE5","descripcion":"Valorar diferentes medios naturales y urbanos c <script>
const CurriculoView = (() => {
  let asigSel = null;

  const criteriosDe = () => Storage.db.criterios
    .filter(c => c.asignaturaId === asigSel)
    .sort((a, b) => String(a.codigo).localeCompare(String(b.codigo), 'es'));

  const espDe = () => Storage.db.competenciasEspecificas
    .filter(c => c.asignaturaId === asigSel)
    .sort((a, b) => String(a.codigo).localeCompare(String(b.codigo), 'es'));

  function modalCriterio(c) {
    const esp = espDe();
    const claves = Storage.db.competenciasClave;
    UI.openModal({
      titulo: c ? 'Editar criterio' : 'Nuevo criterio',
      cuerpo: `
        <div class="fila-campos">
          <label class="campo"><span>Código</span>
            <input type="text" id="f-cod" value="${Utils.esc(c ? c.codigo : '')}" placeholder="Ej. MAT 1.1"></label>
          <label class="campo"><span>Peso %</span>
            <input type="number" id="f-peso" min="0" max="100" step="0.5" value="${c ? c.peso : ''}" placeholder="50"></label>
        </div>
        <label class="campo"><span>Descripción del criterio</span>
          <textarea id="f-desc" rows="2" placeholder="Qué se evalúa">${Utils.esc(c ? c.descripcion : '')}</textarea></label>
        <label class="campo"><span>Competencias específicas (obligatorio al menos una)</span>
          ${esp.length ? `<div class="chips" data-campo="esp">` + esp.map(e => {
            const on = c && c.espIds.includes(e.id);
            return `<label class="chip ${on ? 'on' : ''}"><input type="checkbox" value="${e.id}" ${on ? 'checked' : ''}>${Utils.esc(e.codigo)}</label>`;
          }).join('') + '</div>' : '<div class="aviso">Crea primero una competencia específica.</div>'}
        </label>
        <label class="campo"><span>Competencias clave del perfil de salida (opcional)</span>
          <div class="chips" data-campo="clave">
            ${claves.map(k => {
              const on = c && c.claveIds.includes(k.id);
              return `<label class="chip ${on ? 'on' : ''}"><input type="checkbox" value="${k.id}" ${on ? 'checked' : ''}>${Utils.esc(k.codigo)}</label>`;
            }).join('')}
          </div></label>`,
      textoGuardar: 'Guardar criterio',
      alGuardar(body) {
        const codigo = body.querySelector('#f-cod').value.trim();
        const descripcion = body.querySelector('#f-desc').value.trim();
        const peso = parseFloat(body.querySelector('#f-peso').value);
        if (!codigo || !descripcion || isNaN(peso)) return false;
        const espIds = UI.valoresChips(body.querySelector('[data-campo=esp]'));
        if (!espIds.length) {
          alert('Asigna al menos una competencia específica');
          return false;
        }
        const claveIds = UI.valoresChips(body.querySelector('[data-campo=clave]'));
        if (c) {
          Object.assign(c, { codigo, descripcion, peso, espIds, claveIds });
        } else {
          Storage.db.criterios.push({ id: Utils.uid(), asignaturaId: asigSel, codigo, descripcion, peso, espIds, claveIds });
        }
        Storage.save();
      }
    });
    UI.wireChips(document.querySelector('.modal-body'));
  }

  function modalEsp() {
    UI.openModal({
      titulo: 'Nueva competencia específica',
      cuerpo: `
        <div class="fila-campos">
          <label class="campo"><span>Código</span><input type="text" id="f-cod" placeholder="Ej. CE1"></label>
        </div>
        <label class="campo"><span>Descripción</span>
          <textarea id="f-desc" rows="2" placeholder="Descripción de la competencia específica"></textarea></label>`,
      textoGuardar: 'Añadir',
      alGuardar(body) {
        const codigo = body.querySelector('#f-cod').value.trim();
        const descripcion = body.querySelector('#f-desc').value.trim();
        if (!codigo || !descripcion) return false;
        Storage.db.competenciasEspecificas.push({ id: Utils.uid(), asignaturaId: asigSel, codigo, descripcion });
        Storage.save();
      }
    });
  }

  function render(el) {
    const db = Storage.db;
    if (!asigSel || !Calc.asignatura(asigSel)) {
      const conCurriculo = db.asignaturas.find(a => db.criterios.some(c => c.asignaturaId === a.id));
      asigSel = (conCurriculo || db.asignaturas[0] || {}).id || null;
    }

    if (!db.asignaturas.length) {
      el.innerHTML = `<section class="card"><div class="vacio-grande">
        <strong>Aún no hay asignaturas</strong>
        Crea una asignatura en «Asignaturas y clases» y recupera su currículo oficial, o edítalo a mano.
      </div></section>`;
      return;
    }

    const sumaPesos = criteriosDe().reduce((s, c) => s + (Number(c.peso) || 0), 0);
    const asig = Calc.asignatura(asigSel) || {};
    // Agrupado por area del decreto. Las asignaturas creadas antes de que
    // existiera el campo `area` (o a mano, sin area) caen en «Otras
    // asignaturas»: preferimos que se vean raro a esconderlas del desplegable.
    const SIN_AREA = 'Otras asignaturas';
    const grupos = [];
    db.asignaturas.forEach(a => {
      const clave = String(a.area || '').trim() || SIN_AREA;
      let g = grupos.find(x => x.area === clave);
      if (!g) { g = { area: clave, lista: [] }; grupos.push(g); }
      g.lista.push(a);
    });
    grupos.sort((x, y) => (x.area === SIN_AREA) - (y.area === SIN_AREA)
      || x.area.localeCompare(y.area, 'es'));
    const opcionesAsig = grupos.map(g =>
      `<optgroup label="${Utils.esc(g.area)}">`
      + g.lista.map(a =>
        `<option value="${a.id}" ${a.id === asigSel ? 'selected' : ''}>${Utils.esc(a.nombre)}</option>`
      ).join('')
      + '</optgroup>').join('');
    el.innerHTML = `
      <section class="card">
        <div class="card-head">
          <h2>Currículo</h2>
          <div style="display:flex;gap:8px;align-items:center">
            <select id="sel-asig" style="max-width:280px">${opcionesAsig}</select>
          </div>
        </div>
        <div class="aviso">
          ${asig.fuente
            ? '<b>Legislación:</b> ' + Utils.esc(asig.fuente)
            : '<b>Fuente no registrada.</b> Las plantillas oficiales de Cantabria proceden del Decreto 66/2022, de 7 de julio (BOC nº 135, 13-07-2022), Anexo II-A.'}
        </div>
        <div class="aviso ${Math.round(sumaPesos) === 100 ? '' : ''}" style="${Math.round(sumaPesos) === 100 ? 'background:#f0fdf4;border-color:#bbf7d0;color:#166534' : ''}">
          Suma de ponderaciones: <b>${Utils.fmt(sumaPesos)}%</b>${Math.round(sumaPesos) === 100 ? ' · correcta' : ' · debería sumar 100%'}
        </div>
        <div class="grid-2">
          <div>
            <div class="card-head"><h2 class="subtitulo">Competencias específicas</h2>
              <div class="acciones"><button class="btn btn-primario" id="add-esp">Añadir</button></div></div>
            <ul class="lista">
              ${espDe().map(e => `
                <li style="cursor:default">
                  <span>${Utils.esc(e.codigo)}</span>
                  <small style="flex:1;text-align:left">${Utils.esc(e.descripcion)}</small>
                </li>`).join('') || '<li class="vacio">Sin competencias específicas.</li>'}
            </ul>
          </div>
          <div>
            <div class="card-head"><h2 class="subtitulo">Criterios y ponderaciones</h2>
              <div class="acciones"><button class="btn btn-primario" id="add-crit">Nuevo criterio</button></div></div>
            <table class="tabla">
              <thead><tr><th>Código</th><th>Descripción</th><th>Peso</th><th>Comp.</th><th></th></tr></thead>
              <tbody>
                ${criteriosDe().map(c => `
                  <tr data-id="${c.id}">
                    <td><b>${Utils.esc(c.codigo)}</b></td>
                    <td>${Utils.esc(c.descripcion)}</td>
                    <td class="num">${Utils.fmt(c.peso)}%</td>
                    <td>${c.espIds.map(id => { const e = Calc.byId(db.competenciasEspecificas, id); return e ? `<span class="badge info">${Utils.esc(e.codigo)}</span>` : ''; }).join(' ')}</td>
                    <td>
                      <div class="acciones">
                        <button class="btn btn-mini editar-crit">Editar</button>
                        <button class="icon-btn borrar-crit" title="Eliminar">×</button>
                      </div>
                    </td>
                  </tr>`).join('') || '<tr><td colspan="5" class="vacio">Sin criterios. Añade el primero para poder calificar.</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      </section>`;

    el.querySelector('#sel-asig').onchange = e => { asigSel = e.target.value; render(el); };
    el.querySelector('#add-esp').onclick = () => modalEsp();
    el.querySelector('#add-crit').onclick = () => modalCriterio(null);

    el.querySelectorAll('.editar-crit').forEach(b => {
      b.onclick = () => {
        const tr = b.closest('tr');
        modalCriterio(Calc.criterio(tr.dataset.id));
      };
    });
    el.querySelectorAll('.borrar-crit').forEach(b => {
      b.onclick = () => {
        const tr = b.closest('tr');
        const c = Calc.criterio(tr.dataset.id);
        if (!confirm(`¿Eliminar el criterio ${c.codigo}?`)) return;
        db.criterios = db.criterios.filter(x => x.id !== c.id);
        for (const inst of db.instrumentos) {
          inst.apartados.forEach(ap => ap.criterioIds = ap.criterioIds.filter(x => x !== c.id));
        }
        Storage.save();
        render(el);
      };
    });
  }

  return { render };
})();

</script>
<script>
const InstrumentosView = (() => {
  let claseSel = null;
  let perSel = 'Todos';           // 'Todos' | 'T1' | 'T2' | 'T3'
  // Claves «periodo::unidad» de los bloques que el usuario ha desplegado.
  // El conjunto vacío significa «todos cerrados».
  const udsAbiertas = new Set();
  const TIPOS = ['Control', 'Rúbrica', 'Proyecto', 'Otro'];
  const PERIODOS = ['T1', 'T2', 'T3'];
  const NIVELES_ESTANDAR = [{ pct: 25 }, { pct: 50 }, { pct: 75 }, { pct: 100 }];

  // Sugerencias para el campo «Unidad»: un <datalist> editable (sugiere, no
  // obliga). Recoge las unidades ya usadas en toda la asignatura; si todavía no
  // hay ninguna, devuelve cadena vacía y el campo queda como texto libre.
  function datalistUnidades(asigId) {
    const us = Calc.unidadesDeAsignatura(asigId);
    if (!us.length) return '';
    return `<datalist id="lista-unidades">${us
      .map(u => `<option value="${Utils.esc(u)}"></option>`).join('')}</datalist>`;
  }

  function instrumentosDe() {
    return Storage.db.instrumentos
      .filter(i => i.claseId === claseSel)
      .sort((a, b) => (String(a.unidad || '').localeCompare(String(b.unidad || ''), 'es'))
        || (a.fecha || '').localeCompare(b.fecha || ''));
  }

  // Fila de la tabla de instrumentos (sin columna de periodo: el trimestre ya
  // es el encabezado de sección).
  function filaInstrumento(i) {
    const notas = Calc.alumnosDeInstrumento(i)
      .map(a => Calc.notaInstrumento(i, a.id))
      .filter(n => n != null);
    const media = notas.length ? notas.reduce((x, y) => x + y, 0) / notas.length : null;
    const nivelTxt = i.nivel ? Calc.etiquetaNivel(i.claseId, i.nivel) : '';
    const url = Utils.urlPintable(i.url);
    return `<tr data-inst="${i.id}">
      <td>${url ? `<a href="${Utils.esc(url)}" target="_blank" rel="noopener" title="Enlace del instrumento: ${Utils.esc(url)}"><b>${Utils.esc(i.titulo)}</b></a>` : `<b>${Utils.esc(i.titulo)}</b>`}</td>
      <td><span class="badge info">${Utils.esc(i.tipo)}</span></td>
      <td>${nivelTxt ? `<span class="badge info">${Utils.esc(nivelTxt)}</span> ` : ''}${i.unidad ? `<span class="badge na">${Utils.esc(i.unidad)}</span>` : ''}${!nivelTxt && !i.unidad ? '<span style="color:var(--tinta-suave)">—</span>' : ''}</td>
      <td>${Utils.esc(i.fecha)}</td>
      <td>${i.apartados.length} ${i.tipo === 'Proyecto' ? 'partes/fases' : 'apartados'}</td>
      <td>${Calc.badgeHtml(media)}</td>
      <td>
        <div class="acciones">
          <button class="btn btn-mini btn-primario corregir">Corregir</button>
          <button class="btn btn-mini editar">Editar</button>
          <button class="btn btn-mini duplicar" title="Crear examen paralelo para un nivel ACI">Duplicar</button>
          <button class="btn btn-mini al-banco" title="Guardar una copia en el banco para reutilizarla en otra clase o el curso siguiente">Al banco</button>
          <button class="icon-btn borrar-inst" title="Eliminar">×</button>
        </div>
      </td>
    </tr>`;
  }

  function tablaInstrumentos(insts) {
    return `<table class="tabla">
      <thead><tr><th>Título</th><th>Tipo</th><th>Nivel · Unidad</th><th>Fecha</th><th>Apartados</th><th>Media</th><th></th></tr></thead>
      <tbody>${insts.map(filaInstrumento).join('')}</tbody>
    </table>`;
  }

  // Bloque plegable de una unidad: cabecera siempre visible, cuerpo con la tabla.
  function bloqueUnidad(periodo, unidad, insts) {
    const clave = periodo + '::' + unidad;
    const abierta = udsAbiertas.has(clave);
    const n = insts.length;
    return `<div class="ud-bloque${abierta ? ' abierta' : ''}">
      <button type="button" class="ud-cabecera" data-ud-clave="${Utils.esc(clave)}" aria-expanded="${abierta}">
        <span class="ud-flecha">${abierta ? '▾' : '▸'}</span>
        <b>${Utils.esc(unidad || 'Sin unidad')}</b>
        <small>${n} instrumento${n === 1 ? '' : 's'}</small>
      </button>
      <div class="ud-cuerpo">${tablaInstrumentos(insts)}</div>
    </div>`;
  }

  // Descriptor que un ítem de rúbrica define para un nivel concreto ('' = usa el común).
  function descriptorPropio(ap, pct) {
    const n = (ap.niveles || []).find(x => Math.abs(Number(x.pct) - Number(pct)) < 1e-9);
    return n ? (n.descriptor || '') : '';
  }

function columnasNivel(filas) {
      const pcts = new Set();
      (filas || []).forEach(f => (f.niveles || []).forEach(n => pcts.add(Number(n.pct))));
      const lista = pcts.size ? [...pcts] : NIVELES_ESTANDAR.map(n => n.pct);
      return lista.sort((a, b) => a - b).map(pct => ({ pct, descriptor: '' }));
    }

  function plantillaColumnas(nColsNivel) {
    return `28px minmax(150px,1.5fr) 82px ${'minmax(130px,1fr) '.repeat(nColsNivel)}auto auto`;
  }

  function filaApartado(ap, asignaturaId, esRubrica, modoGlobal, columnasNv) {
    const peso = ap.peso != null ? ap.peso : (esRubrica ? 1 : ap.maxPts);
    const cols = esRubrica ? (columnasNv || []) : [];
    return `
      <div class="apartado-fila${esRubrica ? ' rub' : ''}" data-id="${ap.id}"${esRubrica ? ` style="grid-template-columns:${plantillaColumnas(cols.length)}"` : ''}>
        <span class="num-ap"></span>
        <input type="text" class="ap-desc" placeholder="${esRubrica ? 'Ítem evaluado (ej. Ortografía)' : 'Pregunta, parte o fase'}" value="${Utils.esc(ap.descripcion)}">
        ${esRubrica
          ? `<input type="number" class="ap-peso" min="0.01" step="0.5" value="${peso}" title="Peso de este ítem en la rúbrica">`
          : `<input type="number" class="ap-max" min="0.5" step="0.5" value="${ap.maxPts}" title="Puntos máximos">`}
        ${esRubrica ? '' : '<small style="color:var(--tinta-suave)">peso</small>'}
        ${cols.map((nv, k) => `
          <input type="text" class="ap-nv" data-pct="${nv.pct}"
            value="${Utils.esc(descriptorPropio(ap, nv.pct))}"
            placeholder="Descriptor del nivel"
            title="Nivel ${k + 1} · ${nv.pct}%">`).join('')}
        ${modoGlobal
          ? '<small style="color:var(--tinta-suave)">aplica criterios globales</small>'
          : `<button type="button" class="btn btn-mini toggle-crit" title="Elegir criterios evaluados">Criterios</button>`}
        <button type="button" class="btn btn-mini quitar-ap">Quitar</button>
        ${modoGlobal ? '' : `<div class="zona-crit" style="display:none">${UI.chipsCriterios(asignaturaId, ap.criterioIds)}</div>`}
      </div>`;
  }

  // Cabecera de la cuadrícula de rúbrica: criterio · peso · nivel 1 … nivel N.
  function cabeceraRubrica(columnasNv) {
    return `
      <div class="rub-head" style="grid-template-columns:${plantillaColumnas(columnasNv.length)}">
        <span></span>
        <span>Criterio</span>
        <span>Peso</span>
        ${columnasNv.map((nv, k) => `<span title="${Utils.esc(nv.descriptor || '')}">Nivel ${k + 1}<br><small>${nv.pct}%</small></span>`).join('')}
        <span></span>
        <span></span>
      </div>`;
  }

  function modalInstrumento(inst, claseIdFijo, alCerrar) {
    const db = Storage.db;
    const cid = inst ? inst.claseId : (claseIdFijo || claseSel);
    if (!cid) { alert('Primero selecciona una clase'); return; }
    const asig = Calc.asignaturaDeClase(cid);
    if (!asig) { alert('Error: esta clase no tiene asignatura asociada'); return; }
    const claseId = cid;
    const esNueva = !inst;
    const tipoIni = inst ? inst.tipo : 'Control';
    const nivelesAci = Calc.nivelesAciDeClase(claseId);
    const nivelIni = inst ? (inst.nivel || '') : '';
    const opcionesNivel = '<option value="">Común (todo el alumnado)</option><option value="BASE"' + (nivelIni === 'BASE' ? ' selected' : '') + '>Base (sin adaptación)</option>'
      + nivelesAci.map(n => `<option value="${Utils.esc(n.codigo)}" ${nivelIni === n.codigo ? 'selected' : ''}>${Utils.esc(n.etiqueta || n.codigo)}</option>`).join('');
    UI.openModal({
      titulo: esNueva ? 'Nuevo instrumento' : 'Editar instrumento',
      cuerpo: `
        <div class="fila-campos">
          <label class="campo"><span>Tipo</span>
            <select id="f-tipo">${TIPOS.map(t => `<option ${t === tipoIni ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
          <label class="campo"><span>Periodo</span>
            <select id="f-periodo">${PERIODOS.map(p => `<option ${inst && inst.periodo === p ? 'selected' : ''}>${p}</option>`).join('')}</select></label>
          <label class="campo"><span>Fecha</span>
            <input type="date" id="f-fecha" value="${inst ? inst.fecha : Utils.hoy()}"></label>
        </div>
        <label class="campo"><span>Título</span>
          <input type="text" id="f-titulo" value="${Utils.esc(inst ? inst.titulo : '')}" placeholder="Ej. Control de unidades 1-3"></label>
        <div class="fila-campos">
          <label class="campo"><span>Unidad (agrupa exámenes del mismo tema)</span>
            <input type="text" id="f-unidad" list="lista-unidades" value="${Utils.esc(inst ? (inst.unidad || '') : '')}" placeholder="Ej. UD5" title="Puedes elegir una unidad ya usada o escribir una nueva">
            ${datalistUnidades(asig.id)}</label>
          ${nivelesAci.length ? `<label class="campo"><span>Nivel ACI</span>
            <select id="f-nivel">${opcionesNivel}</select></label>` : '<input type="hidden" id="f-nivel" value="">'}
        </div>
        <div class="fila-campos" id="fila-critmodo" style="margin-bottom:10px">
          <label class="campo"><span>Criterios</span>
            <select id="f-critmodo">
              <option value="desglosado" ${(inst && inst.criteriosModo) === 'desglosado' ? 'selected' : (!inst ? 'selected' : '')}>Desglosado (por apartado/parte)</option>
              <option value="global" ${(inst && inst.criteriosModo) === 'global' ? 'selected' : ''}>Global al instrumento</option>
            </select>
          </label>
        </div>
        <label class="campo"><span>Saberes básicos (informativo)</span>
          <textarea id="f-saberes" rows="2" placeholder="Opcional">${Utils.esc(inst ? inst.saberes : '')}</textarea></label>

        <div id="bloque-niveles" style="display:none">
          ${esNueva ? `<div class="aviso" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
            <span>¿Ya la tienes hecha (por ejemplo, con una IA)? No hace falta escribirla a mano.</span>
            <button class="btn btn-mini" type="button" id="btn-importar-rub">Importar rúbrica (IA)</button>
          </div>` : ''}
        </div>

        <div id="bloque-criterios-global" style="display:none">
          <label class="campo"><span>Criterios de evaluación que se trabajan</span>
            <div id="chips-criterios-global"></div>
          </label>
        </div>

        <label class="campo"><span id="lbl-apartados">Apartados y criterios que evalúan</span>
          <small id="hint-asig-crit" style="display:block;color:var(--tinta-suave)"></small>
          <div id="lista-apartados"></div>
        </label>
        <button class="btn btn-mini" type="button" id="add-ap">Añadir apartado</button>
        <label class="campo" style="margin-top:14px"><span>Enlace (opcional)</span>
          <input type="url" id="f-url" value="${Utils.esc(inst ? (inst.url || '') : '')}" placeholder="https://… (examen, proyecto, materiales)">
          <small class="hint">Dirección del examen, del proyecto o de los materiales. Quedará a mano en el listado y al corregir.</small></label>`,
      textoGuardar: esNueva ? 'Crear' : 'Guardar cambios',
      alCerrar,
      alGuardar(body) {
        const titulo = body.querySelector('#f-titulo').value.trim();
        const tipo = body.querySelector('#f-tipo').value;
        const periodo = body.querySelector('#f-periodo').value;
        const fecha = body.querySelector('#f-fecha').value || Utils.hoy();
        const saberes = body.querySelector('#f-saberes').value.trim();
        const unidad = body.querySelector('#f-unidad').value.trim();
        const nivel = (body.querySelector('#f-nivel') || {}).value || '';
        const urlCampo = body.querySelector('#f-url');
        const url = urlCampo ? Utils.urlLimpia(urlCampo.value) : (inst ? (inst.url || '') : '');
        const esRubrica = tipo === 'Rúbrica';

        const apartados = [];
        let orden = 0;
        const criteriosModo = body.querySelector('#f-critmodo') ? body.querySelector('#f-critmodo').value : 'desglosado';
        const esModoGlobal = criteriosModo === 'global' && !esRubrica;
        for (const fila of body.querySelectorAll('.apartado-fila')) {
          orden++;
          const desc = fila.querySelector('.ap-desc').value.trim();
          const maxPts = esRubrica ? 100 : parseFloat(fila.querySelector('.ap-max').value);
          const criterioIds = esModoGlobal ? [] : UI.valoresChips(fila.querySelector('.zona-crit'));
          if (esRubrica) {
            if (isNaN(maxPts) || maxPts <= 0) maxPts = 100;
          } else {
            if (!esModoGlobal && !criterioIds.length) { alert('Cada apartado necesita al menos un criterio (botón «Criterios»)'); return false; }
            if (isNaN(maxPts) || maxPts <= 0) { alert('Cada apartado necesita puntos máximos'); return false; }
          }
          const peso = fila.querySelector('.ap-peso') ? parseFloat(fila.querySelector('.ap-peso').value) : (esRubrica ? 1 : maxPts);
          const nivelesItem = Array.from(fila.querySelectorAll('.ap-nv'))
            .map(i => ({ pct: Number(i.dataset.pct), descriptor: i.value.trim() }))
            .filter(n => n.descriptor);
          if (esRubrica && nivelesItem.length < 2) {
            alert('El ítem «' + (desc || 'sin nombre') + '» necesita al menos dos descriptores de nivel.');
            return false;
          }
          apartados.push({
            id: fila.dataset.id && fila.dataset.id !== 'nuevo' ? fila.dataset.id : Utils.uid(),
            orden, descripcion: desc, maxPts, criterioIds,
            peso: (isNaN(peso) || peso <= 0) ? 1 : peso,
            niveles: esRubrica ? nivelesItem : []
          });
        }
        if (!apartados.length) { alert('Añade al menos un apartado'); return false; }
        const criterioIdsGlobal = UI.valoresChips(body.querySelector('#chips-criterios-global') || body);
        if (esModoGlobal && !criterioIdsGlobal.length) { alert('Selecciona al menos un criterio global en el bloque superior'); return false; }
        // Blindaje: un instrumento con nivel ACI solo puede evaluar criterios de
        // SU currículo. Si la selección no encaja (p. ej. se cambió el nivel a
        // última hora), no se guarda y se avisa.
        if (Calc.criteriosFueraDeNivel(Storage.db, { claseId, nivel, criterioIdsGlobal, apartados }).length) {
          alert('Los criterios seleccionados no son del currículo del nivel elegido. Revisa el nivel y los criterios antes de guardar.');
          return false;
        }

        const nivelesInst = esRubrica
          ? (apartados[0].niveles || [])
          : (inst ? (inst.niveles || []) : NIVELES_ESTANDAR.map(n => ({ pct: n.pct, descriptor: '' })));

        if (esNueva) {
          Storage.db.instrumentos.push({ id: Utils.uid(), claseId, tipo, titulo, fecha, periodo, saberes, unidad, nivel, niveles: nivelesInst, apartados, criteriosModo, criterioIdsGlobal, url });
        } else {
          Object.assign(inst, { tipo, titulo, fecha, periodo, saberes, unidad, nivel, niveles: nivelesInst, apartados, criteriosModo, criterioIdsGlobal, url });
        }
        Storage.save();
      }
    });

    const body = document.querySelector('.modal-body');
    const btnImpRub = body.querySelector('#btn-importar-rub');
    if (btnImpRub) {
      // La rúbrica importada se crea como instrumento nuevo: cerramos este
      // formulario y abrimos el importador con la clase y el periodo ya puestos.
      btnImpRub.onclick = () => modalImportarRubrica(claseId, (body.querySelector('#f-periodo') || {}).value);
    }
    const selTipo = body.querySelector('#f-tipo');
    const listaAp = body.querySelector('#lista-apartados');
    const chipsGlobal = body.querySelector('#chips-criterios-global');
    chipsGlobal.dataset.asig = asig.id;
    chipsGlobal.innerHTML = UI.chipsCriterios(asig.id, inst ? (inst.criterioIdsGlobal || []) : []);
    UI.wireChips(chipsGlobal);

    function refrescaNumeros() {
      body.querySelectorAll('.num-ap').forEach((n, i) => { n.textContent = i + 1 + '.'; });
    }

    // Columnas de la cuadrícula de rúbrica: la unión de los niveles propios de
    // los ítems. Si todavía no hay ninguno (rúbrica nueva), la escala estándar.
    

    function nivelActual() {
      const s = body.querySelector('#f-nivel');
      return s ? s.value : '';
    }

    function estadoFilas() {
      const esRub = selTipo.value === 'Rúbrica';
      return Array.from(listaAp.querySelectorAll('.apartado-fila')).map(fila => {
        const zona = fila.querySelector('.zona-crit');
        return {
          id: fila.dataset.id,
          descripcion: fila.querySelector('.ap-desc').value,
          // En modo global el apartado no tiene zona de criterios propios.
          criterioIds: zona ? UI.valoresChips(zona) : [],
          maxPts: esRub ? 100 : parseFloat((fila.querySelector('.ap-max') || {}).value),
          peso: fila.querySelector('.ap-peso') ? parseFloat(fila.querySelector('.ap-peso').value) : null,
          niveles: Array.from(fila.querySelectorAll('.ap-nv')).map(i => ({ pct: Number(i.dataset.pct), descriptor: i.value }))
        };
      });
    }

    // Repinta la lista de ítems conservando lo escrito y, en rúbricas, la
    // cabecera «criterio · peso · nivel 1 … nivel N».
    function pintaFilas(filas, nivel) {
      const esRub = selTipo.value === 'Rúbrica';
      const cols = esRub ? columnasNivel(filas) : [];
      listaAp.innerHTML = '';
      if (esRub) listaAp.insertAdjacentHTML('beforeend', cabeceraRubrica(cols).trim());
      (filas || []).forEach(f => addFilaApartado(f, nivel, cols));
    }

    // La cuadrícula se repinta siempre desde el estado de los ítems; no hay
    // editor de escala común, por lo que no es necesario repintarla por ese lado.

    function actualizaEtiquetaCrit(fila) {
      const zona = fila.querySelector('.zona-crit');
      if (!zona) return;
      const n = zona.querySelectorAll('input:checked').length;
      fila.querySelector('.toggle-crit').textContent = 'Criterios (' + n + ')';
    }

    function addFilaApartado(ap, nivel, cols) {
      const esRubrica = selTipo.value === 'Rúbrica';
      const modoGlobal = !esRubrica && (body.querySelector('#f-critmodo') || {}).value === 'global';
      const asigCrit = Calc.asignaturaDeNivel(claseId, nivel || nivelActual());
      const div = document.createElement('div');
      div.innerHTML = filaApartado(ap || { id: 'nuevo', descripcion: '', maxPts: '', criterioIds: [] }, asigCrit ? asigCrit.id : asig.id, esRubrica, modoGlobal, cols).trim();
      const fila = div.firstElementChild;
      fila.querySelector('.quitar-ap').onclick = () => { fila.remove(); refrescaNumeros(); };
      if (fila.querySelector('.toggle-crit')) {
        fila.querySelector('.toggle-crit').onclick = () => {
          const zona = fila.querySelector('.zona-crit');
          zona.style.display = zona.style.display === 'none' ? '' : 'none';
        };
      }
      UI.wireChips(fila);
      fila.querySelectorAll('.chip input').forEach(inp =>
        inp.addEventListener('change', () => actualizaEtiquetaCrit(fila)));
      actualizaEtiquetaCrit(fila);
      listaAp.appendChild(fila);
      refrescaNumeros();
    }

    function refrescaTipo() {
      const esRubrica = selTipo.value === 'Rúbrica';
      const critmodo = (body.querySelector('#f-critmodo') || {}).value || 'desglosado';
      body.querySelector('#bloque-niveles').style.display = esRubrica ? '' : 'none';
      body.querySelector('#bloque-criterios-global').style.display = (critmodo === 'global' && !esRubrica) ? '' : 'none';
      body.querySelector('#fila-critmodo').style.display = esRubrica ? 'none' : '';
      const lbl = body.querySelector('#lbl-apartados');
