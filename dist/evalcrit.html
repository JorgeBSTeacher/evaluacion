      if (lbl) lbl.textContent = esRubrica ? 'Ítems de la rúbrica · criterio, peso y niveles' : 'Apartados y criterios que evalúan';
      const btnAp = body.querySelector('#add-ap');
      if (btnAp) btnAp.textContent = esRubrica ? 'Añadir ítem' : 'Añadir apartado';
      pintaFilas(estadoFilas(), nivelActual());
    }

    function refrescaNivel() {
      const nivel = nivelActual();
      const asigCrit = Calc.asignaturaDeNivel(claseId, nivel);
      const idNuevo = String(asigCrit ? asigCrit.id : asig.id);
      // Si ya estábamos pintando este mismo currículo, respetamos lo que el
      // docente tenga marcado; si venimos de otro (o es la primera pintada),
      // partimos de los criterios guardados del instrumento. Así, al editar un
      // control ya hecho, sus criterios salen marcados.
      const seleccion = (chipsGlobal.dataset.asig === idNuevo)
        ? UI.valoresChips(chipsGlobal)
        : (inst ? (inst.criterioIdsGlobal || []) : []);
      chipsGlobal.dataset.asig = idNuevo;
      const hint = body.querySelector('#hint-asig-crit');
      if (hint) hint.textContent = 'Criterios del currículo de ' + (asigCrit ? asigCrit.nombre : '') +
        (nivel && nivel !== 'BASE' ? ' (nivel ' + Calc.etiquetaNivel(claseId, nivel) + ')' : '');
      pintaFilas(estadoFilas(), nivel);
      chipsGlobal.innerHTML = UI.chipsCriterios(asigCrit ? asigCrit.id : asig.id, seleccion);
      UI.wireChips(chipsGlobal);
    }
    selTipo.onchange = refrescaTipo;
    if (body.querySelector('#f-critmodo')) body.querySelector('#f-critmodo').onchange = refrescaTipo;
    const selNivelEl = body.querySelector('#f-nivel');
    let nivelSel = nivelIni;
    if (selNivelEl) selNivelEl.onchange = () => {
      const nivel = nivelActual();
      const idNuevo = String((Calc.asignaturaDeNivel(claseId, nivel) || asig).id);
      // Cambiar de nivel cambia el currículo: los criterios marcados dejan de
      // encajar. Avisamos antes de descartar la selección (no se pierde ninguna
      // nota: solo qué criterios tenía marcados el formulario).
      if (chipsGlobal.dataset.asig && chipsGlobal.dataset.asig !== idNuevo &&
          (UI.valoresChips(chipsGlobal).length ||
           Array.from(listaAp.querySelectorAll('.zona-crit')).some(z => UI.valoresChips(z).length))) {
        const destino = Calc.asignaturaDeNivel(claseId, nivel);
        if (!confirm('Vas a cambiar a «' + (destino ? destino.nombre : 'otro currículo') +
          '». Los criterios que tienes marcados son del currículo actual y dejarán de estar marcados ' +
          '(no se pierde ninguna nota). ¿Continuar?')) {
          selNivelEl.value = nivelSel;
          return;
        }
      }
      nivelSel = nivel;
      refrescaNivel();
    };
    body.querySelector('#add-ap').onclick = () => addFilaApartado(null, null, selTipo.value === 'Rúbrica' ? columnasNivel(estadoFilas()) : []);

    if (esNueva) {
      addFilaApartado(null, null, selTipo.value === 'Rúbrica' ? columnasNivel([]) : []);
    } else {
      const cols = selTipo.value === 'Rúbrica' ? columnasNivel(inst.apartados) : [];
      inst.apartados.forEach(a => addFilaApartado(a, inst.nivel, cols));
    }
    refrescaTipo();
    refrescaNivel();
  }

  function borrarInstrumento(el, inst) {
    if (!confirm(`¿Eliminar "${inst.titulo}" y todas sus notas?`)) return;
    delete Storage.db.registros[inst.id];
    Storage.db.instrumentos = Storage.db.instrumentos.filter(i => i.id !== inst.id);
    Storage.save();
    render(el);
  }

  // --- Banco de instrumentos (D-48) ---
  // Guarda una copia del instrumento (título, apartados y criterios) para
  // reutilizarla en otra clase o el curso siguiente. No toca el original.
  function guardarAlBanco(el, inst) {
    Storage.guardarEnBanco(inst);
    UI.toast('Guardado en el banco: ' + inst.titulo);
    render(el);
  }

  // Lista del banco para añadir una copia a la clase activa, con las notas en
  // blanco y los criterios reapuntados al currículo de esa clase.
  function modalBanco(el) {
    const banco = (Storage.db.bancoInstrumentos || []).slice().reverse(); // los últimos, primero
    const asig = Calc.asignaturaDeClase(claseSel);
    const clase = Calc.clase(claseSel);
    const grupo = clase ? (Calc.byId(Storage.db.grupos, clase.grupoId) || {}) : {};
    const destino = asig ? `${asig.nombre} · ${grupo.nombre || '?'}` : 'la clase elegida';
    if (!banco.length) {
      UI.openModal({
        titulo: 'Banco de instrumentos',
        cuerpo: `<div class="aviso">Todavía no has guardado ningún instrumento en el banco.
          Para guardar uno, tócalo en la lista con <b>«Al banco»</b> y quedará disponible aquí.</div>`
      });
      return;
    }
    // Las asignaturas del filtro salen de lo que hay guardado, no de un
    // catálogo: si no hay moldes de Inglés, no aparece la opción. Si todos los
    // moldes son de la misma asignatura, el filtro no aporta y no se pinta.
    const asignaturas = [...new Set(banco
      .map(m => (m.origen && m.origen.asignatura) || '')
      .filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
    const conFiltro = asignaturas.length > 1;
    const cuerpo = `
      <p class="hint">Instrumentos guardados para reutilizar. Al pulsar «Usar» se añade una copia a
        <b>${Utils.esc(destino)}</b>, con las notas en blanco y los mismos apartados y criterios.</p>
      ${conFiltro ? `<label class="campo"><span>Ver los de</span>
        <select id="banco-filtro">
          <option value="">Todas las asignaturas (${banco.length})</option>
          ${asignaturas.map(a => {
            const n = banco.filter(m => m.origen && m.origen.asignatura === a).length;
            return `<option value="${Utils.esc(a)}">${Utils.esc(a)} (${n})</option>`;
          }).join('')}
        </select></label>` : ''}
      <label class="campo"><span>Periodo del instrumento que se añada</span>
        <select id="banco-periodo">${PERIODOS.map(p => `<option ${p === 'T1' ? 'selected' : ''}>${p}</option>`).join('')}</select></label>
      <div id="banco-lista">${banco.map(m => `
        <div class="fila-banco" data-molde="${Utils.esc(m.id)}" data-asignatura="${Utils.esc((m.origen && m.origen.asignatura) || '')}">
          <span class="fila-banco-txt">
            <b>${Utils.esc(m.titulo || '(sin título)')}</b>
            <small>${Utils.esc(m.tipo || '')}${m.unidad ? ' · ' + Utils.esc(m.unidad) : ''}${m.origen && m.origen.asignatura ? ' · de ' + Utils.esc(m.origen.asignatura) : ''} · ${(m.apartados || []).length} apartado${(m.apartados || []).length === 1 ? '' : 's'}</small>
          </span>
          <button type="button" class="btn btn-mini btn-primario banco-usar">Usar</button>
          <button type="button" class="icon-btn banco-quitar" title="Quitar del banco (no borra ningún instrumento del curso)">×</button>
        </div>`).join('')}</div>
      <div id="banco-vacio" class="aviso" style="display:none">No hay instrumentos de esa asignatura en el banco.</div>`;
    const mbody = UI.openModal({ titulo: 'Banco de instrumentos', cuerpo });

    // Filtro por asignatura: oculta filas sin recargar el modal.
    const selFiltro = mbody.querySelector('#banco-filtro');
    if (selFiltro) selFiltro.addEventListener('change', () => {
      const valor = selFiltro.value;
      let visibles = 0;
      mbody.querySelectorAll('.fila-banco').forEach(fila => {
        const coincide = !valor || fila.dataset.asignatura === valor;
        fila.style.display = coincide ? '' : 'none';
        if (coincide) visibles++;
      });
      const vacio = mbody.querySelector('#banco-vacio');
      if (vacio) vacio.style.display = visibles ? 'none' : '';
    });
    mbody.querySelectorAll('.banco-usar').forEach(b => {
      b.onclick = () => {
        const moldeId = b.closest('[data-molde]').dataset.molde;
        const periodo = (mbody.querySelector('#banco-periodo') || {}).value || 'T1';
        const r = Storage.anadirDesdeBanco(moldeId, claseSel, '', periodo);
        if (r.faltan.length) {
          const nombre = (r.molde && r.molde.titulo) || '';
          alert('No se puede añadir «' + nombre + '» a ' + (asig ? asig.nombre : 'esta clase') +
            '.\n\nEstos criterios del instrumento no existen en esa asignatura:\n' + r.faltan.join(', ') +
            '\n\nSe guardó desde un currículo distinto. Créalos en «Currículo», o guárdalo desde una clase que use esa asignatura.');
          return;
        }
        UI.closeModal();
        UI.toast('Añadido: ' + r.inst.titulo);
        render(el);
      };
    });
    mbody.querySelectorAll('.banco-quitar').forEach(b => {
      b.onclick = () => {
        const fila = b.closest('[data-molde]');
        const m = (Storage.db.bancoInstrumentos || []).find(x => x.id === fila.dataset.molde);
        if (!confirm('¿Quitar «' + ((m && m.titulo) || '') + '» del banco?\n\nNo se borra ningún instrumento del curso.')) return;
        Storage.borrarDelBanco(fila.dataset.molde);
        modalBanco(el);
      };
    });
  }

  // «¿Qué quieres corregir?»: listado de la clase ordenado por lo que falta.
  // `alElegir(instrumentoId)` decide a dónde lleva tocar cada fila.
  // Las filas se generan aparte para poder comprobarlas sin navegador.
  function filasCorregirHtml(lista) {
    return lista.map(i => {
      const p = Calc.progresoInstrumento(i);
      let marca = 'Sin alumnado', clase = 'na';
      if (p.total) {
        if (!p.pendientes) { marca = 'Completo'; clase = 'ok'; }
        else { marca = `${p.hechos}/${p.total} corregidos`; clase = p.hechos ? 'info' : 'na'; }
      }
      const meta = [i.tipo, i.periodo, i.unidad || 'sin unidad'].join(' · ');
      return `<button type="button" class="fila-corrige" data-inst="${i.id}">
        <span class="fila-corrige-txt"><b>${Utils.esc(i.titulo)}</b><small>${Utils.esc(meta)}</small></span>
        <span class="badge ${clase}">${marca}</span>
      </button>`;
    }).join('');
  }

  function modalCalificar(claseId, alElegir) {
    const lista = Calc.instrumentosPorCorregir(claseId);
    const mbody = UI.openModal({
      titulo: '¿Qué quieres corregir?',
      cuerpo: `<p class="hint">Instrumentos de esta clase, con lo que falta por corregir primero. Toca uno para corregirlo.</p>
        ${filasCorregirHtml(lista) || '<div class="aviso">Esta clase todavía no tiene instrumentos. Créalos en «Instrumentos».</div>'}`
    });
    mbody.querySelectorAll('.fila-corrige').forEach(b => {
      b.onclick = () => { UI.closeModal(); alElegir(b.dataset.inst); };
    });
  }

  // `volverA` permite volver a la vista desde la que se abrió (p. ej. la
  // Cuadrícula) en lugar de ir siempre al listado de Instrumentos.
  // `alumnoId` arranca la corrección en ese alumno (por ejemplo, al tocar su
  // nota en la Cuadrícula) en lugar de en el primero de la lista.
  function renderCorreccion(el, instId, volverA, alumnoId) {
    const inst = Calc.instrumento(instId);
    if (!inst) { render(el); return; }
    const alumnos = Calc.alumnosDeInstrumento(inst);
    const esRubrica = inst.tipo === 'Rúbrica';
    const url = Utils.urlPintable(inst.url);

    el.innerHTML = `
      <section class="card no-print">
        <div class="card-head">
          <h2>${Utils.esc(inst.titulo)}</h2>
          <div class="acciones">
            ${url ? `<a class="btn" href="${Utils.esc(url)}" target="_blank" rel="noopener" title="${Utils.esc(url)}">Abrir enlace</a>` : ''}
            <button class="btn" id="volver">Volver</button>
          </div>
        </div>
        <div class="chips" style="margin-bottom:10px">
          <span class="badge info">${Utils.esc(inst.tipo)}</span>
          <span class="badge info">${Utils.esc(inst.periodo)}</span>
          ${inst.unidad ? `<span class="badge info">${Utils.esc(inst.unidad)}</span>` : ''}
          ${inst.nivel ? `<span class="badge info">Nivel ${Utils.esc(Calc.etiquetaNivel(inst.claseId, inst.nivel))}</span>` : ''}
          <span class="badge na">${inst.apartados.length} ${inst.tipo === 'Proyecto' ? 'partes/fases' : 'apartados'}</span>
          ${esRubrica ? '<small style="align-self:center;color:var(--tinta-suave)">Toca un nivel para puntuar; tócalo otra vez para vaciar.</small>' : ''}
        </div>
        <div class="barra-correccion no-print" id="barra-nav">
          <button class="btn btn-mini" id="btn-anterior">← Anterior</button>
          <span id="nav-info"></span>
          <button class="btn btn-mini btn-primario" id="btn-siguiente">Guardar y siguiente →</button>
        </div>
        <div class="scroll-x">
          <table class="tabla" id="tabla-corrige">
            <thead><tr><th>Alumno</th>${inst.apartados.map(ap =>
              `<th title="${Utils.esc(descripcionNiveles(inst, ap))}">${Utils.esc(ap.descripcion)}<br><small>${esRubrica ? 'niveles 1 a ' + Calc.nivelesDeApartado(inst, ap).length : 'sobre ' + Utils.fmt(ap.maxPts)}</small></th>`
            ).join('')}<th>Nota</th></tr></thead>
            <tbody>
              ${alumnos.map(a => {
                const reg = (Storage.db.registros[inst.id] || {})[a.id] || {};
                return `<tr data-alumno="${a.id}">
                  <td>${Utils.esc(a.apellidos)}, ${Utils.esc(a.nombre)}</td>
                  ${inst.apartados.map(ap => `
                    <td data-apartado="${ap.id}">
                      ${esRubrica
                        ? `<div class="segmentos">${Calc.nivelesDeApartado(inst, ap).map(nv => {
                            const on = Number(reg[ap.id]) === nv.pct ? 'on' : '';
                            return `<button type="button" class="${on}" data-val="${nv.pct}" title="${Utils.esc(nv.descriptor || '')}">${nv.pct}</button>`;
                          }).join('')}</div>`
                        : `<input type="number" class="inp-nota" min="0" max="${ap.maxPts}" step="any"
                            style="min-width:76px" value="${reg[ap.id] ?? ''}" placeholder="—">`}
                    </td>`).join('')}
                  <td class="celda-nota-final"></td>
                </tr>`;
              }).join('') || '<tr><td colspan="9" class="vacio">Este instrumento no tiene alumnado asignado.</td></tr>'}
            </tbody>
          </table>
        </div>
        ${esRubrica ? `<details class="no-print leyenda-rubrica">
          <summary>Ver los descriptores de cada nivel (útil en tableta, donde no hay tooltips)</summary>
          ${inst.apartados.map(ap => `
            <div class="leg-item">
              <b>${Utils.esc(ap.descripcion)}</b>
              <ul>${Calc.nivelesDeApartado(inst, ap).map((nv, k) =>
                `<li><span class="badge info">Nivel ${k + 1} · ${nv.pct}%</span> ${Utils.esc(nv.descriptor || '—')}</li>`).join('')}</ul>
            </div>`).join('')}
        </details>` : ''}
      </section>
      <p class="no-print" style="color:var(--tinta-suave);font-size:13px">
        La nota mostrada es la del instrumento (informativa). Las ponderaciones por criterio se aplican en la Cuadrícula.
      </p>`;

    el.querySelector('#volver').onclick = () => (volverA ? volverA() : render(el));

    const tabla = el.querySelector('#tabla-corrige');

    function notaFila(tr) {
      const alumnoId = tr.dataset.alumno;
      const n = Calc.notaInstrumento(inst, alumnoId);
      tr.querySelector('.celda-nota-final').innerHTML = Calc.badgeHtml(n);
    }

    const persistir = Utils.debounce(() => Storage.save(), 400);
    // El aviso se agrupa: si alguien teclea «77» en un apartado de 1 punto, el
    // recorte salta en la primera tecla y no queremos un toast por tecla.
    const avisarRecorte = Utils.debounce((max) => {
      UI.toast('Esta pregunta vale como máximo ' + Utils.fmt(max) + '; se ha ajustado a esa puntuación');
    }, 800);

    // Escape cierra la edición de la celda: suelta el foco (desaparece el cursor)
    // y vuelve a la tabla, sin mover de alumno ni perder nada, porque cada tecla
    // ya quedó guardada. No repinta: repintar aquí mataría el foco y el flujo.
    tabla.addEventListener('keydown', ev => {
      if (ev.key !== 'Escape') return;
      const inp = ev.target && ev.target.classList && ev.target.classList.contains('inp-nota') ? ev.target : null;
      if (!inp) return;
      ev.preventDefault();
      inp.blur();
    });

    tabla.querySelectorAll('tbody tr[data-alumno]').forEach(tr => {
      const alumnoId = tr.dataset.alumno;

      tr.querySelectorAll('.inp-nota').forEach(inp => {
        // Único camino para escribir una nota: leer, validar, recortar y guardar
        // EN EL MODELO, y por último pintar desde el modelo. El `max` del HTML es
        // solo una pista del navegador (no impide teclear de más) y `calc.js` NO
        // recorta: si aquí entrara un 7 en un apartado de 1, la nota del
        // instrumento saldría disparada ((7/1)*10 = 70). Por eso el recorte vive
        // aquí, en la única puerta de entrada.
        inp.addEventListener('input', () => {
          const td = inp.closest('td');
          const apartadoId = td.dataset.apartado;
          // El máximo se lee del MODELO (ap.maxPts), no de la propiedad `max` del
          // input: la propiedad no es fiable en todos los entornos y el modelo es
          // la fuente de verdad.
          const ap = inst.apartados.find(a => a.id === apartadoId);
          const max = ap ? parseFloat(ap.maxPts) : NaN;
          const texto = inp.value.trim();
          if (!Storage.db.registros[inst.id]) Storage.db.registros[inst.id] = {};
          if (!Storage.db.registros[inst.id][alumnoId]) Storage.db.registros[inst.id][alumnoId] = {};
          const regAlu = Storage.db.registros[inst.id][alumnoId];
          if (texto === '') {
            delete regAlu[apartadoId];
          } else {
            const num = parseFloat(texto.replace(',', '.'));
            // Un texto que no es un número («-», letras) no es un dato: no se
            // guarda ni se pisa lo que ya hubiera. La celda se marca mientras
            // dure, para no dejar un valor fantasma sin avisar.
            if (isNaN(num) || num < 0) {
              inp.classList.add('nota-invalida');
              notaFila(tr);
              return;
            }
            inp.classList.remove('nota-invalida');
            if (!isNaN(max) && num > max) {
              // No se acepta nunca un valor por encima del máximo: se recorta en
              // el MODELO (no solo en el DOM, que era el fallo del valor fantasma)
              // y se avisa una vez, no en cada tecla.
              regAlu[apartadoId] = max;
              inp.value = max;
              avisarRecorte(max);
            } else {
              regAlu[apartadoId] = num;
            }
          }
          persistir();
          notaFila(tr);
        });
      });

      tr.querySelectorAll('.segmentos button').forEach(btn => {
        btn.onclick = () => {
          const td = btn.closest('td');
          const apartadoId = td.dataset.apartado;
          if (!Storage.db.registros[inst.id]) Storage.db.registros[inst.id] = {};
          if (!Storage.db.registros[inst.id][alumnoId]) Storage.db.registros[inst.id][alumnoId] = {};
          const regAlu = Storage.db.registros[inst.id][alumnoId];
          if (btn.classList.contains('on')) {
            delete regAlu[apartadoId];
            btn.classList.remove('on');
          } else {
            td.querySelectorAll('button.on').forEach(x => x.classList.remove('on'));
            btn.classList.add('on');
            regAlu[apartadoId] = parseFloat(btn.dataset.val);
          }
          Storage.save();
          notaFila(tr);
        };
      });

      notaFila(tr);
    });

    const filas = [...tabla.querySelectorAll('tbody tr[data-alumno]')];
    const navInfo = el.querySelector('#nav-info');
    let idx = 0;

    // Al llegar desde fuera (tocar una nota en la Cuadrícula) se arranca en el
    // alumno tocado, no en el primero. Si el id no está en este instrumento
    // (no aplica a ese alumno, p. ej. un nivel ACI) se cae al primero.
    const idxInicial = () => {
      if (!alumnoId) return 0;
      const k = filas.findIndex(tr => tr.dataset.alumno === alumnoId);
      return k < 0 ? 0 : k;
    };

    function pintaNav() {
      if (!filas.length) return;
      const a = alumnos[idx];
      navInfo.innerHTML = `Alumno <b>${idx + 1}</b> de <b>${filas.length}</b> · ${Utils.esc(a.apellidos)}, ${Utils.esc(a.nombre)}`;
    }

    function irA(i, opciones) {
      const op = opciones || {};
      if (!filas.length) return;
      idx = Math.max(0, Math.min(filas.length - 1, i));
      filas.forEach((tr, k) => tr.classList.toggle('fila-actual', k === idx));
      if (op.scroll !== false && filas[idx].scrollIntoView) filas[idx].scrollIntoView({ block: 'center', behavior: 'smooth' });
      const primer = filas[idx].querySelector('.inp-nota');
      if (primer && op.foco !== false) primer.focus({ preventScroll: true });
      pintaNav();
    }

    if (filas.length) {
      el.querySelector('#btn-anterior').onclick = () => { Storage.save(); irA(idx - 1); };
      el.querySelector('#btn-siguiente').onclick = () => {
        Storage.save();
        if (idx >= filas.length - 1) UI.toast('Era el último alumno; notas guardadas');
        irA(idx + 1);
      };
      filas.forEach((tr, k) => tr.addEventListener('click', () => irA(k, { scroll: false, foco: false })));
      // Si venimos de tocar una nota concreta, hay que dejar visible ese alumno
      // (puede ser el 20 de 25); si no, se mantiene el arranque sin scroll.
      irA(idxInicial(), alumnoId ? { foco: false } : { scroll: false, foco: false });
    } else {
      const barra = el.querySelector('#barra-nav');
      if (barra) barra.remove();
    }
  }

  function duplicarInstrumento(inst) {
    const niveles = Calc.nivelesAciDeClase(inst.claseId).filter(n => n.codigo !== inst.nivel);
    const cuerpo = niveles.length ? `
      <div class="aviso">Se creará una copia de <b>${Utils.esc(inst.titulo)}</b> (mismos apartados y criterios${inst.unidad ? `, misma unidad <b>${Utils.esc(inst.unidad)}</b>` : ''}) por cada nivel marcado, con las notas en blanco.</div>
      <label class="campo"><span>Nivel(es) de la copia</span>
        <div class="chips" data-campo="niveles-dup">${niveles.map(n =>
          `<label class="chip"><input type="checkbox" value="${Utils.esc(n.codigo)}">${Utils.esc(n.etiqueta || n.codigo)}</label>`).join('')}</div>
      </label>`
      : '<div class="aviso">Esta clase no tiene niveles ACI disponibles. Añádelos con el botón <b>ACI</b> en «Asignaturas y clases».</div>';
    const mbody = UI.openModal({
      titulo: 'Examen paralelo',
      cuerpo,
      textoGuardar: niveles.length ? 'Crear copias' : 'Cerrar',
      alGuardar(body) {
        if (!niveles.length) return;
        const elegidos = UI.valoresChips(body.querySelector('[data-campo=niveles-dup]'));
        if (!elegidos.length) { alert('Marca al menos un nivel'); return false; }
        const copias = elegidos.map(codigo => {
          const copia = {
            id: Utils.uid(),
            claseId: inst.claseId,
            tipo: inst.tipo,
            titulo: `${inst.titulo} (${Calc.etiquetaNivel(inst.claseId, codigo)})`,
            fecha: inst.fecha,
            periodo: inst.periodo,
            saberes: inst.saberes,
            unidad: inst.unidad,
            nivel: codigo,
            niveles: (inst.niveles || []).map(n => ({ pct: n.pct, descriptor: n.descriptor })),
            criteriosModo: inst.criteriosModo || 'desglosado',
            criterioIdsGlobal: (inst.criterioIdsGlobal || []).slice(),
            apartados: (inst.apartados || []).map(ap => ({
              id: Utils.uid(),
              orden: ap.orden,
              descripcion: ap.descripcion,
              maxPts: ap.maxPts,
              criterioIds: (ap.criterioIds || []).slice(),
              peso: ap.peso,
              niveles: (ap.niveles || []).map(n => ({ pct: n.pct, descriptor: n.descriptor }))
            }))
          };
          // La copia cambia de nivel: sus criterios deben ser los del currículo
          // de ese nivel, no los del original (puede ser de otro ciclo). Se
          // reapuntan por número de criterio; las notas nacen en blanco.
          Calc.repararCriteriosDeInstrumento(Storage.db, copia);
          return copia;
        });
        const sinPar = copias.filter(c => Calc.criteriosFueraDeNivel(Storage.db, c).length);
        if (sinPar.length) {
          alert('No se puede crear el examen paralelo de: ' +
            sinPar.map(c => Calc.etiquetaNivel(inst.claseId, c.nivel)).join(', ') +
            '.\n\nAlguno de los criterios del original no tiene equivalente en ese currículo. ' +
            'Crea esos criterios en «Currículo» (o duplica a un nivel con la misma estructura) y vuelve a intentarlo.');
          return false;
        }
        copias.forEach(c => Storage.db.instrumentos.push(c));
        Storage.save();
        UI.toast('Creado(s): ' + copias.map(c => c.titulo).join(', '));
      }
    });
    UI.wireChips(mbody);
  }

  // Texto de ayuda con los descriptores de un ítem (para el title de la corrección).
  function descripcionNiveles(inst, ap) {
    return Calc.nivelesDeApartado(inst, ap)
      .map((nv, k) => `Nivel ${k + 1} (${nv.pct}%): ${nv.descriptor || '—'}`)
      .join(' · ');
  }

  // Instrucciones listas para pegar en cualquier chat de IA (plantillas/rubrica-para-ia.md).
  // Los huecos (___) son para que cada docente los rellene a su gusto.
  function promptIa(asignatura, criterios) {
    const codigos = criterios.length
      ? criterios.map(c => `  - ${c.codigo} — ${c.descripcion}`).join('\n')
      : '  (Esta asignatura aún no tiene criterios: créalos en la vista Currículo.)';
    return `Actúa como docente experto en evaluación por rúbricas conforme a la LOMLOE (Primaria, Cantabria). Genera una rúbrica a partir de mis datos.

Devuelve EXCLUSIVAMENTE un objeto JSON válido, sin texto antes ni después y sin comentarios:

{
  "tipo": "rubrica-evalcrit",
  "version": 1,
  "titulo": "___",
  "unidad": "___",
  "nivel": "",
  "items": [
    {
      "criterio": "___",
      "peso": 1,
      "criterios": ["CODIGO"],
      "niveles": [
        { "pct": 25, "descriptor": "___" },
        { "pct": 50, "descriptor": "___" },
        { "pct": 75, "descriptor": "___" },
        { "pct": 100, "descriptor": "___" }
      ]
    }
  ]
}

Reglas:
- Cada ítem lleva exactamente 4 niveles (pct 25, 50, 75 y 100), de más bajo a más alto.
- "criterio" es el nombre del ítem evaluado (texto breve, en español).
- "peso" es un número mayor que 0: la importancia relativa del ítem.
- "criterios" solo puede usar códigos de la lista de abajo.
- Cada "descriptor" describe qué hace el alumno en ese nivel, con lenguaje observable.

MIS DATOS
- Asignatura: ${asignatura}   Curso: ___
- Ítems que quiero evaluar: ___
- Nivel ACI (déjalo vacío si es para todo el alumnado): ___
- Criterios disponibles (usa SOLO estos códigos):
${codigos}`;
  }

  function copiarAlPortapapeles(texto) {
    if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(texto).then(() => true).catch(() => false);
    }
    return Promise.resolve(false);
  }

  // Importa una rúbrica pegada desde cualquier chat de IA (P-08). Se puede abrir
  // desde el listado o al crear un instrumento de tipo rúbrica (clase/periodo ya
  // elegidos, para no volver a preguntarlos).
  function modalImportarRubrica(claseIdIni, periodoIni) {
    const claseId = claseIdIni || claseSel;
    if (!claseId || !Calc.clase(claseId)) { alert('Primero selecciona una clase'); return; }
    const asig = Calc.asignaturaDeClase(claseId);
    if (!asig) { alert('Error: esta clase no tiene asignatura asociada'); return; }
    const criterios = Calc.criteriosDeClase(claseId);
    const prompt = promptIa(asig.nombre, criterios);
    const mbody = UI.openModal({
      titulo: 'Importar rúbrica creada con IA',
      cuerpo: `
        <div class="aviso">
          Pide la rúbrica a un chat (ChatGPT, Claude, Gemini…): copia las <b>instrucciones</b> de
          abajo, pégalas allí, rellena los huecos <code>___</code> y trae de vuelta su respuesta.
        </div>
        <label class="campo"><span>1 · Instrucciones para la IA (rellena los huecos)</span>
          <textarea id="ia-prompt" rows="9" readonly></textarea></label>
        <div class="acciones" style="margin:-6px 0 12px">
          <button type="button" class="btn btn-mini btn-primario" id="btn-copiar-prompt">Copiar instrucciones</button>
          <button type="button" class="btn btn-mini" id="btn-descargar-prompt">Descargar .txt</button>
          ${criterios.length ? '' : '<small style="align-self:center;color:var(--ko)">No hay criterios en esta asignatura: impórtalos antes desde Currículo.</small>'}
        </div>
        <label class="campo"><span>2 · Respuesta de la IA (pégala aquí)</span>
          <textarea id="ia-json" rows="9" placeholder='{ "tipo": "rubrica-evalcrit", ... }'></textarea></label>
        <label class="campo"><span>Periodo</span>
          <select id="ia-periodo">${PERIODOS.map(p => `<option ${p === periodoIni ? 'selected' : ''}>${p}</option>`).join('')}</select></label>
        <div class="aviso" style="margin:0">
          Se creará una rúbrica en <b>${Utils.esc(asig.nombre)}</b> con tantos ítems y niveles como traiga el texto.
          Si algún código de criterio no existe, no se importará nada y te lo diremos.
        </div>`,
      textoGuardar: 'Importar rúbrica',
      alGuardar(body) {
        const texto = body.querySelector('#ia-json').value.trim();
        if (!texto) { alert('Pega antes la respuesta de la IA.'); return false; }
        let datos;
        try { datos = JSON.parse(texto); }
        catch (e) { alert('El texto pegado no es un JSON válido. Copia la respuesta COMPLETA de la IA, desde la primera llave { hasta la última }.'); return false; }
        try {
          const r = Storage.importarRubrica(datos, claseId, body.querySelector('#ia-periodo').value);
          UI.toast(`Rúbrica importada: ${r.titulo} (${r.items} ítems)`);
        } catch (e) { alert(e.message); return false; }
      }
    });
    mbody.querySelector('#ia-prompt').value = prompt;
    mbody.querySelector('#btn-copiar-prompt').onclick = () => {
      const ta = mbody.querySelector('#ia-prompt');
      copiarAlPortapapeles(prompt).then(ok => {
        if (ok) { UI.toast('Instrucciones copiadas: pégalas en el chat'); return; }
        // Reserva sin permiso de portapapeles: seleccionamos el texto para Ctrl+C.
        ta.removeAttribute('readonly');
        ta.focus();
        ta.select();
        let copiado = false;
        try { copiado = document.execCommand('copy'); } catch (e) { copiado = false; }
        ta.setAttribute('readonly', '');
        UI.toast(copiado ? 'Instrucciones copiadas' : 'Ya está seleccionado: pulsa Ctrl+C (o mantén pulsado y Copiar)');
      });
    };
    mbody.querySelector('#btn-descargar-prompt').onclick = () => {
      const blob = new Blob([prompt], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'instrucciones-rubrica.txt';
      document.body.appendChild(a);
      a.click();
      a.remove();
    };
  }

  function render(el) {
    const db = Storage.db;
    if (!claseSel || !Calc.clase(claseSel)) claseSel = db.clases.length ? db.clases[0].id : null;

    if (!db.clases.length) {
      el.innerHTML = `<section class="card"><div class="vacio-grande">
        <strong>No hay clases todavía</strong>
        Crea una asignatura y una clase para empezar a evaluar.
      </div></section>`;
      return;
    }

    const lista = instrumentosDe();
    const visibles = perSel === 'Todos' ? lista : lista.filter(i => i.periodo === perSel);
    const periodosMostrados = perSel === 'Todos' ? PERIODOS : [perSel];

    const secciones = periodosMostrados.map(p => {
      const delPeriodo = visibles.filter(i => i.periodo === p);
      const uds = Calc.unidadesDe(delPeriodo);
      const grupos = uds.map(u => ({ u, insts: Calc.instrumentosDeUnidad(delPeriodo, u) }));
      const sinUnidad = delPeriodo.filter(i => !i.unidad);
      if (sinUnidad.length) grupos.push({ u: '', insts: sinUnidad });

      const titulo = perSel === 'Todos'
        ? `<h3 class="per-titulo">${p} <small>${delPeriodo.length} instrumento${delPeriodo.length === 1 ? '' : 's'}</small></h3>`
        : '';
      const cuerpo = grupos.length
        ? grupos.map(g => bloqueUnidad(p, g.u, g.insts)).join('')
        : `<div class="aviso">Sin instrumentos en ${p}.</div>`;
      return titulo + cuerpo;
    }).join('');

    const selPer = `<select id="sel-per" title="Ver un trimestre concreto" style="max-width:190px">
      <option value="Todos" ${perSel === 'Todos' ? 'selected' : ''}>Todos los trimestres</option>
      ${PERIODOS.map(p => `<option value="${p}" ${perSel === p ? 'selected' : ''}>${p}</option>`).join('')}
    </select>`;

    el.innerHTML = `
      <section class="card">
        <div class="card-head">
          <h2>Instrumentos de evaluación</h2>
          <select id="sel-clase" style="max-width:280px">${UI.selectHtml(db.clases.map(c => ({
            id: c.id,
            nombre: `${Calc.asignaturaDeClase(c.id)?.nombre || '?'} · ${(Calc.byId(db.grupos, c.grupoId) || {}).nombre || '?'}`
          })), claseSel, 'id', 'nombre')}</select>
          ${lista.length ? selPer : ''}
          <div class="acciones">
            <button class="btn btn-primario" id="add-inst">Nuevo instrumento</button>
            <button class="btn" id="btn-banco" title="Reutilizar un instrumento guardado (otra clase o el curso siguiente)">Añadir desde el banco${(db.bancoInstrumentos || []).length ? ' (' + db.bancoInstrumentos.length + ')' : ''}</button>
          </div>
        </div>
        ${lista.length ? secciones : '<div class="aviso">Sin instrumentos en esta clase.</div>'}
      </section>`;

    el.querySelector('#sel-clase').onchange = e => { claseSel = e.target.value; perSel = 'Todos'; udsAbiertas.clear(); render(el); };
    if (el.querySelector('#sel-per')) {
      el.querySelector('#sel-per').onchange = e => { perSel = e.target.value; render(el); };
    }
    el.querySelector('#add-inst').onclick = () => modalInstrumento(null);
    el.querySelector('#btn-banco').onclick = () => modalBanco(el);

    el.querySelectorAll('[data-ud-clave]').forEach(b => {
      b.onclick = () => {
        const clave = b.dataset.udClave;
        if (udsAbiertas.has(clave)) udsAbiertas.delete(clave); else udsAbiertas.add(clave);
        render(el);
      };
    });

    el.querySelectorAll('tr[data-inst]').forEach(tr => {
      const inst = Calc.instrumento(tr.dataset.inst);
      tr.querySelector('.corregir').onclick = () => renderCorreccion(el, inst.id);
      tr.querySelector('.editar').onclick = () => modalInstrumento(inst);
      tr.querySelector('.duplicar').onclick = () => duplicarInstrumento(inst);
      tr.querySelector('.al-banco').onclick = () => guardarAlBanco(el, inst);
      tr.querySelector('.borrar-inst').onclick = () => borrarInstrumento(el, inst);
    });
  }

  // API pública de la vista: las demás vistas solo deben usar esto (D-29).
  return { render, renderCorreccion, modalInstrumento, modalCalificar, filasCorregirHtml, filaApartado, cabeceraRubrica, plantillaColumnas, columnasNivel, promptIa, datalistUnidades, modalBanco };
})();

</script>
<script>
'use strict';

// Pestaña «Informe» de la Cuadrícula (D-59): análisis de criterios, hallazgos
// accionables y distribución de notas. Módulo autocontenido: solo lee datos a
// través de Calc, no escribe en Storage. Para eliminar la funcionalidad basta
// con quitar esta entrada de index.html.
const InformeView = (function () {
  // Estado del módulo. Se restablece al cambiar de clase.
  let claseSel = null;
  let nivelSel = '';
  let alcance = { periodo: '', unidad: '', instrumentoId: '' };
  let subVista = 'hallazgos'; // 'hallazgos' | 'criterios' | 'distribucion' | 'alumnos'
  let contenedor = null;

  function esTodas(nv) {
    const v = String(nv == null ? '' : nv).trim();
    if (!v) return false;
    return v === '__todas__' || v === 'TODAS' || v === 'todos' || v === 'Todos' || v === 'TODO' || v === 'todo';
  }

  // ---------------------------------------------------------------- alcance
  // Selector en cascada: trimestre → unidad didáctica → instrumento. Encima
  // va la clase analizada, para que el selector de clase de la cabecera de
  // la cuadrícula tenga una respuesta visible en el propio informe.
  function htmlAlcance(claseId) {
    const f = {};
    if (alcance.periodo) f.periodo = alcance.periodo;
    if (alcance.unidad) f.unidad = alcance.unidad;
    const instsBase = Calc.instrumentosAlcance(claseId, f);
    const uds = Calc.unidadesDe(instsBase);
    const instsUd = alcance.unidad
      ? instsBase.filter(i => i.unidad === alcance.unidad)
      : instsBase;

    const asig = Calc.asignaturaDeClase(claseId);
    const cl = Calc.clase(claseId);
    const gru = cl ? Calc.byId(Storage.db.grupos, cl.grupoId) : null;
    const nivelTxt = esTodas(nivelSel)
      ? 'todos los niveles'
      : (Calc.etiquetaNivel(claseId, nivelSel) || 'Base');

    return `
      <div class="no-print" style="color:var(--tinta-suave);font-size:13px;margin-bottom:8px">
        <b style="color:var(--tinta)">${Utils.esc(asig ? asig.nombre : '¿?')}</b>
        · ${Utils.esc(gru ? gru.nombre : '¿?')} · ${Utils.esc(nivelTxt)}
      </div>
      <div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        <select id="alc-periodo" title="Analizar todo el curso o un trimestre" style="max-width:160px">
          <option value="">Todo el curso</option>
          ${['T1', 'T2', 'T3'].map(p =>
            `<option value="${p}" ${alcance.periodo === p ? 'selected' : ''}>${p}</option>`).join('')}
        </select>
        ${uds.length > 0 ? `
        <select id="alc-unidad" title="Filtrar por unidad didáctica" style="max-width:200px">
          <option value="">Todas las unidades</option>
          ${uds.map(u =>
            `<option value="${Utils.esc(u)}" ${alcance.unidad === u ? 'selected' : ''}>${Utils.esc(u || '(sin unidad)')}</option>`).join('')}
        </select>` : ''}
        ${instsUd.length > 0 ? `
        <select id="alc-instrumento" title="Analizar un solo instrumento" style="max-width:230px">
          <option value="">Todos los instrumentos</option>
          ${instsUd.map(i =>
            `<option value="${i.id}" ${alcance.instrumentoId === i.id ? 'selected' : ''}>${Utils.esc(i.titulo)}</option>`).join('')}
        </select>` : ''}
      </div>`;
  }

  // ------------------------------------------------------------- subvistas
  function htmlSubVista() {
    const vistas = [
      { id: 'hallazgos', nombre: 'Hallazgos' },
      { id: 'criterios', nombre: 'Criterios' },
      { id: 'distribucion', nombre: 'Distribución' },
      { id: 'alumnos', nombre: 'Alumnos' }
    ];
    return `
      <div class="chips no-print" style="margin-bottom:14px">
        ${vistas.map(v =>
          `<label class="chip ${subVista === v.id ? 'on' : ''}" data-subvista="${v.id}">${v.nombre}</label>`).join('')}
        <button class="btn" id="btn-informe-pdf" title="Pasar a PDF todas las subvistas del informe"
                style="margin-left:auto">Imprimir / PDF</button>
      </div>`;
  }

  // Instrumentos del alcance activo (trimestre → UD → instrumento).
  function instsAlcance() {
    const f = {};
    if (alcance.periodo) f.periodo = alcance.periodo;
    if (alcance.unidad) f.unidad = alcance.unidad;
    if (alcance.instrumentoId) f.instrumentoId = alcance.instrumentoId;
    return Calc.instrumentosAlcance(claseSel, f);
  }

  // ------------------------------------------------------------ hallazgos
  // Cada nivel (base + cada ACI) se analiza por separado y cada hallazgo lleva
  // su etiqueta de nivel. El nivel activo decide qué niveles se analizan —igual
  // que en Criterios o Distribución— así que el selector de nivel de la
  // cabecera de la cuadrícula también vale aquí. Se presentan en dos tablas
  // —criterios y preguntas— con barra de porcentaje y filtro de severidad,
  // más legible que tarjetas de texto.
  let filtroSev = 'todos'; // 'todos' | 'critico' | 'atencion'

  // El nivel del selector puede llegar como código ACI (p. ej. '3', '4') o
  // ya normalizado; se compara siempre normalizado para no fallar por mayúsculas
  // o espacios (misma regla que el resto de la app: Calc.nivelNorm).
  function htmlHallazgos(claseId, insts) {
    const nivelesAci = Calc.nivelesAciDeClase(claseId);
    const niveles = [
      { codigo: '', etiqueta: 'Base', criterios: Calc.criteriosDeClase(claseId) }
    ].concat(nivelesAci.map(nv => ({
      codigo: nv.codigo,
      etiqueta: nv.etiqueta || nv.codigo,
      criterios: Calc.criteriosDeNivel(claseId, nv.codigo)
    })));
    const nvNormSel = Calc.nivelNorm ? Calc.nivelNorm(nivelSel) : String(nivelSel || '').trim().toUpperCase();
    const seleccion = esTodas(nivelSel)
      ? niveles
      : niveles.filter(nv => {
          const nvNorm = Calc.nivelNorm ? Calc.nivelNorm(nv.codigo) : String(nv.codigo || '').trim().toUpperCase();
          return nvNorm === nvNormSel;
        });

    const critsPorNivel = [];
    for (const nv of seleccion) {
      Calc.hallazgos(claseId, insts, nv.criterios).forEach(h => {
        if (h.tipo === 'criterio') {
          h.nivelEtiqueta = nv.etiqueta;
          critsPorNivel.push(h);
        }
      });
    }
    const pregGlobal = Calc.hallazgos(claseId, insts, []).filter(h => h.tipo === 'pregunta');
    pregGlobal.forEach(h => { if (!h.nivelEtiqueta) h.nivelEtiqueta = '—'; });
    const todosH = critsPorNivel.concat(pregGlobal);
    if (!todosH.length) {
      return '<div class="aviso">No se han detectado problemas significativos en este alcance.</div>';
    }
    const nCrit = todosH.filter(h => h.nivel === 'critico').length;
    const nAten = todosH.filter(h => h.nivel === 'atencion').length;
    const visibles = filtroSev === 'todos' ? todosH : todosH.filter(h => h.nivel === filtroSev);

    // Cabecera: resumen de severidad + chips de filtro.
    const resumen = `
      <div class="no-print" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px">
        <span style="font-size:13px"><b style="color:var(--ko)">●</b> ${nCrit} crítico${nCrit === 1 ? '' : 's'}</span>
        <span style="font-size:13px"><b style="color:var(--aviso)">●</b> ${nAten} de atención</span>
        <span class="chips" style="margin:0">
          ${[['todos', 'Todos'], ['critico', 'Críticos'], ['atencion', 'Atención']].map(v =>
            `<label class="chip ${filtroSev === v[0] ? 'on' : ''}" data-filtrosev="${v[0]}">${v[1]}</label>`).join('')}
        </span>
      </div>`;

    // Barra horizontal: longitud = porcentaje, color = severidad.
    const barra = h => `
      <div style="display:flex;align-items:center;gap:8px">
        <div style="flex:1;min-width:70px;height:12px;background:var(--na-suave);
                    border-radius:6px;overflow:hidden">
          <div style="width:${h.pct}%;height:100%;
                      background:${h.nivel === 'critico' ? 'var(--ko)' : 'var(--aviso)'}"></div>
        </div>
        <b style="min-width:36px;text-align:right;font-size:13px">${h.pct}%</b>
      </div>`;

    const badgeNivel = h =>
      `<span class="badge info" style="font-size:11px;white-space:nowrap">${Utils.esc(h.nivelEtiqueta)}</span>`;

    const tabla = (cab, filas) => `
      <table class="tabla">
        <thead><tr>${cab.map(c => `<th>${c}</th>`).join('')}</tr></thead>
        <tbody>${filas.join('')}</tbody>
      </table>`;

    const tit = (nom, n) =>
      `<h3 style="margin:16px 0 8px;font-size:14px">${nom}
         <small style="color:var(--tinta-suave);font-weight:400">(${n})</small></h3>`;

    const crits = visibles.filter(h => h.tipo === 'criterio');
    const htmlCrits = crits.length ? tit('Criterios con dificultades', crits.length)
      + tabla(['Nivel', 'Criterio', 'Alumnado por debajo del 50%'], crits.map(h => {
        const c = Calc.criterio(h.criterioId);
        return `<tr>
          <td>${badgeNivel(h)}</td>
          <td><b>${Utils.esc(h.codigo)}</b>
              <span style="color:var(--tinta-suave)">${c ? Utils.esc(c.descripcion) : ''}</span></td>
          <td style="min-width:170px">${barra(h)}</td>
        </tr>`;
      })) : '';

    const pregs = visibles.filter(h => h.tipo === 'pregunta');
    const htmlPregs = pregs.length ? tit('Preguntas con fallos', pregs.length)
      + tabla(['Pregunta', 'Instrumento', 'Alumnado con fallo'], pregs.map(h => `
        <tr>
          <td>${Utils.esc(h.pregunta)}</td>
          <td style="color:var(--tinta-suave)">${Utils.esc(h.titulo)}</td>
          <td style="min-width:170px">${barra(h)}</td>
        </tr>`)) : '';

    if (!visibles.length) {
      return resumen + '<div class="aviso">Ningún hallazgo de esta severidad en este alcance.</div>';
    }
    return resumen + htmlCrits + htmlPregs;
  }

  // -------------------------------------------------------------- criterios
  // Una tabla por nivel (Base y cada ACI): cada grupo se analiza con SUS
  // criterios y su propia media, porque el currículo de cada ACI es distinto
  // y mezclarlos deja las celdas del otro currículo en blanco.
  // Dos modos: Absoluto (logro vs 50%) y Relativo (vs media del grupo).
  let modoCriterios = 'absoluto'; // 'absoluto' | 'relativo'

  // Datos de un nivel: sus criterios como columnas y solo su alumnado como
  // filas. La media se calcula con ese alumnado (la media de la clase mezclaría
  // currículos distintos). Devuelve null si el nivel no tiene nada que ver.
  function datosNivel(claseId, insts, codigo, etiqueta) {
    const alumnos = Calc.alumnosDeClase(claseId)
      .filter(a => Calc.nivelDeAlumno(claseId, a.id) === codigo);
    if (!alumnos.length) return null;
    const ids = new Set(alumnos.map(a => a.id));
    const columnas = Calc.tablaCriteriosInforme(claseId, insts,
      Calc.criteriosDeNivel(claseId, codigo))
      .map(f => {
        const filas = f.filas.filter(fl => ids.has(fl.alumno.id));
        const vals = filas.map(fl => fl.logro).filter(v => v != null);
        const media = vals.length ? vals.reduce((s, v) => s + v, 0) / vals.length : null;
        return { criterio: f.criterio, media, filas };
      })
      .filter(f => f.filas.length);
    if (!columnas.length) return null;
    return { etiqueta, alumnos, columnas };
  }

  function htmlCriterios(claseId, insts) {
    const niveles = [{ codigo: '', etiqueta: 'Base' }]
      .concat(Calc.nivelesAciDeClase(claseId)
        .map(nv => ({ codigo: nv.codigo, etiqueta: nv.etiqueta || nv.codigo })));
    const seleccion = esTodas(nivelSel)
      ? niveles
      : niveles.filter(nv => nv.codigo === Calc.nivelNorm(nivelSel));

    const tablas = seleccion
      .map(nv => datosNivel(claseId, insts, nv.codigo, nv.etiqueta))
      .filter(Boolean);

    if (!tablas.length) {
      return '<div class="aviso">Este nivel no tiene criterios de evaluación o no hay datos en este alcance.</div>';
    }

    const toggle = `
      <div class="chips no-print" style="margin-bottom:12px">
        <label class="chip ${modoCriterios === 'absoluto' ? 'on' : ''}" data-modocrit="absoluto">Absoluto (vs 50%)</label>
        <label class="chip ${modoCriterios === 'relativo' ? 'on' : ''}" data-modocrit="relativo">Relativo (vs media)</label>
      </div>`;

    const thCriterio = f => `
      <th style="writing-mode:vertical-rl;text-orientation:mixed;
                 transform:rotate(180deg);height:130px;padding:6px 4px;
                 font-size:12px;white-space:nowrap;max-width:40px;overflow:hidden"
          title="${Utils.esc(f.criterio.descripcion)}">
        ${Utils.esc(f.criterio.codigo)}
      </th>`;

    // Celda para una fila concreta dentro de un criterio. `f.media` es la media
    // del grupo (no de la clase).
    const celda = (f, fl) => {
      if (fl.logro == null) return '<td class="num"><span class="badge na">—</span></td>';
      if (modoCriterios === 'absoluto') {
        const pct = Math.round(fl.logro * 100);
        const cls = fl.logro >= 0.5 ? 'ok' : fl.logro >= 0.4 ? 'warn' : 'ko';
        return `<td class="num"><span class="badge ${cls}">${pct}%</span></td>`;
      }
      if (f.media == null) return '<td class="num"><span class="badge na">—</span></td>';
      const dif = Math.round((fl.logro - f.media) * 100);
      const cls = dif >= 0 ? 'ok' : 'ko';
      return `<td class="num"><span class="badge ${cls}">${dif >= 0 ? '+' : ''}${dif}%</span></td>`;
    };

    const tablaHtml = (g, i) => {
      // Fila de media del grupo.
      const filaMedia = `
        <tr style="font-weight:700;border-top:2px solid #ccc">
          <td>Media del grupo</td>
          ${g.columnas.map(f => {
            if (f.media == null) return '<td class="num">—</td>';
            const pct = Math.round(f.media * 100);
            if (modoCriterios === 'absoluto') {
              const cls = f.media >= 0.5 ? 'ok' : f.media >= 0.4 ? 'warn' : 'ko';
              return `<td class="num"><span class="badge ${cls}">${pct}%</span></td>`;
            }
            // En modo relativo la media es la referencia: se muestra en tono suave.
            return `<td class="num"><span style="color:var(--tinta-suave)">${pct}%</span></td>`;
          }).join('')}
        </tr>`;

      // La descripción de cada criterio no se lista al pie (ocupa mucho): se
      // ve al pasar el ratón sobre su cabecera (atributo `title` del th).

      // Con varias tablas a la vista hace falta un título por tabla.
      const titulo = tablas.length > 1
        ? `<h3 style="margin:18px 0 8px;font-size:14px">${Utils.esc(g.etiqueta)}</h3>`
        : '';

      return `
        ${titulo}
        <div class="scroll-x">
          <table class="tabla tabla-cuadricula">
            <thead><tr><th>Alumno</th>${g.columnas.map(thCriterio).join('')}</tr></thead>
            <tbody>
              ${g.alumnos.map(a => `
                <tr>
                  <td>${Utils.esc(a.apellidos)}, ${Utils.esc(a.nombre)}</td>
                  ${g.columnas.map(f => {
                    const fl = f.filas.find(x => x.alumno.id === a.id);
                    return fl ? celda(f, fl) : '<td class="num">—</td>';
                  }).join('')}
                </tr>`).join('')}
              ${filaMedia}
            </tbody>
          </table>
        </div>`;
    };

    return toggle + tablas.map(tablaHtml).join('');
  }

  // ----------------------------------------------------------- distribución
  // Una barra por nota (sin agrupar), con línea punteada en el 5 (corte del
  // aprobado). Eje X = nota (0–10), altura proporcional a la nota.
  // `nivelFiltro`: undefined = todo el grupo; '' = base; otro = ese nivel ACI.
  function htmlDistribucion(claseId, insts, nivelFiltro) {
    const dist = Calc.distribucionNotas(claseId, insts, nivelFiltro);
    const filtrado = nivelFiltro !== undefined;
    const mediaTxt = filtrado
      ? `Media del alumnado de <b>${Utils.esc(Calc.etiquetaNivel(claseId, nivelFiltro))}</b>`
      : 'Media de todo el grupo';
    const avisoTxt = filtrado
      ? `No hay notas del alumnado de <b>${Utils.esc(Calc.etiquetaNivel(claseId, nivelFiltro))}</b> en este alcance.`
      : 'No hay notas de todo el grupo en este alcance.';
    if (!dist.notas.length) return `<div class="aviso">${avisoTxt}</div>`;
    const media = Math.round(dist.media * 10) / 10;
    const notas = dist.notas.slice().sort((a, b) => a - b);
    const ALTO = 180; // px máximos de barra

    return `
      <p style="margin-bottom:${filtrado ? 4 : 14}px"><strong>${mediaTxt}:</strong> ${media} / 10</p>
      ${filtrado ? '<p class="no-print" style="margin-bottom:14px;font-size:12px;color:var(--tinta-suave)">Nivel filtrado con el selector superior de la cuadrícula.</p>' : ''}
      <div style="position:relative;height:${ALTO + 28}px;
                  border-bottom:2px solid #ccc;margin-bottom:4px">
        ${notas.map(n => {
          const h = Math.max(4, Math.round((n / 10) * ALTO));
          const x = (n / 10 * 100).toFixed(2);
          const color = n >= 5 ? 'var(--acento, #4a90d9)' : '#dc3545';
          return `
            <div style="position:absolute;bottom:0;left:${x}%;
                        transform:translateX(-50%);
                        width:10px;height:${h}px;
                        background:${color};border-radius:3px 3px 0 0"
                 title="${Math.round(n * 10) / 10}"></div>`;
        }).join('')}
        <div style="position:absolute;top:0;bottom:0;left:50%;
                    border-left:2px dashed #888"></div>
        <span style="position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);
                     font-size:11px;color:#888">5 (aprobado)</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--tinta-suave)">
        <span>0</span><span>2</span><span>4</span><span>6</span><span>8</span><span>10</span>
      </div>
      <p style="margin-top:14px;font-size:13px;color:var(--tinta-suave)">
        Cada barra es un alumno · ${notas.filter(n => n >= 5).length} de ${notas.length} aprueban (${Math.round(notas.filter(n => n >= 5).length / notas.length * 100)}%)
      </p>`;
  }

  // --------------------------------------------------------------- alumnos
  // Resumen accionable («¿con quién hablo mañana?»): cada alumno con SU
  // nivel, SU nota en el alcance y los criterios que van por debajo del 50%
  // (el mismo umbral que los hallazgos). Ordenado por riesgo: más criterios
  // primero y, a igualdad, nota más baja. `nivelFiltro` actúa como en
  // Distribución: undefined = todos los niveles.
  const UMB_RIESGO = 0.5;

  function htmlAlumnos(claseId, insts, nivelFiltro) {
    let alumnos = Calc.alumnosDeClase(claseId);
    if (nivelFiltro !== undefined && nivelFiltro !== null) {
      const nv = Calc.nivelNorm(nivelFiltro);
      alumnos = alumnos.filter(a => Calc.nivelDeAlumno(claseId, a.id) === nv);
    }
    if (!alumnos.length) return '<div class="aviso">No hay alumnado en esta clase.</div>';

    const filas = alumnos.map(a => {
      const criterios = Calc.criteriosDeAlumno(claseId, a.id);
      const bajo = criterios
        .map(c => ({ criterio: c, logro: Calc.logroCriterioEnInsts(c.id, claseId, a.id, insts) }))
        .filter(x => x.logro != null && x.logro < UMB_RIESGO);
      return {
        alumno: a,
        nivel: Calc.etiquetaNivel(claseId, Calc.nivelDeAlumno(claseId, a.id)),
        nota: Calc.notaEnInsts(claseId, a.id, insts),
        bajo
      };
    });

    const enRiesgo = filas.filter(f => f.bajo.length)
      .sort((x, y) => y.bajo.length - x.bajo.length
        || (x.nota == null ? 99 : x.nota) - (y.nota == null ? 99 : y.nota));
    const tranquilos = filas.length - enRiesgo.length;

    const resumen = `
      <p style="margin-bottom:12px"><strong>${enRiesgo.length} de ${filas.length}</strong>
        alumnos con criterios por debajo del 50% en este alcance.</p>`;

    if (!enRiesgo.length) {
      return resumen + '<div class="aviso">Ningún alumno tiene criterios por debajo del 50% en este alcance.</div>';
    }

    return resumen + `
      <div class="scroll-x">
        <table class="tabla">
          <thead><tr>
            <th>Alumno</th><th>Nivel</th><th class="num">Nota</th>
            <th class="num">Criterios bajo 50%</th><th>Criterios con dificultad</th>
          </tr></thead>
          <tbody>
            ${enRiesgo.map(f => `
              <tr>
                <td>${Utils.esc(f.alumno.apellidos)}, ${Utils.esc(f.alumno.nombre)}</td>
                <td><span class="badge info" style="font-size:11px;white-space:nowrap">${Utils.esc(f.nivel || 'Base')}</span></td>
                <td class="num">${Calc.badgeHtml(f.nota)}</td>
                <td class="num"><span class="badge ${f.bajo.length >= 2 ? 'ko' : 'warn'}">${f.bajo.length}</span></td>
                <td>${f.bajo.map(x =>
                  `<span class="badge ${x.logro < 0.3 ? 'ko' : 'warn'}" style="font-size:11px;margin-right:4px"
                         title="${Utils.esc(x.criterio.descripcion)}">${Utils.esc(x.criterio.codigo)} ${Math.round(x.logro * 100)}%</span>`).join('')}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <p style="color:var(--tinta-suave);font-size:13px;margin-top:10px">
        ${tranquilos} alumno(s) sin criterios por debajo del 50%. Cada alumno se valora con los criterios de SU nivel.
      </p>`;
  }

  // Informe de análisis para PDF: todas las subvistas compuestas —hallazgos,
  // criterios, distribución y alumnos— con cabecera de clase y alcance. Devuelve
  // un string puro (comprobable sin navegador); el botón «Imprimir / PDF» se lo
  // pasa al contenedor de impresión de la Cuadrícula (opciones.imprimir).
  function informeHtml() {
    if (!claseSel) return '';
    const insts = instsAlcance();
    const gru = Calc.byId(Storage.db.grupos, (Calc.clase(claseSel) || {}).grupoId);
    const asig = Calc.asignaturaDeClase(claseSel);
    const alcanceTxt = [
      alcance.periodo ? 'Trimestre ' + alcance.periodo : 'Todo el curso',
      alcance.unidad,
      alcance.instrumentoId ? (Calc.instrumento(alcance.instrumentoId) || {}).titulo : ''
    ].filter(Boolean).map(t => Utils.esc(t));
    const nivelTxt = esTodas(nivelSel) ? 'Todos los niveles' : (Calc.etiquetaNivel(claseSel, nivelSel) || 'Base');
    const bloque = (titulo, cuerpo) => `
      <section class="informe-seccion">
        <h2 class="informe-titulo">${titulo}</h2>
        ${cuerpo}
      </section>`;
    return `<div class="informe-cab">
        <strong>Informe de análisis · ${Utils.esc(asig ? asig.nombre : '¿?')}</strong>
        <span>${Utils.esc(gru ? gru.nombre : '¿?')} · nivel: ${Utils.esc(nivelTxt)} · ${alcanceTxt.join(' · ')} · impreso el ${Utils.hoy().split('-').reverse().join('/')}</span>
      </div>
      ${bloque('Hallazgos', htmlHallazgos(claseSel, insts))}
      ${bloque('Criterios', htmlCriterios(claseSel, insts))}
      ${bloque('Distribución', htmlDistribucion(claseSel, insts, esTodas(nivelSel) ? undefined : nivelSel))}
      ${bloque('Alumnos en riesgo', htmlAlumnos(claseSel, insts, esTodas(nivelSel) ? undefined : nivelSel))}`;
  }

  // ---------------------------------------------------------------- render
  function render(el, opciones) {
    // Al cambiar de clase se restablece el alcance.
    if (opciones.claseSel !== claseSel) {
      claseSel = opciones.claseSel;
      alcance = { periodo: '', unidad: '', instrumentoId: '' };
    }
    // Si la cuadrícula nos pasa un periodo (T1/T2/T3/Final), sincronízalo con
    // el alcance del informe. «Final» no es un periodo propio del informe: se
    // trata como «todo el curso» (sin filtro por trimestre).
    if (typeof opciones.periodo === 'string') {
      alcance.periodo = ['T1', 'T2', 'T3'].indexOf(opciones.periodo) !== -1
        ? opciones.periodo
        : '';
    }
    nivelSel = opciones.nivelSel || '';
    contenedor = el;

    if (!claseSel || !Calc.clase(claseSel)) {
      el.innerHTML = '<div class="aviso">Selecciona una clase para ver el informe.</div>';
      return;
    }

    const insts = instsAlcance();
    const todas = esTodas(nivelSel);

    // Criterios decide sus tablas según el nivel; Distribución filtra el
    // alumnado por el mismo nivel; Hallazgos analiza cada nivel seleccionado
    // y lo etiqueta (las preguntas globales no tienen nivel); Alumnos ordena
    // por riesgo.
    el.innerHTML = `
      ${htmlAlcance(claseSel)}
      ${htmlSubVista()}
      <div id="informe-cuerpo">
        ${subVista === 'hallazgos' ? htmlHallazgos(claseSel, insts)
          : subVista === 'criterios' ? htmlCriterios(claseSel, insts)
          : subVista === 'distribucion' ? htmlDistribucion(claseSel, insts, todas ? undefined : nivelSel)
          : htmlAlumnos(claseSel, insts, todas ? undefined : nivelSel)}
      </div>`;

    // --- eventos ---
    const sp = el.querySelector('#alc-periodo');
    if (sp) sp.onchange = e => {
      alcance.periodo = e.target.value;
      alcance.unidad = '';
      alcance.instrumentoId = '';
      // Mantener sincronizado el periodo de la cuadrícula con el del informe.
      if (opciones && typeof opciones.onPeriodo === 'function') {
        opciones.onPeriodo(e.target.value || '');
      }
      render(el, opciones);
    };
    const su = el.querySelector('#alc-unidad');
    if (su) su.onchange = e => {
      alcance.unidad = e.target.value;
      alcance.instrumentoId = '';
      render(el, opciones);
    };
    const si = el.querySelector('#alc-instrumento');
    if (si) si.onchange = e => {
      alcance.instrumentoId = e.target.value;
      render(el, opciones);
    };
    el.querySelectorAll('[data-subvista]').forEach(ch => {
      ch.onclick = () => { subVista = ch.dataset.subvista; render(el, opciones); };
    });
    el.querySelectorAll('[data-modocrit]').forEach(ch => {
      ch.onclick = () => { modoCriterios = ch.dataset.modocrit; render(el, opciones); };
    });
    el.querySelectorAll('[data-filtrosev]').forEach(ch => {
      ch.onclick = () => { filtroSev = ch.dataset.filtrosev; render(el, opciones); };
    });
    // La Cuadrícula inyecta la función de impresión (opciones.imprimir); sin
    // ella (arnés de pruebas) el botón no hace nada.
    const btnPdf = el.querySelector('#btn-informe-pdf');
    if (btnPdf && opciones.imprimir) {
      btnPdf.onclick = () => opciones.imprimir(informeHtml());
    }
  }

  return { render, informeHtml };
})();

</script>
<script>
const CuadriculaView = (() => {
  let claseSel = null;
  let periodo = 'T1';
  let tab = 'notas';
  let nivelSel = '';
  const TODAS = '__todas__';
  // Unidades cuyas columnas están DESPLEGADAS en la pestaña Instrumentos.
  // El conjunto vacío significa «todas plegadas al entrar» (igual que en la vista
  // Instrumentos), de modo que el gesto que aprende el claustro es el mismo.
  const udsAbiertas = new Set();

  function tablaNotas(alumnos, insts, modoTodas) {
    if (!alumnos.length) {
      return '<div class="aviso">El grupo de esta clase no tiene alumnado en este nivel. Revísalo en «Alumnos y grupos» o en los niveles ACI de la clase.</div>';
    }
    const grupos = [];
    insts.forEach(i => {
      const ud = i.unidad || '';
      let g = grupos.find(x => x.ud === ud);
      if (!g) { g = { ud, insts: [] }; grupos.push(g); }
      g.insts.push(i);
    });
    // La barra de unidad (con su plegado) solo tiene sentido si hay algo que
    // agrupar: varias unidades, o una sola con nombre. Si todo va sin unidad no
    // hay barra, y sin barra no se pliega nada (las columnas se ven siempre).
    const conBarra = grupos.length > 1 || (grupos.length === 1 && grupos[0].ud !== '');
    grupos.forEach(g => { g.plegada = conBarra && !udsAbiertas.has(g.ud); });
    // Una unidad plegada NO borra sus celdas: deja UNA celda por fila que se
    // estira con colspan sobre sus columnas. Si se ocultan de verdad, la fila se
    // queda corta y todo lo que va detrás (cabeceras y la nota final) se desplaza
    // de su columna. Con la celda de relleno la tabla siempre cuadra.
    const cabeceraInst = i => `<th class="celda-nota" data-ud="${Utils.esc(i.unidad || '')}" data-edit="${i.id}" title="Toca para editar el instrumento" style="max-width:130px">${Utils.esc(i.titulo)}<br><small>${Utils.esc(i.tipo)} · ${Utils.esc(i.periodo)}${i.unidad ? ' · ' + Utils.esc(i.unidad) : ''}</small></th>`;
    const barraUd = g => `<th class="ud-grupo plegable" colspan="${g.insts.length}" data-toggle-ud="${Utils.esc(g.ud)}" title="${g.insts.length} instrumento${g.insts.length === 1 ? '' : 's'} · toca para ${g.plegada ? 'ver' : 'ocultar'} sus columnas">` +
      `<span class="ud-flecha">${g.plegada ? '▸' : '▾'}</span>${g.ud ? Utils.esc(g.ud) : 'Sin unidad'}` +
      `<small>${g.plegada ? `(${g.insts.length})` : `${g.insts.length} instrumento${g.insts.length === 1 ? '' : 's'}`}</small></th>`;
    const cabecerasGrupo = g => g.plegada
      ? `<th class="celda-plegada" colspan="${g.insts.length}"></th>`
      : g.insts.map(cabeceraInst).join('');
    const celdasGrupo = (a, g) => g.plegada
      ? `<td class="celda-plegada" colspan="${g.insts.length}"></td>`
      : g.insts.map(i => {
        const ud = `data-ud="${Utils.esc(i.unidad || '')}"`;
        if (modoTodas && !Calc.instrumentoParaAlumno(i, claseSel, a.id)) {
          return `<td class="celda-nota num" ${ud} style="color:var(--tinta-suave);opacity:.35" title="No aplica a este alumno">—</td>`;
        }
        const n = Calc.notaInstrumento(i, a.id);
        return `<td class="celda-nota num" ${ud} data-inst="${i.id}" data-alumno="${Utils.esc(a.id)}">${n == null ? '<span class="badge na">—</span>' : Calc.badgeHtml(n)}</td>`;
      }).join('');
    const thead = conBarra
      ? `<tr class="fila-ud"><th rowspan="2">Alumno</th>${grupos.map(barraUd).join('')}<th rowspan="2">Evaluación</th></tr>
         <tr>${grupos.map(cabecerasGrupo).join('')}</tr>`
      : `<tr><th>Alumno</th>${insts.map(cabeceraInst).join('')}<th>Evaluación</th></tr>`;
    return `
      ${insts.length ? '' : '<div class="aviso">Aún no hay instrumentos en esta clase para este nivel. Créalos en «Instrumentos».</div>'}
      <table class="tabla tabla-cuadricula">
        <thead>${thead}</thead>
        <tbody>
          ${alumnos.map(a => `<tr>
            <td>${Utils.esc(a.apellidos)}, ${Utils.esc(a.nombre)}</td>
            ${grupos.map(g => celdasGrupo(a, g)).join('')}
            <td class="num">${Calc.badgeHtml(Calc.notaEvaluacion(claseSel, a.id, periodo))}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      <p class="no-print" style="color:var(--tinta-suave);font-size:13px">${modoTodas
        ? 'Vista de todo el grupo: cada alumno se evalúa con los criterios de su nivel y la columna «Evaluación» armoniza su nota. «—» en gris = el examen no aplica a ese alumno.'
        : 'La columna «Evaluación» aplica las ponderaciones de los criterios del nivel mostrado' + (periodo === 'Final' ? ' sobre todo el curso' : ' en ' + periodo) + '. Toca una nota para corregir y una cabecera para editar.'}</p>`;
  }

  function tablaCriterios(alumnos, modoTodas, claseSel, periodo) {
    let criterios = Calc.criteriosDeNivel(claseSel, nivelSel);
    if (!alumnos.length) return '<div class="aviso">El grupo de esta clase no tiene alumnado en este nivel.</div>';
    if (!criterios.length) return '<div class="vacio-grande">Este nivel no tiene criterios definidos.</div>';
    return `
      <table class="tabla tabla-cuadricula">
        <thead><tr><th>Alumno</th>${criterios.map(c =>
          `<th title="${Utils.esc(c.descripcion)}">${Utils.esc(c.codigo)}<br><small>${Utils.fmt(c.peso)}%</small></th>`
        ).join('')}<th class="num">Evaluación</th></tr></thead>
        <tbody>
          ${alumnos.map(a => `<tr>
            <td>${Utils.esc(a.apellidos)}, ${Utils.esc(a.nombre)}</td>
            ${criterios.map(c => {
              const l = Calc.logroCriterio(c.id, claseSel, a.id, periodo);
              const n = (l == null ? null : l * 10);
              return `<td class="num">${n == null ? '<span class="badge na">—</span>' : '<span class="badge ' + Calc.clasif(n) + '">' + Utils.fmt(n) + '</span>'}</td>`;
            }).join('')}
            <td class="num">${Calc.badgeHtml(Calc.notaEvaluacion(claseSel, a.id, periodo))}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      <p class="no-print" style="color:var(--tinta-suave);font-size:13px">% de logro acumulado por criterio del nivel${periodo === 'Final' ? ' (todo el curso)' : ' en ' + periodo}. «—» = sin evidencias todavía. La columna «Evaluación» es la nota final (0–10) con las ponderaciones de los criterios.</p>`;
  }

  function tablaCompetencias(alumnos, modoTodas) {
    let esps = Calc.competenciasEspecificasDeNivel(claseSel, nivelSel);
    let claves = Calc.clavesDeNivel(claseSel, nivelSel);
    if (!alumnos.length) return '<div class="aviso">El grupo de esta clase no tiene alumnado en este nivel.</div>';

    const tabla = (lista, titulo, fnNota, notaPie) => {
      if (!lista.length) return '';
      return `
        <h3 style="font-size:15px;margin:4px 0 8px">${titulo}</h3>
        <table class="tabla tabla-cuadricula">
          <thead><tr><th>Alumno</th>${lista.map(x =>
            `<th title="${Utils.esc(x.descripcion || x.nombre || '')}">${Utils.esc(x.codigo)}</th>`
          ).join('')}</tr></thead>
          <tbody>
            ${alumnos.map(a => `<tr>
              <td>${Utils.esc(a.apellidos)}, ${Utils.esc(a.nombre)}</td>
              ${lista.map(x => {
                const n = fnNota(a, x);
                return `<td class="num">${Calc.badgeHtml(n)}</td>`;
              }).join('')}
            </tr>`).join('')}
          </tbody>
        </table>
        <p class="no-print" style="color:var(--tinta-suave);font-size:13px">${notaPie}</p>`;
    };

    const hayClaves = criteriosConClaves();
    return `
      ${tabla(esps, 'Competencias específicas',
        (a, e) => Calc.notaCompetencia(claseSel, a.id, e.id, periodo),
        'Nota por competencia específica (0–10), agregando los criterios vinculados con su peso.')}
      ${claves.length ? tabla(claves, 'Competencias clave (perfil de salida)',
        (a, k) => Calc.notaClave(claseSel, a.id, k.id, periodo),
        'Nota por competencia clave (0–10), agregando con su peso todos los criterios que la llevan asignada.') : `
        <h3 style="font-size:15px;margin:14px 0 8px">Competencias clave (perfil de salida)</h3>
        <div class="aviso">${hayClaves ? 'Ninguna clave aparece aún en esta tabla.' : 'Los criterios de esta asignatura no tienen competencias clave asignadas. Asígnalas editando cada criterio en «Currículo»; las plantillas oficiales las traen automáticamente.'}</div>`}`;
  }

  function criteriosConClaves() {
    return Calc.criteriosDeNivel(claseSel, nivelSel).some(c => (c.claveIds || []).length > 0);
  }

  // Informe de «Imprimir»: una sección por nivel —base y cada nivel ACI—
  // con SOLO su alumnado y SU currículo, sin mezclar columnas (los currículos
  // de cada nivel pueden no coincidir). `opciones`:
  //   - criterios / competencias: qué bloques incluir (al menos uno).
  //   - alumnoId: si se indica, solo ese alumno (informe individual).
  // Se compone aquí y no en el DOM para poder comprobarlo sin navegador.
  function informeHtml(claseId, periodoId, opciones) {
    const op = Object.assign({ criterios: true, competencias: true, alumnoId: null }, opciones || {});
    const db = Storage.db;
    const cl = Calc.clase(claseId);
    if (!cl) return '';
    const gru = Calc.byId(db.grupos, cl.grupoId);
    const alu = op.alumnoId ? Calc.alumno(op.alumnoId) : null;
    const nombreAsig = id => (Calc.asignatura(id) || {}).nombre || '¿?';
    const tituloBloques = op.criterios && op.competencias ? 'Criterios y competencias'
      : op.criterios ? 'Criterios' : 'Competencias específicas y clave';
    const dosBloques = op.criterios && op.competencias;
    const niveles = [{ codigo: '', etiqueta: 'Base (sin adaptación)', asig: nombreAsig(cl.asignaturaId) }]
      .concat(Calc.nivelesAciDeClase(claseId).map(n => ({
        codigo: n.codigo,
        etiqueta: n.etiqueta || n.codigo,
        asig: nombreAsig(n.asignaturaId)
      })));

    // Las tablas leen clase, nivel y periodo del estado del módulo: se fija aquí
    // y se restaura al final, para que el informe no dependa de lo que hubiera
    // seleccionado en pantalla.
    const antes = { claseSel, periodo, nivelSel };
    claseSel = claseId;
    periodo = periodoId;
    let secciones = '';
    try {
      secciones = niveles.map(nv => {
        nivelSel = nv.codigo;
        let alumnos = Calc.alumnosDeClase(claseId)
          .filter(a => Calc.nivelDeAlumno(claseId, a.id) === nv.codigo);
        if (alu) alumnos = alumnos.filter(a => a.id === alu.id);
        if (!alumnos.length) return '';
        const partes = [];
        if (op.criterios) {
          // Con dos bloques hace falta un rótulo; las competencias ya llevan
          // los suyos propios dentro de tablaCompetencias.
          partes.push((dosBloques
            ? '<h3 style="font-size:15px;margin:4px 0 8px">Criterios</h3>' : '')
            + tablaCriterios(alumnos, false, claseId, periodoId));
        }
        if (op.competencias) partes.push(tablaCompetencias(alumnos, false));
        // El título lleva la asignatura del nivel (los ACI pueden venir de otro curso).
        return `<section class="informe-seccion">
        <h2 class="informe-titulo">${Utils.esc(nv.etiqueta)} · ${Utils.esc(nv.asig)}</h2>
        ${partes.join('')}
      </section>`;
      }).join('');
    } finally {
      claseSel = antes.claseSel;
      periodo = antes.periodo;
      nivelSel = antes.nivelSel;
    }

    const quien = alu
      ? Utils.esc(`${alu.apellidos}, ${alu.nombre}`)
      : `${Calc.alumnosDeClase(claseId).length} alumno(s)`;
    return `<div class="informe-cab">
        <strong>${alu ? 'Informe individual' : 'Cuadrícula de calificaciones'} · ${tituloBloques}</strong>
        <span>${Utils.esc(nombreAsig(cl.asignaturaId))} · ${Utils.esc(gru ? gru.nombre : '¿?')} · ${quien} · ${periodo} · impreso el ${Utils.hoy().split('-').reverse().join('/')}</span>
      </div>
      ${secciones || '<p class="aviso">No hay alumnado para imprimir.</p>'}`;
  }

  // El informe vive fuera de la vista (en `#informe-impresion`), y solo se ve al
  // imprimir: así la pantalla no cambia al generar el PDF.
  function limpiarInforme() {
    const cont = document.getElementById('informe-impresion');
    if (cont) cont.innerHTML = '';
    document.body.classList.remove('imprimiendo-informe');
  }

  function imprimirInforme(html) {
    limpiarInforme();
    let cont = document.getElementById('informe-impresion');
    if (!cont) {
      cont = document.createElement('div');
      cont.id = 'informe-impresion';
      document.body.appendChild(cont);
    }
    cont.innerHTML = html;
    document.body.classList.add('imprimiendo-informe');
    // Al cerrar el diálogo se retira el informe; la vista queda intacta.
    const alCerrar = () => { limpiarInforme(); window.removeEventListener('afterprint', alCerrar); };
    window.addEventListener('afterprint', alCerrar);
    window.print();
  }

  // Modal de impresión: elegir alcance (vista actual, clase completa o un
  // alumno) y qué bloques incluir (criterios / competencias) al generar el PDF.
  function modalImprimir(el, insts) {
    const alumnos = Calc.alumnosDeClase(claseSel)
      .map(a => ({ id: a.id, nom: `${a.apellidos}, ${a.nombre}` }));
    const mbody = UI.openModal({
      titulo: 'Imprimir / PDF',
      cuerpo: `<p class="hint">Elige qué quieres pasar a PDF.</p>
        <div style="display:flex;flex-direction:column;gap:8px">
          <label style="display:flex;gap:8px;align-items:center">
            <input type="radio" name="imp-alcance" value="vista" checked>
            Vista actual (lo que se ve en pantalla)
          </label>
          <label style="display:flex;gap:8px;align-items:center">
            <input type="radio" name="imp-alcance" value="clase">
            Informe de la clase (base + cada nivel ACI)
          </label>
          <label style="display:flex;gap:8px;align-items:center">
            <input type="radio" name="imp-alcance" value="alumno" ${alumnos.length ? '' : 'disabled'}>
            Informe de un alumno
            <select id="imp-alumno" style="max-width:220px;margin-left:auto">
              ${UI.selectHtml(alumnos, alumnos[0] ? alumnos[0].id : '', 'id', 'nom')}
            </select>
          </label>
        </div>
        <div id="imp-bloques" style="display:none;gap:16px;margin:10px 0 2px;
             padding:10px 12px;border:1px solid var(--linea);border-radius:8px">
          <label style="display:flex;gap:6px;align-items:center">
            <input type="checkbox" id="imp-criterios" checked> Criterios
          </label>
          <label style="display:flex;gap:6px;align-items:center">
            <input type="checkbox" id="imp-competencias" checked> Competencias
          </label>
        </div>
        <button class="btn btn-primario" id="imp-go" style="margin-top:12px">Imprimir / PDF</button>`
    });

    const selAlumno = mbody.querySelector('#imp-alumno');
    const cajaBloques = mbody.querySelector('#imp-bloques');
    const alcance = () => {
      const r = mbody.querySelector('input[name=imp-alcance]:checked');
      return r ? r.value : 'vista';
    };
    const refresca = () => {
      selAlumno.disabled = alcance() !== 'alumno';
      cajaBloques.style.display = alcance() === 'vista' ? 'none' : 'flex';
    };
    mbody.querySelectorAll('input[name=imp-alcance]').forEach(r => { r.onchange = refresca; });
    refresca();

    mbody.querySelector('#imp-go').onclick = () => {
      const donde = alcance();
      if (donde === 'vista') {
        UI.closeModal();
        imprimirVistaActual(el, insts);
        return;
      }
      const criterios = mbody.querySelector('#imp-criterios').checked;
      const competencias = mbody.querySelector('#imp-competencias').checked;
      if (!criterios && !competencias) {
        UI.toast('Marca «Criterios», «Competencias» o ambas.');
        return;
      }
      const alumnoId = donde === 'alumno' ? selAlumno.value : null;
      UI.closeModal();
      imprimirInforme(informeHtml(claseSel, periodo, { criterios, competencias, alumnoId }));
    };
  }

  // Imprime lo que hay en pantalla. Si la pestaña es «Instrumentos», todas las
  // unidades quedan desplegadas: una unidad plegada deja su celda de relleno y
  // CSS no puede recuperarla, así que se abren en JS.
  function imprimirVistaActual(el, insts) {
    limpiarInforme();
    if (tab === 'notas') {
      udsAbiertas.clear();
      Calc.unidadesDe(insts).forEach(u => udsAbiertas.add(u));
      render(el);
    }
    window.print();
  }

  // `opciones.tab` permite fijar la pestaña activa (uso interno y pruebas) y
  // `opciones.unidadesAbiertas` las unidades que deben verse desplegadas.
  function render(el, opciones) {
    if (opciones && opciones.tab) tab = opciones.tab;
    if (opciones && opciones.unidadesAbiertas) {
      udsAbiertas.clear();
      opciones.unidadesAbiertas.forEach(u => udsAbiertas.add(u));
    }
    const db = Storage.db;
    // `opciones.claseId` permite abrir una clase concreta (p. ej. desde los
    // paneles de Inicio).
    if (opciones && opciones.claseId && Calc.clase(opciones.claseId)) claseSel = opciones.claseId;
    if (!claseSel || !Calc.clase(claseSel)) claseSel = db.clases.length ? db.clases[0].id : null;

    if (!db.clases.length) {
      el.innerHTML = `<section class="card"><div class="vacio-grande">
        <strong>No hay clases todavía</strong>
        Crea grupos, alumnos y clases para ver aquí la cuadrícula de calificación.
      </div></section>`;
      return;
    }

    const nivelesAci = Calc.nivelesAciDeClase(claseSel);
    if (nivelSel && nivelSel !== TODAS && !nivelesAci.some(n => n.codigo === nivelSel)) nivelSel = '';

    const alumnosTodos = Calc.alumnosDeClase(claseSel);
    const modoTodas = nivelSel === TODAS;
    const alumnos = modoTodas ? alumnosTodos : alumnosTodos.filter(a => Calc.nivelDeAlumno(claseSel, a.id) === nivelSel);
    const instsNivel = Calc.instrumentosDeClase(claseSel)
      .filter(i => modoTodas || Calc.instrumentoParaNivel(i, nivelSel))
      .sort((a, b) => (String(a.unidad || '').localeCompare(String(b.unidad || ''), 'es'))
        || (a.fecha || '').localeCompare(b.fecha || ''));
    // Las unidades se ven en el orden en que se despliegan en la propia tabla:
    // el plegado de las barras es el único filtro que se ofrece (D-45).
    const insts = instsNivel;
