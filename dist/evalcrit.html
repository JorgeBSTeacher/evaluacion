<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvalCrit · Evaluación por criterios</title>
<style>
:root {
  --papel: #f5f3ec;
  --tinta: #2b2a26;
  --tinta-suave: #6b685e;
  --linea: #e3dfd3;
  --acento: #4f46e5;
  --acento-suave: #eceafd;
  --ok: #16a34a;
  --ok-suave: #e8f7ee;
  --ko: #dc2626;
  --ko-suave: #fdecec;
  --na: #9ca3af;
  --na-suave: #f1f2f4;
  --radio: 14px;
  --sombra: 0 1px 3px rgba(43, 42, 38, .08), 0 8px 24px rgba(43, 42, 38, .06);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--papel);
  color: var(--tinta);
  min-height: 100vh;
}

.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 16px;
  padding: 10px 18px;
  background: rgba(245, 243, 236, .92);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--linea);
  flex-wrap: wrap;
}

.brand { display: flex; align-items: center; gap: 10px; }
.logo {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--acento); color: #fff; font-weight: 800; font-size: 15px;
}
.brand-txt { line-height: 1.1; }
.brand-txt small { display: block; color: var(--tinta-suave); font-size: 11px; }

.nav { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
.nav button {
  border: none; background: transparent; cursor: pointer;
  font-size: 14px; font-weight: 600; color: var(--tinta-suave);
  padding: 9px 13px; border-radius: 999px; min-height: 40px;
}
.nav button:hover { background: var(--acento-suave); color: var(--acento); }
.nav button.activo { background: var(--acento); color: #fff; }
.nav button.peligro-activo { background: var(--ko-suave); color: var(--ko); }

.actions { display: flex; align-items: center; gap: 8px; }
.save-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); display: inline-block; transition: background .3s; }
.save-dot.guardando { background: #f59e0b; }

main { max-width: 1200px; margin: 0 auto; padding: 20px 18px 60px; }

.card {
  background: #fff; border: 1px solid var(--linea);
  border-radius: var(--radio); box-shadow: var(--sombra);
  padding: 18px; margin-bottom: 18px;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card h1, .card h2 { margin: 0; font-size: 18px; }
.card-head .sub { color: var(--tinta-suave); font-size: 13px; width: 100%; margin-top: -6px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

.btn {
  appearance: none; border: 1px solid var(--linea); background: #fff;
  color: var(--tinta); font-weight: 600; font-size: 14px;
  padding: 9px 14px; border-radius: 10px; cursor: pointer; min-height: 40px;
}
.btn:hover { border-color: var(--acento); color: var(--acento); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primario { background: var(--acento); border-color: var(--acento); color: #fff; }
.btn-primario:hover { filter: brightness(1.07); color: #fff; }
.btn-peligro { color: var(--ko); border-color: #f3caca; }
.btn-peligro:hover { background: var(--ko-suave); border-color: var(--ko); color: var(--ko); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--tinta-suave); }
.btn-ghost:hover { background: var(--acento-suave); color: var(--acento); border-color: transparent; }
.btn-mini { padding: 4px 9px; min-height: 30px; font-size: 12px; border-radius: 8px; }

.icon-btn {
  border: none; background: transparent; cursor: pointer;
  font-size: 16px; line-height: 1; color: var(--na); padding: 6px; border-radius: 8px;
}
.icon-btn:hover { background: var(--ko-suave); color: var(--ko); }

.lista { list-style: none; margin: 0; padding: 0; }
.lista li {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border-radius: 10px; cursor: pointer;
  border: 1px solid transparent;
}
.lista li:hover { background: var(--papel); }
.lista li.activo { background: var(--acento-suave); border-color: #d8d3fb; }
.lista li span { flex: 1; font-weight: 600; }
.lista li small { color: var(--tinta-suave); }
.lista li.vacio, td.vacio { color: var(--na); text-align: center; padding: 18px !important; cursor: default !important; }

.tabla { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabla th, .tabla td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--linea); vertical-align: middle; }
.tabla th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--tinta-suave); }
.tabla tr:last-child td { border-bottom: none; }
.tabla .num { text-align: right; font-variant-numeric: tabular-nums; }
.tabla tbody tr:hover { background: #faf9f4; }

.scroll-x { overflow-x: auto; }

/* Cuadrícula ancha: fija la columna del alumno y agrupa por unidades didácticas */
.tabla-cuadricula th:first-child, .tabla-cuadricula td:first-child {
  position: sticky; left: 0; background: #fff; z-index: 2;
  box-shadow: 1px 0 0 var(--linea);
}
.tabla-cuadricula tbody tr:hover td:first-child { background: #faf9f4; }
.tabla-cuadricula .fila-ud .ud-grupo { text-align: center; background: var(--acento-suave); color: var(--acento); }
.tabla-cuadricula .fila-ud th { border-bottom: 2px solid var(--linea); }

input[type="text"], input[type="number"], input[type="date"], select, textarea {
  font: inherit; color: inherit;
  border: 1px solid var(--linea); border-radius: 10px;
  padding: 8px 10px; background: #fff; min-height: 40px; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--acento-suave); border-color: var(--acento); }
.campo { display: block; margin-bottom: 12px; }
.campo > span { display: block; font-size: 12px; font-weight: 700; color: var(--tinta-suave); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
.fila-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }

.badge {
  display: inline-block; padding: 3px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.badge.ok { background: var(--ok-suave); color: var(--ok); }
.badge.ko { background: var(--ko-suave); color: var(--ko); }
.badge.na { background: var(--na-suave); color: var(--na); }
.badge.info { background: var(--acento-suave); color: var(--acento); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.hint { display: block; color: var(--tinta-suave); font-size: 12px; margin-bottom: 6px; }
.importa-areas { display: flex; flex-direction: column; gap: 8px; }
.importa-area { border: 1px solid var(--linea); border-radius: 10px; padding: 8px 10px; }
.importa-area > strong { display: block; font-size: 13px; color: var(--tinta); margin-bottom: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--linea); border-radius: 999px;
  padding: 6px 12px; font-size: 13px; cursor: pointer; user-select: none; background: #fff;
}
.chip.on { background: var(--acento); border-color: var(--acento); color: #fff; }
.chip input { display: none; }

.aviso {
  background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
  padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 12px;
}
.vacio-grande { text-align: center; color: var(--tinta-suave); padding: 40px 20px; }
.vacio-grande strong { display: block; font-size: 17px; color: var(--tinta); margin-bottom: 6px; }

#modal-root .velo {
  position: fixed; inset: 0; background: rgba(43, 42, 38, .45);
  display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px;
}
.modal {
  background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
  width: min(720px, 100%); max-height: 90vh; display: flex; flex-direction: column;
}
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--linea); }
.modal-head h3 { margin: 0; font-size: 16px; }
.modal-body { padding: 18px; overflow: auto; }
/* La cuadrícula de rúbrica necesita más ancho para sus columnas de nivel */
.modal:has(.rub-head) { width: min(1080px, 100%); }
.modal:has(#ia-prompt) { width: min(860px, 100%); }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--linea); }

#toast-root { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: var(--tinta); color: #fff; padding: 10px 18px; border-radius: 999px;
  font-size: 14px; box-shadow: var(--sombra); animation: aparecer .2s ease-out;
}
@keyframes aparecer { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.apartado-fila {
  display: grid; grid-template-columns: 28px 1fr 110px auto auto auto; gap: 8px; align-items: center;
  padding: 6px 0; border-bottom: 1px dashed var(--linea);
}
.zona-crit { grid-column: 1 / -1; padding: 8px 4px 2px; border-top: 1px dashed var(--linea); }
.apartado-fila:last-child { border-bottom: none; }
.nivel-fila { display: grid; grid-template-columns: 90px 1fr auto; gap: 8px; align-items: center; padding: 4px 0; }

/* Rúbrica: cuadrícula «criterio · peso · nivel 1 … nivel N» (D-40) */
.rub-head { display: grid; gap: 8px; align-items: end; padding: 2px 0 8px; border-bottom: 2px solid var(--linea); }
.rub-head > span { font-size: 11px; font-weight: 700; color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .04em; line-height: 1.3; }
.rub-head > span small { text-transform: none; letter-spacing: 0; font-size: 11px; color: var(--acento); }
.apartado-fila.rub { align-items: start; }
.apartado-fila.rub .ap-nv { font-size: 13px; }
.apartado-fila.rub .ap-nv::placeholder { color: #b6b2a6; font-style: italic; }

.leyenda-rubrica { margin-top: 12px; font-size: 13px; }
.leyenda-rubrica summary { cursor: pointer; color: var(--acento); font-weight: 600; }
.leyenda-rubrica .leg-item { margin-top: 10px; }
.leyenda-rubrica ul { margin: 4px 0 0; padding-left: 18px; color: var(--tinta-suave); }
.leyenda-rubrica li { margin-bottom: 3px; }

#ia-prompt, #ia-json { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; white-space: pre; }

.segmentos { display: inline-flex; border: 1px solid var(--linea); border-radius: 999px; overflow: hidden; }
.segmentos button {
  border: none; background: #fff; cursor: pointer; font-size: 12px; font-weight: 600;
  padding: 7px 10px; min-width: 52px; color: var(--tinta-suave);
}
.segmentos button + button { border-left: 1px solid var(--linea); }
.segmentos button.on { background: var(--acento); color: #fff; }

.celda-nota { cursor: pointer; text-align: center; }
.celda-nota:hover { outline: 2px solid var(--acento-suave); }

/* Corrección: barra de navegación y resaltado del alumno en curso */
.barra-correccion { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 2px 0 12px; }
.barra-correccion #nav-info { flex: 1; color: var(--tinta-suave); font-size: 13px; }
.tabla tbody tr.fila-actual { background: var(--acento-suave); }

.resumen-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 14px 0; }
.stat { background: #fff; border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px; text-align: center; }
.stat b { display: block; font-size: 26px; }
.stat span { font-size: 12px; color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .05em; }

/* Instrumentos: secciones por trimestre y bloques plegables por unidad didáctica */
.per-titulo { font-size: 15px; margin: 18px 0 8px; }
.per-titulo:first-child { margin-top: 0; }
.per-titulo small { color: var(--tinta-suave); font-weight: 400; }
.ud-bloque { border: 1px solid var(--linea); border-radius: 10px; margin-bottom: 10px; overflow: hidden; background: #fffdf8; }
.ud-cabecera { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 10px 12px; background: var(--acento-suave); border: 0; font: inherit; color: var(--acento); cursor: pointer; }
.ud-cabecera:hover { filter: brightness(.97); }
.ud-cabecera .ud-flecha { width: 1em; }
.ud-cabecera small { margin-left: auto; color: var(--tinta-suave); font-size: 12px; }
.ud-bloque .ud-cuerpo { display: none; }
.ud-bloque.abierta .ud-cuerpo { display: block; }
.ud-cuerpo .tabla { margin: 0; }

/* Cuadrícula · pestaña Instrumentos: plegado de columnas por unidad */
/* Celda que ocupa las columnas de una unidad plegada: mantiene la tabla cuadrada
   (la nota final no se desplaza) y una banda tenue señala que está plegada. */
.tabla-cuadricula .celda-plegada { background: var(--acento-suave); }
.tabla-cuadricula .ud-grupo.plegable { cursor: pointer; user-select: none; }
.tabla-cuadricula .ud-grupo.plegable:hover { filter: brightness(.95); }
.tabla-cuadricula .ud-grupo .ud-flecha { margin-right: 5px; font-size: 11px; }
/* Mismo aspecto que las barras de unidad de la vista Instrumentos. */
.tabla-cuadricula .ud-grupo { text-transform: none; letter-spacing: normal; }
.tabla-cuadricula .ud-grupo small { margin-left: 6px; color: var(--tinta-suave); font-weight: 400; }
.barra-tab { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }

/* Cabecera de informe: solo existe al imprimir, para que el PDF se lea solo. */
.solo-impresion { display: none; }

/* Filas del modal «¿ qué quieres corregir? » (de lista, no de acción). */
.fila-corrige {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; text-align: left; font: inherit; color: var(--tinta);
  background: #fff; border: 1px solid var(--linea); border-radius: 10px;
  padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
}
.fila-corrige:hover { border-color: var(--acento); background: var(--acento-suave); }
.fila-corrige-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fila-corrige-txt b { font-size: 14px; }
.fila-corrige-txt small { color: var(--tinta-suave); font-size: 12px; }

/* Filas del banco de instrumentos (modal «Banco de instrumentos», D-48). */
.fila-banco {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: #fff; border: 1px solid var(--linea); border-radius: 10px;
  padding: 10px 12px; margin-bottom: 8px;
}
.fila-banco-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fila-banco-txt b { font-size: 14px; }
.fila-banco-txt small { color: var(--tinta-suave); font-size: 12px; }

@media print {
  .topbar, #modal-root, #toast-root, .no-print { display: none !important; }
  /* Al imprimir, los bloques plegables de Instrumentos salen abiertos. */
  .ud-bloque .ud-cuerpo { display: block !important; }
  body { background: #fff; }
  main { max-width: none; padding: 0; }
  .card { box-shadow: none; border: none; padding: 0; }

  /* Salen solo los datos: los controles (selects, botones) se quedan en pantalla. */
  .solo-impresion { display: block !important; }
  .card-head select, .card-head input, .btn, .icon-btn { display: none !important; }

  /* El informe de «Imprimir todo» sustituye a la vista mientras se imprime. */
  body.imprimiendo-informe main { display: none !important; }
  body.imprimiendo-informe #informe-impresion { display: block !important; }
  .cabecera-impresion { display: flex; flex-direction: column; gap: 2px; margin: 0 0 10px; }
  .cabecera-impresion strong { font-size: 15px; }
  .cabecera-impresion span { color: #555; font-size: 12px; }

  /* La tabla entera, con su cabecera repetida en cada página y sin cortar filas. */
  .scroll-x { overflow: visible !important; }
  .tabla-cuadricula th:first-child, .tabla-cuadricula td:first-child {
    position: static !important; box-shadow: none;
  }
  thead { display: table-header-group; }
  tr { page-break-inside: avoid; break-inside: avoid; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @page { margin: 12mm; }
}
.aci-ast { font-size: 11px; vertical-align: text-top; margin-left: 1px; }

/* Informe de «Imprimir todo»: solo existe al imprimir, nunca en pantalla. */
#informe-impresion { display: none; }
.informe-cab { margin: 0 0 12px; }
.informe-cab strong { font-size: 16px; }
.informe-cab span { display: block; color: var(--tinta-suave); font-size: 12px; }
.informe-seccion { margin-bottom: 16px; }
/* El título viaja siempre con su tabla: nunca solo al pie de una página. */
.informe-titulo { font-size: 15px; margin: 0 0 6px; break-after: avoid; page-break-after: avoid; }
.informe-seccion table { break-before: avoid; page-break-before: avoid; }

</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">EC</span>
    <div class="brand-txt"><strong>EvalCrit</strong><small>Evaluación por criterios · LOMLOE</small></div>
  </div>
  <nav id="nav" class="nav"></nav>
  <div class="actions">
    <span id="estado-guardado" class="save-dot" title="Guardado"></span>
    <button id="btn-guardar" class="btn btn-primario">Guardar</button>
    <button id="btn-exportar" class="btn btn-ghost">Exportar backup</button>
    <button id="btn-importar" class="btn btn-ghost">Importar backup</button>
    <input type="file" id="input-importar" accept=".json,application/json" hidden>
  </div>
</header>
<main id="app"></main>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
const Utils = {
  uid() {
    return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  },
  esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },

  // Enlace de un instrumento (al examen, al proyecto, a los materiales…).
  // Al guardar se limpia: se descartan los esquemas peligrosos y, si falta el
  // esquema, se asume https://. Al pintar se vuelve a comprobar, de modo que un
  // backup manipulado no pueda inyectar código por el atributo href.
  urlLimpia(u) {
    let s = String(u == null ? '' : u).trim();
    if (!s || this.esquemaPeligroso(s)) return '';
    if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://' + s;
    return s;
  },
  urlPintable(u) {
    const s = String(u == null ? '' : u).trim();
    return (s && !this.esquemaPeligroso(s)) ? s : '';
  },
  esquemaPeligroso(s) {
    return /^(javascript|data|vbscript):/i.test(String(s).trim());
  },
  fmt(n) {
    if (n == null || isNaN(n)) return '—';
    return (Math.round(n * 10) / 10).toFixed(1).replace('.', ',');
  },
  pct(n) {
    if (n == null || isNaN(n)) return '—';
    return Math.round(n) + '%';
  },
  hoy() {
    const d = new Date();
    const p = x => String(x).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  },

  fechaLegible(d = new Date()) {
    const p = x => String(x).padStart(2, '0');
    return p(d.getDate()) + '-' + p(d.getMonth() + 1) + '-' + d.getFullYear();
  },

  horaCorta(d = new Date()) {
    const p = x => String(x).padStart(2, '0');
    return p(d.getHours()) + p(d.getMinutes());
  },
  stamp() {
    const d = new Date();
    const p = x => String(x).padStart(2, '0');
    return '' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  },
  debounce(fn, ms) {
    let t;
    return function (...a) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, a), ms);
    };
  }
};

</script>
<script>
const Storage = {
  KEY: 'evalcrit:data',
  db: null,

  defaults() {
    const hoy = new Date();
    const inicio = hoy.getMonth() >= 6 ? hoy.getFullYear() : hoy.getFullYear() - 1;
    return {
      schemaVersion: 1,
      cursoEscolar: `${inicio}/${inicio + 1}`,
      meta: { ultimaExportacion: null },
      grupos: [],
      alumnos: [],
      asignaturas: [],
      clases: [],
      competenciasClave: [
        { id: 'cc-ccl', codigo: 'CCL', nombre: 'Comunicación lingüística' },
        { id: 'cc-cp', codigo: 'CP', nombre: 'Competencia plurilingüe' },
        { id: 'cc-stem', codigo: 'STEM', nombre: 'Competencia científica y tecnológica' },
        { id: 'cc-cd', codigo: 'CD', nombre: 'Competencia digital' },
        { id: 'cc-cpsaa', codigo: 'CPSAA', nombre: 'Personal, social y de aprender a aprender' },
        { id: 'cc-cc', codigo: 'CC', nombre: 'Competencia ciudadana' },
        { id: 'cc-ce', codigo: 'CE', nombre: 'Competencia emprendedora' },
        { id: 'cc-ccec', codigo: 'CCEC', nombre: 'En conciencia y expresión culturales' }
      ],
      competenciasEspecificas: [],
      criterios: [],
      instrumentos: [],
      // Moldes de instrumentos guardados para reutilizarlos en otra clase o en
      // el curso siguiente (D-48).
      bancoInstrumentos: [],
      registros: {}
    };
  },

  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      this.db = raw ? this.migrar(JSON.parse(raw)) : this.defaults();
    } catch (e) {
      this.db = this.defaults();
    }
    return this.db;
  },

  save() {
    const dot = document.getElementById('estado-guardado');
    if (dot) {
      dot.classList.add('guardando');
      setTimeout(() => dot.classList.remove('guardando'), 400);
    }
    try {
      localStorage.setItem(this.KEY, JSON.stringify(this.db));
    } catch (e) {
      UI.toast('Error al guardar: exporta tu backup ahora');
    }
  },

  vacio() {
    const d = this.db;
    return !d.grupos.length && !d.alumnos.length && !d.asignaturas.length && !d.criterios.length && !d.instrumentos.length;
  },

  puedeCarpeta() {
    return typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function';
  },

  abrirIdb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('evalcrit-fs', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('kv');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },

  idbLeer(clave) {
    return this.abrirIdb().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readonly');
      const req = tx.objectStore('kv').get(clave);
      tx.oncomplete = () => resolve(req.result);
      tx.onerror = () => reject(tx.error);
    }));
  },

  idbEscribir(clave, valor) {
    return this.abrirIdb().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(valor, clave);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    }));
  },

  async elegirCarpetaBackup() {
    if (!this.puedeCarpeta()) {
      alert('Tu navegador no permite elegir carpeta de guardado (necesitas Chrome o Edge en Windows). Los backups irán a Descargas.');
      return null;
    }
    try {
      const handle = await window.showDirectoryPicker({ id: 'evalcrit-backups', mode: 'readwrite' });
      await this.idbEscribir('dir', handle);
      UI.toast('Los backups se guardarán en la carpeta «' + handle.name + '»');
      return handle;
    } catch (e) {
      if (e && e.name === 'AbortError') return null;
      console.error(e);
      alert('No se pudo elegir la carpeta: ' + e.message + '. Puede que tu navegador rechace ubicaciones de red (p. ej. rutas WSL).');
      return null;
    }
  },

  async guardar() {
    // Guarda siempre en el mismo fichero (evalcrit.json) dentro de la carpeta
    // de backups elegida: sobrescribe, evitando amontonar archivos.
    const contenido = JSON.stringify(this.db, null, 2);
    if (!this.puedeCarpeta()) return this.exportar();
    let dir = await this.idbLeer('dir');
    if (!dir) dir = await this.elegirCarpetaBackup();
    if (!dir) return; // el usuario canceló
    let perm = 'granted';
    if (dir.queryPermission) perm = await dir.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted' && dir.requestPermission) {
      perm = await dir.requestPermission({ mode: 'readwrite' });
    }
    if (perm !== 'granted') {
      // Sin permiso: caemos al export normal para no perder nada.
      return this.exportar();
    }
    try {
      const fh = await dir.getFileHandle('evalcrit.json', { create: true });
      const w = await fh.createWritable();
      await w.write(contenido);
      await w.close();
      this.db.meta = this.db.meta || {};
      this.db.meta.ultimaExportacion = new Date().toISOString();
      this.save();
      UI.toast('Guardado en «' + dir.name + '/evalcrit.json»');
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      console.error(e);
      return this.exportar();
    }
  },

  async exportar() {
    const contenido = JSON.stringify(this.db, null, 2);
    const nombre = `backup-${Utils.fechaLegible()}-${Utils.horaCorta()}.json`;
    let destino = '';
    try {
      const dir = await this.idbLeer('dir');
      if (dir) {
        let perm = 'granted';
        if (dir.queryPermission) perm = await dir.queryPermission({ mode: 'readwrite' });
        if (perm !== 'granted' && dir.requestPermission) {
          perm = await dir.requestPermission({ mode: 'readwrite' });
        }
        if (perm === 'granted') {
          const fh = await dir.getFileHandle(nombre, { create: true });
          const w = await fh.createWritable();
          await w.write(contenido);
          await w.close();
          destino = `la carpeta «${dir.name}»`;
        }
      }
      if (!destino && typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function') {
        const fh = await window.showSaveFilePicker({
          suggestedName: nombre,
          types: [{ description: 'Backup EvalCrit (JSON)', accept: { 'application/json': ['.json'] } }]
        });
        const w = await fh.createWritable();
        await w.write(contenido);
        await w.close();
        destino = `«${fh.name}»`;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      console.error(e);
    }
    if (!destino) {
      const blob = new Blob([contenido], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = nombre;
      document.body.appendChild(a);
      a.click();
      a.remove();
      destino = 'Descargas';
    }
    this.db.meta = this.db.meta || {};
    this.db.meta.ultimaExportacion = new Date().toISOString();
    this.save();
    UI.toast(destino === 'Descargas'
      ? 'Backup en Descargas: cópialo a la carpeta backups/ del proyecto'
      : `Backup guardado en ${destino}`);
  },

  importar(archivo) {
    return new Promise((resolve, reject) => {
      const lector = new FileReader();
      lector.onload = () => {
        try {
          const datos = JSON.parse(lector.result);
          if (!datos || datos.schemaVersion !== 1 || !Array.isArray(datos.grupos) || !Array.isArray(datos.alumnos)) {
            throw new Error('Formato no válido');
          }
          this.db = this.migrar(datos);
          this.save();
          resolve(true);
        } catch (e) {
          reject(e);
        }
      };
      lector.onerror = () => reject(new Error('No se pudo leer el archivo'));
      lector.readAsText(archivo);
    });
  },

  migrar(datos) {
    const d = this.defaults();
    const db = datos && typeof datos === 'object' ? datos : {};
    db.schemaVersion = 1;
    for (const k of Object.keys(d)) {
      if (db[k] == null) db[k] = d[k];
    }
    if (!db.meta || typeof db.meta !== 'object') db.meta = { ultimaExportacion: null };
    db.grupos.forEach(g => { if (g.etapa == null) g.etapa = ''; });
    // Códigos de nivel ACI y asignaciones de alumnado: se guardan siempre
    // normalizados (sin espacios, en mayúsculas) para que un «b» tecleado por
    // el docente no deje al alumnado fuera de su nivel (y de todas las vistas).
    const normNivel = v => String(v == null ? '' : v).trim().toUpperCase();
    db.clases.forEach(c => {
      if (!Array.isArray(c.nivelesAci)) c.nivelesAci = [];
      c.nivelesAci = c.nivelesAci
        .map(n => Object.assign({}, n, { codigo: normNivel(n.codigo) }))
        .filter(n => n.codigo);
      if (!c.adaptaciones || typeof c.adaptaciones !== 'object') c.adaptaciones = {};
      const adap = {};
      Object.keys(c.adaptaciones).forEach(k => {
        const v = normNivel(c.adaptaciones[k]);
        if (v && v !== 'BASE') adap[k] = v;
      });
      c.adaptaciones = adap;
    });
    db.criterios.forEach(c => { if (!Array.isArray(c.claveIds)) c.claveIds = []; });
    db.instrumentos.forEach(i => {
      if (i.nivel == null) i.nivel = '';
      i.nivel = normNivel(i.nivel); // '' = común, 'BASE' = solo base, resto = nivel
      if (i.unidad == null) i.unidad = '';
      if (!Array.isArray(i.apartados)) i.apartados = [];
      if (!Array.isArray(i.niveles)) i.niveles = [];
      if (i.criteriosModo == null) i.criteriosModo = 'desglosado';
      if (!Array.isArray(i.criterioIdsGlobal)) i.criterioIdsGlobal = [];
      i.apartados.forEach(ap => {
        if (ap.peso == null || isNaN(ap.peso)) {
          ap.peso = (i.tipo === 'Rúbrica') ? 1 : (ap.maxPts || 1);
        }
        if (!Array.isArray(ap.criterioIds)) ap.criterioIds = [];
        if (!Array.isArray(ap.niveles)) ap.niveles = [];
      });
    });
    // Moldes guardados en el banco: se sanean al cargar para que un backup
    // antiguo (o editado a mano) no rompa la vista del banco.
    if (!Array.isArray(db.bancoInstrumentos)) db.bancoInstrumentos = [];
    db.bancoInstrumentos.forEach(m => {
      if (m.unidad == null) m.unidad = '';
      if (m.criteriosModo == null) m.criteriosModo = 'desglosado';
      if (!Array.isArray(m.niveles)) m.niveles = [];
      if (!Array.isArray(m.criterioCodesGlobal)) m.criterioCodesGlobal = [];
      if (!m.origen || typeof m.origen !== 'object') m.origen = {};
      if (!Array.isArray(m.apartados)) m.apartados = [];
      m.apartados.forEach(ap => {
        if (!Array.isArray(ap.criterioCodes)) ap.criterioCodes = [];
        if (!Array.isArray(ap.niveles)) ap.niveles = [];
      });
    });
    // Un instrumento con nivel ACI debe evaluar los criterios de SU currículo.
    // Los creados con «Duplicar» antes de esta versión copiaban los del original
    // (otro ciclo) y sus notas no salían en el informe; aquí se reapuntan por
    // número de criterio, sin tocar ninguna nota.
    this.reparadosCriterios = 0;
    if (typeof Calc !== 'undefined' && Calc.repararCriteriosDeInstrumentos) {
      this.reparadosCriterios = Calc.repararCriteriosDeInstrumentos(db);
    }
    return db;
  },

  claveDesdeDescriptores(descriptores) {
    const mapa = [
      ['CPSAA', 'cc-cpsaa'], ['CCEC', 'cc-ccec'], ['CCL', 'cc-ccl'],
      ['CP', 'cc-cp'], ['STEM', 'cc-stem'], ['CD', 'cc-cd'],
      ['CC', 'cc-cc'], ['CE', 'cc-ce']
    ];
    const ids = new Set();
    (descriptores || []).forEach(d => {
      const hit = mapa.find(([pref]) => String(d).startsWith(pref));
      if (hit) ids.add(hit[1]);
    });
    return [...ids];
  },

  reiniciar() {
    try { localStorage.removeItem(this.KEY); } catch (e) {}
    this.db = this.defaults();
    this.save();
  },

  // --- Banco de instrumentos (D-48) ---
  // Guarda un instrumento del curso como molde reutilizable. Devuelve el molde.
  guardarEnBanco(inst) {
    if (!Array.isArray(this.db.bancoInstrumentos)) this.db.bancoInstrumentos = [];
    const molde = Calc.moldeDeInstrumento(this.db, inst);
    this.db.bancoInstrumentos.push(molde);
    this.save();
    return molde;
  },

  borrarDelBanco(moldeId) {
    this.db.bancoInstrumentos = (this.db.bancoInstrumentos || []).filter(m => m.id !== moldeId);
    this.save();
  },

  // Crea un instrumento nuevo en `claseId` a partir de un molde del banco. Si
  // algún criterio del molde no existe en el currículo de destino, no crea nada
  // y devuelve esa lista en `faltan`.
  anadirDesdeBanco(moldeId, claseId, nivel, periodo) {
    const molde = (this.db.bancoInstrumentos || []).find(m => m.id === moldeId);
    if (!molde) return { faltan: ['(el molde ya no está en el banco)'] };
    const r = Calc.instrumentoDesdeMolde(molde, claseId, nivel, periodo);
    if (r.faltan.length) return { faltan: r.faltan, molde };
    this.db.instrumentos.push(r.inst);
    this.save();
    return { inst: r.inst, faltan: [], molde };
  },

  importarCurriculo(datos) {
    if (!datos || datos.tipo !== 'curriculo-evalcrit' || datos.version !== 1) {
      throw new Error('El archivo no es una plantilla de currículo EvalCrit válida');
    }
    const asig = datos.asignatura || {};
    const nombre = String(asig.nombre || '').trim();
    const etapa = String(asig.etapa || '').trim();
    if (!nombre) throw new Error('Falta el nombre de la asignatura');
    if (!Array.isArray(datos.competenciasEspecificas) || !datos.competenciasEspecificas.length) {
      throw new Error('La plantilla no incluye competencias específicas');
    }
    if (!Array.isArray(datos.criterios) || !datos.criterios.length) {
      throw new Error('La plantilla no incluye criterios de evaluación');
    }
    const cesCodigos = datos.competenciasEspecificas.map(c => c.codigo);
    if (new Set(cesCodigos).size !== cesCodigos.length) {
      throw new Error('Hay competencias específicas con código repetido');
    }
    const critCodigos = datos.criterios.map(c => c.codigo);
    if (new Set(critCodigos).size !== critCodigos.length) {
      throw new Error('Hay criterios con código repetido');
    }
    for (const c of datos.criterios) {
      if (!cesCodigos.includes(c.ceCodigo)) {
        throw new Error(`El criterio ${c.codigo} referencia una competencia específica inexistente (${c.ceCodigo})`);
      }
    }

    const cursos = Array.isArray(asig.cursos) && asig.cursos.length
      ? asig.cursos.map(c => String(c).trim()).filter(Boolean)
      : [''];
    const n = datos.criterios.length;
    const pesoIgual = Math.round((100 / n) * 10000) / 10000;
    const creadas = [];
    const ids = [];

    for (const curso of cursos) {
      const nombreCompleto = curso ? `${nombre} ${curso}` : nombre;
      let target = this.db.asignaturas.find(a =>
        a.nombre.toLowerCase() === nombreCompleto.toLowerCase() && (a.etapa || '') === etapa);
      if (target && this.db.competenciasEspecificas.some(e => e.asignaturaId === target.id)) {
        throw new Error(`La asignatura «${nombreCompleto}» ya tiene currículo. Elimínalo primero o renombra la asignatura en la plantilla.`);
      }
      if (!target) {
        target = { id: Utils.uid(), nombre: nombreCompleto, etapa };
        this.db.asignaturas.push(target);
      }

      const idEsp = {};
      for (const ce of datos.competenciasEspecificas) {
        const obj = {
          id: Utils.uid(),
          asignaturaId: target.id,
          codigo: ce.codigo,
          descripcion: ce.descripcion,
          perfilSalida: Array.isArray(ce.perfilSalida) ? ce.perfilSalida : []
        };
        this.db.competenciasEspecificas.push(obj);
        idEsp[ce.codigo] = obj;
      }

      datos.criterios.forEach((c, i) => {
        const esp = idEsp[c.ceCodigo];
        const peso = (typeof c.peso === 'number' && !isNaN(c.peso))
          ? c.peso
          : (i === n - 1 ? Math.round((100 - pesoIgual * (n - 1)) * 10000) / 10000 : pesoIgual);
        const claveIds = [...new Set(esp.perfilSalida ? this.claveDesdeDescriptores(esp.perfilSalida) : [])];
        this.db.criterios.push({
          id: Utils.uid(),
          asignaturaId: target.id,
          codigo: c.codigo,
          descripcion: c.descripcion,
          peso,
          espIds: [esp.id],
          claveIds
        });
      });

      if (Array.isArray(datos.saberesBasicos)) {
        target.saberesBasicos = datos.saberesBasicos;
      }
      creadas.push(nombreCompleto);
      ids.push(target.id);
    }

    this.save();
    return {
      asignaturas: creadas,
      ids,
      ces: datos.competenciasEspecificas.length,
      criterios: n,
      pesosAjustados: typeof datos.criterios[0].peso !== 'number'
    };
  },

  // Importa una rúbrica generada por una IA (formato "rubrica-evalcrit", ver §14
  // del SSOT). `claseId` fija la asignatura y, con ella, los códigos de criterio.
  // Lanza Error con un mensaje en castellano si algo no cuadra: en ese caso no
  // se importa nada.
  importarRubrica(datos, claseId, periodo) {
    if (!datos || datos.tipo !== 'rubrica-evalcrit' || datos.version !== 1) {
      throw new Error('El texto no es una rúbrica EvalCrit válida (debe empezar por "tipo": "rubrica-evalcrit").');
    }
    const titulo = String(datos.titulo || '').trim();
    if (!titulo) throw new Error('La rúbrica no tiene título.');

    const items = Array.isArray(datos.items) ? datos.items : [];
    if (!items.length) throw new Error('La rúbrica no trae ningún ítem.');

    const nivel = String(datos.nivel || '').trim();
    const asig = Calc.asignaturaDeNivel(claseId, nivel);
    if (!asig) throw new Error('Esta clase no tiene una asignatura asociada con currículo.');

    const porCodigo = {};
    this.db.criterios
      .filter(c => c.asignaturaId === asig.id)
      .forEach(c => { porCodigo[String(c.codigo).trim().toLowerCase()] = c.id; });

    const vistos = new Set();
    const desconocidos = new Set();
    const apartados = items.map((it, i) => {
      const nombre = String((it && it.criterio) || '').trim();
      if (!nombre) throw new Error(`El ítem ${i + 1} no tiene nombre en el campo "criterio".`);
      if (vistos.has(nombre.toLowerCase())) throw new Error(`El ítem «${nombre}» está repetido.`);
      vistos.add(nombre.toLowerCase());

      const peso = Number(it.peso);
      if (!isFinite(peso) || peso <= 0) throw new Error(`El ítem «${nombre}» necesita un "peso" mayor que 0.`);

      const niveles = (Array.isArray(it.niveles) ? it.niveles : [])
        .filter(n => n && isFinite(Number(n.pct)))
        .map(n => ({ pct: Number(n.pct), descriptor: String(n.descriptor || '').trim() }))
        .sort((a, b) => a.pct - b.pct);
      if (niveles.length < 2) throw new Error(`El ítem «${nombre}» necesita al menos 2 niveles.`);

      const codigos = Array.isArray(it.criterios) ? it.criterios : [];
      const criterioIds = [];
      for (const cod of codigos) {
        const limpio = String(cod).trim();
        const id = porCodigo[limpio.toLowerCase()];
        if (id && !criterioIds.includes(id)) criterioIds.push(id);
        else if (!id && limpio) desconocidos.add(limpio);
      }
      return { id: Utils.uid(), orden: i + 1, descripcion: nombre, maxPts: 100, criterioIds, peso, niveles };
    });

    if (desconocidos.size) {
      throw new Error(`Estos criterios no existen en ${asig.nombre}: ${[...desconocidos].join(', ')}. ` +
        'Pídele a la IA que use solo los códigos de la lista, o créalos en la vista Currículo.');
    }
    const sinCriterios = apartados.filter(a => !a.criterioIds.length);
    if (sinCriterios.length) {
      throw new Error(`Estos ítems no indican ningún criterio: ${sinCriterios.map(a => a.descripcion).join(', ')}.`);
    }

    const instrumento = {
      id: Utils.uid(),
      claseId,
      tipo: 'Rúbrica',
      titulo,
      fecha: Utils.hoy(),
      periodo: periodo || 'T1',
      saberes: String(datos.saberes || ''),
      unidad: String(datos.unidad || '').trim(),
      nivel,
      // Escala por defecto: la del primer ítem. Cada ítem guarda además la suya.
      niveles: apartados[0].niveles.map(n => ({ pct: n.pct, descriptor: n.descriptor })),
      apartados,
      criteriosModo: 'desglosado',
      criterioIdsGlobal: []
    };
    this.db.instrumentos.push(instrumento);
    this.save();
    return { id: instrumento.id, titulo, items: apartados.length };
  },

    db.instrumentos.push(inst);
    const valores = [
      [3.5, 2, 1], [4, 1, 2], [2, 0.5, 1], [3, 1.5, 2], [4, 2, 2], [1.5, 1, 0]
    ];
    const reg = {};
    db.alumnos.forEach((al, i) => {
      reg[al.id] = {};
      inst.apartados.forEach((ap, j) => { reg[al.id][ap.id] = valores[i % valores.length][j]; });
    });
    db.registros[inst.id] = reg;
    this.db = db;
    this.save();
  }
};

</script>
<script>
const Calc = {
  byId(lista, id) {
    return (lista || []).find(x => x.id === id) || null;
  },

  clase(claseId) { return this.byId(Storage.db.clases, claseId); },
  asignatura(asigId) { return this.byId(Storage.db.asignaturas, asigId); },
  criterio(critId) { return this.byId(Storage.db.criterios, critId); },
  instrumento(instId) { return this.byId(Storage.db.instrumentos, instId); },
  alumno(aluId) { return this.byId(Storage.db.alumnos, aluId); },

  asignaturaDeClase(claseId) {
    const cl = this.clase(claseId);
    return cl ? this.asignatura(cl.asignaturaId) : null;
  },

  alumnosDeClase(claseId) {
    const cl = this.clase(claseId);
    if (!cl) return [];
    return Storage.db.alumnos
      .filter(a => a.grupoId === cl.grupoId)
      .sort((x, y) => (x.apellidos + x.nombre).localeCompare(y.apellidos + y.nombre, 'es'));
  },

  criteriosDeClase(claseId) {
    const asig = this.asignaturaDeClase(claseId);
    if (!asig) return [];
    return Storage.db.criterios
      .filter(c => c.asignaturaId === asig.id)
      .sort((x, y) => String(x.codigo).localeCompare(String(y.codigo), 'es'));
  },

  competenciasEspecificasDeClase(claseId) {
    return this.competenciasEspecificasDeNivel(claseId, '');
  },

  clavesDeClase(claseId) {
    return this.clavesDeNivel(claseId, '');
  },

  competenciasEspecificasDeNivel(claseId, codigo) {
    const asig = this.asignaturaDeNivel(claseId, codigo);
    if (!asig) return [];
    return Storage.db.competenciasEspecificas.filter(c => c.asignaturaId === asig.id);
  },

  clavesDeNivel(claseId, codigo) {
    const usadas = new Set();
    this.criteriosDeNivel(claseId, codigo).forEach(c => (c.claveIds || []).forEach(k => usadas.add(k)));
    return Storage.db.competenciasClave.filter(k => usadas.has(k.id));
  },

  // --- Adaptaciones curriculares (ACI) ---
  // Cada nivel ACI de una clase apunta a la asignatura (currículo) de otro curso.

  // Unifica la forma de un código de nivel: sin espacios y en mayúsculas, y
  // «BASE» se trata como base interna (''). Es la ÚNICA forma de comparar
  // códigos en todo el programa: si no se normaliza, un «b» tecleado por el
  // docente no casaría con el nivel «B» guardado y el alumnado desaparecería.
  nivelNorm(codigo) {
    const v = String(codigo == null ? '' : codigo).trim().toUpperCase();
    return v === 'BASE' ? '' : v;
  },

  nivelesAciDeClase(claseId) {
    const cl = this.clase(claseId);
    const arr = (cl && Array.isArray(cl.nivelesAci)) ? cl.nivelesAci : [];
    // Se devuelven con el código normalizado (y sin códigos vacíos) para que
    // todas las vistas y comparaciones usen la misma forma.
    return arr
      .map(n => Object.assign({}, n, { codigo: this.nivelNorm(n.codigo) }))
      .filter(n => n.codigo);
  },

  nivelDeAlumno(claseId, alumnoId) {
    const cl = this.clase(claseId);
    const c = this.nivelNorm((cl && cl.adaptaciones && cl.adaptaciones[alumnoId]) || '');
    if (!c) return '';
    // Si el código no corresponde a ningún nivel definido (p. ej. un nivel
    // borrado), el alumnado cae a base: mejor corregido contra el currículo de
    // su clase que desaparecido de la cuadrícula y del informe.
    return this.nivelesAciDeClase(claseId).some(n => n.codigo === c) ? c : '';
  },

  etiquetaNivel(claseId, codigo) {
    const c = this.nivelNorm(codigo);
    if (!c) return 'Base';
    const n = this.nivelesAciDeClase(claseId).find(x => x.codigo === c);
    return n ? (n.etiqueta || n.codigo) : c;
  },

  asignaturaDeNivel(claseId, codigo) {
    const c = this.nivelNorm(codigo);
    if (c) {
      const n = this.nivelesAciDeClase(claseId).find(x => x.codigo === c);
      if (n && n.asignaturaId && this.asignatura(n.asignaturaId)) return this.asignatura(n.asignaturaId);
    }
    return this.asignaturaDeClase(claseId);
  },

  asignaturaDeAlumno(claseId, alumnoId) {
    return this.asignaturaDeNivel(claseId, this.nivelDeAlumno(claseId, alumnoId));
  },

  criteriosDeNivel(claseId, codigo) {
    const asig = this.asignaturaDeNivel(claseId, codigo);
    if (!asig) return [];
    return Storage.db.criterios
      .filter(c => c.asignaturaId === asig.id)
      .sort((x, y) => String(x.codigo).localeCompare(String(y.codigo), 'es'));
  },

  criteriosDeAlumno(claseId, alumnoId) {
    return this.criteriosDeNivel(claseId, this.nivelDeAlumno(claseId, alumnoId));
  },

  // --- Criterios de un instrumento frente al currículo de su nivel ACI ---
  // Un instrumento con nivel solo debe evaluar criterios de SU currículo; si
  // apunta a otro (p. ej. una copia de examen paralelo), sus notas no salen en
  // el informe. Estas helpers lo detectan y lo corrigen.

  // Clave numérica de un criterio: «MAT.TC.2.2» → «2.2». La numeración es la
  // misma en todos los ciclos (es el criterio oficial adaptado), así que sirve
  // para reconocer el criterio equivalente de otro currículo.
  claveCriterio(codigo) {
    const m = String(codigo == null ? '' : codigo).match(/(\d+(?:\.\d+)+)\s*$/);
    return m ? m[1] : '';
  },

  // Nivel ACI (con su currículo) dentro de un `db` concreto. Devuelve null si el
  // código es vacío/BASE, si el nivel no existe o si su asignatura ya no está.
  nivelAciEn(db, claseId, codigo) {
    const c = this.nivelNorm(codigo);
    if (!c) return null;
    const cl = (db.clases || []).find(x => x.id === claseId);
    if (!cl) return null;
    const n = (cl.nivelesAci || [])
      .map(x => Object.assign({}, x, { codigo: this.nivelNorm(x.codigo) }))
      .find(x => x.codigo === c);
    if (!n || !n.asignaturaId) return null;
    return (db.asignaturas || []).some(a => a.id === n.asignaturaId) ? n : null;
  },

  // Ids de criterio de un instrumento que NO pertenecen al currículo de su
  // nivel ACI. Los instrumentos comunes (sin nivel) no tienen currículo propio.
  criteriosFueraDeNivel(db, inst) {
    if (!inst) return [];
    const nv = this.nivelAciEn(db, inst.claseId, inst.nivel);
    if (!nv) return [];
    const porId = {};
    (db.criterios || []).forEach(c => { porId[c.id] = c; });
    const fuera = [];
    const mirar = ids => (ids || []).forEach(id => {
      const c = porId[id];
      if (c && c.asignaturaId !== nv.asignaturaId) fuera.push(id);
    });
    mirar(inst.criterioIdsGlobal);
    (inst.apartados || []).forEach(ap => mirar(ap.criterioIds));
    return [...new Set(fuera)];
  },

  // Reapunta los criterios de un instrumento al currículo de su nivel ACI,
  // emparejando por número de criterio («MAT.TC.2.2» ↔ «MAT.SC.2.2»). Las notas
  // cuelgan del apartado, no del criterio, así que no se pierde ninguna.
  // Devuelve true si cambió algo. Si un criterio no tiene equivalente, se deja
  // el bloque tal cual (mejor visible que reapuntado a medias).
  repararCriteriosDeInstrumento(db, inst) {
    if (!inst) return false;
    if (!this.criteriosFueraDeNivel(db, inst).length) return false;
    const nv = this.nivelAciEn(db, inst.claseId, inst.nivel);
    const porId = {};
    (db.criterios || []).forEach(c => { porId[c.id] = c; });
    const destino = {};   // clave de criterio → id dentro del currículo del nivel
    (db.criterios || []).filter(c => c.asignaturaId === nv.asignaturaId).forEach(c => {
      const k = this.claveCriterio(c.codigo);
      if (k && destino[k] == null) destino[k] = c.id;
    });
    const remapear = ids => {
      const salida = [];
      let cambio = false;
      for (const id of (ids || [])) {
        const c = porId[id];
        if (!c || c.asignaturaId === nv.asignaturaId) {
          if (salida.indexOf(id) === -1) salida.push(id);
          continue;
        }
        const k = this.claveCriterio(c.codigo);
        const nuevo = k ? destino[k] : null;
        if (!nuevo) return { ok: false };
        if (salida.indexOf(nuevo) === -1) salida.push(nuevo);
        cambio = true;
      }
      return { ok: true, ids: salida, cambio };
    };
    let cambio = false;
    const g = remapear(inst.criterioIdsGlobal);
    if (g.ok && g.cambio) { inst.criterioIdsGlobal = g.ids; cambio = true; }
    (inst.apartados || []).forEach(ap => {
      const a = remapear(ap.criterioIds);
      if (a.ok && a.cambio) { ap.criterioIds = a.ids; cambio = true; }
    });
    return cambio;
  },

  // Repasa todos los instrumentos de un `db` (al cargar o importar un backup).
  // Devuelve cuántos ha corregido.
  repararCriteriosDeInstrumentos(db) {
    let n = 0;
    (db.instrumentos || []).forEach(inst => { if (this.repararCriteriosDeInstrumento(db, inst)) n++; });
    return n;
  },

  // --- Banco de instrumentos (D-48) ---
  // Un «molde» es la plantilla de un instrumento (título, tipo, apartados y
  // criterios) guardada para reutilizarla en otra clase o en el curso siguiente.
  // Guarda los criterios por CÓDIGO, no por id: así el molde sigue siendo válido
  // aunque su asignatura de origen desaparezca, y los ids reales los pone el
  // currículo de la clase de destino al añadirlo.

  // Molde a partir de un instrumento ya guardado. `db` explícito para poder
  // probarlo sin depender del estado global.
  moldeDeInstrumento(db, inst) {
    const porId = {};
    (db.criterios || []).forEach(c => { porId[c.id] = c; });
    const codigos = ids => [...new Set((ids || [])
      .map(id => (porId[id] || {}).codigo)
      .filter(Boolean))];
    const clase = (db.clases || []).find(c => c.id === inst.claseId);
    const asig = clase ? (db.asignaturas || []).find(a => a.id === clase.asignaturaId) : null;
    return {
      id: Utils.uid(),
      titulo: inst.titulo || '',
      tipo: inst.tipo || 'Control',
      unidad: inst.unidad || '',
      saberes: inst.saberes || '',
      url: inst.url || '',
      niveles: (inst.niveles || []).map(n => ({ pct: n.pct, descriptor: n.descriptor })),
      criteriosModo: inst.criteriosModo || 'desglosado',
      criterioCodesGlobal: codigos(inst.criterioIdsGlobal),
      apartados: (inst.apartados || []).map(ap => ({
        descripcion: ap.descripcion || '',
        maxPts: ap.maxPts,
        peso: ap.peso,
        niveles: (ap.niveles || []).map(n => ({ pct: n.pct, descriptor: n.descriptor })),
        criterioCodes: codigos(ap.criterioIds)
      })),
      origen: {
        asignaturaId: asig ? asig.id : '',
        asignatura: asig ? asig.nombre : '',
        etapa: asig ? (asig.etapa || '') : '',
        guardadoEn: Utils.hoy()
      }
    };
  },

  // Instrumento nuevo a partir de un molde del banco, para la clase y el nivel
  // indicados. Los códigos se resuelven contra el currículo de destino por
  // código EXACTO (la numeración cambia entre ciclos; para reapuntar entre
  // ciclos está «Duplicar» con el nivel). Devuelve { inst, faltan }: si `faltan`
  // no está vacío, NO debe crearse el instrumento.
  instrumentoDesdeMolde(molde, claseId, nivel, periodo) {
    const asig = this.asignaturaDeNivel(claseId, nivel || '');
    const faltan = [];
    const porCodigo = {};
    if (asig) {
      Storage.db.criterios
        .filter(c => c.asignaturaId === asig.id)
        .forEach(c => { porCodigo[String(c.codigo).trim().toLowerCase()] = c.id; });
    }
    const resolver = codigos => {
      const ids = [];
      (codigos || []).forEach(cod => {
        const id = porCodigo[String(cod).trim().toLowerCase()];
        if (id) { if (ids.indexOf(id) === -1) ids.push(id); }
        else if (faltan.indexOf(cod) === -1) faltan.push(cod);
      });
      return ids;
    };
    const apartados = (molde.apartados || []).map((ap, i) => ({
      id: Utils.uid(),
      orden: i + 1,
      descripcion: ap.descripcion || '',
      maxPts: ap.maxPts,
      peso: ap.peso,
      niveles: (ap.niveles || []).map(n => ({ pct: n.pct, descriptor: n.descriptor })),
      criterioIds: resolver(ap.criterioCodes)
    }));
    const inst = {
      id: Utils.uid(),
      claseId,
      tipo: molde.tipo || 'Control',
      titulo: molde.titulo || '',
      fecha: Utils.hoy(),
      periodo: periodo || 'T1',
      saberes: molde.saberes || '',
      unidad: molde.unidad || '',
      url: molde.url || '',
      nivel: this.nivelNorm(nivel || ''),
      niveles: (molde.niveles || []).map(n => ({ pct: n.pct, descriptor: n.descriptor })),
      apartados,
      criteriosModo: molde.criteriosModo || 'desglosado',
      criterioIdsGlobal: resolver(molde.criterioCodesGlobal)
    };
    return { inst, faltan };
  },

  // Un instrumento sin nivel es común a todos; con nivel, solo para ese nivel
  // ('' o 'BASE' = base, es decir, alumnado sin adaptación).
  instrumentoParaNivel(inst, codigo) {
    if (!inst || !inst.nivel) return true;
    return this.nivelNorm(inst.nivel) === this.nivelNorm(codigo);
  },

  instrumentoParaAlumno(inst, claseId, alumnoId) {
    return this.instrumentoParaNivel(inst, this.nivelDeAlumno(claseId, alumnoId));
  },

  alumnosDeInstrumento(inst) {
    return this.alumnosDeClase(inst.claseId).filter(a => this.instrumentoParaAlumno(inst, inst.claseId, a.id));
  },

  instrumentosDeAlumno(claseId, alumnoId, periodo) {
    return this.instrumentosDeClase(claseId, periodo)
      .filter(i => this.instrumentoParaAlumno(i, claseId, alumnoId));
  },

  // Cuánto falta por corregir de un instrumento: alumnado asignado que todavía
  // tiene algún apartado sin nota. Lo que se deja en blanco se cuenta como
  // pendiente (una ausencia también queda en blanco, y así se ve).
  progresoInstrumento(inst) {
    if (!inst) return { hechos: 0, total: 0, pendientes: 0 };
    const alumnos = this.alumnosDeInstrumento(inst);
    const registros = (Storage.db.registros || {})[inst.id] || {};
    let hechos = 0;
    if (inst.apartados && inst.apartados.length) {
      alumnos.forEach(a => {
        const fila = registros[a.id] || {};
        const completo = inst.apartados.every(ap => {
          const v = fila[ap.id];
          return v !== undefined && v !== null && v !== '';
        });
        if (completo) hechos++;
      });
    }
    return { hechos, total: alumnos.length, pendientes: alumnos.length - hechos };
  },

  // Instrumentos de una clase ordenados para corregir: lo que más falta tiene
  // primero y, a igualdad, lo más reciente.
  instrumentosPorCorregir(claseId) {
    return this.instrumentosDeClase(claseId)
      .map(i => ({ i, p: this.progresoInstrumento(i) }))
      .sort((a, b) => (b.p.pendientes - a.p.pendientes)
        || String(b.i.fecha || '').localeCompare(String(a.i.fecha || '')))
      .map(x => x.i);
  },

  logroCriterioEnInstrumento(inst, alumnoId, criterioId) {
    const modo = inst.criteriosModo || 'desglosado';
    const reg = (Storage.db.registros[inst.id] || {})[alumnoId] || {};
    if (modo === 'global') {
      const globalIds = inst.criterioIdsGlobal || [];
      if (globalIds.length && !globalIds.includes(criterioId)) return null;
      let obt = 0, max = 0, hay = false;
      for (const ap of inst.apartados) {
        const v = reg[ap.id];
        if (v == null || isNaN(v)) continue;
        obt += Number(v);
        max += ap.maxPts;
        hay = true;
      }
      return hay && max > 0 ? obt / max : null;
    }
    let obt = 0, max = 0, hay = false;
    for (const ap of inst.apartados) {
      if (!ap.criterioIds.includes(criterioId)) continue;
      const v = reg[ap.id];
      if (v == null || isNaN(v)) continue;
      obt += Number(v);
      max += ap.maxPts;
      hay = true;
    }
    return hay && max > 0 ? obt / max : null;
  },

  instrumentosDeClase(claseId, periodo) {
    const lista = Storage.db.instrumentos.filter(i => i.claseId === claseId);
    if (!periodo || periodo === 'Final') return lista;
    return lista.filter(i => i.periodo === periodo);
  },

  // Niveles aplicables a un ítem de rúbrica: los propios si los define, si no los
  // de la escala común del instrumento. Siempre de menor a mayor
  // (nivel 1 = más bajo … nivel N = más alto).
  nivelesDeApartado(inst, ap) {
    const comunes = (inst && inst.niveles) || [];
    const propios = (ap && Array.isArray(ap.niveles))
      ? ap.niveles.filter(n => n && !isNaN(Number(n.pct)))
      : [];
    const base = propios.length ? propios : comunes;
    return base.slice().sort((a, b) => Number(a.pct) - Number(b.pct));
  },

  // Etiquetas de unidad didáctica presentes en una lista de instrumentos, ordenadas alfabéticamente.
  unidadesDe(insts) {
    return [...new Set((insts || []).map(i => i.unidad).filter(Boolean))]
      .sort((a, b) => String(a).localeCompare(String(b), 'es'));
  },

  // Instrumentos de una unidad concreta. `unidad` vacío o nulo = todos.
  instrumentosDeUnidad(insts, unidad) {
    if (!unidad) return insts || [];
    return (insts || []).filter(i => i.unidad === unidad);
  },

  // Unidades didácticas ya usadas en una asignatura (todas sus clases). Sirve
  // para sugerirlas al escribir: una UD1 de 6ºA se ofrece también en 6ºB.
  unidadesDeAsignatura(asigId) {
    const clases = Storage.db.clases.filter(c => c.asignaturaId === asigId).map(c => c.id);
    return this.unidadesDe(Storage.db.instrumentos.filter(i => clases.indexOf(i.claseId) !== -1));
  },

  logroCriterio(criterioId, claseId, alumnoId, periodo) {
    const insts = this.instrumentosDeAlumno(claseId, alumnoId, periodo).filter(i => {
      if ((i.criteriosModo || 'desglosado') === 'global') {
        return (i.criterioIdsGlobal || []).includes(criterioId);
      }
      return i.apartados.some(ap => ap.criterioIds.includes(criterioId));
    });
    const logros = [];
    for (const inst of insts) {
      const l = this.logroCriterioEnInstrumento(inst, alumnoId, criterioId);
      if (l != null) logros.push(l);
    }
    if (!logros.length) return null;
    return logros.reduce((a, b) => a + b, 0) / logros.length;
  },

  notaPonderada(claseId, alumnoId, periodo, filtroCriterios) {
    const todos = this.criteriosDeAlumno(claseId, alumnoId);
    const criterios = filtroCriterios ? todos.filter(filtroCriterios) : todos;
    let suma = 0, pesos = 0;
    for (const c of criterios) {
      const l = this.logroCriterio(c.id, claseId, alumnoId, periodo);
      if (l == null) continue;
      suma += l * c.peso;
      pesos += c.peso;
    }
    if (pesos <= 0) return null;
    return (suma / pesos) * 10;
  },

  notaEvaluacion(claseId, alumnoId, periodo) {
    return this.notaPonderada(claseId, alumnoId, periodo, null);
  },

  notaCompetencia(claseId, alumnoId, espId, periodo) {
    return this.notaPonderada(claseId, alumnoId, periodo, c => c.espIds.includes(espId));
  },

  notaClave(claseId, alumnoId, claveId, periodo) {
    return this.notaPonderada(claseId, alumnoId, periodo, c => (c.claveIds || []).includes(claveId));
  },

  notaInstrumento(inst, alumnoId) {
    const reg = (Storage.db.registros[inst.id] || {})[alumnoId] || {};
    const esRubrica = inst.tipo === 'Rúbrica';
    if (esRubrica) {
      let suma = 0, pesos = 0;
      for (const ap of inst.apartados) {
        const v = reg[ap.id];
        if (v == null || isNaN(v)) continue;
        const niveles = this.nivelesDeApartado(inst, ap);
        const nv = niveles.find(n => Math.abs(Number(v) - Number(n.pct)) < 1e-9);
        const pct = nv ? Number(nv.pct) : Number(v);
        const p = ap.peso == null || isNaN(ap.peso) ? 1 : Number(ap.peso);
        suma += (pct / 100) * p;
        pesos += p;
      }
      if (pesos <= 0) return null;
      return (suma / pesos) * 10;
    }
    let obt = 0, max = 0;
    for (const ap of inst.apartados) {
      const v = reg[ap.id];
      max += ap.maxPts;
      if (v != null && !isNaN(v)) obt += Number(v);
    }
    return max > 0 ? (obt / max) * 10 : null;
  },

  clasif(n) {
    if (n == null || isNaN(n)) return 'na';
    return n >= 5 ? 'ok' : 'ko';
  },

  badgeHtml(n) {
    return '<span class="badge ' + this.clasif(n) + '">' + Utils.fmt(n) + '</span>';
  }
};

</script>
<script>
const UI = {
  openModal({ titulo, cuerpo, textoGuardar, alGuardar, peligro }) {
    const root = document.getElementById('modal-root');
    root.innerHTML = `
      <div class="velo">
        <div class="modal">
          <div class="modal-head">
            <h3>${Utils.esc(titulo)}</h3>
            <button class="icon-btn cerrar" title="Cerrar">×</button>
          </div>
          <div class="modal-body"></div>
          <div class="modal-foot">
            ${alGuardar ? '<button class="btn cancelar">Cancelar</button><button class="btn btn-primario guardar">' + Utils.esc(textoGuardar || 'Guardar') + '</button>' : '<button class="btn cancelar">Cerrar</button>'}
          </div>
        </div>
      </div>`;
    const velo = root.querySelector('.velo');
    const body = root.querySelector('.modal-body');
    body.innerHTML = cuerpo;
    const cerrar = () => { root.innerHTML = ''; };
    root.querySelector('.cerrar').onclick = cerrar;
    root.querySelector('.cancelar').onclick = cerrar;
    if (alGuardar) {
      const btn = root.querySelector('.guardar');
      if (peligro) btn.classList.add('btn-peligro');
      btn.onclick = () => {
        if (alGuardar(body, cerrar) !== false) {
          cerrar();
          if (typeof App !== 'undefined' && App.refrescar) App.refrescar();
        }
      };
    }
    return body;
  },

  closeModal() {
    document.getElementById('modal-root').innerHTML = '';
  },

  toast(msg) {
    const root = document.getElementById('toast-root');
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    root.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  },

  chipsCriterios(asignaturaId, seleccionados) {
    const lista = Storage.db.criterios
      .filter(c => c.asignaturaId === asignaturaId)
      .sort((a, b) => String(a.codigo).localeCompare(String(b.codigo), 'es'));
    if (!lista.length) return '<div class="aviso">Primero crea criterios en la sección Currículo.</div>';
    return `<div class="chips" data-campo="criterios">` + lista.map(c => {
      const on = (seleccionados || []).includes(c.id);
      return `<label class="chip ${on ? 'on' : ''}"><input type="checkbox" value="${c.id}" ${on ? 'checked' : ''}>${Utils.esc(c.codigo)} · ${Utils.esc(c.descripcion)}</label>`;
    }).join('') + '</div>';
  },

  wireChips(container) {
    container.querySelectorAll('.chip input').forEach(inp => {
      inp.addEventListener('change', () => {
        inp.closest('.chip').classList.toggle('on', inp.checked);
      });
    });
  },

  valoresChips(container) {
    return Array.from(container.querySelectorAll('input:checked')).map(i => i.value);
  },

  selectHtml(lista, valorActual, campoId, campoNombre) {
    return lista.map(x =>
      `<option value="${x[campoId]}" ${x[campoId] === valorActual ? 'selected' : ''}>${Utils.esc(x[campoNombre])}</option>`
    ).join('');
  }
};

</script>
<script>
const AlumnosView = (() => {
  let grupoSel = null;

  const nombreGrupo = () => {
    const g = Calc.byId(Storage.db.grupos, grupoSel);
    return g ? g.nombre : '';
  };

  const alumnosDe = gid => Storage.db.alumnos
    .filter(a => a.grupoId === gid)
    .sort((x, y) => (x.apellidos + x.nombre).localeCompare(y.apellidos + y.nombre, 'es'));

  function modalGrupo(g) {
    UI.openModal({
      titulo: g ? 'Editar grupo' : 'Nuevo grupo',
      cuerpo: `
        <label class="campo"><span>Nombre del grupo</span>
          <input type="text" id="f-nombre" value="${Utils.esc(g ? g.nombre : '')}" placeholder="Ej. 3ºA"></label>
        <label class="campo"><span>Etapa</span>
          <select id="f-etapa">
            <option ${g && g.etapa === 'Primaria' ? 'selected' : ''}>Primaria</option>
            <option ${g && g.etapa === 'Infantil' ? 'selected' : ''}>Infantil</option>
          </select></label>`,
      alGuardar(body) {
        const nombre = body.querySelector('#f-nombre').value.trim();
        if (!nombre) return false;
        if (g) { g.nombre = nombre; g.etapa = body.querySelector('#f-etapa').value; }
        else {
          const nuevo = { id: Utils.uid(), nombre, etapa: body.querySelector('#f-etapa').value };
          Storage.db.grupos.push(nuevo);
          grupoSel = nuevo.id;
        }
        Storage.save();
      }
    });
  }

  function modalAlumno() {
    UI.openModal({
      titulo: 'Nuevo alumno en ' + nombreGrupo(),
      cuerpo: `
        <label class="campo"><span>Nombre</span><input type="text" id="f-nombre" placeholder="Nombre"></label>
        <label class="campo"><span>Apellidos</span><input type="text" id="f-apellidos" placeholder="Apellidos"></label>`,
      alGuardar(body) {
        const nombre = body.querySelector('#f-nombre').value.trim();
        const apellidos = body.querySelector('#f-apellidos').value.trim();
        if (!nombre && !apellidos) return false;
        Storage.db.alumnos.push({ id: Utils.uid(), nombre, apellidos, grupoId: grupoSel });
        Storage.save();
      }
    });
  }

  function render(el) {
    const db = Storage.db;
    el.innerHTML = `
      <div class="grid-2">
        <section class="card">
          <div class="card-head">
            <h2>Grupos</h2>
            <button class="btn btn-primario" id="add-grupo">Nuevo grupo</button>
          </div>
          <ul class="lista" id="lista-grupos">
            ${db.grupos.map(g => `
              <li data-id="${g.id}" class="${g.id === grupoSel ? 'activo' : ''}">
                <span>${Utils.esc(g.nombre)}</span><small>${Utils.esc(g.etapa)}</small>
                <button class="icon-btn borrar-grupo" data-id="${g.id}" title="Eliminar grupo">×</button>
              </li>`).join('') || '<li class="vacio">Sin grupos todavía. Crea el primero.</li>'}
          </ul>
        </section>
        <section class="card">
          <div class="card-head">
            <h2>Alumnos${grupoSel ? ' · ' + Utils.esc(nombreGrupo()) : ''}</h2>
            <button class="btn btn-primario" id="add-alumno" ${grupoSel ? '' : 'disabled'}>Nuevo alumno</button>
          </div>
          <table class="tabla">
            <thead><tr><th>Apellidos</th><th>Nombre</th><th></th></tr></thead>
            <tbody>
              ${grupoSel ? alumnosDe(grupoSel).map(a => `
                <tr>
                  <td>${Utils.esc(a.apellidos)}</td>
                  <td>${Utils.esc(a.nombre)}</td>
                  <td style="width:36px"><button class="icon-btn borrar-alumno" data-id="${a.id}" title="Eliminar">×</button></td>
                </tr>`).join('') || '<tr><td colspan="3" class="vacio">Este grupo no tiene alumnos aún.</td></tr>'
                : '<tr><td colspan="3" class="vacio">Selecciona un grupo para ver sus alumnos.</td></tr>'}
            </tbody>
          </table>
        </section>
      </div>`;

    el.querySelector('#add-grupo').onclick = () => modalGrupo(null);
    el.querySelector('#add-alumno').onclick = () => modalAlumno();
    el.querySelectorAll('#lista-grupos li[data-id]').forEach(li => {
      li.addEventListener('click', e => {
        if (e.target.closest('.borrar-grupo')) return;
        grupoSel = li.dataset.id;
        render(el);
      });
    });
    el.querySelectorAll('.borrar-grupo').forEach(b => {
      b.onclick = e => {
        e.stopPropagation();
        const id = b.dataset.id;
        const nAlu = db.alumnos.filter(a => a.grupoId === id).length;
        const extra = nAlu ? ` También se eliminarán ${nAlu} alumno(s).` : '';
        if (confirm('¿Eliminar este grupo?' + extra)) {
          db.alumnos = db.alumnos.filter(a => a.grupoId !== id);
          db.clases = db.clases.filter(c => c.grupoId !== id);
          db.grupos = db.grupos.filter(g => g.id !== id);
          if (grupoSel === id) grupoSel = null;
          Storage.save();
          render(el);
        }
      };
    });
    el.querySelectorAll('.borrar-alumno').forEach(b => {
      b.onclick = () => {
        if (confirm('¿Eliminar este alumno y todas sus notas?')) {
          const id = b.dataset.id;
          db.alumnos = db.alumnos.filter(a => a.id !== id);
          for (const instId of Object.keys(db.registros)) delete db.registros[instId][id];
          Storage.save();
          render(el);
        }
      };
    });
  }

  return { render };
})();

</script>
<script>
const ClasesView = (() => {
  function modalAsignatura() {
    UI.openModal({
      titulo: 'Nueva asignatura / área',
      cuerpo: `
        <label class="campo"><span>Nombre</span>
          <input type="text" id="f-nombre" placeholder="Ej. Matemáticas"></label>
        <label class="campo"><span>Etapa</span>
          <select id="f-etapa"><option>Primaria</option><option>Infantil</option></select></label>`,
      alGuardar(body) {
        const nombre = body.querySelector('#f-nombre').value.trim();
        if (!nombre) return false;
        Storage.db.asignaturas.push({ id: Utils.uid(), nombre, etapa: body.querySelector('#f-etapa').value });
        Storage.save();
      }
    });
  }

  function modalClase() {
    const db = Storage.db;
    if (!db.asignaturas.length || !db.grupos.length) {
      UI.toast('Necesitas al menos una asignatura y un grupo');
      return;
    }
    UI.openModal({
      titulo: 'Nueva clase',
      cuerpo: `
        <label class="campo"><span>Asignatura</span>
          <select id="f-asig">${UI.selectHtml(db.asignaturas, null, 'id', 'nombre')}</select></label>
        <label class="campo"><span>Grupo</span>
          <select id="f-grupo">${UI.selectHtml(db.grupos, null, 'id', 'nombre')}</select></label>`,
      alGuardar(body) {
        const asignaturaId = body.querySelector('#f-asig').value;
        const grupoId = body.querySelector('#f-grupo').value;
        if (db.clases.some(c => c.asignaturaId === asignaturaId && c.grupoId === grupoId)) {
          alert('Esa clase ya existe');
          return false;
        }
        db.clases.push({ id: Utils.uid(), asignaturaId, grupoId });
        Storage.save();
      }
    });
  }

  function modalAci(clase) {
    const db = Storage.db;
    const alumnos = Calc.alumnosDeClase(clase.id);
    let mbody = null;

    const nivelesActuales = () => Array.from(document.querySelectorAll('.nivel-aci-fila')).map(f => ({
      codigo: (f.querySelector('.nv-cod') || {}).value || '',
      etiqueta: (f.querySelector('.nv-etq') || {}).value || '',
      asignaturaId: (f.querySelector('.nv-asig') || {}).value || ''
    }));

    const opcionesAsig = asignaturaId => '<option value="">— asignatura —</option>'
      + UI.selectHtml(db.asignaturas, asignaturaId, 'id', 'nombre');

    function filaNivel(n) {
      const div = document.createElement('div');
      div.className = 'nivel-aci-fila fila-campos';
      div.innerHTML = `
        <label class="campo"><span>Código</span><input type="text" class="nv-cod" value="${Utils.esc(n.codigo || '')}" placeholder="B" style="max-width:80px"></label>
        <label class="campo"><span>Etiqueta</span><input type="text" class="nv-etq" value="${Utils.esc(n.etiqueta || '')}" placeholder="4º"></label>
        <label class="campo"><span>Currículo (asignatura)</span><select class="nv-asig">${opcionesAsig(n.asignaturaId)}</select></label>
        <button type="button" class="icon-btn quitar-nivel-aci">×</button>`;
      div.querySelector('.quitar-nivel-aci').onclick = () => { div.remove(); pintarAsignacion(); };
      div.querySelector('.nv-cod').addEventListener('input', pintarAsignacion);
      return div;
    }

    function pintarAsignacion() {
      const cont = mbody.querySelector('#lista-asignacion');
      const niveles = nivelesActuales().filter(x => String(x.codigo).trim());
      if (!niveles.length) {
        cont.innerHTML = '<div class="aviso">Aún no hay niveles definidos. Pulsa «Añadir nivel», escribe su <b>código</b> (p. ej. «B») y elige su currículo; entonces podrás asignar alumnado aquí.</div>';
        return;
      }
      const previos = {};
      cont.querySelectorAll('.alu-nivel').forEach(s => { previos[s.dataset.alu] = s.value; });
      cont.innerHTML = alumnos.map(a => {
        const actual = Calc.nivelNorm((a.id in previos) ? previos[a.id] : ((clase.adaptaciones || {})[a.id] || ''));
        const ops = ['<option value="">Base</option>']
          .concat(niveles.map(n => `<option value="${Utils.esc(Calc.nivelNorm(n.codigo))}" ${actual === Calc.nivelNorm(n.codigo) ? 'selected' : ''}>${Utils.esc(n.etiqueta || n.codigo)}</option>`))
          .join('');
        return `<div class="fila-campos">
          <span style="flex:1">${Utils.esc(a.apellidos)}, ${Utils.esc(a.nombre)}</span>
          <select class="alu-nivel" data-alu="${a.id}">${ops}</select></div>`;
      }).join('') || '<div class="vacio">El grupo de esta clase no tiene alumnado.</div>';
    }

    mbody = UI.openModal({
      titulo: 'Niveles ACI · ' + (Calc.asignaturaDeClase(clase.id) || {}).nombre + ' · ' + ((Calc.byId(db.grupos, clase.grupoId) || {}).nombre || ''),
      cuerpo: `
        <div class="aviso">Un <b>nivel ACI</b> agrupa al alumnado que trabaja un currículo de otro curso (p. ej. 4º o 2º). Cada nivel apunta a la asignatura que se usará para corregirlo. Los exámenes de cada nivel se crean en «Instrumentos» eligiendo el nivel y una misma <b>unidad</b>.</div>
        <label class="campo"><span>Niveles ACI</span><div id="lista-niveles-aci"></div></label>
        <button class="btn btn-mini" type="button" id="add-nivel-aci">Añadir nivel</button>
        <label class="campo" style="margin-top:14px"><span>Asignación de alumnado</span><div id="lista-asignacion"></div></label>`,
      textoGuardar: 'Guardar niveles ACI',
      alGuardar(body) {
        const niveles = nivelesActuales().map(n => ({
          codigo: String(n.codigo).trim().toUpperCase(),
          etiqueta: String(n.etiqueta).trim(),
          asignaturaId: n.asignaturaId
        })).filter(n => n.codigo);
        const codigos = niveles.map(n => n.codigo);
        if (new Set(codigos).size !== codigos.length) { alert('Hay códigos de nivel repetidos'); return false; }
        if (codigos.includes('BASE')) { alert('El código BASE está reservado para el nivel base'); return false; }
        for (const n of niveles) {
          if (!n.asignaturaId) { alert(`El nivel ${n.codigo} necesita una asignatura (currículo)`); return false; }
        }
        clase.nivelesAci = niveles;
        const adap = {};
        body.querySelectorAll('.alu-nivel').forEach(sel => {
          const v = Calc.nivelNorm(sel.value);
          if (v) adap[sel.dataset.alu] = v;
        });
        clase.adaptaciones = adap;
        Storage.save();
      }
    });

    mbody.querySelector('#add-nivel-aci').onclick = () => {
      const cont = mbody.querySelector('#lista-niveles-aci');
      cont.appendChild(filaNivel({}));
      pintarAsignacion();
      const cod = cont.querySelector('.nivel-aci-fila:last-child .nv-cod');
      if (cod) cod.focus();
    };
    (clase.nivelesAci || []).forEach(n => mbody.querySelector('#lista-niveles-aci').appendChild(filaNivel(n)));
    pintarAsignacion();
  }

  function render(el) {
    const db = Storage.db;
    el.innerHTML = `
      <div class="grid-2">
        <section class="card">
          <div class="card-head">
            <h2>Asignaturas</h2>
            <button class="btn btn-primario" id="add-asig">Nueva asignatura</button>
          </div>
          <ul class="lista" id="lista-asig">
            ${db.asignaturas.map(a => `
              <li data-id="${a.id}">
                <span>${Utils.esc(a.nombre)}</span><small>${Utils.esc(a.etapa)}</small>
                <button class="icon-btn borrar-asig" data-id="${a.id}" title="Eliminar">×</button>
              </li>`).join('') || '<li class="vacio">Sin asignaturas. Crea la primera.</li>'}
          </ul>
        </section>
        <section class="card">
          <div class="card-head">
            <h2>Clases <small class="sub" style="margin:0">asignatura · grupo</small></h2>
            <button class="btn btn-primario" id="add-clase">Nueva clase</button>
          </div>
          <table class="tabla">
            <thead><tr><th>Asignatura</th><th>Grupo</th><th>Alumnos</th><th></th></tr></thead>
            <tbody>
              ${db.clases.map(c => {
                const asig = Calc.asignatura(c.asignaturaId) || { nombre: '?' };
                const gru = Calc.byId(db.grupos, c.grupoId) || { nombre: '?' };
                const nAlu = db.alumnos.filter(a => a.grupoId === c.grupoId).length;
                const nAci = (c.nivelesAci || []).length;
                return `<tr>
                  <td>${Utils.esc(asig.nombre)}</td>
                  <td>${Utils.esc(gru.nombre)}</td>
                  <td>${nAlu}${nAci ? ` · <span class="badge info">ACI ${nAci}</span>` : ''}</td>
                  <td style="white-space:nowrap"><button class="btn btn-mini aci-clase" data-id="${c.id}" title="Niveles ACI (adaptaciones)">ACI</button> <button class="icon-btn borrar-clase" data-id="${c.id}" title="Eliminar">×</button></td>
                </tr>`;
              }).join('') || '<tr><td colspan="4" class="vacio">Crea una clase combinando asignatura y grupo.</td></tr>'}
            </tbody>
          </table>
        </section>
      </div>`;

    el.querySelector('#add-asig').onclick = () => modalAsignatura();
    el.querySelector('#add-clase').onclick = () => modalClase();

    el.querySelectorAll('.aci-clase').forEach(b => {
      b.onclick = () => {
        try { modalAci(Calc.clase(b.dataset.id)); }
        catch (e) { console.error(e); alert('Error al abrir niveles ACI: ' + e.message); }
      };
    });

    el.querySelectorAll('.borrar-asig').forEach(b => {
      b.onclick = e => {
        e.stopPropagation();
        const id = b.dataset.id;
        const nCrit = db.criterios.filter(x => x.asignaturaId === id).length;
        const nClas = db.clases.filter(x => x.asignaturaId === id).length;
        if (confirm(`¿Eliminar la asignatura y TODO su currículo? (${nCrit} criterios, ${nClas} clases)`)) {
          const instIds = db.instrumentos.filter(i => nClas && db.clases.some(c => c.id === i.claseId && c.asignaturaId === id)).map(i => i.id);
          instIds.forEach(i => delete db.registros[i]);
          db.instrumentos = db.instrumentos.filter(i => !instIds.includes(i.id));
          db.criterios = db.criterios.filter(x => x.asignaturaId !== id);
          db.competenciasEspecificas = db.competenciasEspecificas.filter(x => x.asignaturaId !== id);
          db.clases = db.clases.filter(x => x.asignaturaId !== id);
          db.asignaturas = db.asignaturas.filter(x => x.id !== id);
          Storage.save();
          render(el);
        }
      };
    });

    el.querySelectorAll('.borrar-clase').forEach(b => {
      b.onclick = () => {
        const id = b.dataset.id;
        if (!confirm('¿Eliminar esta clase? Sus instrumentos y notas también se eliminarán.')) return;
        delete db.registros[id];
        db.instrumentos = db.instrumentos.filter(i => i.claseId !== id);
        db.clases = db.clases.filter(c => c.id !== id);
        Storage.save();
        render(el);
      };
    });
  }

  return { render };
})();

</script>

<script>
const CurriculoView = (() => {
  let asigSel = null;

  const seleccionar = id => { asigSel = id; };

  const criteriosDe = () => Storage.db.criterios
    .filter(c => c.asignaturaId === asigSel)
    .sort((a, b) => String(a.codigo).localeCompare(String(b.codigo), 'es'));

  const espDe = () => Storage.db.competenciasEspecificas
    .filter(c => c.asignaturaId === asigSel)
    .sort((a, b) => String(a.codigo).localeCompare(String(b.codigo), 'es'));

  function modalCriterio(c) {
    const esp = espDe();
    const claves = Storage.db.competenciasClave;
    UI.openModal({
      titulo: c ? 'Editar criterio' : 'Nuevo criterio',
      cuerpo: `
        <div class="fila-campos">
          <label class="campo"><span>Código</span>
